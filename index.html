// ----- Tela de cotação de uma solicitação -----
async function telaCotacao (s) {
  if (!s) return

  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = `<div class="modal"><p class="texto-dim2">carregando orçamentos...</p></div>`
  document.body.appendChild(fundo)
  const fechar = () => fundo.remove()
  fundo.onclick = e => { if (e.target === fundo) fechar() }

  const recarregar = async () => {
    const { data: orcs } = await db.from('orcamento')
      .select('id,valor,prazo_entrega,forma_pagamento,condicao_pagamento,link_proposta,observacoes,escolhido,fornecedor_avulso,fornecedor:fornecedor_id(nome)')
      .eq('solicitacao_id', s.id).order('valor')
    desenhar(orcs || [])
  }

  const desenhar = orcs => {
    const menor = orcs.length ? Math.min(...orcs.map(o => Number(o.valor))) : null
    const escolhido = orcs.find(o => o.escolhido)

    fundo.innerHTML = `
      <div class="modal" style="max-width:860px;">
        <div class="cabeca-secao">
          <h3>Cotação — ${esc(s.produto_servico)}</h3>
          <span class="texto-dim2" style="font-size:12px;">
            ${s.quantidade ? esc(s.quantidade) + ' ' + esc(s.unidade ?? '') : ''}
            ${s.valor_estimado ? '· estimado R$ ' + fmtNum(s.valor_estimado) : ''}</span>
        </div>

        <div class="panel" style="padding:0;margin-bottom:16px;">
          <table><thead><tr>
            <th></th><th>Fornecedor</th><th class="num">Valor</th>
            <th>Prazo</th><th>Pagamento</th><th></th>
          </tr></thead><tbody>
            ${orcs.map(o => `<tr>
              <td><input type="radio" name="escolha" data-escolher="${o.id}" ${o.escolhido ? 'checked' : ''}></td>
              <td>${esc(o.fornecedor?.nome || o.fornecedor_avulso || '—')}
                ${o.link_proposta ? `<br><a class="anexo-link" href="${esc(o.link_proposta)}" target="_blank" rel="noopener">proposta</a>` : ''}</td>
              <td class="num ${Number(o.valor) === menor ? 'badge-bom' : ''}">R$ ${fmtNum(o.valor)}</td>
              <td>${esc(o.prazo_entrega ?? '—')}</td>
              <td>${esc([o.forma_pagamento, o.condicao_pagamento].filter(Boolean).join(' · ') || '—')}</td>
              <td style="text-align:right;">
                <button class="btn-secundario mini" data-apagar="${o.id}">remover</button></td>
            </tr>`).join('') || `<tr><td colspan="6" class="vazio">
              Nenhum orçamento lançado. Adicione ao menos um abaixo.</td></tr>`}
          </tbody></table>
        </div>

        <div class="secao">
          <h3 style="font-size:15px;">Novo orçamento</h3>
          <div class="form-grade">
            <div class="campo"><label>Fornecedor</label>
              <select id="o-forn"><option value="">— digitar abaixo —</option>
                ${COMPRAS_CACHE.fornecedores.map(f =>
                  `<option value="${f.id}">${esc(f.nome)}</option>`).join('')}</select></div>
            <div class="campo"><label>ou nome do fornecedor</label><input id="o-avulso"></div>
            <div class="campo"><label>Valor (R$) *</label><input id="o-valor" inputmode="decimal" placeholder="1.250,00"></div>
            <div class="campo"><label>Prazo de entrega</label><input id="o-prazo" placeholder="5 dias úteis"></div>
            <div class="campo"><label>Forma de pagamento</label><input id="o-forma" placeholder="boleto, PIX, cartão"></div>
            <div class="campo"><label>Condição</label><input id="o-cond" placeholder="à vista, 30/60"></div>
            <div class="campo"><label>Link da proposta</label><input id="o-link" placeholder="https://..."></div>
          </div>
          <div class="acoes"><button class="btn mini" id="o-add">Adicionar orçamento</button></div>
        </div>

        <div class="secao">
          <h3 style="font-size:15px;">Pagamento e envio</h3>
          <div class="form-grade">
            <div class="campo"><label>Parcelas</label>
              <input id="p-parcelas" type="number" min="1" value="${s.parcelas ?? 1}"></div>
            <div class="campo"><label>Vencimento</label>
              <input id="p-venc" type="date" value="${s.vencimento ?? ''}"></div>
          </div>
          <div class="campo" style="margin-top:10px;"><label>Dados de pagamento</label>
            <textarea id="p-dados" style="min-height:64px;"
              placeholder="PIX, dados bancários ou instruções">${esc(s.dados_pagamento ?? '')}</textarea></div>
          <div class="campo" style="margin-top:10px;"><label>Onde achou mais barato</label>
            <input id="p-onde" value="${esc(s.onde_mais_barato ?? '')}"
              placeholder="loja, site ou representante"></div>
          <div class="campo" style="margin-top:10px;"><label>Observação do compras</label>
            <textarea id="p-obs" style="min-height:56px;">${esc(s.observacao_compras ?? '')}</textarea></div>
          <div class="campo" style="margin-top:10px;"><label>Por que este orçamento *</label>
            <textarea id="p-parecer" style="min-height:64px;"
              placeholder="Menor preço, prazo melhor, único fornecedor homologado...">${esc(s.parecer_cotacao ?? '')}</textarea></div>
        </div>

        <div class="acoes">
          <button class="btn" id="c-enviar">Enviar para aprovação</button>
          <button class="btn-secundario" id="c-pdf">PDF dos orçamentos</button>
          <button class="btn-secundario" id="c-fechar">Fechar</button>
        </div>
        <div class="recado oculto" id="c-recado"></div>
      </div>`

    const q = id => fundo.querySelector(id)
    const aviso = (t, alerta = true) => {
      const el = q('#c-recado'); el.textContent = t; el.classList.remove('oculto')
      el.style.borderColor = alerta ? 'var(--warn-text)' : 'var(--line2)'
      el.style.color = alerta ? 'var(--warn-text)' : 'var(--dim)'
    }

    q('#c-fechar').onclick = fechar

    // marcar o escolhido
    fundo.querySelectorAll('[data-escolher]').forEach(r => {
      r.onchange = async () => {
        await db.from('orcamento').update({ escolhido: false }).eq('solicitacao_id', s.id)
        await db.from('orcamento').update({ escolhido: true }).eq('id', r.dataset.escolher)
        recarregar()
      }
    })

    fundo.querySelectorAll('[data-apagar]').forEach(b => {
      b.onclick = async () => {
        await db.from('orcamento').delete().eq('id', b.dataset.apagar)
        recarregar()
      }
    })

    q('#o-add').onclick = async () => {
      const valor = numeroBR(q('#o-valor').value)
      if (valor === null) { aviso('Informe o valor do orçamento.'); return }
      if (!q('#o-forn').value && !q('#o-avulso').value.trim()) {
        aviso('Escolha um fornecedor cadastrado ou digite o nome.'); return }

      const { error } = await db.from('orcamento').insert({
        solicitacao_id: s.id,
        fornecedor_id: q('#o-forn').value || null,
        fornecedor_avulso: q('#o-avulso').value.trim() || null,
        valor,
        prazo_entrega: q('#o-prazo').value.trim() || null,
        forma_pagamento: q('#o-forma').value.trim() || null,
        condicao_pagamento: q('#o-cond').value.trim() || null,
        link_proposta: q('#o-link').value.trim() || null,
        criado_por_id: PERFIL.pessoaId
      })
      if (error) { aviso(error.message); return }
      recarregar()
    }

    q('#c-pdf').onclick = () => pdfOrcamentos(s, orcs)

    q('#c-enviar').onclick = async () => {
      if (!orcs.length) { aviso('Lance ao menos um orçamento antes de enviar.'); return }
      if (!escolhido) { aviso('Marque qual orçamento foi escolhido.'); return }
      const parecer = q('#p-parecer').value.trim()
      if (!parecer) { aviso('Escreva por que escolheu este orçamento.'); return }

      const { error } = await db.from('solicitacao_compra').update({
        status: 'AGUARDANDO_APROVACAO',
        analista_id: PERFIL.pessoaId,
        cotado_em: new Date().toISOString(),
        parecer_cotacao: parecer,
        onde_mais_barato: q('#p-onde').value.trim() || null,
        observacao_compras: q('#p-obs').value.trim() || null,
        orcamento_escolhido_id: escolhido.id,
        forma_pagamento: escolhido.forma_pagamento ?? null,
        condicao_pagamento: escolhido.condicao_pagamento ?? null,
        parcelas: Number(q('#p-parcelas').value) || null,
        vencimento: q('#p-venc').value || null,
        dados_pagamento: q('#p-dados').value.trim() || null,
        fornecedor_id: escolhido.fornecedor?.nome
          ? COMPRAS_CACHE.fornecedores.find(f => f.nome === escolhido.fornecedor.nome)?.id ?? null
          : null
      }).eq('id', s.id)

      if (error) { aviso(error.message); return }
      fechar()
      abrirCompras('cotar', true)
    }
  }

  recarregar()
}

// converte "1.250,50" e "80.5" para número
function numeroBR (raw) {
  let b = String(raw ?? '').trim()
  if (!b) return null
  if (b.includes(',')) b = b.replace(/\./g, '').replace(',', '.')
  else if (/^\d{1,3}(\.\d{3})+$/.test(b)) b = b.replace(/\./g, '')
  const n = Number(b)
  return Number.isNaN(n) ? null : n
}

// ----- PDF: quadro comparativo dos orçamentos -----
function pdfOrcamentos (s, orcs) {
  const menor = orcs.length ? Math.min(...orcs.map(o => Number(o.valor))) : null
  const nomeForn = o => o?.fornecedor?.nome || o?.fornecedor_avulso || null
  const escolhido = orcs.find(o => o.escolhido)

  const corpo = `
    <div class="doc-linha">
      ${docBloco('Solicitação',
        docLinha('Nº', s.numero) +
        docLinha('Produto ou serviço', s.produto_servico) +
        docLinha('Quantidade', s.quantidade ? `${s.quantidade} ${s.unidade ?? ''}` : null))}
      ${docBloco('Origem',
        docLinha('Solicitante', s.solicitante?.nome) +
        docLinha('Setor', s.setor?.nome) +
        docLinha('Data', fmtQuando(s.data_solicitacao)))}
      ${docBloco('Cotação',
        docLinha('Levantado por', PERFIL.nome) +
        docLinha('Em', fmtQuando(new Date().toISOString())) +
        docLinha('Orçamentos', String(orcs.length)))}
    </div>

    ${docBloco('Orçamentos levantados', `
      <table><thead><tr>
        <th>Fornecedor</th><th class="num">Valor</th><th>Prazo</th><th>Pagamento</th><th></th>
      </tr></thead><tbody>
        ${orcs.map(o => `<tr>
          <td>${esc(nomeForn(o) ?? '—')}</td>
          <td class="num">R$ ${fmtNum(o.valor)}</td>
          <td>${esc(o.prazo_entrega ?? '—')}</td>
          <td>${esc([o.forma_pagamento, o.condicao_pagamento].filter(Boolean).join(' · ') || '—')}</td>
          <td>${o.escolhido ? '<b>escolhido</b>' : (Number(o.valor) === menor ? 'menor preço' : '')}</td>
        </tr>`).join('') || '<tr><td colspan="5">Nenhum orçamento lançado.</td></tr>'}
      </tbody></table>
      ${docValor('Menor preço', 'melhor condição encontrada', menor)}
      ${docValor('Escolhido', nomeForn(escolhido) ?? 'ainda não definido', escolhido?.valor, true)}`)}

    ${s.parecer_cotacao ? docTexto('Por que este orçamento', s.parecer_cotacao) : ''}
    ${s.onde_mais_barato ? docTexto('Onde achou mais barato', s.onde_mais_barato) : ''}

    ${docAssinaturas([['Levantado por', PERFIL.nome],
                      ['Conferido por', ''],
                      ['Aprovação', s.aprovador?.nome]])}`

  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = documentoPDF({
    titulo: 'QUADRO COMPARATIVO DE ORÇAMENTOS',
    subtitulo: 'cotação de compras',
    corpo,
    acoes: `<button class="btn" id="pq-imprimir">Gerar PDF</button>
      <button class="btn-secundario" id="pq-fechar">Fechar</button>`
  })
  document.body.appendChild(fundo)
  fundo.querySelector('#pq-fechar').onclick = () => fundo.remove()
  fundo.querySelector('#pq-imprimir').onclick = () => window.print()
  fundo.onclick = e => { if (e.target === fundo) fundo.remove() }
}

function telaDecisao (s, nomeEtapa) {

  fundo.className = 'modal-fundo'
  fundo.innerHTML = `
    <div class="modal">

        <p style="margin:4px 0 0;font-size:13.5px;">${esc(s.parecer_coordenacao)}</p></div>` : ''}

      ${s.parecer_cotacao ? `<div class="secao">
        <div class="rot texto-dim2" style="font-size:10.5px;text-transform:uppercase;">Cotação — ${esc(s.analista?.nome ?? '')}</div>
        <p style="margin:4px 0 0;font-size:13.5px;">${esc(s.parecer_cotacao)}</p></div>` : ''}

      <div id="d-orcamentos"></div>

      ${nomeEtapa === 'aprovacao' ? `<div class="campo" style="margin-bottom:10px;">
        <label>Valor aprovado (R$)</label>
        <input id="d-valor" inputmode="decimal" value="${s.valor_aprovado ?? ''}"
          placeholder="deixe vazio para usar o valor cotado"></div>` : ''}
      <div class="campo"><label>${etapa.rotuloParecer} *</label>
        <textarea id="d-parecer" placeholder="Por que está ${nomeEtapa === 'coordenacao' ? 'encaminhando ou devolvendo' : 'aprovando ou reprovando'}"></textarea></div>

      <div class="acoes">
        <button class="btn" id="d-avancar">${etapa.avancar.rotulo}</button>
        <button class="btn-secundario" id="d-recusar">${etapa.recusar.rotulo}</button>
        <button class="btn-secundario" id="d-cancelar">Cancelar</button>
      </div>
      <div class="recado oculto" id="d-recado"></div>
      <p class="aviso">${etapa.explica}</p>
    </div>`

  document.body.appendChild(fundo)
  const q = id => fundo.querySelector(id)
  const fechar = () => fundo.remove()
  q('#d-cancelar').onclick = fechar
  fundo.onclick = e => { if (e.target === fundo) fechar() }

  const aviso = t => {

                <td>${esc(o.prazo_entrega ?? '—')}</td>
                <td>${esc([o.forma_pagamento, o.condicao_pagamento].filter(Boolean).join(' · ') || '—')}</td>

              </tr>`).join('')}
            </tbody></table>
            ${s.dados_pagamento || s.vencimento || s.parcelas ? `
              <p class="aviso" style="margin-top:8px;">
                ${s.parcelas ? s.parcelas + 'x · ' : ''}
                ${s.vencimento ? 'vence ' + fmtData(s.vencimento) + ' · ' : ''}
                ${esc(s.dados_pagamento ?? '')}</p>` : ''}
          </div>`
      })
  }
}

        <div class="campo"><label>Nome *</label><input id="fo-nome"></div>

        <th>Cadastrado por</th><th>Situação</th></tr></thead>
      <tbody>${(data || []).map(f => `<tr>
        <td>${esc(f.nome)}</td>
        <td class="texto-dim">${esc(f.cnpj_cpf ?? '—')}</td>
        <td>${esc(f.contato ?? '—')}</td>

    if ($('#f-ate').value) q = q.lte('data_carregamento', $('#f-ate').value)

    const { data, error } = await q
    if (error) { $('#corpo').innerHTML = `<tr><td colspan="10" class="vazio">${esc(error.message)}</td></tr>`; return }
    if (!data.length) { $('#corpo').innerHTML = `<tr><td colspan="10" class="vazio">Nenhum carregamento no filtro.</td></tr>`; return }

    const total = data.reduce((s, c) => s + Number(c.quantidade_t || 0), 0)
    const nClientes = new Set(data.map(c => c.cliente?.razao_social)).size
    $('#kpis').innerHTML =
      kpi('Carregamentos', data.length, data.length === 500 ? 'limite de 500 atingido' : '') +
      kpi('Toneladas', fmtNum(total), 'soma do período') +
      kpi('Clientes', nClientes) +
      kpi('Média por carga', fmtNum(total / data.length) + ' t')

    $('#corpo').innerHTML = data.map(c => `<tr>
      <td class="texto-dim2">${c.origem_linha ?? '—'}</td>
      <td>${fmtData(c.data_carregamento)}</td>
      <td>${esc(c.cliente?.razao_social)}</td>
      <td>${c.vendedor?.nome ? esc(c.vendedor.nome) : '<span class="badge-alerta">sem vendedor</span>'}</td>
      <td><span class="chip">${esc(c.produto?.nome ?? '—')}</span></td>
      <td>${esc(c.veiculo?.placa ?? '—')}</td>
      <td class="num">${fmtNum(c.quantidade_t, 3)}</td>
      <td>${esc(c.numero_nf ?? '—')}</td>

    </tr>`).join('')

    $('#corpo').querySelectorAll('.anexo-link').forEach(a => { a.onclick = () => verAnexos(a.dataset.linha) })
    $('#rodape').textContent = `${data.length} registros · ${fmtNum(total)} t`
  }

  async function verAnexos (linha) {
    const { data: c } = await db.from('carregamento').select('id').eq('origem_linha', linha).maybeSingle()
    if (!c) return
    const { data: anexos } = await db.from('anexo').select('tipo, drive_file_id')
      .eq('entidade', 'CARREGAMENTO').eq('registro_id', c.id)
    if (!anexos?.length) { alert('Sem anexos nesta linha.'); return }
    anexos.forEach(a => window.open('https://drive.google.com/open?id=' + a.drive_file_id, '_blank'))
  }
}

// ---------------------------------------------------------------
// Página: Crédito e Cobrança  (módulo 'cobranca')
// Carteira de pedidos vendidos a prazo: quem deve, desde quando, e dá
// pra dar baixa anexando o comprovante. Fica sobre a tabela `pedido`
// (numero = "PD"), que já existe pro lado comercial/vendas — aqui só
// somamos os campos de vencimento/baixa e a tela.
//
// "Puxar da Expedição": ao escolher um cliente no formulário de novo
// pedido, listamos os carregamentos FATURADOS dele que ainda não têm
// pedido vinculado — clicar num deles preenche toneladas/preço/PD e,
// ao salvar, liga aquele carregamento a este pedido (carregamento.pedido_id).
// ---------------------------------------------------------------
let CRED_CACHE = { pedidos: [], clientes: [] }
let CRED_FILTRO = 'tudo'
let CRED_CLIENTE = ''

function nomeCliente (c) { return c?.nome_fantasia || c?.razao_social || '—' }

function diasAging (venc) {
  if (!venc) return null
  return Math.round((new Date(hojeISO()) - new Date(venc)) / 86400000)
}

const PAG_FORMAS = { DINHEIRO: 'dinheiro', TRANSFERENCIA: 'transferência', BEM: 'bem (troca)', OUTRO: 'outro' }
const saldoAberto = p => Math.max(0, Number(p.valor_total || 0) - Number(p.valor_recebido || 0))

function tagAging (p) {
  if (p.situacao_pagamento === 'QUITADO') return `<span class="tag-aging quitado">quitado</span>`
  const prefixo = p.situacao_pagamento === 'PARCIAL' ? 'parcial · ' : ''
  const dias = diasAging(p.vencimento)
  if (dias === null) return `<span class="tag-aging futuro">${prefixo}sem prazo</span>`
  if (dias > 60) return `<span class="tag-aging critico">${prefixo}${dias} dias</span>`
  if (dias > 0) return `<span class="tag-aging alerta">${prefixo}${dias} dias</span>`
  if (dias === 0) return `<span class="tag-aging alerta">${prefixo}vence hoje</span>`
  return `<span class="tag-aging futuro">${prefixo}faltam ${-dias} d</span>`
}

function renderCobranca (area) {
  const editavel = podeEditar('cobranca')
  const todos = CRED_CACHE.pedidos
  const abertos = todos.filter(p => p.situacao_pagamento !== 'QUITADO')
  const vencidos = abertos.filter(p => diasAging(p.vencimento) > 0)
  const mais60 = vencidos.filter(p => diasAging(p.vencimento) > 60)
  const aVencer = abertos.filter(p => (diasAging(p.vencimento) ?? -1) <= 0)
  const quitados = todos.filter(p => p.situacao_pagamento === 'QUITADO')

  const carteiraAberta = abertos.reduce((s, p) => s + saldoAberto(p), 0)
  const totVencido = vencidos.reduce((s, p) => s + saldoAberto(p), 0)
  const totAVencer = aVencer.reduce((s, p) => s + saldoAberto(p), 0)
  const totRecebido = todos.reduce((s, p) => s + Number(p.valor_recebido || 0), 0)

  const porCliente = {}
  abertos.forEach(p => { porCliente[p.cliente_id] = (porCliente[p.cliente_id] || 0) + saldoAberto(p) })
  let maiorId = null, maiorVal = 0
  Object.entries(porCliente).forEach(([k, v]) => { if (v > maiorVal) { maiorVal = v; maiorId = k } })
  const maiorCliente = todos.find(p => p.cliente_id === maiorId)?.cliente

  const filtros = [
    ['tudo', 'tudo', todos], ['vencido', 'vencido', vencidos], ['mais60', '+60 dias', mais60],
    ['avencer', 'a vencer', aVencer], ['quitado', 'quitado', quitados]
  ]
  const filtroAtual = filtros.find(f => f[0] === CRED_FILTRO) || filtros[0]
  const listaAtual = filtroAtual[2]
  const listaFiltrada = CRED_CLIENTE ? listaAtual.filter(p => p.cliente_id === CRED_CLIENTE) : listaAtual

  area.innerHTML = `
    <div class="kpis" style="margin-bottom:16px;">
      ${kpi('Carteira em aberto', 'R$ ' + fmtNum(carteiraAberta), abertos.length + ' pedidos')}
      ${kpi('Vencido', 'R$ ' + fmtNum(totVencido), carteiraAberta ? Math.round(totVencido / carteiraAberta * 100) + '% da carteira' : '')}
      ${kpi('A vencer', 'R$ ' + fmtNum(totAVencer), carteiraAberta ? Math.round(totAVencer / carteiraAberta * 100) + '%' : '')}
      ${kpi('Já recebido', 'R$ ' + fmtNum(totRecebido), quitados.length + ' pedidos quitados')}
      ${kpi('Maior exposição', 'R$ ' + fmtNum(maiorVal), maiorCliente ? nomeCliente(maiorCliente) + (carteiraAberta ? ' · ' + Math.round(maiorVal / carteiraAberta * 100) + '%' : '') : '—')}
    </div>

    <div class="acoes" style="margin:0 0 14px;">
      <button class="btn-secundario mini" id="cb-imprimir-lista">Imprimir esta lista</button>
    </div>

    <div class="chips-cred">
      ${filtros.map(f => `<button data-f="${f[0]}" class="${CRED_FILTRO === f[0] ? 'ativo' : ''}">${f[1]}</button>`).join('')}
    </div>

    <select id="cb-cliente" style="margin-bottom:14px;min-width:260px;">
      <option value="">todos os clientes</option>
      ${CRED_CACHE.clientes.map(c => `<option value="${c.id}" ${CRED_CLIENTE === c.id ? 'selected' : ''}>${esc(nomeCliente(c))}</option>`).join('')}
    </select>

    <div class="panel" style="padding:0;"><div class="tabela-scroll">
      <table><thead><tr>
        <th>Cliente</th><th>PD</th><th>Vencimento</th><th class="num">Toneladas</th>
        <th class="num">R$/t</th><th class="num">Valor do pedido</th><th>Situação</th><th></th>
      </tr></thead><tbody>
      ${listaFiltrada.map(p => `<tr>
        <td><b>${esc(nomeCliente(p.cliente))}</b>${p.observacao_cobranca ? `<div class="texto-dim2" style="font-size:11.5px;margin-top:2px;max-width:280px;">${esc(p.observacao_cobranca)}</div>` : ''}</td>
        <td class="texto-dim">${esc(p.numero || '—')}</td>
        <td class="texto-dim">${fmtData(p.vencimento)}</td>
        <td class="num">${fmtNum(p.quantidade_t)}</td>
        <td class="num">${fmtNum(p.preco_unitario)}</td>
        <td class="num">R$ ${fmtNum(p.valor_total)}${p.situacao_pagamento === 'PARCIAL' ? `<div class="texto-dim2" style="font-size:11px;">recebido R$ ${fmtNum(p.valor_recebido)}</div>` : ''}</td>

      <p class="texto-dim2" style="font-size:11.5px;margin-top:8px;">O valor do pedido é calculado por toneladas × R$/t.</p>
    </div>` : ''}`

  area.querySelectorAll('.chips-cred button').forEach(b => {
    b.onclick = () => { CRED_FILTRO = b.dataset.f; renderCobranca(area) }
  })
  $('#cb-cliente').onchange = e => { CRED_CLIENTE = e.target.value; renderCobranca(area) }

  $('#cb-imprimir-lista').onclick = () => {

    imprimirListaCobranca(listaFiltrada, filtroAtual[1] + (nomeCli ? ' · ' + nomeCli : ''))
  }
  area.querySelectorAll('[data-hist]').forEach(b => {
    b.onclick = () => verHistoricoPagamentos(CRED_CACHE.pedidos.find(p => p.id === b.dataset.hist))
  })
  area.querySelectorAll('[data-imprimir]').forEach(b => {
    b.onclick = () => imprimirPedido(CRED_CACHE.pedidos.find(p => p.id === b.dataset.imprimir))
  })

  if (!editavel) return

  area.querySelectorAll('[data-baixa]').forEach(b => {

  area.querySelectorAll('[data-parcial]').forEach(b => {

  $('#np-cliente').onchange = () => carregarCarregamentosCliente($('#np-cliente').value)

      await db.from('carregamento').update({ pedido_id: novo.id }).eq('id', carregamentoId)
    }
    paginaCobranca()

async function carregarCarregamentosCliente (clienteId) {
  const alvo = $('#np-carregamentos')
  if (!clienteId) { alvo.innerHTML = ''; return }
  alvo.innerHTML = '<p class="texto-dim2" style="font-size:12px;">carregando NFs do cliente...</p>'

  const { data } = await db.from('carregamento')
    .select('id,numero_nf,data_carregamento,quantidade_t,preco_unitario,valor_nf')
    .eq('cliente_id', clienteId).eq('status', 'FATURADO').is('pedido_id', null)
    .order('data_carregamento', { ascending: false }).limit(20)

  if (!data?.length) { alvo.innerHTML = '<p class="texto-dim2" style="font-size:12px;">nenhum carregamento faturado sem pedido vinculado pra este cliente.</p>'; return }

  alvo.innerHTML = `<label class="texto-dim2" style="font-size:11px;">puxar de um carregamento da Expedição (opcional)</label>` +
    data.map(c => `<div class="carreg-disponivel" data-carregamento="${c.id}">
      <span>NF ${esc(c.numero_nf || '—')} · ${fmtData(c.data_carregamento)} · ${fmtNum(c.quantidade_t)} t</span>
      <span class="texto-dim2">R$ ${fmtNum(c.valor_nf)}</span></div>`).join('')

  alvo.querySelectorAll('[data-carregamento]').forEach(el => {
    el.onclick = () => {
      const jaSelecionado = el.dataset.selecionado === '1'
      alvo.querySelectorAll('[data-carregamento]').forEach(x => { x.classList.remove('selecionado'); delete x.dataset.selecionado })
      if (!jaSelecionado) {
        el.classList.add('selecionado'); el.dataset.selecionado = '1'
        const c = data.find(x => x.id === el.dataset.carregamento)
        $('#np-ton').value = c.quantidade_t
        $('#np-preco').value = c.preco_unitario || (c.quantidade_t ? (c.valor_nf / c.quantidade_t).toFixed(2) : '')
        if (!$('#np-numero').value) $('#np-numero').value = c.numero_nf || ''
      }
    }
  })
}

// grava um recebimento (dinheiro/bem/transferência), possivelmente cobrindo
// vários pedidos ao mesmo tempo -- ver alocacoes: [{ pedido, valor }]
async function registrarPagamento ({ clienteId, valorTotal, forma, descricao, data, arquivo, alocacoes }) {
  const { data: novoPag, error } = await db.from('pagamento').insert({
    cliente_id: clienteId, valor_total: valorTotal, forma, descricao: descricao || null,
    data, registrado_por: PERFIL.pessoaId
  }).select('id').single()
  if (error) return { error }

  if (arquivo) {
    const caminho = `pagamento/${novoPag.id}/${Date.now()}_${arquivo.name}`
    const { error: erroUpload } = await db.storage.from('comprovantes').upload(caminho, arquivo)
    if (!erroUpload) {
      await db.from('anexo').insert({
        entidade: 'PAGAMENTO', registro_id: novoPag.id, tipo: 'comprovante_pagamento',
        nome_arquivo: arquivo.name, storage_path: caminho
      })
    }
  }

  for (const { pedido, valor } of alocacoes) {
    await db.from('pedido_pagamento').insert({ pedido_id: pedido.id, pagamento_id: novoPag.id, valor })
    const novoRecebido = Number(pedido.valor_recebido || 0) + valor
    const novaSituacao = novoRecebido >= Number(pedido.valor_total) ? 'QUITADO' : 'PARCIAL'
    await db.from('pedido').update({
      valor_recebido: novoRecebido, situacao_pagamento: novaSituacao,
      baixado_em: new Date().toISOString(), baixado_por: PERFIL.pessoaId
    }).eq('id', pedido.id)
  }
  return { ok: true }
}

function abrirBaixa (p) {
  if (!p) return
  const restante = saldoAberto(p)
  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = `<div class="modal">
    <h3>Dar baixa — ${esc(nomeCliente(p.cliente))}</h3>
    ${p.situacao_pagamento === 'PARCIAL' ? `<p class="texto-dim2" style="font-size:12.5px;">
      já recebido R$ ${fmtNum(p.valor_recebido)} · falta R$ ${fmtNum(restante)}</p>` : ''}
    <div class="form-grade">
      <div class="campo"><label>Valor recebido</label><input id="bx-valor" type="number" step="0.01" value="${restante}"></div>
      <div class="campo"><label>Forma</label><select id="bx-forma">
        ${Object.entries(PAG_FORMAS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div>
      <div class="campo"><label>Data do recebimento</label><input id="bx-data" type="date" value="${new Date().toISOString().slice(0, 10)}"></div>
    </div>
    <div class="campo" style="margin-top:10px;"><label>Comprovante de pagamento</label>
      <input id="bx-arquivo" type="file" accept="image/*,application/pdf"></div>
    <div class="acoes"><button class="btn" id="bx-salvar">Confirmar baixa</button><button class="btn-secundario" id="bx-cancelar">Cancelar</button></div>
    <div class="recado oculto" id="bx-recado"></div>
  </div>`
  document.body.appendChild(fundo)
  const fechar = () => fundo.remove()
  fundo.querySelector('#bx-cancelar').onclick = fechar
  fundo.onclick = e => { if (e.target === fundo) fechar() }

  fundo.querySelector('#bx-salvar').onclick = async () => {
    const el = fundo.querySelector('#bx-recado')
    const aviso = t => { el.textContent = t; el.classList.remove('oculto'); el.style.borderColor = 'var(--warn-text)'; el.style.color = 'var(--warn-text)' }
    const botao = fundo.querySelector('#bx-salvar')
    const valor = Number(fundo.querySelector('#bx-valor').value) || restante
    if (valor <= 0) { aviso('Informe um valor maior que zero.'); return }
    botao.disabled = true

    const { error } = await registrarPagamento({
      clienteId: p.cliente_id, valorTotal: valor, forma: fundo.querySelector('#bx-forma').value,
      descricao: null, data: fundo.querySelector('#bx-data').value,
      arquivo: fundo.querySelector('#bx-arquivo').files[0], alocacoes: [{ pedido: p, valor }]
    })
    if (error) { aviso(error.message); botao.disabled = false; return }

    fechar()
    paginaCobranca()
  }
}

// pagamento parcial (ou 1 pagamento cobrindo vários pedidos do mesmo cliente)
async function formPagamentoParcial (p) {
  if (!p) return
  const { data: outrosRaw } = await db.from('pedido')
    .select('id,numero,valor_total,valor_recebido,situacao_pagamento,vencimento')
    .eq('cliente_id', p.cliente_id).neq('situacao_pagamento', 'QUITADO')
    .order('vencimento', { ascending: true, nullsFirst: false })
  const outros = outrosRaw || [{ id: p.id, numero: p.numero, valor_total: p.valor_total, valor_recebido: p.valor_recebido }]

  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = `<div class="modal">
    <h3>Pagamento parcial — ${esc(nomeCliente(p.cliente))}</h3>
    <p class="texto-dim2" style="font-size:12.5px;">
      Marque quais pedidos esse pagamento cobre. O valor é distribuído na ordem
      abaixo (mais antigo primeiro) até acabar.</p>
    <div class="check-pessoas" style="margin:10px 0 14px;">
      ${outros.map(o => `<label>
        <input type="checkbox" data-alocar="${o.id}" ${o.id === p.id ? 'checked' : ''}>
        PD ${esc(o.numero || '—')} · falta R$ ${fmtNum(Math.max(0, Number(o.valor_total) - Number(o.valor_recebido || 0)))}
      </label>`).join('')}
    </div>
    <div class="form-grade">
      <div class="campo"><label>Valor recebido *</label><input id="pp-valor" type="number" step="0.01"></div>
      <div class="campo"><label>Forma</label><select id="pp-forma">
        ${Object.entries(PAG_FORMAS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div>
      <div class="campo"><label>Data</label><input id="pp-data" type="date" value="${new Date().toISOString().slice(0, 10)}"></div>
    </div>
    <div class="campo" style="margin-top:10px;"><label>Descrição (obrigatório se for bem/troca)</label>
      <input id="pp-desc" placeholder="ex: trator John Deere modelo X, avaliado em R$ 200.000"></div>
    <div class="campo" style="margin-top:10px;"><label>Comprovante</label>
      <input id="pp-arquivo" type="file" accept="image/*,application/pdf"></div>
    <div class="acoes"><button class="btn" id="pp-salvar">Registrar pagamento</button><button class="btn-secundario" id="pp-cancelar">Cancelar</button></div>
    <div class="recado oculto" id="pp-recado"></div>
  </div>`
  document.body.appendChild(fundo)
  const fechar = () => fundo.remove()
  fundo.querySelector('#pp-cancelar').onclick = fechar
  fundo.onclick = e => { if (e.target === fundo) fechar() }

  fundo.querySelector('#pp-salvar').onclick = async () => {
    const el = fundo.querySelector('#pp-recado')
    const aviso = t => { el.textContent = t; el.classList.remove('oculto'); el.style.borderColor = 'var(--warn-text)'; el.style.color = 'var(--warn-text)' }
    const valor = Number(fundo.querySelector('#pp-valor').value)
    const forma = fundo.querySelector('#pp-forma').value
    const descricao = fundo.querySelector('#pp-desc').value.trim()
    if (!valor || valor <= 0) { aviso('Informe o valor recebido.'); return }
    if (forma === 'BEM' && !descricao) { aviso('Descreva o bem recebido (qual máquina, valor de avaliação etc).'); return }

    const marcados = [...fundo.querySelectorAll('[data-alocar]:checked')].map(el2 => el2.dataset.alocar)
    if (!marcados.length) { aviso('Marque pelo menos um pedido.'); return }

    let restante = valor
    const alocacoes = []
    for (const id of marcados) {
      if (restante <= 0) break
      const o = outros.find(x => x.id === id)
      if (!o) continue
      const saldo = Math.max(0, Number(o.valor_total) - Number(o.valor_recebido || 0))
      if (saldo <= 0) continue
      const aloc = Math.min(saldo, restante)
      alocacoes.push({ pedido: o, valor: aloc })
      restante -= aloc
    }
    if (!alocacoes.length) { aviso('Os pedidos marcados já estão quitados.'); return }

    const botao = fundo.querySelector('#pp-salvar')
    botao.disabled = true
    const { error } = await registrarPagamento({
      clienteId: p.cliente_id, valorTotal: valor, forma, descricao: descricao || null,
      data: fundo.querySelector('#pp-data').value, arquivo: fundo.querySelector('#pp-arquivo').files[0],
      alocacoes
    })
    if (error) { aviso(error.message); botao.disabled = false; return }

    if (restante > 0.01) {
      alert(`R$ ${fmtNum(restante)} do valor informado não foi aplicado a nenhum pedido — os pedidos marcados já cobriam o total antes de acabar o valor.`)
    }
    fechar()
    paginaCobranca()
  }
}

// ----- Cobrança › Pedidos de venda -----
// Numeração vem do banco (sequência a partir de 2500), para dois usuários
// não gerarem o mesmo número ao mesmo tempo.
async function cobPedidos (alvo, editavel) {
  const [{ data: pedidos }, { data: parcelas }] = await Promise.all([
    db.from('pedido').select(`
      id, numero, quantidade_t, unidade, preco_unitario, valor_total,
      forma_pagamento, condicao_pagamento, data_pedido, status, observacoes,
      local_entrega, situacao_pagamento, cancelado_em, motivo_cancelamento,
      cliente_id, produto_id, vendedor_id, observacao_cobranca,
      cliente:cliente_id ( razao_social, cnpj_cpf, inscricao_estadual, endereco,
                           bairro, municipio, uf, cep, telefone ),
      vendedor:vendedor_id ( nome ), produto:produto_id ( nome )
    `).order('numero', { ascending: false }).limit(200),
    db.from('pedido_parcela').select('pedido_id,numero,vencimento,valor,situacao')
  ])

  const porPedido = {}
  ;(parcelas || []).forEach(p => {
    porPedido[p.pedido_id] = porPedido[p.pedido_id] || []
    porPedido[p.pedido_id].push(p)
  })

  const total = (pedidos || []).filter(p => !p.cancelado_em)
    .reduce((s, p) => s + Number(p.valor_total || 0), 0)

  alvo.innerHTML = `
    <div class="kpis" style="margin-bottom:14px;">
      ${kpi('Pedidos', (pedidos || []).length)}
      ${kpi('Valor total', 'R$ ' + fmtNum(total))}
      ${kpi('Cancelados', (pedidos || []).filter(x => x.cancelado_em).length, 'fora da carteira')}
    </div>
    ${editavel ? `<div class="acoes" style="margin:0 0 14px;">
      <button class="btn" id="pv-novo">Novo pedido de venda</button></div>` : ''}
    <div id="pv-lista"></div>`

  $('#pv-lista').innerHTML = (pedidos || []).map(p => {
    const par = porPedido[p.id] || []
    const abertas = par.filter(x => x.situacao !== 'PAGA').length
    return `<div class="cartao-sol" ${p.cancelado_em ? 'style="opacity:.55;"' : ''}>
      <div class="linha1">
        <span class="titulo">Pedido ${esc(p.numero)} — ${esc(p.cliente?.razao_social ?? 'sem cliente')}</span>
        ${p.cancelado_em ? '<span class="status reprovada">cancelado</span>'
          : `<span class="chip">${esc(p.produto?.nome ?? '—')}</span>`}
        ${p.observacao_cobranca?.startsWith('CONFERIR')
          ? '<span class="urgente">● conferir valor</span>' : ''}
        <div class="botoes">
          <button class="btn-secundario mini" data-pdf="${p.id}">PDF</button>
          <button class="btn-secundario mini" data-hist="${p.id}">histórico</button>
          ${editavel && !p.cancelado_em
            ? `<button class="btn-secundario mini" data-edit="${p.id}">editar</button>
               <button class="btn-secundario mini" data-cancel="${p.id}">cancelar</button>` : ''}
          ${editavel && p.cancelado_em
            ? `<button class="btn-secundario mini" data-reativar="${p.id}">reativar</button>` : ''}
        </div>
      </div>
      <div class="meta">
        ${p.quantidade_t ? fmtNum(p.quantidade_t, 2) + ' ' + esc(p.unidade ?? 'TL') : '—'}
        ${p.preco_unitario ? ' × R$ ' + fmtNum(p.preco_unitario) : ''}
        = <b>R$ ${fmtNum(p.valor_total)}</b>
        ${p.data_pedido ? ' · ' + fmtData(p.data_pedido) : ''}
        ${par.length ? ` · ${par.length} parcela(s)${abertas ? `, ${abertas} em aberto` : ', quitado'}` : ' · sem parcelas'}
        ${p.cancelado_em ? `<br><span class="urgente">cancelado em ${fmtQuando(p.cancelado_em)} — ${esc(p.motivo_cancelamento ?? 'sem motivo')}</span>` : ''}
        ${p.observacao_cobranca ? `<br><span class="texto-dim2">${esc(p.observacao_cobranca)}</span>` : ''}
      </div>
    </div>`
  }).join('') || `<p class="vazio">Nenhum pedido de venda emitido ainda.</p>`

  alvo.querySelectorAll('[data-pdf]').forEach(b => {
    b.onclick = () => pdfPedidoVenda((pedidos || []).find(x => x.id === b.dataset.pdf),
                                     porPedido[b.dataset.pdf] || [])
  })
  alvo.querySelectorAll('[data-hist]').forEach(b => {
    b.onclick = () => historicoPedido((pedidos || []).find(x => x.id === b.dataset.hist))
  })
  if (!editavel) return
  alvo.querySelectorAll('[data-edit]').forEach(b => {
    b.onclick = () => formPedidoVenda((pedidos || []).find(x => x.id === b.dataset.edit))
  })
  alvo.querySelectorAll('[data-cancel]').forEach(b => {
    b.onclick = () => justificar((pedidos || []).find(x => x.id === b.dataset.cancel), 'CANCELAMENTO')
  })
  alvo.querySelectorAll('[data-reativar]').forEach(b => {
    b.onclick = () => justificar((pedidos || []).find(x => x.id === b.dataset.reativar), 'REATIVACAO')
  })
  $('#pv-novo').onclick = () => formPedidoVenda(null)
}

      <div class="acoes">
        <button class="btn" id="pv-salvar">${p ? 'Salvar' : 'Emitir pedido'}</button>
        <button class="btn-secundario" id="pv-cancelar">Cancelar</button>
      </div>
      <div class="recado oculto" id="pv-recado"></div>
    </div>`

  document.body.appendChild(fundo)
  const q = id => fundo.querySelector(id)
  const fechar = () => fundo.remove()
  q('#pv-cancelar').onclick = fechar
  fundo.onclick = e => { if (e.target === fundo) fechar() }

  const aviso = t => {
    const el = q('#pv-recado'); el.textContent = t; el.classList.remove('oculto')
    el.style.borderColor = 'var(--warn-text)'; el.style.color = 'var(--warn-text)'
  }

  // cliente sem CPF/CNPJ ou com nome a conferir: avisa antes de emitir
  q('#pv-cliente').onchange = () => {
    const c = (clientes || []).find(x => x.id === q('#pv-cliente').value)
    const el = q('#pv-aviso-cli')
    el.textContent = !c ? ''
      : !c.cnpj_cpf ? 'Este cliente está sem CPF/CNPJ. Complete o cadastro antes de emitir.'
      : c.conferir_dados ? 'O nome deste cliente difere do que saiu na NF. Confira antes de emitir.'
      : ''
    el.style.color = el.textContent ? 'var(--warn-text)' : 'var(--dim2)'
  }
  q('#pv-cliente').onchange()

  const totalCalc = () => {
    const t = (numeroBR(q('#pv-qtd').value) ?? 0) * (numeroBR(q('#pv-preco').value) ?? 0)
    q('#pv-total').value = t ? t.toFixed(2).replace('.', ',') : ''
    return t
  }
  q('#pv-qtd').oninput = totalCalc
  q('#pv-preco').oninput = totalCalc

  const desenharParcelas = () => {
    q('#pv-parcelas').innerHTML = parcelas.map((x, i) => `
      <div class="linha-modulo" style="gap:8px;">
        <span class="texto-dim2" style="width:22px;">${i + 1}</span>
        <input type="date" data-venc="${i}" value="${x.vencimento ?? ''}" style="flex:1;">
        <input inputmode="decimal" data-valor="${i}" value="${x.valor ? String(x.valor).replace('.', ',') : ''}"
          placeholder="valor" style="flex:1;">
        <button class="btn-secundario mini" data-remove="${i}">×</button>
      </div>`).join('') || `<p class="texto-dim2" style="font-size:12.5px;">
        Nenhuma parcela. Use "+ parcela" ou divida o total.</p>`

    const soma = parcelas.reduce((s, x) => s + (x.valor || 0), 0)
    const t = numeroBR(q('#pv-total').value) ?? 0
    const dif = t - soma
    q('#pv-soma').textContent = parcelas.length
      ? `soma das parcelas R$ ${fmtNum(soma)}` + (Math.abs(dif) > 0.01 ? ` · faltam R$ ${fmtNum(dif)}` : ' · confere')
      : ''
    q('#pv-soma').style.color = parcelas.length && Math.abs(dif) > 0.01 ? 'var(--warn-text)' : 'var(--dim2)'

    q('#pv-parcelas').querySelectorAll('[data-venc]').forEach(el => {
      el.onchange = () => { parcelas[+el.dataset.venc].vencimento = el.value; desenharParcelas() }
    })
    q('#pv-parcelas').querySelectorAll('[data-valor]').forEach(el => {
      el.onchange = () => { parcelas[+el.dataset.valor].valor = numeroBR(el.value) ?? 0; desenharParcelas() }
    })
    q('#pv-parcelas').querySelectorAll('[data-remove]').forEach(el => {
      el.onclick = () => { parcelas.splice(+el.dataset.remove, 1); desenharParcelas() }
    })
  }

  q('#pv-add-parcela').onclick = () => {
    const ultima = parcelas[parcelas.length - 1]
    const base = ultima?.vencimento ? new Date(ultima.vencimento) : new Date()
    base.setMonth(base.getMonth() + 1)
    parcelas.push({ vencimento: base.toISOString().slice(0, 10), valor: 0 })
    desenharParcelas()
  }

  q('#pv-dividir').onclick = () => {
    const t = totalCalc()
    if (!t) { aviso('Preencha quantidade e valor unitário primeiro.'); return }
    const n = Number(prompt('Dividir em quantas parcelas?', '3'))
    if (!n || n < 1) return
    // a última parcela absorve a sobra dos centavos
    const base = Math.floor((t / n) * 100) / 100
    const d = new Date(q('#pv-data').value || Date.now())
    parcelas = Array.from({ length: n }, (_, i) => {
      const v = new Date(d); v.setMonth(v.getMonth() + i + 1)
      return {
        vencimento: v.toISOString().slice(0, 10),
        valor: i === n - 1 ? Number((t - base * (n - 1)).toFixed(2)) : base
      }
    })
    desenharParcelas()
  }

  totalCalc(); desenharParcelas()

  q('#pv-salvar').onclick = async () => {
    const cliente_id = q('#pv-cliente').value
    if (!cliente_id) { aviso('Escolha o cliente.'); return }
    const qtd = numeroBR(q('#pv-qtd').value)
    const preco = numeroBR(q('#pv-preco').value)
    if (!qtd || !preco) { aviso('Informe quantidade e valor unitário.'); return }

    const total = Number((qtd * preco).toFixed(2))
    const soma = parcelas.reduce((s, x) => s + (x.valor || 0), 0)
    if (parcelas.length && Math.abs(total - soma) > 0.01) {
      aviso(`A soma das parcelas (R$ ${fmtNum(soma)}) não bate com o total (R$ ${fmtNum(total)}).`)
      return
    }
    if (parcelas.some(x => !x.vencimento || !x.valor)) {
      aviso('Toda parcela precisa de vencimento e valor.'); return
    }

    const justif = p ? (q('#pv-justif')?.value.trim() ?? '') : ''
    if (p && justif.length < 10) {
      aviso('Escreva por que está alterando — pelo menos uma frase.'); return
    }

    const btn = q('#pv-salvar'); btn.disabled = true; btn.textContent = 'Salvando...'
    const corpo = {
      cliente_id,
      produto_id: q('#pv-produto').value || null,
      vendedor_id: q('#pv-vendedor').value || null,
      quantidade_t: qtd, unidade: q('#pv-unid').value,
      preco_unitario: preco, valor_total: total,
      data_pedido: q('#pv-data').value || null,
      forma_pagamento: q('#pv-forma').value,
      local_entrega: q('#pv-local').value.trim() || null,
      observacoes: q('#pv-obs').value.trim() || null,
      vencimento: parcelas.length ? parcelas[parcelas.length - 1].vencimento : null,
      emitido_por: PERFIL.pessoaId
    }

    let pedidoId = p?.id
    if (p) {
      const { error } = await db.from('pedido').update(corpo).eq('id', p.id)
      if (error) { aviso(error.message); btn.disabled = false; btn.textContent = 'Salvar'; return }
      await db.from('pedido_historico').insert({
        pedido_id: p.id, acao: 'EDICAO', justificativa: justif,
        antes: {
          cliente_id: p.cliente_id, quantidade_t: p.quantidade_t,
          preco_unitario: p.preco_unitario, valor_total: p.valor_total,
          forma_pagamento: p.forma_pagamento, data_pedido: p.data_pedido,
          local_entrega: p.local_entrega, observacoes: p.observacoes,
          parcelas: parcelasAntes
        },
        depois: {
          cliente_id: corpo.cliente_id, quantidade_t: corpo.quantidade_t,
          preco_unitario: corpo.preco_unitario, valor_total: corpo.valor_total,
          forma_pagamento: corpo.forma_pagamento, data_pedido: corpo.data_pedido,
          local_entrega: corpo.local_entrega, observacoes: corpo.observacoes,
          parcelas: parcelas.length
        },
        pessoa_id: PERFIL.pessoaId
      })
    } else {
      const { data, error } = await db.from('pedido').insert(corpo).select('id,numero').single()
      if (error) { aviso(error.message); btn.disabled = false; btn.textContent = 'Emitir pedido'; return }
      pedidoId = data.id
    }

    await db.from('pedido_parcela').delete().eq('pedido_id', pedidoId)
    if (parcelas.length) {
      await db.from('pedido_parcela').insert(parcelas.map((x, i) => ({
        pedido_id: pedidoId, numero: i + 1,
        vencimento: x.vencimento, valor: x.valor
      })))
    }

    fechar(); abrirCobranca('pedidos')
  }
}

// ----- Cancelar, reativar ou excluir pedido: sempre com justificativa -----
function justificar (p, acao) {
  if (!p) return

  const texto = {
    CANCELAMENTO: {
      titulo: 'Cancelar pedido ' + p.numero,
      explica: 'O pedido sai da carteira e das cobranças, mas continua no sistema com o histórico. '
             + 'Nada é apagado.',
      botao: 'Confirmar cancelamento',
      rotulo: 'Por que está cancelando *'
    },
    REATIVACAO: {
      titulo: 'Reativar pedido ' + p.numero,
      explica: 'O pedido volta para a carteira e as parcelas voltam a ser cobradas.',
      botao: 'Confirmar reativação',
      rotulo: 'Por que está reativando *'
    },
    EXCLUSAO: {
      titulo: 'Excluir pedido ' + p.numero + ' em definitivo',
      explica: 'Isto apaga o pedido e as parcelas do banco. Não há como desfazer. '
             + 'Use apenas para pedido lançado por engano — para pedido real que não vai acontecer, cancele.',
      botao: 'Excluir em definitivo',
      rotulo: 'Por que está excluindo *'
    }
  }[acao]

  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = `
    <div class="modal">
      <h3>${esc(texto.titulo)}</h3>
      <div class="ficha" style="margin-bottom:14px;">
        <div class="item"><div class="rot">Cliente</div>
          <div class="val">${esc(p.cliente?.razao_social ?? '—')}</div></div>
        <div class="item"><div class="rot">Valor</div>
          <div class="val">R$ ${fmtNum(p.valor_total)}</div></div>
        <div class="item"><div class="rot">Emitido em</div>
          <div class="val">${fmtData(p.data_pedido)}</div></div>
      </div>
      <p class="aviso" style="margin-top:0;">${esc(texto.explica)}</p>
      <div class="campo"><label>${esc(texto.rotulo)}</label>
        <textarea id="j-motivo" style="min-height:90px;"
          placeholder="Escreva o que aconteceu. Fica registrado com seu nome e a data."></textarea></div>
      <div class="acoes">
        <button class="btn" id="j-ok">${esc(texto.botao)}</button>
        <button class="btn-secundario" id="j-cancelar">Voltar</button>
      </div>
      <div class="recado oculto" id="j-recado"></div>
    </div>`

  document.body.appendChild(fundo)
  const q = id => fundo.querySelector(id)
  const fechar = () => fundo.remove()
  q('#j-cancelar').onclick = fechar
  fundo.onclick = e => { if (e.target === fundo) fechar() }

  const aviso = t => {
    const el = q('#j-recado'); el.textContent = t; el.classList.remove('oculto')
    el.style.borderColor = 'var(--warn-text)'; el.style.color = 'var(--warn-text)'
  }

  q('#j-ok').onclick = async () => {
    const motivo = q('#j-motivo').value.trim()
    if (motivo.length < 10) { aviso('Escreva a justificativa — pelo menos uma frase.'); return }

    const btn = q('#j-ok'); btn.disabled = true; btn.textContent = 'Registrando...'

    // o histórico entra primeiro: se a ação falhar depois, fica o registro da tentativa
    await db.from('pedido_historico').insert({
      pedido_id: p.id, acao, justificativa: motivo,
      antes: { numero: p.numero, valor_total: p.valor_total,
               cancelado_em: p.cancelado_em ?? null },
      pessoa_id: PERFIL.pessoaId
    })

    let erro = null
    if (acao === 'CANCELAMENTO') {
      const { error } = await db.from('pedido').update({
        cancelado_em: new Date().toISOString(),
        cancelado_por: PERFIL.pessoaId,
        motivo_cancelamento: motivo,
        status: 'CANCELADO'
      }).eq('id', p.id)
      erro = error
      if (!error) await db.from('pedido_parcela')
        .update({ situacao: 'CANCELADA' }).eq('pedido_id', p.id).neq('situacao', 'PAGA')
    }
    if (acao === 'REATIVACAO') {
      const { error } = await db.from('pedido').update({
        cancelado_em: null, cancelado_por: null,
        motivo_cancelamento: null, status: 'EMITIDO'
      }).eq('id', p.id)
      erro = error
      if (!error) await db.from('pedido_parcela')
        .update({ situacao: 'ABERTA' }).eq('pedido_id', p.id).eq('situacao', 'CANCELADA')
    }
    if (acao === 'EXCLUSAO') {
      const { error } = await db.from('pedido').delete().eq('id', p.id)
      erro = error
    }

    btn.disabled = false; btn.textContent = texto.botao
    if (erro) { aviso(erro.message); return }
    fechar(); abrirCobranca('pedidos')
  }
}

// ----- Histórico de alterações do pedido -----
async function historicoPedido (p) {
  if (!p) return
  const { data } = await db.from('pedido_historico')
    .select('acao,justificativa,quando,antes,depois,pessoa:pessoa_id(nome)')
    .eq('pedido_id', p.id).order('quando', { ascending: false })

  const rotulo = { EDICAO: 'Editado', CANCELAMENTO: 'Cancelado',
                   REATIVACAO: 'Reativado', EXCLUSAO: 'Excluído' }

  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = `
    <div class="modal">
      <div class="cabeca-secao">
        <h3>Histórico do pedido ${esc(p.numero)}</h3>
        <span class="texto-dim2" style="font-size:12px;">${(data || []).length} registro(s)</span>
      </div>
      ${(data || []).map(x => `
        <div class="passo">
          <span class="quando">${fmtQuando(x.quando) ?? '—'}</span>
          <span><b>${esc(rotulo[x.acao] ?? x.acao)}</b> por ${esc(x.pessoa?.nome ?? '—')}<br>
            ${esc(x.justificativa)}
            ${x.antes && x.depois ? `<br><span class="texto-dim2" style="font-size:11.5px;">${
              esc(diferencas(x.antes, x.depois))}</span>` : ''}
          </span>
        </div>`).join('') || `<p class="vazio">
          Nenhuma alteração registrada. O pedido está como foi emitido.</p>`}
      <div class="acoes">
        ${podeEditar('cobranca') ? `<button class="btn-secundario" id="h-excluir">Excluir pedido</button>` : ''}
        <button class="btn-secundario" id="h-fechar">Fechar</button>
      </div>
    </div>`

  document.body.appendChild(fundo)
  fundo.querySelector('#h-fechar').onclick = () => fundo.remove()
  fundo.onclick = e => { if (e.target === fundo) fundo.remove() }
  const bx = fundo.querySelector('#h-excluir')
  if (bx) bx.onclick = () => { fundo.remove(); justificar(p, 'EXCLUSAO') }
}

// resume o que mudou entre dois estados, para o histórico ficar legível
function diferencas (antes, depois) {
  const nomes = {
    valor_total: 'valor', quantidade_t: 'quantidade', preco_unitario: 'preço unitário',
    forma_pagamento: 'forma de pagamento', data_pedido: 'data', cliente_id: 'cliente',
    local_entrega: 'entrega', observacoes: 'observações', parcelas: 'parcelas'
  }
  const mudou = []
  Object.keys({ ...antes, ...depois }).forEach(k => {
    const a = antes?.[k], d = depois?.[k]
    if (String(a ?? '') !== String(d ?? '')) {
      mudou.push(`${nomes[k] ?? k}: ${a ?? '—'} → ${d ?? '—'}`)
    }
  })
  return mudou.join(' · ')
}

        <td>${esc(p.produto?.nome ?? '—')}</td>
        <td class="num">${fmtNum(p.quantidade_t, 2)}</td>
        <td>${esc(p.unidade ?? 'TL')}</td>
        <td class="num">R$ ${fmtNum(p.preco_unitario)}</td>
        <td class="num">R$ ${fmtNum(p.valor_total)}</td>
      </tr></tbody></table>
      ${docValor('Valor total do pedido', esc(p.forma_pagamento ?? 'forma a combinar'), p.valor_total, true)}`)}

    ${par.length ? docBloco('Condições de pagamento', `
      <table><thead><tr>
        <th>Parcela</th><th>Vencimento</th><th class="num">Valor</th>

}

// ----- Cobrança › Clientes -----
// Boa parte dos dados veio das DANFEs. O que estiver marcado para conferir
// mostra alerta: nome do cadastro diferente do nome que saiu na nota.
async function cobClientes (alvo, editavel) {

    .select('id,razao_social,nome_fantasia,cnpj_cpf,inscricao_estadual,endereco,bairro,municipio,uf,cep,telefone,email,status,observacoes,dados_nf_origem,conferir_dados,vendedor_id')
    .order('razao_social')
  if (error) { alvo.innerHTML = `<p class="vazio">${esc(error.message)}</p>`; return }

  const semDados = (data || []).filter(c => !c.cnpj_cpf).length
  const conferir = (data || []).filter(c => c.conferir_dados).length

  alvo.innerHTML = `
    <div class="kpis" style="margin-bottom:14px;">
      ${kpi('Clientes', (data || []).length)}
      ${kpi('Sem CPF ou CNPJ', semDados, semDados ? 'não dá para emitir pedido' : 'todos completos')}
      ${kpi('A conferir', conferir, conferir ? 'nome difere da NF' : 'nenhuma divergência')}

    ${editavel ? `<div class="acoes" style="margin:0 0 14px;">
      <button class="btn" id="cl-novo">Novo cliente</button></div>` : ''}

    <div class="filtros" style="margin-bottom:12px;">

        <input id="cl-busca" placeholder="nome, CPF/CNPJ ou município"></div>
    </div>
    <div class="lista-pessoas" id="cl-lista"></div>`

  const desenhar = () => {
    const q = $('#cl-busca').value.trim().toLowerCase()
    const lista = (data || []).filter(c => !q ||
      `${c.razao_social} ${c.nome_fantasia ?? ''} ${c.cnpj_cpf ?? ''} ${c.municipio ?? ''}`
        .toLowerCase().includes(q))

    $('#cl-lista').innerHTML = lista.map(c => `
      <div class="cartao-pessoa">
        <div class="inicial">${esc((c.razao_social || '?').trim()[0].toUpperCase())}</div>
        <div class="dados">
          <div class="nome">${esc(c.razao_social)}
            ${c.conferir_dados ? '<span class="urgente">● conferir nome</span>' : ''}</div>
          <div class="sub">
            ${c.cnpj_cpf ? esc(c.cnpj_cpf) : '<span class="badge-alerta">sem CPF/CNPJ</span>'}
            ${c.inscricao_estadual ? ' · IE ' + esc(c.inscricao_estadual) : ''}
            ${c.municipio ? ' · ' + esc(c.municipio) + '/' + esc(c.uf ?? '') : ''}
            ${c.dados_nf_origem ? ' · da ' + esc(c.dados_nf_origem) : ''}
          </div>
        </div>
        <div class="selos">
          <span class="selo ${c.status === 'ATIVO' ? '' : 'forte'}">${esc(c.status)}</span>
        </div>
        <div class="botoes">
          ${editavel ? `<button class="btn-secundario mini" data-editar="${c.id}">editar</button>` : ''}
        </div>
      </div>`).join('') || `<p class="vazio">Nenhum cliente encontrado.</p>`

    if (!editavel) return
    $('#cl-lista').querySelectorAll('[data-editar]').forEach(b => {
      b.onclick = () => formCliente(data.find(x => x.id === b.dataset.editar))
    })
  }

  $('#cl-busca').oninput = desenhar
  desenhar()
  if (editavel) $('#cl-novo').onclick = () => formCliente(null)
}

function formCliente (c) {
  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  const v = k => esc(c?.[k] ?? '')

  fundo.innerHTML = `
    <div class="modal">
      <h3>${c ? 'Editar cliente' : 'Novo cliente'}</h3>
      ${c?.conferir_dados ? `<div class="recado" style="border-color:var(--warn-text);color:var(--warn-text);margin:0 0 12px;">
        O nome deste cadastro difere do que saiu na ${esc(c.dados_nf_origem ?? 'NF')}.
        Confirme qual é o correto antes de emitir pedido.</div>` : ''}
      <div class="form-grade">
        <div class="campo" style="grid-column:1/-1;"><label>Razão social ou nome *</label>
          <input id="cl-razao" value="${v('razao_social')}"></div>
        <div class="campo"><label>Nome fantasia</label><input id="cl-fantasia" value="${v('nome_fantasia')}"></div>
        <div class="campo"><label>CPF ou CNPJ</label><input id="cl-doc" value="${v('cnpj_cpf')}"></div>
        <div class="campo"><label>Inscrição estadual</label><input id="cl-ie" value="${v('inscricao_estadual')}"></div>
        <div class="campo" style="grid-column:1/-1;"><label>Endereço</label>
          <input id="cl-end" value="${v('endereco')}"></div>
        <div class="campo"><label>Bairro</label><input id="cl-bairro" value="${v('bairro')}"></div>
        <div class="campo"><label>Município</label><input id="cl-mun" value="${v('municipio')}"></div>
        <div class="campo"><label>UF</label><input id="cl-uf" maxlength="2" value="${v('uf')}"></div>
        <div class="campo"><label>CEP</label><input id="cl-cep" value="${v('cep')}"></div>
        <div class="campo"><label>Telefone</label><input id="cl-tel" value="${v('telefone')}"></div>
        <div class="campo"><label>E-mail</label><input id="cl-email" type="email" value="${v('email')}"></div>
        <div class="campo"><label>Situação</label>
          <select id="cl-status">
            <option value="ATIVO" ${c?.status !== 'INATIVO' ? 'selected' : ''}>ativo</option>
            <option value="INATIVO" ${c?.status === 'INATIVO' ? 'selected' : ''}>inativo</option>
          </select></div>
      </div>
      <div class="campo" style="margin-top:12px;"><label>Observações</label>
        <textarea id="cl-obs" style="min-height:64px;">${v('observacoes')}</textarea></div>
      ${c?.conferir_dados ? `<label class="linha-modulo" style="margin-top:10px;">
        <input type="checkbox" id="cl-conferido">
        <span class="nome">Já conferi: o nome acima está correto</span></label>` : ''}

      <div class="acoes">
        <button class="btn" id="cl-salvar">Salvar</button>
        ${c ? '<button class="btn-secundario" id="cl-excluir">Excluir</button>' : ''}
        <button class="btn-secundario" id="cl-cancelar">Cancelar</button>
      </div>
      <div class="recado oculto" id="cl-recado"></div>
      ${c?.dados_nf_origem ? `<p class="aviso">Dados fiscais extraídos da ${esc(c.dados_nf_origem)}.</p>` : ''}
    </div>`

  document.body.appendChild(fundo)
  const q = id => fundo.querySelector(id)
  const fechar = () => fundo.remove()
  q('#cl-cancelar').onclick = fechar
  fundo.onclick = e => { if (e.target === fundo) fechar() }

  const aviso = t => {
    const el = q('#cl-recado'); el.textContent = t; el.classList.remove('oculto')
    el.style.borderColor = 'var(--warn-text)'; el.style.color = 'var(--warn-text)'
  }

  q('#cl-salvar').onclick = async () => {
    const razao = q('#cl-razao').value.trim()
    if (!razao) { aviso('Escreva a razão social ou o nome.'); return }

    const corpo = {
      razao_social: razao,
      nome_fantasia: q('#cl-fantasia').value.trim() || null,
      cnpj_cpf: q('#cl-doc').value.trim() || null,
      inscricao_estadual: q('#cl-ie').value.trim() || null,
      endereco: q('#cl-end').value.trim() || null,
      bairro: q('#cl-bairro').value.trim() || null,
      municipio: q('#cl-mun').value.trim() || null,
      uf: q('#cl-uf').value.trim().toUpperCase() || null,
      cep: q('#cl-cep').value.trim() || null,
      telefone: q('#cl-tel').value.trim() || null,
      email: q('#cl-email').value.trim() || null,
      status: q('#cl-status').value,
      observacoes: q('#cl-obs').value.trim() || null
    }
    if (q('#cl-conferido')?.checked) corpo.conferir_dados = false

    const { error } = c
      ? await db.from('cliente').update(corpo).eq('id', c.id)
      : await db.from('cliente').insert(corpo)
    if (error) { aviso(error.message); return }
    fechar(); abrirCobranca('clientes')
  }

  const bx = q('#cl-excluir')
  if (bx) bx.onclick = async () => {
    // não apaga cliente com histórico: inativa, para não quebrar NF e pedido
    const [{ count: nCarr }, { count: nPed }] = await Promise.all([
      db.from('carregamento').select('id', { count: 'exact', head: true }).eq('cliente_id', c.id),
      db.from('pedido').select('id', { count: 'exact', head: true }).eq('cliente_id', c.id)
    ])
    if ((nCarr || 0) + (nPed || 0) > 0) {
      if (!confirm(`Este cliente tem ${nCarr || 0} carregamento(s) e ${nPed || 0} pedido(s).\n`
        + 'Apagar quebraria esse histórico, então ele será apenas inativado. Continuar?')) return
      await db.from('cliente').update({ status: 'INATIVO' }).eq('id', c.id)
    } else {
      if (!confirm('Excluir este cliente em definitivo?')) return
      const { error } = await db.from('cliente').delete().eq('id', c.id)
      if (error) { aviso(error.message); return }
    }
    fechar(); abrirCobranca('clientes')
  }
}

// ---------------------------------------------------------------
// Página: Financeiro
// Sub-abas: Lançamentos · Orçamento · Saldo e contas · Planos e metas ·
// Investimentos · Relatórios. Todas (exceto Contas/Planos/Investimentos,
// que não são mensais) seguem um mês corrente comum (FIN_MES).
// ---------------------------------------------------------------
let FIN_CACHE = { contas: [], categorias: [], centros: [] }
let FIN_MES = primeiroDiaMes()

function primeiroDiaMes (d = new Date()) { return new Date(d.getFullYear(), d.getMonth(), 1) }
function isoMes (d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01' }
function nomeMes (d) {
  const meses = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho',
    'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro']
  return meses[d.getMonth()] + ' de ' + d.getFullYear()
}
function opcoesFin (lista, vazio = 'selecione…', atual = null) {
  return `<option value="">${vazio}</option>` + lista.map(x =>
    `<option value="${x.id}" ${x.id === atual ? 'selected' : ''}>${esc(x.nome)}</option>`).join('')
}
function navMesHtml () {
  return `<div class="filtros" style="margin-bottom:14px;align-items:center;">
    <button class="btn-secundario mini" id="fm-menos">‹</button>
    <span style="min-width:150px;text-align:center;">${nomeMes(FIN_MES)}</span>
    <button class="btn-secundario mini" id="fm-mais">›</button>
    <button class="btn-secundario mini" id="fm-hoje">hoje</button>
  </div>`
}
function ligarNavMes (sub, editavel) {
  $('#fm-menos').onclick = () => { FIN_MES = new Date(FIN_MES.getFullYear(), FIN_MES.getMonth() - 1, 1); abrirFinanceiro(sub, editavel) }
  $('#fm-mais').onclick  = () => { FIN_MES = new Date(FIN_MES.getFullYear(), FIN_MES.getMonth() + 1, 1); abrirFinanceiro(sub, editavel) }
  $('#fm-hoje').onclick  = () => { FIN_MES = primeiroDiaMes(); abrirFinanceiro(sub, editavel) }
}
function anelHtml (pct, nome) {
  const r = 38, c = 2 * Math.PI * r, off = c * (1 - pct / 100)
  return `<div class="item"><div class="anel">
    <svg viewBox="0 0 100 100">
      <circle class="fundo" cx="50" cy="50" r="${r}"></circle>
      <circle class="frente" cx="50" cy="50" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${off}"></circle>
    </svg><div class="pct">${pct}%</div></div>
    <div class="nome">${esc(nome)}</div></div>`
}

async function paginaFinanceiro () {
  if (!podeVer('financeiro')) { areaLivre().innerHTML =
    `<div class="panel" style="padding:22px;"><p class="texto-dim">
     Você não tem acesso a Financeiro.</p></div>`; return }

  const editavel = podeEditar('financeiro')
  $('#subtitulo-pagina').textContent = editavel
    ? 'Lançamentos, orçamento, contas, planos e investimentos'
    : 'Somente leitura — você pode consultar, mas não alterar'

  const area = areaLivre()
  const abas = [['lancamentos', 'Lançamentos'], ['compras', 'Compras'], ['pagar', 'A pagar'], ['fechamento', 'Fechamento'], ['gastos', 'Gastos por setor'],
    ['orcamento', 'Orçamento'], ['contas', 'Saldo e contas'], ['planos', 'Planos e metas'],
    ['investimentos', 'Investimentos'], ['relatorios', 'Relatórios'], ['cadastros', 'Cadastros']]
  area.innerHTML = `
    <div class="subabas">
      ${abas.map((a, i) => `<button data-sub="${a[0]}" class="${i === 0 ? 'ativo' : ''}">${a[1]}</button>`).join('')}
    </div>
    <div id="sub-financeiro"></div>`

  area.querySelectorAll('.subabas button').forEach(b => {
    b.onclick = () => {
      area.querySelectorAll('.subabas button').forEach(x => x.classList.toggle('ativo', x === b))
      abrirFinanceiro(b.dataset.sub, editavel)
    }
  })

  const [{ data: contas }, { data: categorias }, { data: centros }] = await Promise.all([
    db.from('conta_financeira').select('id,nome,tipo,instituicao,saldo_ini,dia_fechamento,dia_vencimento,limite,status').order('nome'),
    db.from('categoria_financeira').select('id,nome,tipo,status').order('nome'),
    db.from('centro_de_custo').select('id,nome,status').order('nome')
  ])
  FIN_CACHE = { contas: contas || [], categorias: categorias || [], centros: centros || [] }

  abrirFinanceiro('lancamentos', editavel)
}

function abrirFinanceiro (sub, editavel) {
  const alvo = $('#sub-financeiro')
  alvo.innerHTML = `<p class="texto-dim2">carregando...</p>`
  if (sub === 'lancamentos') finLancamentos(alvo, editavel)
  if (sub === 'pagar') finAPagar(alvo, editavel)
  if (sub === 'compras') finCompras(alvo, editavel)
  if (sub === 'gastos') finGastos(alvo)
  if (sub === 'fechamento') finFechamento(alvo, editavel)
  if (sub === 'cadastros') finCadastros(alvo, editavel)
  if (sub === 'orcamento') finOrcamento(alvo, editavel)
  if (sub === 'contas') finContas(alvo, editavel)
  if (sub === 'planos') finPlanos(alvo, editavel)
  if (sub === 'investimentos') finInvestimentos(alvo, editavel)
  if (sub === 'relatorios') finRelatorios(alvo, editavel)
}

// ----- Financeiro › Lançamentos -----
async function finLancamentos (alvo, editavel) {
  const de = isoMes(FIN_MES)
  const ate = isoMes(new Date(FIN_MES.getFullYear(), FIN_MES.getMonth() + 1, 1))

  const { data, error } = await db.from('lancamento_financeiro')
    .select(`id, descricao, valor, tipo, situacao, data_lancamento, observacao,
      conta_id, categoria_id, centro_custo_id, editado_em,
      conta:conta_id ( nome ), categoria:categoria_id ( nome ), centro:centro_custo_id ( nome ),
      editor:editado_por ( nome )`)
    .gte('data_lancamento', de).lt('data_lancamento', ate)
    .order('data_lancamento', { ascending: false })

  if (error) { alvo.innerHTML = `<p class="vazio">${esc(error.message)}</p>`; return }

  const rec = (data || []).filter(l => l.tipo === 'ENTRADA').reduce((s, l) => s + Number(l.valor), 0)
  const des = (data || []).filter(l => l.tipo === 'SAIDA').reduce((s, l) => s + Number(l.valor), 0)
  const pend = (data || []).filter(l => l.situacao === 'PENDENTE').length

  // compras aprovadas do mesmo mês, para o gasto aparecer mesmo antes de virar lançamento
  const mesComp = de.slice(0, 7)
  const { data: comp } = await db.from('compras_por_mes').select('*').eq('competencia', mesComp)
  const compras = comp?.[0] ?? { quantidade: 0, valor: 0 }

  alvo.innerHTML = navMesHtml() + resumoTopo([
    { rotulo: 'Receitas', valor: 'R$ ' + fmtNum(rec), nota: 'entradas do mês', classe: 'bom' },
    { rotulo: 'Despesas', valor: 'R$ ' + fmtNum(des), nota: 'saídas do mês' },
    { rotulo: 'Resultado', valor: 'R$ ' + fmtNum(rec - des),
      nota: rec - des >= 0 ? 'positivo' : 'negativo',
      classe: rec - des >= 0 ? 'bom' : 'alerta' },
    pend ? { rotulo: 'Pendentes', valor: String(pend), nota: 'a efetivar', classe: 'alerta' } : null,
    { rotulo: 'Compras aprovadas', valor: 'R$ ' + fmtNum(compras.valor),
      nota: `${compras.quantidade} no mês · ainda fora do caixa`, classe: 'destaque' }
  ]) + `
    ${editavel ? `<div class="secao panel" style="padding:18px;">
      <h3>Novo lançamento</h3>
      <div class="form-grade">
        <div class="campo"><label>Descrição *</label><input id="l-desc"></div>
        <div class="campo"><label>Valor *</label><input id="l-valor" type="number" step="0.01" placeholder="0,00"></div>
        <div class="campo"><label>Data</label><input id="l-data" type="date" value="${new Date().toISOString().slice(0, 10)}"></div>
        <div class="campo"><label>Conta</label><select id="l-conta">${opcoesFin(FIN_CACHE.contas.filter(c => c.tipo !== 'PASSIVO'))}</select></div>
        <div class="campo"><label>Categoria</label><select id="l-cat">${opcoesFin(FIN_CACHE.categorias)}</select></div>
        <div class="campo"><label>Centro de custo</label><select id="l-centro">${opcoesFin(FIN_CACHE.centros)}</select></div>
        <div class="campo"><label>Situação</label><select id="l-sit"><option value="EFETIVADO">efetivado</option><option value="PENDENTE">pendente</option></select></div>
        <div class="campo"><label>Observação</label><input id="l-obs" placeholder="opcional"></div>
      </div>
      <div class="acoes">
        <button class="btn-secundario" id="l-saida">− Saída</button>
        <button class="btn" id="l-entrada">+ Entrada</button>
      </div>
      <div class="recado oculto" id="l-recado"></div>
    </div>` : ''}

    <div class="panel" style="padding:0;margin-top:16px;"><div class="tabela-scroll">
      <table><thead><tr>
        <th>Data</th><th>Descrição</th><th>Conta</th><th>Categoria</th><th>Centro de custo</th>
        <th>Situação</th><th class="num">Valor</th>${editavel ? '<th></th>' : ''}
      </tr></thead><tbody>
      ${(data || []).map(l => `<tr>
        <td>${fmtData(l.data_lancamento)}</td>
        <td>${esc(l.descricao)}</td>
        <td class="texto-dim">${esc(l.conta?.nome ?? '—')}</td>
        <td class="texto-dim">${esc(l.categoria?.nome ?? '—')}</td>
        <td class="texto-dim">${esc(l.centro?.nome ?? '—')}</td>
        <td>${l.situacao === 'EFETIVADO'
          ? '<span class="badge-bom">efetivado</span>'
          : editavel ? `<button class="btn-secundario mini" data-efetivar="${l.id}">efetivar</button>` : '<span class="badge-alerta">pendente</span>'}</td>
        <td class="num ${l.tipo === 'ENTRADA' ? 'badge-bom' : ''}">${l.tipo === 'SAIDA' ? '−' : '+'} ${fmtNum(l.valor)}</td>
        ${editavel ? `<td style="text-align:right;white-space:nowrap;">
          <button class="btn-secundario mini" data-edit-l="${l.id}">editar</button>
          <button class="btn-secundario mini" data-del="${l.id}">excluir</button>
          ${l.editado_em ? `<div class="texto-dim2" style="font-size:10px;margin-top:2px;">
            editado ${fmtQuando(l.editado_em)}${l.editor?.nome ? ' · ' + esc(l.editor.nome) : ''}</div>` : ''}
        </td>` : ''}
      </tr>`).join('') || `<tr><td colspan="${editavel ? 8 : 7}" class="vazio">Nenhum lançamento neste mês.</td></tr>`}
      </tbody></table>
    </div></div>`

  ligarNavMes('lancamentos', editavel)
  if (!editavel) return

  const aviso = (t, alerta = true) => {
    const el = $('#l-recado'); el.textContent = t; el.classList.remove('oculto')
    el.style.borderColor = alerta ? 'var(--warn-text)' : 'var(--line2)'
    el.style.color = alerta ? 'var(--warn-text)' : 'var(--dim)'
  }
  const salvar = async tipo => {
    const desc = $('#l-desc').value.trim()
    const valor = Number($('#l-valor').value)
    if (!desc || !valor) { aviso('Preencha descrição e valor.'); return }
    const { error: e2 } = await db.from('lancamento_financeiro').insert({
      descricao: desc, valor: Math.abs(valor), tipo,
      data_lancamento: $('#l-data').value || new Date().toISOString().slice(0, 10),
      conta_id: $('#l-conta').value || null,
      categoria_id: $('#l-cat').value || null,
      centro_custo_id: $('#l-centro').value || null,
      situacao: $('#l-sit').value || 'EFETIVADO',
      observacao: $('#l-obs').value.trim() || null,
      registrado_por: PERFIL.pessoaId
    })
    if (e2) { aviso(e2.message); return }
    abrirFinanceiro('lancamentos', true)
  }
  $('#l-entrada').onclick = () => salvar('ENTRADA')
  $('#l-saida').onclick = () => salvar('SAIDA')
  alvo.querySelectorAll('[data-efetivar]').forEach(b => {
    b.onclick = async () => { await db.from('lancamento_financeiro').update({ situacao: 'EFETIVADO' }).eq('id', b.dataset.efetivar); abrirFinanceiro('lancamentos', true) }
  })
  alvo.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = () => telaLancamento((data || []).find(x => x.id === b.dataset.del), 'EXCLUSAO')
  })
  alvo.querySelectorAll('[data-edit-l]').forEach(b => {
    b.onclick = () => telaLancamento((data || []).find(x => x.id === b.dataset.editL), 'EDICAO')
  })
}

// ----- Financeiro › Orçamento -----
async function finOrcamento (alvo, editavel) {
  const mesIso = isoMes(FIN_MES)
  const proxIso = isoMes(new Date(FIN_MES.getFullYear(), FIN_MES.getMonth() + 1, 1))

  const [{ data: orc }, { data: lancs }] = await Promise.all([
    db.from('orcamento_categoria').select('id,categoria_id,valor_previsto').eq('mes_ref', mesIso),
    db.from('lancamento_financeiro').select('categoria_id,valor,tipo').gte('data_lancamento', mesIso).lt('data_lancamento', proxIso)
  ])
  const previstoDe = catId => Number((orc || []).find(o => o.categoria_id === catId)?.valor_previsto || 0)
  const realDe = catId => (lancs || []).filter(l => l.categoria_id === catId).reduce((s, l) => s + Number(l.valor), 0)

  const grupo = (tipo, titulo) => {
    const cats = FIN_CACHE.categorias.filter(c => c.tipo === tipo)
    const totPrev = cats.reduce((s, c) => s + previstoDe(c.id), 0)
    const totReal = cats.reduce((s, c) => s + realDe(c.id), 0)
    return `<div class="cabeca-secao"><h3 style="font-family:var(--serif);font-size:16px;">${titulo}</h3>
      <span class="texto-dim2" style="font-variant-numeric:tabular-nums;">R$ ${fmtNum(totReal)} / R$ ${fmtNum(totPrev)}</span></div>
      <div class="orc-grade">${cats.map(c => {
        const p = previstoDe(c.id), r = realDe(c.id)
        const pct = p ? Math.min(100, Math.round(r / p * 100)) : 0
        const estourou = tipo === 'DESPESA' && p && r > p
        return `<div class="orc-item">
          <div class="linha1"><span>${esc(c.nome)}</span><span class="real ${estourou ? 'estourado' : ''}">R$ ${fmtNum(r)}</span></div>
          <div class="barra ${estourou ? 'estourada' : ''}"><span style="width:${pct}%"></span></div>
          ${editavel ? `<input type="number" step="0.01" data-previsto="${c.id}" value="${p || ''}" placeholder="previsto">` : ''}
        </div>`
      }).join('') || '<p class="vazio">Nenhuma categoria cadastrada.</p>'}</div>`
  }

  alvo.innerHTML = navMesHtml() +
    `<div class="secao">${grupo('DESPESA', 'Despesas')}</div><div class="secao">${grupo('RECEITA', 'Receitas')}</div>`

  ligarNavMes('orcamento', editavel)
  if (!editavel) return

  alvo.querySelectorAll('[data-previsto]').forEach(inp => {
    inp.onchange = async () => {
      const catId = inp.dataset.previsto, val = Number(inp.value) || 0
      const existente = (orc || []).find(o => o.categoria_id === catId)
      if (existente) await db.from('orcamento_categoria').update({ valor_previsto: val }).eq('id', existente.id)
      else await db.from('orcamento_categoria').insert({ categoria_id: catId, mes_ref: mesIso, valor_previsto: val })
      abrirFinanceiro('orcamento', true)
    }
  })
}

// ----- Financeiro › Saldo e contas -----
async function finContas (alvo, editavel) {
  const { data: saldos } = await db.from('saldo_conta').select('conta_id,saldo')
  const saldoDe = id => Number((saldos || []).find(s => s.conta_id === id)?.saldo || 0)

  const secao = (tipos, titulo) => {
    const cs = FIN_CACHE.contas.filter(c => tipos.includes(c.tipo))
    const tot = cs.reduce((s, c) => s + saldoDe(c.id), 0)
    return `<div class="cabeca-secao"><h3 style="font-family:var(--serif);font-size:16px;">${titulo}</h3>
      <span class="texto-dim2" style="font-variant-numeric:tabular-nums;">R$ ${fmtNum(tot)}</span></div>
      <div class="panel" style="padding:0;margin-bottom:18px;">
      ${cs.map(c => `<div class="conta-linha">
        <span><b>${esc(c.nome)}</b>${c.instituicao ? ` <span class="texto-dim2">· ${esc(c.instituicao)}</span>` : ''}</span>
        <span style="display:flex;gap:12px;align-items:center;">
          <span class="saldo ${saldoDe(c.id) < 0 ? 'neg' : 'pos'}">R$ ${fmtNum(saldoDe(c.id))}</span>
          ${editavel ? `<button class="btn-secundario mini" data-del-conta="${c.id}">×</button>` : ''}
        </span></div>`).join('') || '<div class="vazio">Nenhuma conta.</div>'}
      </div>`
  }

  alvo.innerHTML =
