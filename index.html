<!DOCTYPE html>
<html lang="pt-BR" data-skin="plataforma">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema Gefoscal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="skins_gefoscal.css">
<style>
/* Layout do app. Usa só os tokens das skins — nenhuma cor fixa aqui. */
.app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
@media (max-width: 860px) { .app { grid-template-columns: 1fr; } .nav { display: none; } }
.nav { background: var(--panel); border-right: 1px solid var(--line); padding: 18px 12px; }
.nav h1 { font-family: var(--serif); font-size: 19px; margin: 0 0 2px; }
.nav .sub { color: var(--dim2); font-size: 11px; margin-bottom: 22px; }
.nav a { display:block; padding:9px 11px; border-radius:6px; color:var(--dim);
         text-decoration:none; font-size:14px; margin-bottom:2px; cursor:pointer; }
.nav a:hover { background: var(--hover-bg); color: var(--txt); }
.nav a.ativo { background: var(--hover-bg); color: var(--txt); border-left:3px solid var(--rust); }
.nav a.bloqueado { opacity:.35; cursor:not-allowed; }
.conteudo { padding: 22px 26px; max-width: 1400px; }
.topo { display:flex; justify-content:space-between; align-items:flex-start;
        gap:16px; flex-wrap:wrap; margin-bottom:20px; }
.topo h2 { font-family: var(--serif); margin:0 0 4px; font-size:24px; }
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); gap:12px; margin-bottom:20px; }
.kpi .rotulo { color:var(--dim2); font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
.kpi .valor { font-family:var(--serif); font-size:26px; margin-top:6px; }
.kpi .nota { color:var(--dim); font-size:12px; margin-top:2px; }
.filtros { display:flex; gap:10px; flex-wrap:wrap; align-items:end; margin-bottom:16px; }
.campo { display:flex; flex-direction:column; gap:4px; }
.campo label { color:var(--dim2); font-size:11px; text-transform:uppercase; letter-spacing:.4px; }
table { width:100%; border-collapse:collapse; font-size:13.5px; }
th { text-align:left; color:var(--dim2); font-weight:600; font-size:11px;
     text-transform:uppercase; letter-spacing:.4px; padding:9px 10px;
     border-bottom:1px solid var(--line2); position:sticky; top:0; background:var(--panel); }
td { padding:9px 10px; border-bottom:1px solid var(--line); }
tbody tr:hover { background: var(--hover-bg); }
.num { text-align:right; font-variant-numeric: tabular-nums; }
.tabela-scroll { max-height: 62vh; overflow:auto; }
.chip { display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px;
        border:1px solid var(--line2); color:var(--dim); }
.anexo-link { color:var(--rust); text-decoration:none; font-size:12px; margin-right:6px; }
.anexo-link:hover { text-decoration:underline; }
.login-wrap { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
.login { width:100%; max-width:380px; }
.login h1 { font-family:var(--serif); margin:0 0 4px; }
.login .campo { margin-bottom:12px; }
.login input { width:100%; }
.erro { color:var(--warn-text); font-size:13px; margin-top:10px; min-height:18px; }
.vazio { color:var(--dim2); padding:28px; text-align:center; }
.oculto { display:none !important; }
.barra-skin { display:flex; gap:6px; }
.barra-skin button { font-size:11px; padding:5px 9px; }

/* ---- Marca ---- */
.logo-login { display:block; height:64px; width:auto; margin:0 auto 14px; }
.logo-nav { display:block; height:34px; width:auto; margin-bottom:14px; }
.marca-pdf { display:none; }
@media print {
  .marca-pdf { display:flex !important; align-items:center; gap:12px;
               border-bottom:2px solid #1c5632; padding-bottom:10px; margin-bottom:18px; }
  .marca-pdf img { height:46px; width:auto; }
  .marca-pdf span { font-family:var(--serif); font-size:15px; color:#1c5632;
                    letter-spacing:.5px; margin-left:auto; }
}

/* ---- Administração e Visão geral ---- */
.subabas { display:flex; gap:2px; margin-bottom:18px; border-bottom:1px solid var(--line2); }
.subabas button { background:none; border:none; color:var(--dim); cursor:pointer;
                  font-size:13px; padding:9px 14px; border-bottom:2px solid transparent; }
.subabas button:hover { color:var(--txt); }
.subabas button.ativo { color:var(--txt); border-bottom-color:var(--rust); }
.form-grade { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; }
.grade-modulos { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:8px; margin-top:6px; }
.linha-modulo { display:flex; align-items:center; gap:12px; padding:8px 10px;
                border:1px solid var(--line); border-radius:6px; font-size:13px; }
.linha-modulo .nome { flex:1; }
.linha-modulo label { display:flex; align-items:center; gap:5px; color:var(--dim); font-size:11.5px; }
.acoes { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; align-items:center; }
.aviso { color:var(--dim2); font-size:12px; margin-top:10px; }
.secao { margin-bottom:22px; }
.secao h3 { font-family:var(--serif); font-size:17px; margin:0 0 10px; }
.mini { font-size:12px; padding:4px 9px; }
textarea { width:100%; min-height:230px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
           font-size:12.5px; line-height:1.5; }
.moldura-visao { width:100%; height:60vh; border:1px solid var(--line); border-radius:8px; background:var(--panel); }
.duas-colunas { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
@media (max-width: 900px) { .duas-colunas { grid-template-columns:1fr; } }

/* ---- Lista de pessoas ---- */
.lista-pessoas { display:grid; gap:9px; }
.cartao-pessoa { display:flex; align-items:center; gap:13px; padding:12px 14px;
                 border:1px solid var(--line); border-radius:8px; background:var(--panel);
                 transition:border-color .15s ease; }
.cartao-pessoa:hover { border-color:var(--line2); }
.inicial { width:38px; height:38px; border-radius:50%; flex:none; display:grid; place-items:center;
           background:var(--hover-bg); font-family:var(--serif); font-size:15px; }
.cartao-pessoa .dados { flex:1; min-width:0; }
.cartao-pessoa .nome { font-size:14px; margin-bottom:2px; }
.cartao-pessoa .sub { color:var(--dim2); font-size:12px; overflow:hidden;
                      text-overflow:ellipsis; white-space:nowrap; }
.cartao-pessoa .selos { display:flex; gap:5px; flex:none; align-items:center; }
.cartao-pessoa .botoes { display:flex; gap:6px; flex:none; }
@media (max-width: 720px) {
  .cartao-pessoa { flex-wrap:wrap; }
  .cartao-pessoa .dados { flex-basis:calc(100% - 51px); }
  .cartao-pessoa .selos, .cartao-pessoa .botoes { flex-basis:auto; }
}
.selo { font-size:10px; padding:3px 9px; border-radius:20px; letter-spacing:.5px;
        text-transform:uppercase; border:1px solid var(--line2); color:var(--dim2); }
.selo.forte { border-color:var(--rust); color:var(--rust); }
.recado { font-size:12.5px; padding:9px 12px; border-radius:6px; margin-top:12px;
          border:1px solid var(--line2); color:var(--dim); }
.linha-inline { display:flex; gap:6px; margin-top:6px; }
.cabeca-secao { display:flex; justify-content:space-between; align-items:baseline;
                gap:12px; margin-bottom:14px; }
.cabeca-secao h3 { margin:0; }

/* ---- Compras ---- */
.status { display:inline-block; font-size:10px; padding:3px 9px; border-radius:20px;
          letter-spacing:.5px; text-transform:uppercase; border:1px solid var(--line2); color:var(--dim2); }
.status.aguardando { border-color:var(--rust); color:var(--rust); }
.status.aprovada   { border-color:var(--ok-text, var(--rust)); color:var(--ok-text, var(--rust)); }
.status.reprovada  { border-color:var(--warn-text); color:var(--warn-text); }
.status.recebida   { opacity:.6; }
.urgente { color:var(--warn-text); font-size:11px; }
.progresso { display:flex; height:8px; border-radius:20px; overflow:hidden;
             background:var(--hover-bg); margin:10px 0 8px; }
.progresso span { display:block; height:100%; }
.progresso .feito     { background:var(--rust); }
.progresso .andamento { background:var(--rust); opacity:.38; }
.progresso .parado    { background:var(--line2); }
.legenda { display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--dim); }
.legenda i { display:inline-block; width:9px; height:9px; border-radius:50%;
             margin-right:6px; vertical-align:baseline; font-style:normal; }
.legenda .feito i     { background:var(--rust); }
.legenda .andamento i { background:var(--rust); opacity:.38; }
.legenda .parado i    { background:var(--line2); }
.cartao-sol { border:1px solid var(--line); border-radius:8px; background:var(--panel);
              padding:13px 15px; margin-bottom:9px; }
.cartao-sol .linha1 { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.cartao-sol .titulo { font-size:14px; flex:1; min-width:180px; }
.cartao-sol .meta { color:var(--dim2); font-size:12px; margin-top:4px; }
.cartao-sol .botoes { display:flex; gap:6px; }
.ficha { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px 20px; }
.ficha .item .rot { color:var(--dim2); font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; }
.ficha .item .val { font-size:13.5px; margin-top:3px; }
.passo { display:flex; gap:10px; align-items:flex-start; padding:8px 0;
         border-bottom:1px solid var(--line); font-size:13px; }
.passo:last-child { border-bottom:none; }
.passo .quando { color:var(--dim2); font-size:11.5px; flex:none; width:96px; }
.modal-fundo { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50;
               display:flex; align-items:flex-start; justify-content:center; padding:28px 16px; overflow:auto; }
.modal { background:var(--panel); border:1px solid var(--line2); border-radius:10px;
         width:100%; max-width:720px; padding:22px 24px; }
.modal h3 { font-family:var(--serif); margin:0 0 14px; font-size:19px; }
.modal textarea { min-height:110px; }

@media print {
  body * { visibility:hidden; }
  .area-impressao, .area-impressao * { visibility:visible; }
  .area-impressao { position:absolute; inset:0; padding:0; background:#fff; color:#000; }
  .area-impressao .nao-imprime { display:none; }
  .modal-fundo { position:static; background:none; padding:0; }
  .modal { border:none; max-width:100%; padding:0; }
}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="tela-login" class="login-wrap">
  <div class="login panel" style="padding:26px;">
    <img class="logo-login" id="logo-login" alt="Grupo Gefoscal">
    <p class="texto-dim" style="margin-top:0;font-size:13px;text-align:center;">Sistema interno</p>

    <div class="campo">
      <label>E-mail</label>
      <input id="email" type="email" autocomplete="username" placeholder="voce@grupogefoscal.com.br">
    </div>
    <div class="campo">
      <label>Senha</label>
      <input id="senha" type="password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <button class="btn" id="btn-entrar" style="width:100%;margin-top:6px;">Entrar</button>
    <button class="btn-secundario" id="btn-link" style="width:100%;margin-top:8px;">
      Receber link de acesso por e-mail
    </button>
    <div class="erro" id="erro-login"></div>

    <div class="linha-divisoria" style="margin:18px 0 12px;"></div>
    <div class="barra-skin">
      <button class="btn-secundario" onclick="trocarSkin('sofisticado')">Sofisticado</button>
      <button class="btn-secundario" onclick="trocarSkin('plataforma')">Plataforma</button>
      <button class="btn-secundario" onclick="trocarSkin('daylight')">Daylight</button>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="tela-app" class="app oculto">
  <nav class="nav">
    <img class="logo-nav" id="logo-nav" alt="Grupo Gefoscal">
    <div class="sub" id="quem-sou"></div>
    <div id="menu"></div>
    <div class="linha-divisoria" style="margin:18px 0 12px;"></div>
    <div class="barra-skin" style="flex-direction:column;">
      <button class="btn-secundario" onclick="trocarSkin('sofisticado')">Sofisticado</button>
      <button class="btn-secundario" onclick="trocarSkin('plataforma')">Plataforma</button>
      <button class="btn-secundario" onclick="trocarSkin('daylight')">Daylight</button>
    </div>
    <button class="btn-secundario" style="width:100%;margin-top:14px;" onclick="sair()">Sair</button>
  </nav>

  <main class="conteudo">
    <div class="topo">
      <div>
        <h2 id="titulo-pagina">Visão geral</h2>
        <div class="texto-dim" id="subtitulo-pagina" style="font-size:13px;"></div>
      </div>
    </div>

    <div class="kpis" id="kpis"></div>
    <div class="filtros" id="filtros"></div>

    <!-- área livre: telas que não são tabela (Visão geral, Administração) -->
    <div id="area-livre" class="oculto"></div>

    <div class="panel" id="painel-tabela">
      <div class="tabela-scroll">
        <table>
          <thead id="cabecalho"></thead>
          <tbody id="corpo"></tbody>
        </table>
      </div>
    </div>

    <div class="texto-dim2" id="rodape" style="font-size:12px;margin-top:10px;"></div>
  </main>
</div>

// Login
// ---------------------------------------------------------------
$('#btn-entrar').onclick = entrar
$('#btn-link').onclick = entrarPorLink
$('#senha').onkeydown = e => { if (e.key === 'Enter') entrar() }

async function entrar () {
  const btn = $('#btn-entrar')
  btn.disabled = true; btn.textContent = 'Entrando...'
  $('#erro-login').textContent = ''
  const { error } = await db.auth.signInWithPassword({
    email: $('#email').value.trim().toLowerCase(),
    password: $('#senha').value
  })
  btn.disabled = false; btn.textContent = 'Entrar'
  if (error) { $('#erro-login').textContent = traduzErro(error.message); return }
  await abrirApp()
}

// Primeiro acesso: quem foi cadastrado ainda não tem senha.
async function entrarPorLink () {
  const email = $('#email').value.trim().toLowerCase()
  if (!email) { $('#erro-login').textContent = 'Escreva seu e-mail acima primeiro.'; return }
  const btn = $('#btn-link')
  btn.disabled = true; btn.textContent = 'Enviando...'
  const { error } = await db.auth.signInWithOtp({
    email, options: { emailRedirectTo: location.origin + location.pathname }
  })
  btn.disabled = false; btn.textContent = 'Receber link de acesso por e-mail'
  $('#erro-login').textContent = error
    ? traduzErro(error.message)
    : 'Link enviado. Abra o e-mail neste mesmo navegador.'
}

function traduzErro (m) {
  if (/invalid login/i.test(m)) return 'E-mail ou senha incorretos.'
  if (/email not confirmed/i.test(m)) return 'E-mail ainda não confirmado.'
  if (/rate limit/i.test(m)) return 'Muitos e-mails em pouco tempo. Espere alguns minutos.'
  if (/signups not allowed/i.test(m)) return 'Cadastro por e-mail desligado no painel do Supabase.'
  return m
}

window.sair = async () => { await db.auth.signOut(); location.reload() }

// ---------------------------------------------------------------
// Sessão, permissões e menu
// ---------------------------------------------------------------
const CHAVE_ADMIN = 'ti'          // módulo "Administração do sistema"
const PAPEIS_TOTAIS = ['ADMIN', 'DIRETORIA']   // enxergam tudo, por tem_modulo()

let PERFIL = {
  userId: '', email: '', nome: '',
  pessoaId: null, setorId: null,
  papeis: [], modulos: [], permissoes: []
}

async function abrirApp () {
  const { data: { user } } = await db.auth.getUser()
  if (!user) return
  PERFIL.userId = user.id
  PERFIL.email = user.email

  const [{ data: papeis }, { data: modulos }, { data: perfil }] = await Promise.all([
    db.from('usuario_papel').select('papel').eq('user_id', user.id),
    db.from('modulo').select('id,chave,nome,ordem').order('ordem'),
    db.from('usuario_perfil')
      .select('pessoa_id,setor_id,ativo,pessoa:pessoa_id(nome)')
      .eq('user_id', user.id).maybeSingle()
  ])

  PERFIL.papeis = (papeis || []).map(p => p.papel)
  PERFIL.modulos = modulos || []
  PERFIL.pessoaId = perfil?.pessoa_id ?? null
  PERFIL.setorId = perfil?.setor_id ?? null
  PERFIL.nome = perfil?.pessoa?.nome || user.email

  if (PERFIL.papeis.length === 0 || perfil?.ativo === false) {
    $('#erro-login').textContent =
      'Seu usuário entrou, mas ainda não tem acesso liberado. Fale com o administrador do sistema.'
    await db.auth.signOut()
    return
  }

  const { data: perms } = await db.from('modulo_permissao')
    .select('modulo_id,pessoa_id,setor_id,pode_editar')
  // administrador enxerga as permissões de todo mundo; aqui só interessam as minhas
  PERFIL.permissoes = (perms || []).filter(p =>
    (p.pessoa_id && p.pessoa_id === PERFIL.pessoaId) ||
    (p.setor_id && p.setor_id === PERFIL.setorId))

  $('#quem-sou').textContent = PERFIL.nome + ' · ' + PERFIL.papeis.join(', ')
  montarMenu()
  $('#tela-login').classList.add('oculto')
  $('#tela-app').classList.remove('oculto')
  irPara('visao_geral')
}

const ehTotal = () => PERFIL.papeis.some(p => PAPEIS_TOTAIS.includes(p))

function moduloPorChave (chave) { return PERFIL.modulos.find(m => m.chave === chave) }

function podeVer (chave) {
  if (ehTotal()) return true
  const m = moduloPorChave(chave)
  return !!m && PERFIL.permissoes.some(p => p.modulo_id === m.id)
}

// espelha tem_modulo(chave, true) do banco — o RLS é quem manda de verdade
function podeEditar (chave) {
  if (ehTotal()) return true
  const m = moduloPorChave(chave)
  return !!m && PERFIL.permissoes.some(p => p.modulo_id === m.id && p.pode_editar)
}

const PAGINAS = {
  visao_geral: { nome: 'Visão geral', render: paginaVisaoGeral, sempre: true },
  expedicao:   { nome: 'Expedição', render: paginaExpedicao },
  compras:     { nome: 'Compras e Recebimento', render: paginaCompras },
  financeiro:  { nome: 'Financeiro', render: paginaFinanceiro },
  estoque:     { nome: 'Estoque e Produção', render: paginaEstoque },
  ti:          { nome: 'Administração', render: paginaAdministracao }
}

function montarMenu () {
  const fixos = `<a data-chave="visao_geral">Visão geral</a>`
  const doBanco = PERFIL.modulos.map(m => {
    const temPagina = !!PAGINAS[m.chave]
    const liberado = podeVer(m.chave)
    if (!liberado) return ''
    return `<a data-chave="${m.chave}" class="${temPagina ? '' : 'bloqueado'}">${esc(m.nome)}</a>`
  }).join('')
  $('#menu').innerHTML = fixos + doBanco
  $('#menu').querySelectorAll('a').forEach(a => {
    if (!a.classList.contains('bloqueado')) a.onclick = () => irPara(a.dataset.chave)
  })
}

function irPara (chave) {
  const p = PAGINAS[chave]
  if (!p) return
  $('#menu').querySelectorAll('a').forEach(a => a.classList.toggle('ativo', a.dataset.chave === chave))
  $('#titulo-pagina').textContent = p.nome
  $('#subtitulo-pagina').textContent = ''
  $('#kpis').innerHTML = ''; $('#filtros').innerHTML = ''
  $('#cabecalho').innerHTML = ''; $('#corpo').innerHTML = ''
  $('#area-livre').innerHTML = ''; $('#area-livre').classList.add('oculto')
  $('#painel-tabela').classList.remove('oculto')
  $('#rodape').textContent = ''
  p.render()
}

// telas que não usam a tabela padrão
function areaLivre () {
  $('#painel-tabela').classList.add('oculto')
  $('#area-livre').classList.remove('oculto')
  return $('#area-livre')
}

function kpi (rotulo, valor, nota = '') {
  return `<div class="card kpi"><div class="rotulo">${esc(rotulo)}</div>
    <div class="valor">${valor}</div><div class="nota">${esc(nota)}</div></div>`
}

// avisa quando a migração ainda não rodou, em vez de quebrar calado
function faltaMigracao (erro) {
  return erro && /does not exist|schema cache/i.test(erro.message || '')
}

// Página: Visão geral (tela inicial)
// ---------------------------------------------------------------
async function paginaVisaoGeral () {
  $('#subtitulo-pagina').textContent = 'O painel montado para você'
  const area = areaLivre()

  if (!PERFIL.pessoaId) {
    area.innerHTML = `<div class="panel" style="padding:22px;">
      <p class="texto-dim">Seu login ainda não está ligado a uma pessoa do cadastro,
      então não há painel para montar. O administrador resolve isso em
      Administração → Usuários.</p></div>`
    return
  }

  // avisos não lidos primeiro
  const { data: avisos } = await db.from('aviso')
    .select('id,titulo,texto,criado_em').is('lido_em', null)
    .eq('pessoa_id', PERFIL.pessoaId).order('criado_em', { ascending: false })

  if (avisos?.length) {
    const bloco = document.createElement('div')
    bloco.className = 'panel'
    bloco.style.cssText = 'padding:18px;margin-bottom:16px;'
    bloco.innerHTML = `
      <div class="cabeca-secao">
        <h3 style="font-family:var(--serif);font-size:17px;">
          ${avisos.length} aviso${avisos.length > 1 ? 's' : ''}</h3>
        <button class="btn-secundario mini" id="av-limpar">marcar como lidos</button>
      </div>
      ${avisos.map(a => `<div class="passo">
        <span class="quando">${fmtQuando(a.criado_em) ?? '—'}</span>
        <span><b>${esc(a.titulo)}</b>${a.texto ? '<br>' + esc(a.texto) : ''}</span>
      </div>`).join('')}`
    area.appendChild(bloco)
    bloco.querySelector('#av-limpar').onclick = async () => {
      await db.from('aviso').update({ lido_em: new Date().toISOString() })
        .in('id', avisos.map(a => a.id))
      irPara('visao_geral')
    }
  }

  const { data, error } = await db.from('visao_geral_pessoa')
    .select('html_conteudo,atualizado_em').eq('pessoa_id', PERFIL.pessoaId).maybeSingle()

  if (faltaMigracao(error)) {
    area.insertAdjacentHTML('beforeend', `<div class="panel" style="padding:22px;">
      <p class="texto-dim">A tabela <code>visao_geral_pessoa</code> ainda não existe no banco.
      Rode a migração no SQL Editor do Supabase para ligar esta tela.</p></div>`)
    return
  }

  if (!data?.html_conteudo) {
    area.insertAdjacentHTML('beforeend', `<div class="panel" style="padding:22px;">
      <h3 style="font-family:var(--serif);margin-top:0;">Olá, ${esc(PERFIL.nome.split(' ')[0])}</h3>
      <p class="texto-dim">Ainda não há um painel montado para você. Use o menu ao lado
      para abrir os módulos liberados${podeEditar(CHAVE_ADMIN)
        ? ', ou monte um painel em Administração → Visão geral.' : '.'}</p></div>`)
    return
  }

  // conteúdo montado por administrador: isolado em iframe para não injetar script na página
  const quadro = document.createElement('iframe')
  quadro.className = 'moldura-visao'
  quadro.setAttribute('sandbox', '')
  quadro.srcdoc = data.html_conteudo
  area.appendChild(quadro)
  $('#rodape').textContent = 'Atualizado em ' + (fmtQuando(data.atualizado_em) || '—')
}

async function paginaAdministracao () {
  if (!podeVer(CHAVE_ADMIN)) { areaLivre().innerHTML =
    `<div class="panel" style="padding:22px;"><p class="texto-dim">
     Você não tem acesso à Administração.</p></div>`; return }

  const editavel = podeEditar(CHAVE_ADMIN)
  $('#subtitulo-pagina').textContent = editavel
    ? 'Usuários, cadastros de apoio e painéis'
    : 'Somente leitura — você pode consultar, mas não alterar'

  const area = areaLivre()
  area.innerHTML = `
    <div class="subabas">
      <button data-sub="usuarios" class="ativo">Usuários</button>
      <button data-sub="apoio">Cargos e setores</button>
      <button data-sub="visao">Visão geral</button>
    </div>
    <div id="sub-conteudo"></div>`

  area.querySelectorAll('.subabas button').forEach(b => {
    b.onclick = () => {
      area.querySelectorAll('.subabas button').forEach(x => x.classList.toggle('ativo', x === b))
      abrirSub(b.dataset.sub, editavel)
    }
  })
  abrirSub('usuarios', editavel)
}

function abrirSub (sub, editavel) {
  const alvo = $('#sub-conteudo')
  alvo.innerHTML = `<p class="texto-dim2">carregando...</p>`
  if (sub === 'usuarios') subUsuarios(alvo, editavel)
  if (sub === 'apoio') subApoio(alvo, editavel)
  if (sub === 'visao') subVisao(alvo, editavel)
}

// ----- Administração › Usuários -----
async function subUsuarios (alvo, editavel) {
  const [{ data: pessoas }, { data: cargos, error: erroCargo },
         { data: setores }, { data: pre }, { data: perms }] = await Promise.all([
    db.from('pessoa').select('id,nome,email,cargo_id,setor_id,status').order('nome'),
    db.from('cargo').select('id,nome').order('nome'),
    db.from('setor').select('id,nome').order('nome'),
    db.from('usuario_precadastro').select('email,papeis,pessoa_id,usado_em,convite_enviado_em'),
    db.from('modulo_permissao').select('modulo_id,pessoa_id,pode_editar')
  ])

  if (faltaMigracao(erroCargo)) {
    alvo.innerHTML = `<div class="panel" style="padding:22px;"><p class="texto-dim">
      A tabela <code>cargo</code> ainda não existe. Rode a migração no SQL Editor
      do Supabase antes de usar esta tela.</p></div>`
    return
  }

  const preDe = e => (pre || []).find(p => p.email === (e || '').toLowerCase())
  const nivelDe = p => (p?.papeis || []).includes('ADMIN') ? 'Administrador' : 'Usuário'

  alvo.innerHTML = `
    <div class="secao panel" style="padding:20px;">
      <div class="cabeca-secao">
        <h3>${editavel ? 'Cadastrar ou atualizar pessoa' : 'Consultar pessoa'}</h3>
        <span class="texto-dim2" style="font-size:12px;">o e-mail é o que liga a pessoa ao login</span>
      </div>
      <div class="form-grade">
        <div class="campo"><label>Nome</label><input id="u-nome" ${editavel ? '' : 'disabled'}></div>
        <div class="campo"><label>E-mail</label><input id="u-email" type="email" ${editavel ? '' : 'disabled'}></div>
        <div class="campo"><label>Cargo</label>
          <div style="display:flex;gap:6px;">
            <select id="u-cargo" style="flex:1;" ${editavel ? '' : 'disabled'}></select>
            ${editavel ? '<button class="btn-secundario mini" id="u-novo-cargo" title="novo cargo">+</button>' : ''}
          </div>
          <div class="linha-inline oculto" id="linha-cargo">
            <input id="nome-cargo" placeholder="nome do cargo" style="flex:1;">
            <button class="btn mini" id="criar-cargo">criar</button>
          </div>
        </div>
        <div class="campo"><label>Setor</label>
          <div style="display:flex;gap:6px;">
            <select id="u-setor" style="flex:1;" ${editavel ? '' : 'disabled'}></select>
            ${editavel ? '<button class="btn-secundario mini" id="u-novo-setor" title="novo setor">+</button>' : ''}
          </div>
          <div class="linha-inline oculto" id="linha-setor">
            <input id="nome-setor" placeholder="nome do setor" style="flex:1;">
            <button class="btn mini" id="criar-setor">criar</button>
          </div>
        </div>
        <div class="campo"><label>Nível de acesso</label>
          <select id="u-nivel" ${editavel ? '' : 'disabled'}>
            <option value="usuario">Usuário — só consulta</option>
            <option value="administrador">Administrador — consulta e altera</option>
          </select></div>
        ${editavel ? `<div class="campo"><label>Senha de acesso</label>
          <input id="u-senha" type="text" autocomplete="off" placeholder="mínimo 8 caracteres">
          <span class="texto-dim2" style="font-size:11px;">deixe vazio para não mexer na senha</span>
        </div>` : ''}
      </div>

      <div class="secao" style="margin-top:18px;">
        <label class="texto-dim2" style="font-size:11px;text-transform:uppercase;letter-spacing:.4px;">
          Abas que esta pessoa enxerga</label>
        <div class="grade-modulos" id="u-modulos"></div>
      </div>

      ${editavel ? `<div class="acoes">
        <button class="btn" id="u-salvar">Salvar cadastro</button>
        <button class="btn-secundario" id="u-limpar">Limpar</button>
      </div>
      <div class="recado oculto" id="u-recado"></div>` : ''}
      <p class="aviso">O nível de acesso e as abas são independentes: dá para liberar
      todas as abas para alguém que só consulta.</p>
    </div>

    <div class="cabeca-secao">
      <h3 style="font-family:var(--serif);font-size:17px;">Pessoas cadastradas</h3>
      <span class="texto-dim2" style="font-size:12px;">${(pessoas || []).length} no total</span>
    </div>
    <div class="lista-pessoas" id="u-lista"></div>`

  // selects de apoio
  const encher = (sel, itens) => {
    sel.innerHTML = '<option value="">—</option>' +
      itens.map(i => `<option value="${i.id}">${esc(i.nome)}</option>`).join('')
  }
  encher($('#u-cargo'), cargos || [])
  encher($('#u-setor'), setores || [])

  // checkboxes de módulo
  $('#u-modulos').innerHTML = PERFIL.modulos.map(m => `
    <div class="linha-modulo">
      <span class="nome">${esc(m.nome)}</span>
      <label><input type="checkbox" data-ver="${m.id}" ${editavel ? '' : 'disabled'}> ver</label>
      <label><input type="checkbox" data-editar="${m.id}" ${editavel ? '' : 'disabled'}> editar</label>
    </div>`).join('')

  // "editar" implica "ver"
  $('#u-modulos').querySelectorAll('[data-editar]').forEach(c => {
    c.onchange = () => { if (c.checked) $(`#u-modulos [data-ver="${c.dataset.editar}"]`).checked = true }
  })

  const recado = (texto, alerta = false) => {
    const el = $('#u-recado'); if (!el) return
    el.textContent = texto
    el.classList.remove('oculto')
    el.style.borderColor = alerta ? 'var(--warn-text)' : 'var(--line2)'
    el.style.color = alerta ? 'var(--warn-text)' : 'var(--dim)'
  }

  // lista em cartões
  const iniciais = n => n.split(' ').filter(Boolean).slice(0, 2).map(x => x[0]).join('').toUpperCase()

  $('#u-lista').innerHTML = (pessoas || []).map(p => {
    const pc = preDe(p.email)
    const n = (perms || []).filter(x => x.pessoa_id === p.id).length
    const estado = !pc ? 'sem cadastro de acesso'
      : pc.usado_em ? 'último acesso em ' + fmtQuando(pc.usado_em)
      : 'cadastrado, aguardando primeiro acesso'
    return `<div class="cartao-pessoa">
      <div class="inicial">${esc(iniciais(p.nome))}</div>
      <div class="dados">
        <div class="nome">${esc(p.nome)}</div>
        <div class="sub">${esc(p.email || 'sem e-mail')} · ${esc(estado)}${n ? ` · ${n} aba${n > 1 ? 's' : ''}` : ''}</div>
      </div>
      <div class="selos">
        ${pc ? `<span class="selo ${nivelDe(pc) === 'Administrador' ? 'forte' : ''}">${nivelDe(pc)}</span>` : ''}
      </div>
      <div class="botoes">
        <button class="btn-secundario mini" data-abrir="${p.id}">abrir</button>
        ${editavel && pc ? `<button class="btn-secundario mini" data-senha="${esc(p.email)}">senha</button>` : ''}
      </div>
    </div>`
  }).join('') || `<p class="vazio">Nenhuma pessoa cadastrada ainda.</p>`

  // abrir uma pessoa no formulário
  $('#u-lista').querySelectorAll('[data-abrir]').forEach(b => {
    b.onclick = () => {
      const p = pessoas.find(x => x.id === b.dataset.abrir)
      const pc = preDe(p.email)
      $('#u-nome').value = p.nome || ''
      $('#u-email').value = p.email || ''
      $('#u-cargo').value = p.cargo_id || ''
      $('#u-setor').value = p.setor_id || ''
      $('#u-nivel').value = (pc?.papeis || []).includes('ADMIN') ? 'administrador' : 'usuario'
      const meus = (perms || []).filter(x => x.pessoa_id === p.id)
      $('#u-modulos').querySelectorAll('[data-ver]').forEach(c => {
        const r = meus.find(x => x.modulo_id === c.dataset.ver)
        c.checked = !!r
        $(`#u-modulos [data-editar="${c.dataset.ver}"]`).checked = !!r?.pode_editar
      })
      window.scrollTo({ top: 0, behavior: 'smooth' })
    }
  })

  if (!editavel) return

  // definir senha direto na lista, sem passar pelo formulário inteiro
  $('#u-lista').querySelectorAll('[data-senha]').forEach(b => {
    b.onclick = async () => {
      const email = b.dataset.senha
      const nova = window.prompt(`Senha de acesso para ${email}\n(mínimo 8 caracteres)`)
      if (nova === null) return
      if (nova.trim().length < 8) { recado('A senha precisa de pelo menos 8 caracteres.', true); return }
      b.disabled = true; const antes = b.textContent; b.textContent = 'salvando...'
      const { data: r, error } = await db.functions.invoke('criar-usuario', {
        body: { email, senha: nova.trim() }
      })
      b.disabled = false; b.textContent = antes
      if (error || r?.erro) { recado('Não deu certo: ' + (r?.erro || error.message), true); return }
      recado(r.acao === 'usuario_criado'
        ? `${email} já pode entrar com essa senha.`
        : `Senha de ${email} atualizada.`)
      setTimeout(() => abrirSub('usuarios', true), 1200)
    }
  })

  // + cargo / + setor, sem prompt do navegador
  const criador = (btnAbrir, linha, campo, tabela, select) => {
    $(btnAbrir).onclick = () => {
      $(linha).classList.toggle('oculto')
      if (!$(linha).classList.contains('oculto')) $(campo).focus()
    }
    $(campo).onkeydown = e => { if (e.key === 'Enter') criar() }
    $('#criar-' + tabela).onclick = criar
    async function criar () {
      const nome = $(campo).value.trim(); if (!nome) return
      const { data, error } = await db.from(tabela).insert({ nome }).select('id,nome').single()
      if (error) { recado('Não deu para criar: ' + error.message, true); return }
      $(select).add(new Option(data.nome, data.id))
      $(select).value = data.id
      $(campo).value = ''
      $(linha).classList.add('oculto')
      recado(`${tabela === 'cargo' ? 'Cargo' : 'Setor'} "${data.nome}" criado.`)
    }
  }
  criador('#u-novo-cargo', '#linha-cargo', '#nome-cargo', 'cargo', '#u-cargo')
  criador('#u-novo-setor', '#linha-setor', '#nome-setor', 'setor', '#u-setor')

  $('#u-limpar').onclick = () => {
    ;['u-nome','u-email','u-cargo','u-setor','u-senha'].forEach(i => {
      const el = $('#' + i); if (el) el.value = ''
    })
    $('#u-nivel').value = 'usuario'
    $('#u-modulos').querySelectorAll('input').forEach(c => c.checked = false)
    $('#u-recado').classList.add('oculto')
  }

  $('#u-salvar').onclick = async () => {
    const nome = $('#u-nome').value.trim()
    const email = $('#u-email').value.trim().toLowerCase()
    if (!nome) { recado('Escreva o nome.', true); return }
    if (!email) { recado('Escreva o e-mail — é ele que liga a pessoa ao login.', true); return }

    const btn = $('#u-salvar'); btn.disabled = true; btn.textContent = 'Salvando...'

    const { data: pessoa, error: e1 } = await db.from('pessoa').upsert({
      nome, email,
      cargo_id: $('#u-cargo').value || null,
      setor_id: $('#u-setor').value || null
    }, { onConflict: 'email' }).select('id,setor_id').single()

    if (e1) { recado(e1.message, true); btn.disabled = false; btn.textContent = 'Salvar cadastro'; return }

    const papeis = $('#u-nivel').value === 'administrador' ? ['ADMIN', 'DIRETORIA'] : ['LEITOR']
    const { error: e2 } = await db.from('usuario_precadastro').upsert({
      email, papeis, pessoa_id: pessoa.id, setor_id: pessoa.setor_id
    }, { onConflict: 'email' })
    if (e2) { recado(e2.message, true); btn.disabled = false; btn.textContent = 'Salvar cadastro'; return }

    // permissões: apaga as antigas e grava as marcadas
    const marcadas = [...$('#u-modulos').querySelectorAll('[data-ver]:checked')].map(c => ({
      modulo_id: c.dataset.ver,
      pessoa_id: pessoa.id,
      pode_editar: $(`#u-modulos [data-editar="${c.dataset.ver}"]`).checked
    }))
    await db.from('modulo_permissao').delete().eq('pessoa_id', pessoa.id)
    if (marcadas.length) await db.from('modulo_permissao').insert(marcadas)

    // senha: cria o login de verdade, sem depender de e-mail
    const senha = $('#u-senha')?.value.trim()
    if (senha) {
      if (senha.length < 8) {
        btn.disabled = false; btn.textContent = 'Salvar cadastro'
        recado('Cadastro salvo, mas a senha precisa de pelo menos 8 caracteres.', true)
        abrirSub('usuarios', true)
        return
      }
      const { data: r, error: e3 } = await db.functions.invoke('criar-usuario', {
        body: { email, senha }
      })
      btn.disabled = false; btn.textContent = 'Salvar cadastro'
      if (e3 || r?.erro) {
        recado('Cadastro salvo, mas a senha não foi definida: ' + (r?.erro || e3.message), true)
      } else {
        recado(r.acao === 'usuario_criado'
          ? `Pronto. ${email} já pode entrar com essa senha.`
          : `Senha de ${email} atualizada.`)
      }
    } else {
      btn.disabled = false; btn.textContent = 'Salvar cadastro'
      recado('Cadastro salvo. Sem senha definida, essa pessoa ainda não consegue entrar.')
    }

    setTimeout(() => abrirSub('usuarios', true), 1200)
  }
}

// ----- Administração › Cargos e setores -----
async function subApoio (alvo, editavel) {
  const [{ data: cargos, error: erroCargo }, { data: setores }] = await Promise.all([
    db.from('cargo').select('id,nome').order('nome'),
    db.from('setor').select('id,nome').order('nome')
  ])

  if (faltaMigracao(erroCargo)) {
    alvo.innerHTML = `<div class="panel" style="padding:22px;"><p class="texto-dim">
      A tabela <code>cargo</code> ainda não existe. Rode a migração no Supabase.</p></div>`
    return
  }

  const bloco = (titulo, tabela, itens) => `
    <div class="panel" style="padding:18px;">
      <h3>${titulo}</h3>
      ${editavel ? `<div style="display:flex;gap:6px;margin-bottom:12px;">
        <input id="novo-${tabela}" placeholder="nome" style="flex:1;">
        <button class="btn" data-add="${tabela}">Adicionar</button></div>` : ''}
      <table><tbody>${(itens || []).map(i => `<tr>
        <td>${esc(i.nome)}</td>
        <td style="text-align:right;">${editavel
          ? `<button class="btn-secundario mini" data-del="${tabela}" data-id="${i.id}">remover</button>` : ''}</td>
      </tr>`).join('') || `<tr><td class="vazio">Nada cadastrado ainda.</td></tr>`}</tbody></table>
    </div>`

  alvo.innerHTML = `<div class="duas-colunas">
    ${bloco('Cargos', 'cargo', cargos)}
    ${bloco('Setores', 'setor', setores)}
  </div>`

  if (!editavel) return

  alvo.querySelectorAll('[data-add]').forEach(b => {
    b.onclick = async () => {
      const t = b.dataset.add
      const nome = $('#novo-' + t).value.trim(); if (!nome) return
      const { error } = await db.from(t).insert({ nome })
      if (error) { alert(error.message); return }
      abrirSub('apoio', true)
    }
  })
  alvo.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = async () => {
      if (!confirm('Remover?')) return
      const { error } = await db.from(b.dataset.del).delete().eq('id', b.dataset.id)
      if (error) { alert('Não deu para remover — provavelmente há gente usando este registro.'); return }
      abrirSub('apoio', true)
    }
  })
}

// ----- Administração › Visão geral -----
async function subVisao (alvo, editavel) {
  if (!editavel) {
    alvo.innerHTML = `<div class="panel" style="padding:22px;"><p class="texto-dim">
      Só quem pode editar a Administração monta os painéis.</p></div>`
    return
  }

  const { data: pessoas } = await db.from('pessoa')
    .select('id,nome,email').not('email', 'is', null).order('nome')

  alvo.innerHTML = `<div class="panel" style="padding:18px;">
    <h3>Painel de abertura por pessoa</h3>
    <div class="campo" style="max-width:340px;margin-bottom:12px;">
      <label>Pessoa</label>
      <select id="v-pessoa">${(pessoas || []).map(p =>
        `<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select>
    </div>
    <textarea id="v-html" placeholder="Cole aqui o HTML do painel desta pessoa"></textarea>
    <div class="acoes">
      <button class="btn" id="v-salvar">Salvar painel</button>
      <button class="btn-secundario" id="v-limpar">Apagar painel</button>
      <span class="texto-dim2" id="v-recado" style="font-size:12.5px;"></span>
    </div>
    <p class="aviso">O conteúdo é exibido isolado, sem acesso ao resto do sistema.
    Ainda assim, cole só HTML de origem conhecida.</p>
  </div>`

  const carregar = async () => {
    const { data, error } = await db.from('visao_geral_pessoa')
      .select('html_conteudo').eq('pessoa_id', $('#v-pessoa').value).maybeSingle()
    if (faltaMigracao(error)) { $('#v-recado').textContent = 'Tabela ainda não criada no banco.'; return }
    $('#v-html').value = data?.html_conteudo || ''
  }
  $('#v-pessoa').onchange = carregar
  await carregar()

  $('#v-salvar').onclick = async () => {
    const { error } = await db.from('visao_geral_pessoa').upsert({
      pessoa_id: $('#v-pessoa').value,
      html_conteudo: $('#v-html').value,
      atualizado_em: new Date().toISOString()
    }, { onConflict: 'pessoa_id' })
    $('#v-recado').textContent = error ? error.message : 'Painel salvo.'
  }
  $('#v-limpar').onclick = async () => {
    if (!confirm('Apagar o painel desta pessoa?')) return
    await db.from('visao_geral_pessoa').delete().eq('pessoa_id', $('#v-pessoa').value)
    $('#v-html').value = ''; $('#v-recado').textContent = 'Painel apagado.'
  }
}

// ---------------------------------------------------------------
// Página: Compras e Recebimento  (módulo 'compras')
// Modelada sobre as tabelas que já existem:
//   solicitacao_compra · recebimento_mercadoria · fornecedor
// ---------------------------------------------------------------
const STATUS_COMPRA = {
  AGUARDANDO_COORD:     { rotulo: 'Aguardando coordenação', classe: 'aguardando' },
  AGUARDANDO_COTACAO:   { rotulo: 'Em cotação',             classe: 'aguardando' },
  AGUARDANDO_APROVACAO: { rotulo: 'Aguardando aprovação',   classe: 'aguardando' },
  DEVOLVIDA:            { rotulo: 'Devolvida',              classe: 'reprovada' },
  APROVADA:             { rotulo: 'Aprovada — a pagar',    classe: 'aprovada' },
  PAGA:                 { rotulo: 'Paga',                  classe: 'aprovada' },
  REPROVADA:            { rotulo: 'Reprovada',              classe: 'reprovada' },
  RECEBIDA:             { rotulo: 'Recebida',               classe: 'recebida' },
  CANCELADA:            { rotulo: 'Cancelada',              classe: 'recebida' }
}
const selo = s => {
  const e = STATUS_COMPRA[s] || { rotulo: s || '—', classe: '' }
  return `<span class="status ${e.classe}">${esc(e.rotulo)}</span>`
}
const URGENCIA = { URGENTE_4H: 'Urgente — 4h', NAO_URGENTE_5D: 'Normal — 5 dias' }

// Setor que exige passar pela coordenação antes de cotar.
const SETOR_COM_COORDENACAO = 'Indústria'

// Quem faz o quê:
//   ver e solicitar   -> qualquer um com acesso ao módulo compras
//   coordenação       -> quem é gestor do setor da solicitação (setor.gestor_id)
//   cotação           -> papel COMPRAS (o analista de compras)
//   aprovação final   -> papel DIRETORIA
//   ADMIN passa em todas, para destravar o fluxo
const ehAdminSistema = () => PERFIL.papeis.includes('ADMIN')
const podeCotar     = () => PERFIL.papeis.includes('COMPRAS') || ehAdminSistema()
const podeAprovar   = () => PERFIL.papeis.includes('DIRETORIA') || ehAdminSistema()
// baixa de pagamento: quem edita o módulo financeiro
const podePagar     = () => podeEditar('financeiro') || ehAdminSistema()
// coordenação depende do setor: só aparece para quem gerencia algum
const podeCoordenar = () => COMPRAS_CACHE.meusSetores.length > 0 || ehAdminSistema()

let COMPRAS_CACHE = { fornecedores: [], setores: [], pessoas: [], meusSetores: [] }

async function paginaCompras () {
  if (!podeVer('compras')) { areaLivre().innerHTML =
    `<div class="panel" style="padding:22px;"><p class="texto-dim">
     Você não tem acesso a Compras.</p></div>`; return }

  const editavel = podeEditar('compras')
  $('#subtitulo-pagina').textContent = 'Solicitações, coordenação, cotação e aprovação'
  const area = areaLivre()
  area.innerHTML = `<p class="texto-dim2">carregando...</p>`

  // carrega antes de montar as abas: quem coordena depende dos setores
  const [{ data: forn }, { data: setores }, { data: pessoas }] = await Promise.all([
    db.from('fornecedor').select('id,nome,cnpj_cpf,contato,status').order('nome'),
    db.from('setor').select('id,nome,gestor_id').order('nome'),
    db.from('pessoa').select('id,nome').order('nome')
  ])
  COMPRAS_CACHE = {
    fornecedores: forn || [],
    setores: setores || [],
    pessoas: pessoas || [],
    meusSetores: (setores || []).filter(s => s.gestor_id && s.gestor_id === PERFIL.pessoaId)
  }

  const abas = [
    { chave: 'solicitacoes', nome: 'Solicitações', mostrar: true },
    { chave: 'coordenar',    nome: 'Coordenação',  mostrar: podeCoordenar() },
    { chave: 'cotar',        nome: 'Cotação',      mostrar: podeCotar() },
    { chave: 'aprovar',      nome: 'Aprovação',    mostrar: podeAprovar() },
    { chave: 'pagar',        nome: 'Pagamento',    mostrar: podePagar() },
    { chave: 'receber',      nome: 'Recebimento',  mostrar: true },
    { chave: 'fornecedores', nome: 'Fornecedores', mostrar: true }
  ].filter(a => a.mostrar)

  area.innerHTML = `
    <div class="subabas">
      ${abas.map((a, i) => `<button data-sub="${a.chave}" class="${i === 0 ? 'ativo' : ''}">${a.nome}</button>`).join('')}
    </div>
    <div id="sub-compras"></div>`

  area.querySelectorAll('.subabas button').forEach(b => {
    b.onclick = () => {
      area.querySelectorAll('.subabas button').forEach(x => x.classList.toggle('ativo', x === b))
      abrirCompras(b.dataset.sub, editavel)
    }
  })

  abrirCompras('solicitacoes', editavel)
}

function abrirCompras (sub, editavel) {
  const alvo = $('#sub-compras')
  alvo.innerHTML = `<p class="texto-dim2">carregando...</p>`
  if (sub === 'solicitacoes') comprasSolicitacoes(alvo, editavel)
  if (sub === 'coordenar') comprasDecidir(alvo, 'coordenacao')
  if (sub === 'cotar') comprasCotar(alvo)
  if (sub === 'aprovar') comprasDecidir(alvo, 'aprovacao')
  if (sub === 'pagar') comprasPagar(alvo)
  if (sub === 'receber') comprasReceber(alvo, editavel)
  if (sub === 'fornecedores') comprasFornecedores(alvo, editavel)
}

const selSolicitacao = `
  id, status, urgencia, tipo_solicitacao, justificativa, tem_risco, descricao_risco,
  produto_servico, quantidade, unidade, especificacoes, finalidade, local_entrega,
  valor_estimado, recorrencia, data_solicitacao, setor_id,
  parecer_coordenacao, coordenado_em, parecer_aprovacao, decidido_em,
  parecer_cotacao, cotado_em, forma_pagamento, condicao_pagamento,
  parcelas, vencimento, dados_pagamento, orcamento_escolhido_id,
  solicitante:solicitante_id ( nome ),
  gestor:gestor_id ( nome ),
  analista:analista_id ( nome ),
  aprovador:aprovador_id ( nome ),
  setor:setor_id ( nome ),
  fornecedor:fornecedor_id ( nome )`

// ----- Compras › Solicitações -----
async function comprasSolicitacoes (alvo, editavel) {
  const { data, error } = await db.from('solicitacao_compra')
    .select(selSolicitacao).order('data_solicitacao', { ascending: false }).limit(300)

  if (error) { alvo.innerHTML = `<p class="vazio">${esc(error.message)}</p>`; return }

  alvo.innerHTML = `
    ${editavel ? `<div class="acoes" style="margin:0 0 16px;">
      <button class="btn" id="c-nova">Nova solicitação</button></div>` : ''}
    <div class="panel" id="c-resumo" style="padding:16px 18px;margin-bottom:16px;"></div>
    <div class="filtros" style="margin-bottom:14px;">
      <div class="campo"><label>Status</label>
        <select id="c-f-status"><option value="">todos</option>
          ${Object.entries(STATUS_COMPRA).map(([k, v]) =>
            `<option value="${k}">${esc(v.rotulo)}</option>`).join('')}
        </select></div>
      <div class="campo"><label>Buscar</label>
        <input id="c-f-texto" placeholder="produto, serviço ou finalidade"></div>
    </div>
    <div id="c-lista"></div>`

  // Concluída = recebida. Em andamento = ainda vai andar.
  // Encerrada sem compra = reprovada, devolvida ou cancelada: saiu da fila,
  // então não entra na conta do que "falta concluir".
  const CONCLUIDAS = ['RECEBIDA']
  const PARADAS = ['REPROVADA', 'CANCELADA', 'DEVOLVIDA']

  const resumir = lista => {
    const feito = lista.filter(s => CONCLUIDAS.includes(s.status)).length
    const parado = lista.filter(s => PARADAS.includes(s.status)).length
    const andamento = lista.length - feito - parado
    const base = feito + andamento              // o que precisa chegar ao fim
    const pct = base ? Math.round((feito / base) * 100) : 0

    $('#c-resumo').innerHTML = `
      <div class="cabeca-secao" style="margin-bottom:2px;">
        <h3 style="font-family:var(--serif);font-size:17px;">
          ${base ? pct + '% concluído' : 'Nenhuma solicitação em curso'}</h3>
        <span class="texto-dim2" style="font-size:12px;">
          ${andamento ? `faltam ${andamento} de ${base}` : base ? 'tudo recebido' : ''}</span>
      </div>
      ${lista.length ? `
      <div class="progresso">
        ${feito ? `<span class="feito" style="width:${(feito / lista.length) * 100}%"></span>` : ''}
        ${andamento ? `<span class="andamento" style="width:${(andamento / lista.length) * 100}%"></span>` : ''}
        ${parado ? `<span class="parado" style="width:${(parado / lista.length) * 100}%"></span>` : ''}
      </div>
      <div class="legenda">
        <span class="feito"><i></i>${feito} recebida${feito === 1 ? '' : 's'}</span>
        <span class="andamento"><i></i>${andamento} em andamento</span>
        ${parado ? `<span class="parado"><i></i>${parado} encerrada${parado === 1 ? '' : 's'} sem compra</span>` : ''}
      </div>` : ''}`
  }

  const desenhar = () => {
    const st = $('#c-f-status').value
    const txt = $('#c-f-texto').value.trim().toLowerCase()
    const lista = (data || []).filter(s =>
      (!st || s.status === st) &&
      (!txt || `${s.produto_servico} ${s.finalidade ?? ''}`.toLowerCase().includes(txt)))

    resumir(lista)
    $('#c-lista').innerHTML = lista.map(s => `
      <div class="cartao-sol">
        <div class="linha1">
          <span class="titulo">${esc(s.produto_servico)}</span>
          ${s.urgencia === 'URGENTE_4H' ? '<span class="urgente">● urgente</span>' : ''}
          ${selo(s.status)}
          <div class="botoes">
            <button class="btn-secundario mini" data-ficha="${s.id}">ficha</button>
          </div>
        </div>
        <div class="meta">
          ${esc(s.solicitante?.nome ?? 'sem solicitante')}
          ${s.setor?.nome ? '· ' + esc(s.setor.nome) : ''}
          · ${fmtQuando(s.data_solicitacao) ?? '—'}
          ${s.quantidade ? `· ${esc(s.quantidade)} ${esc(s.unidade ?? '')}` : ''}
          ${s.valor_estimado ? `· estimado R$ ${fmtNum(s.valor_estimado)}` : ''}
        </div>
      </div>`).join('') ||
      `<p class="vazio">Nenhuma solicitação${(data || []).length ? ' com esse filtro' : ' registrada ainda'}.</p>`

    $('#c-lista').querySelectorAll('[data-ficha]').forEach(b => {
      b.onclick = () => abrirFicha(data.find(x => x.id === b.dataset.ficha), editavel)
    })
  }

  $('#c-f-status').onchange = desenhar
  $('#c-f-texto').oninput = desenhar
  desenhar()

  if (editavel) $('#c-nova').onclick = () => formSolicitacao()
}

// ----- Ficha da solicitação, com impressão em PDF -----
function abrirFicha (s, editavel) {
  if (!s) return
  const item = (rot, val) => val
    ? `<div class="item"><div class="rot">${esc(rot)}</div><div class="val">${esc(val)}</div></div>` : ''

  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = `
    <div class="modal area-impressao">
      ${marcaPDF()}
      <div class="cabeca-secao">
        <h3>Solicitação de compra</h3>
        <span>${selo(s.status)}</span>
      </div>
      <div class="ficha">
        ${item('Produto ou serviço', s.produto_servico)}
        ${item('Quantidade', s.quantidade ? `${s.quantidade} ${s.unidade ?? ''}` : null)}
        ${item('Solicitante', s.solicitante?.nome)}
        ${item('Setor', s.setor?.nome)}
        ${item('Urgência', URGENCIA[s.urgencia] ?? s.urgencia)}
        ${item('Tipo', s.tipo_solicitacao)}
        ${item('Valor estimado', s.valor_estimado ? 'R$ ' + fmtNum(s.valor_estimado) : null)}
        ${item('Fornecedor sugerido', s.fornecedor?.nome)}
        ${item('Local de entrega', s.local_entrega)}
        ${item('Recorrência', s.recorrencia)}
        ${item('Data', fmtQuando(s.data_solicitacao))}
      </div>
      ${s.finalidade ? `<div class="secao" style="margin-top:18px;">
        <div class="rot texto-dim2" style="font-size:10.5px;text-transform:uppercase;">Finalidade</div>
        <p style="margin:4px 0 0;font-size:13.5px;">${esc(s.finalidade)}</p></div>` : ''}
      ${s.especificacoes ? `<div class="secao">
        <div class="rot texto-dim2" style="font-size:10.5px;text-transform:uppercase;">Especificações</div>
        <p style="margin:4px 0 0;font-size:13.5px;">${esc(s.especificacoes)}</p></div>` : ''}
      ${s.justificativa ? `<div class="secao">
        <div class="rot texto-dim2" style="font-size:10.5px;text-transform:uppercase;">Justificativa do solicitante</div>
        <p style="margin:4px 0 0;font-size:13.5px;">${esc(s.justificativa)}</p></div>` : ''}
      ${s.tem_risco ? `<div class="secao">
        <div class="rot" style="font-size:10.5px;text-transform:uppercase;color:var(--warn-text);">Risco apontado</div>
        <p style="margin:4px 0 0;font-size:13.5px;">${esc(s.descricao_risco || 'sim, sem descrição')}</p></div>` : ''}

      <div class="secao" style="margin-top:18px;">
        <div class="rot texto-dim2" style="font-size:10.5px;text-transform:uppercase;">Andamento</div>
        <div class="passo"><span class="quando">${fmtQuando(s.data_solicitacao) ?? '—'}</span>
          <span>Solicitada por ${esc(s.solicitante?.nome ?? '—')}</span></div>
        ${s.coordenado_em || s.parecer_coordenacao ? `<div class="passo">
          <span class="quando">${fmtQuando(s.coordenado_em) ?? '—'}</span>
          <span><b>Coordenação</b> — ${esc(s.gestor?.nome ?? 'sem nome')}<br>
          ${esc(s.parecer_coordenacao ?? 'sem parecer registrado')}</span></div>` : ''}
        ${s.decidido_em || s.parecer_aprovacao ? `<div class="passo">
          <span class="quando">${fmtQuando(s.decidido_em) ?? '—'}</span>
          <span><b>Aprovação</b> — ${esc(s.aprovador?.nome ?? 'sem nome')}<br>
          ${esc(s.parecer_aprovacao ?? 'sem parecer registrado')}</span></div>` : ''}
      </div>

      <div class="acoes nao-imprime">
        <button class="btn" id="f-imprimir">Salvar em PDF</button>
        ${editavel ? `<button class="btn-secundario" id="f-editar">Editar</button>` : ''}
        <button class="btn-secundario" id="f-fechar">Fechar</button>
      </div>
    </div>`

  document.body.appendChild(fundo)
  const fechar = () => fundo.remove()
  fundo.onclick = e => { if (e.target === fundo) fechar() }
  fundo.querySelector('#f-fechar').onclick = fechar
  fundo.querySelector('#f-imprimir').onclick = () => window.print()
  const bEditar = fundo.querySelector('#f-editar')
  if (bEditar) bEditar.onclick = () => { fechar(); formSolicitacao(s) }
}

// ----- Formulário de solicitação -----
function formSolicitacao (s = null) {
  const opc = (lista, atual) => '<option value="">—</option>' +
    lista.map(i => `<option value="${i.id}" ${i.id === atual ? 'selected' : ''}>${esc(i.nome)}</option>`).join('')

  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = `
    <div class="modal">
      <h3>${s ? 'Editar solicitação' : 'Nova solicitação de compra'}</h3>
      <div class="form-grade">
        <div class="campo"><label>Produto ou serviço *</label>
          <input id="s-produto" value="${esc(s?.produto_servico ?? '')}"></div>
        <div class="campo"><label>Quantidade</label>
          <input id="s-qtd" value="${esc(s?.quantidade ?? '')}"></div>
        <div class="campo"><label>Unidade</label>
          <input id="s-unid" value="${esc(s?.unidade ?? '')}" placeholder="un, kg, cx"></div>
        <div class="campo"><label>Urgência</label>
          <select id="s-urg">
            <option value="NAO_URGENTE_5D" ${s?.urgencia === 'NAO_URGENTE_5D' ? 'selected' : ''}>Normal — 5 dias</option>
            <option value="URGENTE_4H" ${s?.urgencia === 'URGENTE_4H' ? 'selected' : ''}>Urgente — 4 horas</option>
          </select></div>
        <div class="campo"><label>Tipo</label>
          <input id="s-tipo" value="${esc(s?.tipo_solicitacao ?? '')}" placeholder="material, serviço..."></div>
        <div class="campo"><label>Setor</label>
          <select id="s-setor">${opc(COMPRAS_CACHE.setores, s?.setor_id)}</select></div>
        <div class="campo"><label>Valor estimado (R$)</label>
          <input id="s-valor" inputmode="decimal" value="${s?.valor_estimado ?? ''}" placeholder="80,00"></div>
        <div class="campo"><label>Fornecedor sugerido</label>
          <select id="s-forn">${opc(COMPRAS_CACHE.fornecedores, s?.fornecedor_id)}</select></div>
        <div class="campo"><label>Local de entrega</label>
          <input id="s-local" value="${esc(s?.local_entrega ?? '')}"></div>
        <div class="campo"><label>Recorrência</label>
          <input id="s-recor" value="${esc(s?.recorrencia ?? '')}" placeholder="única, mensal..."></div>
      </div>

      <div class="campo" style="margin-top:12px;"><label>Finalidade</label>
        <textarea id="s-final" style="min-height:70px;">${esc(s?.finalidade ?? '')}</textarea></div>
      <div class="campo" style="margin-top:10px;"><label>Especificações</label>
        <textarea id="s-espec" style="min-height:70px;">${esc(s?.especificacoes ?? '')}</textarea></div>
      <div class="campo" style="margin-top:10px;"><label>Justificativa</label>
        <textarea id="s-just" style="min-height:70px;">${esc(s?.justificativa ?? '')}</textarea></div>

      <label class="linha-modulo" style="margin-top:12px;">
        <input type="checkbox" id="s-risco" ${s?.tem_risco ? 'checked' : ''}>
        <span class="nome">Existe risco se esta compra não acontecer</span></label>
      <div class="campo ${s?.tem_risco ? '' : 'oculto'}" id="s-linha-risco" style="margin-top:8px;">
        <label>Qual o risco</label>
        <textarea id="s-descrisco" style="min-height:60px;">${esc(s?.descricao_risco ?? '')}</textarea></div>

      <div class="acoes">
        <button class="btn" id="s-salvar">${s ? 'Salvar alterações' : 'Enviar solicitação'}</button>
        <button class="btn-secundario" id="s-cancelar">Cancelar</button>
      </div>
      <div class="recado oculto" id="s-recado"></div>
    </div>`

  document.body.appendChild(fundo)
  const fechar = () => fundo.remove()
  fundo.querySelector('#s-cancelar').onclick = fechar
  fundo.onclick = e => { if (e.target === fundo) fechar() }

  const q = id => fundo.querySelector(id)
  q('#s-risco').onchange = () => q('#s-linha-risco').classList.toggle('oculto', !q('#s-risco').checked)

  const aviso = (t, alerta = false) => {
    const el = q('#s-recado'); el.textContent = t; el.classList.remove('oculto')
    el.style.borderColor = alerta ? 'var(--warn-text)' : 'var(--line2)'
    el.style.color = alerta ? 'var(--warn-text)' : 'var(--dim)'
  }

  q('#s-salvar').onclick = async () => {
    const produto = q('#s-produto').value.trim()
    if (!produto) { aviso('Escreva o produto ou serviço.', true); return }

    const btn = q('#s-salvar'); btn.disabled = true; btn.textContent = 'Salvando...'
    const corpo = {
      produto_servico: produto,
      quantidade: q('#s-qtd').value.trim() || null,
      unidade: q('#s-unid').value.trim() || null,
      urgencia: q('#s-urg').value,
      tipo_solicitacao: q('#s-tipo').value.trim() || null,
      setor_id: q('#s-setor').value || null,
      valor_estimado: (() => {
        let b = q('#s-valor').value.trim()
        if (!b) return null
        if (b.includes(',')) {
          b = b.replace(/\./g, '').replace(',', '.')   // 1.250,50   -> 1250.50
        } else if (/^\d{1,3}(\.\d{3})+$/.test(b)) {
          b = b.replace(/\./g, '')                     // 1.234.567  -> 1234567
        }                                              // 80.5 fica como está
        const n = Number(b)
        return Number.isNaN(n) ? null : n
      })(),
      fornecedor_id: q('#s-forn').value || null,
      local_entrega: q('#s-local').value.trim() || null,
      recorrencia: q('#s-recor').value.trim() || null,
      finalidade: q('#s-final').value.trim() || null,
      especificacoes: q('#s-espec').value.trim() || null,
      justificativa: q('#s-just').value.trim() || null,
      tem_risco: q('#s-risco').checked,
      descricao_risco: q('#s-risco').checked ? (q('#s-descrisco').value.trim() || null) : null
    }
    if (!s) {
      corpo.solicitante_id = PERFIL.pessoaId
      corpo.data_solicitacao = new Date().toISOString()
      // Indústria passa pela coordenação; os demais vão direto para o analista
      const setorEscolhido = COMPRAS_CACHE.setores.find(x => x.id === corpo.setor_id)
      corpo.status = setorEscolhido?.nome === SETOR_COM_COORDENACAO
        ? 'AGUARDANDO_COORD'
        : 'AGUARDANDO_COTACAO'
    }

    const { error } = s
      ? await db.from('solicitacao_compra').update(corpo).eq('id', s.id)
      : await db.from('solicitacao_compra').insert(corpo)

    btn.disabled = false; btn.textContent = s ? 'Salvar alterações' : 'Enviar solicitação'
    if (error) { aviso(error.message, true); return }
    fechar()
    abrirCompras('solicitacoes', true)
  }
}

// ----- Compras › Coordenação e Aprovação -----
// A mesma fila serve as duas etapas; muda o status filtrado e quem assina.
const ETAPAS = {
  coordenacao: {
    titulo: 'Aguardando coordenação',
    statusFila: 'AGUARDANDO_COORD',
    permitido: podeCoordenar,
    avancar: { status: 'AGUARDANDO_COTACAO', rotulo: 'Justificar e enviar para cotação' },
    recusar: { status: 'DEVOLVIDA', rotulo: 'Devolver ao solicitante' },
    campoParecer: 'parecer_coordenacao',
    campoData: 'coordenado_em',
    campoPessoa: 'gestor_id',
    rotuloParecer: 'Justificativa da compra',
    explica: `Só solicitações de ${SETOR_COM_COORDENACAO} passam por aqui. ` +
             'Justifique a necessidade e encaminhe para o analista cotar.'
  },
  aprovacao: {
    titulo: 'Aguardando aprovação da diretoria',
    statusFila: 'AGUARDANDO_APROVACAO',
    permitido: podeAprovar,
    avancar: { status: 'APROVADA', rotulo: 'Aprovar' },
    recusar: { status: 'REPROVADA', rotulo: 'Reprovar' },
    campoParecer: 'parecer_aprovacao',
    campoData: 'decidido_em',
    campoPessoa: 'aprovador_id',
    rotuloParecer: 'Parecer da aprovação',
    explica: 'Decisão final. O parecer fica registrado e sai na ficha em PDF.'
  }
}

async function comprasDecidir (alvo, nomeEtapa) {
  const etapa = ETAPAS[nomeEtapa]
  if (!etapa.permitido()) {
    alvo.innerHTML = `<div class="panel" style="padding:22px;"><p class="texto-dim">
      ${nomeEtapa === 'coordenacao'
        ? 'A coordenação é de quem gerencia um setor. Nenhum setor está sob sua gestão hoje.'
        : 'A aprovação final é do papel <b>Diretoria</b>.'}
      Você acompanha tudo na aba Solicitações.</p></div>`
    return
  }

  let consulta = db.from('solicitacao_compra')
    .select(selSolicitacao).eq('status', etapa.statusFila)

  // coordenação só enxerga o que é do setor que a pessoa gerencia
  if (nomeEtapa === 'coordenacao' && !ehAdminSistema()) {
    consulta = consulta.in('setor_id', COMPRAS_CACHE.meusSetores.map(s => s.id))

// ----- Compras › Cotação (analista de compras) -----
async function comprasCotar (alvo) {
  if (!podeCotar()) {
    alvo.innerHTML = `<div class="panel" style="padding:22px;"><p class="texto-dim">
      A cotação é do analista de compras (papel <b>Compras</b>).</p></div>`
    return
  }

  const { data, error } = await db.from('solicitacao_compra')
    .select(selSolicitacao).eq('status', 'AGUARDANDO_COTACAO')
    .order('urgencia').order('data_solicitacao')

  if (error) { alvo.innerHTML = `<p class="vazio">${esc(error.message)}</p>`; return }

  // quantos orçamentos cada uma já tem
  const ids = (data || []).map(s => s.id)
  let porSol = {}
  if (ids.length) {
    const { data: orcs } = await db.from('orcamento')
      .select('solicitacao_id, valor, escolhido').in('solicitacao_id', ids)
    ;(orcs || []).forEach(o => {
      porSol[o.solicitacao_id] = porSol[o.solicitacao_id] || { n: 0, menor: null }
      porSol[o.solicitacao_id].n++
      const m = porSol[o.solicitacao_id].menor
      if (m === null || Number(o.valor) < m) porSol[o.solicitacao_id].menor = Number(o.valor)
    })
  }

  alvo.innerHTML = `
    <div class="cabeca-secao">
      <h3 style="font-family:var(--serif);font-size:17px;">Para cotar</h3>
      <span class="texto-dim2" style="font-size:12px;">${(data || []).length} pendente(s)</span>
    </div>
    <p class="aviso" style="margin-top:0;margin-bottom:14px;">
      Lance os orçamentos, escolha o melhor, preencha o pagamento e envie para a diretoria.</p>
    <div id="c-cotar"></div>`

  $('#c-cotar').innerHTML = (data || []).map(s => {
    const r = porSol[s.id]
    return `<div class="cartao-sol">
      <div class="linha1">
        <span class="titulo">${esc(s.produto_servico)}</span>
        ${s.urgencia === 'URGENTE_4H' ? '<span class="urgente">● urgente</span>' : ''}
        ${r ? `<span class="chip">${r.n} orçamento${r.n > 1 ? 's' : ''}</span>` : ''}
        <div class="botoes">
          <button class="btn-secundario mini" data-ficha="${s.id}">ficha</button>
          <button class="btn mini" data-cotar="${s.id}">cotar</button>
        </div>
      </div>
      <div class="meta">
        ${esc(s.solicitante?.nome ?? '—')} ${s.setor?.nome ? '· ' + esc(s.setor.nome) : ''}
        · ${fmtQuando(s.data_solicitacao) ?? '—'}
        ${s.valor_estimado ? `· estimado R$ ${fmtNum(s.valor_estimado)}` : ''}
        ${r?.menor != null ? `· menor cotação R$ ${fmtNum(r.menor)}` : ''}
      </div>
    </div>`
  }).join('') || `<p class="vazio">Nada aguardando cotação.</p>`

  $('#c-cotar').querySelectorAll('[data-ficha]').forEach(b => {
    b.onclick = () => abrirFicha(data.find(x => x.id === b.dataset.ficha), false)
  })
  $('#c-cotar').querySelectorAll('[data-cotar]').forEach(b => {
    b.onclick = () => telaCotacao(data.find(x => x.id === b.dataset.cotar))

// ----- Tela de cotação de uma solicitação -----
async function telaCotacao (s) {
  if (!s) return

  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = `<div class="modal"><p class="texto-dim2">carregando orçamentos...</p></div>`
  document.body.appendChild(fundo)
  const fechar = () => fundo.remove()
  fundo.onclick = e => { if (e.target === fundo) fechar() }

  const recarregar = async () => {
    const { data: orcs } = await db.from('orcamento')
      .select('id,valor,prazo_entrega,forma_pagamento,condicao_pagamento,link_proposta,observacoes,escolhido,fornecedor_avulso,fornecedor:fornecedor_id(nome)')
      .eq('solicitacao_id', s.id).order('valor')
    desenhar(orcs || [])
  }

  const desenhar = orcs => {
    const menor = orcs.length ? Math.min(...orcs.map(o => Number(o.valor))) : null
    const escolhido = orcs.find(o => o.escolhido)

    fundo.innerHTML = `
      <div class="modal" style="max-width:860px;">
        <div class="cabeca-secao">
          <h3>Cotação — ${esc(s.produto_servico)}</h3>
          <span class="texto-dim2" style="font-size:12px;">
            ${s.quantidade ? esc(s.quantidade) + ' ' + esc(s.unidade ?? '') : ''}
            ${s.valor_estimado ? '· estimado R$ ' + fmtNum(s.valor_estimado) : ''}</span>
        </div>

        <div class="panel" style="padding:0;margin-bottom:16px;">
          <table><thead><tr>
            <th></th><th>Fornecedor</th><th class="num">Valor</th>
            <th>Prazo</th><th>Pagamento</th><th></th>
          </tr></thead><tbody>
            ${orcs.map(o => `<tr>
              <td><input type="radio" name="escolha" data-escolher="${o.id}" ${o.escolhido ? 'checked' : ''}></td>
              <td>${esc(o.fornecedor?.nome || o.fornecedor_avulso || '—')}
                ${o.link_proposta ? `<br><a class="anexo-link" href="${esc(o.link_proposta)}" target="_blank" rel="noopener">proposta</a>` : ''}</td>
              <td class="num ${Number(o.valor) === menor ? 'badge-bom' : ''}">R$ ${fmtNum(o.valor)}</td>
              <td>${esc(o.prazo_entrega ?? '—')}</td>
              <td>${esc([o.forma_pagamento, o.condicao_pagamento].filter(Boolean).join(' · ') || '—')}</td>
              <td style="text-align:right;">
                <button class="btn-secundario mini" data-apagar="${o.id}">remover</button></td>
            </tr>`).join('') || `<tr><td colspan="6" class="vazio">
              Nenhum orçamento lançado. Adicione ao menos um abaixo.</td></tr>`}
          </tbody></table>
        </div>

        <div class="secao">
          <h3 style="font-size:15px;">Novo orçamento</h3>
          <div class="form-grade">
            <div class="campo"><label>Fornecedor</label>
              <select id="o-forn"><option value="">— digitar abaixo —</option>
                ${COMPRAS_CACHE.fornecedores.map(f =>
                  `<option value="${f.id}">${esc(f.nome)}</option>`).join('')}</select></div>
            <div class="campo"><label>ou nome do fornecedor</label><input id="o-avulso"></div>
            <div class="campo"><label>Valor (R$) *</label><input id="o-valor" inputmode="decimal" placeholder="1.250,00"></div>
            <div class="campo"><label>Prazo de entrega</label><input id="o-prazo" placeholder="5 dias úteis"></div>
            <div class="campo"><label>Forma de pagamento</label><input id="o-forma" placeholder="boleto, PIX, cartão"></div>
            <div class="campo"><label>Condição</label><input id="o-cond" placeholder="à vista, 30/60"></div>
            <div class="campo"><label>Link da proposta</label><input id="o-link" placeholder="https://..."></div>
          </div>
          <div class="acoes"><button class="btn mini" id="o-add">Adicionar orçamento</button></div>
        </div>

        <div class="secao">
          <h3 style="font-size:15px;">Pagamento e envio</h3>
          <div class="form-grade">
            <div class="campo"><label>Parcelas</label>
              <input id="p-parcelas" type="number" min="1" value="${s.parcelas ?? 1}"></div>
            <div class="campo"><label>Vencimento</label>
              <input id="p-venc" type="date" value="${s.vencimento ?? ''}"></div>
          </div>
          <div class="campo" style="margin-top:10px;"><label>Dados de pagamento</label>
            <textarea id="p-dados" style="min-height:64px;"
              placeholder="PIX, dados bancários ou instruções">${esc(s.dados_pagamento ?? '')}</textarea></div>
          <div class="campo" style="margin-top:10px;"><label>Por que este orçamento *</label>
            <textarea id="p-parecer" style="min-height:64px;"
              placeholder="Menor preço, prazo melhor, único fornecedor homologado...">${esc(s.parecer_cotacao ?? '')}</textarea></div>
        </div>

        <div class="acoes">
          <button class="btn" id="c-enviar">Enviar para aprovação</button>
          <button class="btn-secundario" id="c-pdf">PDF dos orçamentos</button>
          <button class="btn-secundario" id="c-fechar">Fechar</button>
        </div>
        <div class="recado oculto" id="c-recado"></div>
      </div>`

    const q = id => fundo.querySelector(id)
    const aviso = (t, alerta = true) => {
      const el = q('#c-recado'); el.textContent = t; el.classList.remove('oculto')
      el.style.borderColor = alerta ? 'var(--warn-text)' : 'var(--line2)'
      el.style.color = alerta ? 'var(--warn-text)' : 'var(--dim)'
    }

    q('#c-fechar').onclick = fechar

    // marcar o escolhido
    fundo.querySelectorAll('[data-escolher]').forEach(r => {
      r.onchange = async () => {
        await db.from('orcamento').update({ escolhido: false }).eq('solicitacao_id', s.id)
        await db.from('orcamento').update({ escolhido: true }).eq('id', r.dataset.escolher)
        recarregar()
      }
    })

    fundo.querySelectorAll('[data-apagar]').forEach(b => {
      b.onclick = async () => {
        await db.from('orcamento').delete().eq('id', b.dataset.apagar)
        recarregar()
      }
    })

    q('#o-add').onclick = async () => {
      const valor = numeroBR(q('#o-valor').value)
      if (valor === null) { aviso('Informe o valor do orçamento.'); return }
      if (!q('#o-forn').value && !q('#o-avulso').value.trim()) {
        aviso('Escolha um fornecedor cadastrado ou digite o nome.'); return }

      const { error } = await db.from('orcamento').insert({
        solicitacao_id: s.id,
        fornecedor_id: q('#o-forn').value || null,
        fornecedor_avulso: q('#o-avulso').value.trim() || null,
        valor,
        prazo_entrega: q('#o-prazo').value.trim() || null,
        forma_pagamento: q('#o-forma').value.trim() || null,
        condicao_pagamento: q('#o-cond').value.trim() || null,
        link_proposta: q('#o-link').value.trim() || null,
        criado_por_id: PERFIL.pessoaId
      })
      if (error) { aviso(error.message); return }
      recarregar()
    }

    q('#c-pdf').onclick = () => pdfOrcamentos(s, orcs)

    q('#c-enviar').onclick = async () => {
      if (!orcs.length) { aviso('Lance ao menos um orçamento antes de enviar.'); return }
      if (!escolhido) { aviso('Marque qual orçamento foi escolhido.'); return }
      const parecer = q('#p-parecer').value.trim()
      if (!parecer) { aviso('Escreva por que escolheu este orçamento.'); return }

      const { error } = await db.from('solicitacao_compra').update({
        status: 'AGUARDANDO_APROVACAO',
        analista_id: PERFIL.pessoaId,
        cotado_em: new Date().toISOString(),
        parecer_cotacao: parecer,
        orcamento_escolhido_id: escolhido.id,
        forma_pagamento: escolhido.forma_pagamento ?? null,
        condicao_pagamento: escolhido.condicao_pagamento ?? null,
        parcelas: Number(q('#p-parcelas').value) || null,
        vencimento: q('#p-venc').value || null,
        dados_pagamento: q('#p-dados').value.trim() || null,
        fornecedor_id: escolhido.fornecedor?.nome
          ? COMPRAS_CACHE.fornecedores.find(f => f.nome === escolhido.fornecedor.nome)?.id ?? null
          : null
      }).eq('id', s.id)

      if (error) { aviso(error.message); return }
      fechar()
      abrirCompras('cotar', true)
    }
  }

  recarregar()
}

// converte "1.250,50" e "80.5" para número
function numeroBR (raw) {
  let b = String(raw ?? '').trim()
  if (!b) return null
  if (b.includes(',')) b = b.replace(/\./g, '').replace(',', '.')
  else if (/^\d{1,3}(\.\d{3})+$/.test(b)) b = b.replace(/\./g, '')
  const n = Number(b)
  return Number.isNaN(n) ? null : n
}

  const o = orcs[0]
  const item = (rot, val) => val
    ? `<div class="item"><div class="rot">${esc(rot)}</div><div class="val">${esc(val)}</div></div>` : ''

  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = `

      ${marcaPDF()}
      <div class="cabeca-secao">

        ${item('Solicitante', s.solicitante?.nome)}
        ${item('Setor', s.setor?.nome)}

        ${item('Parcelas', s.parcelas ? s.parcelas + 'x' : null)}
