<!DOCTYPE html>
<html lang="pt-BR" data-skin="plataforma">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema Gefoscal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="skins_gefoscal.css">
<style>
/* Layout do app. Usa só os tokens das skins — nenhuma cor fixa aqui. */
.app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
@media (max-width: 860px) { .app { grid-template-columns: 1fr; } .nav { display: none; } }
.nav { background: var(--panel); border-right: 1px solid var(--line); padding: 18px 12px; }
.nav h1 { font-family: var(--serif); font-size: 19px; margin: 0 0 2px; }
.nav .sub { color: var(--dim2); font-size: 11px; margin-bottom: 22px; }
.nav a { display:block; padding:9px 11px; border-radius:6px; color:var(--dim);
         text-decoration:none; font-size:14px; margin-bottom:2px; cursor:pointer; }
.nav a:hover { background: var(--hover-bg); color: var(--txt); }
.nav a.ativo { background: var(--hover-bg); color: var(--txt); border-left:3px solid var(--rust); }
.nav a.bloqueado { opacity:.35; cursor:not-allowed; }
.conteudo { padding: 22px 26px; max-width: 1400px; }
.topo { display:flex; justify-content:space-between; align-items:flex-start;
        gap:16px; flex-wrap:wrap; margin-bottom:20px; }
.topo h2 { font-family: var(--serif); margin:0 0 4px; font-size:24px; }
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); gap:12px; margin-bottom:20px; }
.kpi .rotulo { color:var(--dim2); font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
.kpi .valor { font-family:var(--serif); font-size:26px; margin-top:6px; }
.kpi .nota { color:var(--dim); font-size:12px; margin-top:2px; }
.filtros { display:flex; gap:10px; flex-wrap:wrap; align-items:end; margin-bottom:16px; }
.campo { display:flex; flex-direction:column; gap:4px; }
.campo label { color:var(--dim2); font-size:11px; text-transform:uppercase; letter-spacing:.4px; }
table { width:100%; border-collapse:collapse; font-size:13.5px; }
th { text-align:left; color:var(--dim2); font-weight:600; font-size:11px;
     text-transform:uppercase; letter-spacing:.4px; padding:9px 10px;
     border-bottom:1px solid var(--line2); position:sticky; top:0; background:var(--panel); }
td { padding:9px 10px; border-bottom:1px solid var(--line); }
tbody tr:hover { background: var(--hover-bg); }
.num { text-align:right; font-variant-numeric: tabular-nums; }
.tabela-scroll { max-height: 62vh; overflow:auto; }
.chip { display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px;
        border:1px solid var(--line2); color:var(--dim); background:var(--surface2); }
.anexo-link { color:var(--rust); text-decoration:none; font-size:12px; margin-right:6px; }
.anexo-link:hover { text-decoration:underline; }
.login-wrap { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
.login { width:100%; max-width:380px; }
.login h1 { font-family:var(--serif); margin:0 0 4px; }
.login .campo { margin-bottom:12px; }
.login input { width:100%; }
.erro { color:var(--warn-text); font-size:13px; margin-top:10px; min-height:18px; }
.vazio { color:var(--dim2); padding:28px; text-align:center; }
.oculto { display:none !important; }

.skin-toggle { background:var(--surface2); border:1px solid var(--line2); color:var(--dim);
               width:36px; height:36px; border-radius:50%; display:flex; align-items:center;
               justify-content:center; cursor:pointer; flex:none;
               transition:background .15s ease, border-color .15s ease, color .15s ease, transform .2s ease; }
.skin-toggle:hover { border-color:var(--rust); color:var(--rust); transform:rotate(20deg); }
.skin-toggle svg { width:17px; height:17px; }

/* ---- Marca ---- */
.logo-login { display:block; height:64px; width:auto; margin:0 auto 14px; }
.logo-nav { display:block; height:34px; width:auto; margin-bottom:14px; }
/* ---- Documento do pedido: cores fixas da marca, para sair igual no papel ---- */
.doc { --verde:#1c5632; --verde-claro:#eef5f0; --ouro:#c8a11a; --borda:#d7e3da;
       background:#fff; color:#1b1b1b; border-radius:10px; overflow:hidden; }
.doc-topo { background:var(--verde); color:#fff; padding:18px 22px; border-bottom:4px solid var(--ouro); }
.doc-topo h2 { margin:0; font-size:21px; letter-spacing:.5px; font-weight:600; }
.doc-topo .sub { font-size:12px; opacity:.85; margin-top:3px; }
.doc-topo img { height:40px; width:auto; }
.doc-corpo { padding:16px; display:grid; gap:12px; }
.doc-linha { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); }
.bloco { border:1px solid var(--borda); border-radius:8px; overflow:hidden; background:#fff; }
.bloco > h4 { margin:0; background:var(--verde-claro); color:var(--verde);
              font-size:11px; letter-spacing:.6px; text-transform:uppercase;
              padding:8px 12px; border-bottom:1px solid var(--borda); font-weight:600; }
.bloco .conteudo { padding:12px; font-size:13px; line-height:1.65; }
.bloco .conteudo .rot { color:#5b6b60; }
.bloco .conteudo b { color:#1b1b1b; }
.doc .valor-caixa { display:flex; justify-content:space-between; align-items:center;
                    gap:12px; border:1px solid var(--borda); border-radius:7px;
                    padding:10px 12px; margin-top:8px; }
.doc .valor-caixa .rotulo { font-size:11.5px; letter-spacing:.5px;
                            text-transform:uppercase; color:var(--verde); font-weight:600; }
.doc .valor-caixa .nota { font-size:11px; color:#6d7c72; }
.doc .valor-caixa .cifra { font-size:19px; font-weight:600; color:var(--verde); white-space:nowrap; }
.doc .valor-caixa.destaque { background:#fffcf0; border-color:var(--ouro); }
.doc .valor-caixa.destaque .cifra { color:#8a5a12; font-size:24px; }
.doc .caixa-texto { border:1.5px solid var(--verde); border-radius:8px; padding:11px 13px; }
.doc .caixa-texto .rot { color:var(--verde); font-size:11px; letter-spacing:.6px;
                         text-transform:uppercase; font-weight:600; margin-bottom:4px; }
.doc .caixa-texto p { margin:0; font-size:13.5px; white-space:pre-wrap; }
.doc .caixa-texto.coord { border-color:#4b4fd0; background:#f2f3ff; }
.doc .caixa-texto.coord .rot { color:#4b4fd0; }
.doc .estado { display:inline-block; border:1px solid var(--ouro); background:#fffaf0;
               color:#8a5a12; border-radius:20px; padding:5px 14px;
               font-size:12.5px; font-weight:600; letter-spacing:.4px; }
.doc table { font-size:12.5px; }
.doc table th { background:var(--verde-claro); color:var(--verde); position:static; }
.doc table td { border-bottom:1px solid var(--borda); }
.assinaturas { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:10px;
               text-align:center; font-size:11px; color:#5b6b60; }
.assinaturas .risco { border-top:1px solid #98a89e; margin:24px 8px 5px; }
.assinaturas b { color:#1b1b1b; }

/* ---- Financeiro e Projetos ---- */
.orc-grade { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-top:10px; }
.orc-item { border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
.orc-item .linha1 { display:flex; justify-content:space-between; align-items:baseline; font-size:13px; margin-bottom:6px; }
.orc-item .linha1 .real.estourado { color:var(--warn-text); }
.orc-item input { width:100%; margin-top:8px; }
.conta-linha { display:flex; justify-content:space-between; align-items:center; padding:10px 14px;
               border-bottom:1px solid var(--line); }
.conta-linha:last-child { border-bottom:none; }
.conta-linha .saldo.neg { color:var(--warn-text); }
.conta-linha .saldo.pos { color:var(--good-text); }
.anel { position:relative; width:96px; height:96px; }
.anel svg { width:100%; height:100%; transform:rotate(-90deg); }
.anel circle { fill:none; stroke-width:8; }
.anel .fundo { stroke:var(--surface2); }
.anel .frente { stroke:var(--rust); stroke-linecap:round; transition:stroke-dashoffset .3s; }
.anel .pct { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
             font-family:var(--serif); font-size:17px; }
.aneis-linha { display:flex; gap:22px; flex-wrap:wrap; margin:16px 0; }
.aneis-linha .item { text-align:center; }
.aneis-linha .nome { font-size:11.5px; color:var(--dim); margin-top:6px; max-width:100px; }
.grafico12 { display:flex; align-items:flex-end; gap:6px; height:150px; padding-top:10px; }
.grafico12 .coluna { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:2px; height:100%; }
.grafico12 .barras { display:flex; gap:2px; align-items:flex-end; height:100%; width:100%; justify-content:center; }
.grafico12 .b-rec, .grafico12 .b-desp { width:40%; border-radius:2px 2px 0 0; min-height:2px; }
.grafico12 .b-rec { background:var(--good-text); }
.grafico12 .b-desp { background:var(--rust); }
.grafico12 .mes { font-size:9.5px; color:var(--dim2); margin-top:4px; }
.ticks { display:flex; gap:2px; margin:8px 0 4px; }
.ticks .seg { flex:1; height:6px; border-radius:2px; background:var(--surface2); }
.ticks.editavel .seg { cursor:pointer; }
.card-projeto { border:1px solid var(--line); border-radius:8px; background:var(--panel);
                padding:14px 16px; margin-bottom:10px; }
.card-projeto.filho { border-left:2px solid var(--line2); }
.card-projeto .cabeca { display:flex; gap:14px; align-items:center; cursor:pointer; }
.card-projeto .titulo-col { width:190px; flex:none; }
.card-projeto .barra-col { flex:1; }
.card-projeto .pct-col { width:70px; flex:none; text-align:right; font-variant-numeric:tabular-nums; }
.card-projeto .detalhe { margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
.check-pessoas { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
.check-pessoas label { display:flex; align-items:center; gap:5px; font-size:12.5px; color:var(--dim);
                        border:1px solid var(--line); border-radius:20px; padding:4px 10px; cursor:pointer; }
.hist-item { font-size:12.5px; border-left:2px solid var(--line); padding-left:9px; margin-bottom:7px; color:var(--dim); }
.kanban { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; align-items:start; }
.coluna-kanban { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; min-height:120px; }
.coluna-kanban h4 { font-family:var(--serif); font-size:14px; margin:2px 4px 10px; display:flex; justify-content:space-between; }
.coluna-kanban .grupo-resp { font-size:10.5px; text-transform:uppercase; letter-spacing:.4px;
                              color:var(--dim2); margin:10px 4px 4px; }
.card-tarefa { background:var(--card); border:1px solid var(--line); border-radius:6px;
               padding:9px 10px; margin-bottom:7px; font-size:13px; cursor:pointer; }
.card-tarefa:hover { border-color:var(--line2); }
.card-tarefa .proj { font-size:11px; color:var(--dim2); margin-top:3px; }
.card-tarefa .rodape-t { display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
.prio { font-size:9.5px; padding:2px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.3px; }
.prio.ALTA  { border:1px solid var(--warn-text); color:var(--warn-text); background:rgba(var(--warn-rgb),.13); }
.prio.MEDIA { border:1px solid var(--line2); color:var(--dim); background:var(--surface2); }
.prio.BAIXA { border:1px solid var(--line); color:var(--dim2); }

/* ---- Ferramentas ---- */
.calc-grade { display:grid; grid-template-columns:1fr 380px; gap:24px; align-items:start; }
@media (max-width:1000px){ .calc-grade { grid-template-columns:1fr; } }
.memo { font-size:13px; }
.memo-linha { display:flex; gap:10px; align-items:baseline; padding:7px 0; border-bottom:1px solid var(--line); }
.memo-linha.total { border-top:1px solid var(--line2); border-bottom:none; font-weight:600; }
.memo-linha.off { opacity:.45; }
.memo-n { color:var(--dim2); font-size:11px; width:20px; flex:none; font-variant-numeric:tabular-nums; }
.memo-d { flex:1; }
.memo-d small { display:block; color:var(--dim2); font-size:11.5px; }
.memo-v { font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
.saida { background:var(--surface2); border:1px solid var(--line2); border-radius:8px; padding:16px; }
.saida .destaque { font-family:var(--serif); font-size:30px; margin:2px 0 14px; }
.saida .par { display:flex; justify-content:space-between; padding:6px 0; border-top:1px solid var(--line); font-size:13px; }
.saida .par span:last-child { font-variant-numeric:tabular-nums; }
.chaves { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 4px; }
.chaves label { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--dim);
                border:1px solid var(--line); border-radius:20px; padding:5px 11px; cursor:pointer; }
.sens-linha { display:flex; align-items:center; gap:8px; font-size:12px; padding:3px 0; }
.sens-linha .p { width:78px; flex:none; font-variant-numeric:tabular-nums; }
.sens-linha .barra { flex:1; }
.sens-linha .v { width:96px; flex:none; text-align:right; font-variant-numeric:tabular-nums; }
.sens-linha.agora { color:var(--gold); font-weight:600; }
.alerta-caixa { font-size:12.5px; padding:10px 13px; border-radius:6px; margin-top:14px;
                background:rgba(var(--warn-rgb),.13); color:var(--warn-text); line-height:1.5; }
.cartao-ferramenta { border:1px solid var(--line); border-radius:8px; background:var(--panel);
                     padding:16px 18px; cursor:pointer; }
.cartao-ferramenta:hover { border-color:var(--rust); }
.cartao-ferramenta h4 { font-family:var(--serif); font-size:15px; margin:0 0 5px; }
.cartao-ferramenta p { margin:0; font-size:12.5px; color:var(--dim); line-height:1.5; }
.grade-cartoes { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; }
.lead-linha td { vertical-align:top; }
.lead-obs { color:var(--dim2); font-size:11.5px; margin-top:3px; max-width:520px; line-height:1.45; }

/* ---- Crédito e Cobrança ---- */
.chips-cred { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:14px; }
.chips-cred button { font-size:12px; padding:5px 13px; border-radius:20px; cursor:pointer;
                      border:1px solid var(--line2); background:none; color:var(--dim); }
.chips-cred button:hover { color:var(--txt); }
.chips-cred button.ativo { border-color:var(--rust); color:var(--rust); background:rgba(var(--rust-rgb),.12); }
.tag-aging { font-size:11px; padding:2px 8px; border-radius:20px; white-space:nowrap; }
.tag-aging.critico { background:rgba(var(--warn-rgb),.18); color:var(--warn-text); }
.tag-aging.alerta  { background:rgba(var(--gold-rgb),.18); color:var(--gold); }
.tag-aging.ok      { background:rgba(var(--good-rgb),.16); color:var(--good-text); }
.tag-aging.futuro  { background:var(--surface2); color:var(--dim); }
.tag-aging.quitado { background:rgba(var(--good-rgb),.16); color:var(--good-text); }
.carreg-disponivel { border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin-bottom:6px;
                      font-size:12.5px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
.carreg-disponivel:hover { border-color:var(--rust); }
.carreg-disponivel.selecionado { border-color:var(--rust); background:rgba(var(--rust-rgb),.08); }


/* ---- Agenda e bloco de notas ---- */
.grade-trabalho { display:grid; grid-template-columns:1.15fr .85fr; gap:16px; margin-bottom:18px; }
@media (max-width: 980px) { .grade-trabalho { grid-template-columns:1fr; } }
.tarefa { display:flex; gap:11px; align-items:flex-start; padding:9px 2px;
          border-bottom:1px solid var(--line); }
.tarefa:last-child { border-bottom:none; }
.tarefa input[type=checkbox] { margin-top:3px; flex:none; width:16px; height:16px; cursor:pointer; }
.tarefa .txt { flex:1; min-width:0; font-size:13.5px; line-height:1.45; }
.tarefa .txt small { display:block; color:var(--dim2); font-size:11.5px; margin-top:2px; }
.tarefa.feita .txt { text-decoration:line-through; opacity:.5; }
.tarefa .prazo { font-size:11px; padding:2px 8px; border-radius:20px; flex:none;
                 border:1px solid var(--line2); color:var(--dim2); white-space:nowrap; }
.tarefa .prazo.hoje { border-color:var(--rust); color:var(--rust); }
.tarefa .prazo.atrasada { border-color:var(--warn-text); color:var(--warn-text); }
.tarefa .apagar { background:none; border:none; color:var(--dim2); cursor:pointer;
                  font-size:15px; line-height:1; padding:2px 4px; opacity:0; flex:none; }
.tarefa:hover .apagar { opacity:1; }
.nota { border:1px solid var(--line); border-radius:8px; padding:11px 13px; margin-bottom:8px;
        cursor:pointer; transition:border-color .15s ease; }
.nota:hover { border-color:var(--line2); }
.nota.fixa { border-left:3px solid var(--rust); }
.nota .tit { font-size:13.5px; margin-bottom:3px; display:flex; align-items:center; gap:7px; }
.nota .prev { color:var(--dim2); font-size:12px; line-height:1.5;
              display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.nota .marca { font-size:10px; padding:2px 7px; border-radius:20px;
               border:1px solid var(--line2); color:var(--dim2); text-transform:uppercase;
               letter-spacing:.4px; flex:none; }
.oculto-senha { filter: blur(4px); transition: filter .15s ease; }
.oculto-senha:hover, .oculto-senha:focus { filter:none; }
.linha-add { display:flex; gap:7px; margin-bottom:12px; }
.linha-add input { flex:1; }


/* ---- Compras: separação entre em análise e encerradas ---- */
.gaveta { border:1px solid var(--line); border-radius:8px; margin-top:16px; overflow:hidden; }
.gaveta > summary { padding:12px 15px; cursor:pointer; font-size:13.5px; color:var(--dim);
                    background:var(--panel); list-style:none; display:flex;
                    align-items:center; gap:10px; }
.gaveta > summary::-webkit-details-marker { display:none; }
.gaveta > summary::before { content:'▸'; font-size:11px; color:var(--dim2); }
.gaveta[open] > summary::before { content:'▾'; }
.gaveta > summary:hover { color:var(--txt); }
.gaveta .corpo { padding:6px 15px 15px; border-top:1px solid var(--line); }
.gaveta .conta { margin-left:auto; font-size:12px; color:var(--dim2); }
.faixa-etapa { display:flex; gap:2px; margin:0 0 16px; border-radius:20px; overflow:hidden;
               background:var(--hover-bg); }
.faixa-etapa button { flex:1; background:none; border:none; padding:9px 8px; cursor:pointer;
                      color:var(--dim2); font-size:12.5px; }
.faixa-etapa button:hover { color:var(--txt); }
.faixa-etapa button.ativo { background:var(--rust); color:#fff; }
.faixa-etapa button .n { display:block; font-size:16px; font-family:var(--serif); }


/* ---- Resumo grande do financeiro ---- */
.resumo-topo { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
               gap:1px; background:var(--line); border:1px solid var(--line);
               border-radius:10px; overflow:hidden; margin-bottom:20px; }
.resumo-topo .bloco { background:var(--panel); padding:20px 22px; }
.resumo-topo .rot { color:var(--dim2); font-size:10.5px; text-transform:uppercase;
                    letter-spacing:.12em; }
.resumo-topo .val { font-family:var(--serif); font-size:34px; line-height:1.05;
                    margin-top:10px; letter-spacing:-.01em; }
.resumo-topo .nota { color:var(--dim); font-size:12.5px; margin-top:7px; }
.resumo-topo .bloco.destaque { box-shadow:inset 4px 0 0 var(--rust); }
.resumo-topo .bloco.alerta  { box-shadow:inset 4px 0 0 var(--warn-text); }
.resumo-topo .bloco.alerta .val { color:var(--warn-text); }
.resumo-topo .bloco.bom .val { color:var(--ok-text, var(--rust)); }
@media (max-width:640px) { .resumo-topo .val { font-size:26px; } }


/* ---- Linha que abre em detalhe ---- */
tr.abrivel { cursor:pointer; }
tr.abrivel:hover { background:var(--hover-bg); }
tr.abrivel .seta { display:inline-block; color:var(--dim2); font-size:10px;
                   transition:transform .15s ease; margin-right:6px; }
tr.abrivel.aberta .seta { transform:rotate(90deg); color:var(--rust); }
tr.detalhe > td { background:var(--hover-bg); padding:0; border-bottom:1px solid var(--line2); }
tr.detalhe .conteudo { padding:16px 18px; }
.det-grade { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
             gap:12px 22px; margin-bottom:12px; }
.det-grade .rot { color:var(--dim2); font-size:10px; text-transform:uppercase;
                  letter-spacing:.1em; }
.det-grade .val { font-size:13.5px; margin-top:3px; }
.det-texto { border-left:2px solid var(--line2); padding-left:11px; margin-top:10px;
             font-size:13px; line-height:1.6; }
.det-texto b { color:var(--dim); font-size:10.5px; text-transform:uppercase;
               letter-spacing:.08em; display:block; margin-bottom:2px; }


/* ---- Documentos anexados dentro do detalhe ---- */
.docs-anexos { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
               gap:9px; margin:12px 0 4px; }
.doc-card { border:1px solid var(--line2); border-radius:8px; padding:11px 13px;
            background:var(--panel); display:flex; gap:11px; align-items:flex-start; }
.doc-card .icone { width:34px; height:34px; border-radius:7px; flex:none; display:grid;
                   place-items:center; background:var(--hover-bg); font-size:14px; }
.doc-card.comprovante .icone { color:var(--ok-text, var(--rust)); }
.doc-card.boleto .icone { color:var(--rust); }
.doc-card .corpo { flex:1; min-width:0; }
.doc-card .tipo { font-size:10px; text-transform:uppercase; letter-spacing:.1em;
                  color:var(--dim2); }
.doc-card .valor { font-size:14px; margin-top:3px; }
.doc-card .quando { font-size:11.5px; color:var(--dim2); margin-top:2px; }
.doc-card .nome { font-size:11px; color:var(--dim2); margin-top:4px;
                  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sem-doc { border:1px dashed var(--line2); border-radius:8px; padding:12px 14px;
           font-size:12.5px; color:var(--dim2); margin:12px 0 4px; }


/* ---- Card recolhível com resumo na barra ---- */
.card-gaveta { border:1px solid var(--line); border-radius:10px; overflow:hidden;
               margin-bottom:16px; background:var(--panel); }
.card-gaveta > .barra { padding:14px 18px; cursor:pointer; display:flex;
                        align-items:center; gap:12px; }
.card-gaveta > .barra:hover { background:var(--hover-bg); }
.card-gaveta > .barra .seta-card { color:var(--dim2); font-size:11px;
                                   transition:transform .18s ease; }
.card-gaveta.aberto > .barra .seta-card { transform:rotate(90deg); color:var(--rust); }
.card-gaveta > .barra .titulo-card { font-family:var(--serif); font-size:16px; flex:1; }
.card-gaveta > .barra .resumo-card { font-size:12.5px; color:var(--dim2); text-align:right; }
.card-gaveta > .barra .resumo-card b { color:var(--txt); font-weight:500; }
.card-gaveta > .miolo { border-top:1px solid var(--line); padding:16px 18px; }
.card-gaveta:not(.aberto) > .miolo { display:none; }

@page { size: A4; margin: 8mm; }

@media print {
  .doc { border-radius:0; }
  .doc-topo { -webkit-print-color-adjust:exact; print-color-adjust:exact;
              padding:10px 14px; border-bottom-width:3px; }
  .doc-topo h2 { font-size:16px; }
  .doc-topo .sub { font-size:9.5px; }
  .doc-topo img { height:30px; }
  .bloco > h4, .doc .valor-caixa.destaque, .doc table th {
    -webkit-print-color-adjust:exact; print-color-adjust:exact; }

  /* tudo mais compacto para caber em uma folha */
  .doc-corpo { padding:9px; gap:7px; }
  .doc-linha { grid-template-columns:1fr 1fr 1fr; gap:7px; }
  .bloco > h4 { padding:4px 9px; font-size:9px; }
  .bloco .conteudo { padding:7px 9px; font-size:10px; line-height:1.45; }
  .doc .valor-caixa { padding:5px 9px; margin-top:4px; border-radius:5px; }
  .doc .valor-caixa .rotulo { font-size:9px; }
  .doc .valor-caixa .nota { font-size:8.5px; }
  .doc .valor-caixa .cifra { font-size:13px; }
  .doc .valor-caixa.destaque .cifra { font-size:16px; }
  .doc .caixa-texto { padding:6px 9px; border-width:1px; border-radius:5px; }
  .doc .caixa-texto .rot { font-size:8.5px; margin-bottom:2px; }
  .doc .caixa-texto p { font-size:10px; line-height:1.4; }
  .doc .estado { padding:2px 9px; font-size:10px; }
  .doc table { font-size:9.5px; }
  .doc table th, .doc table td { padding:3px 6px; }
  .assinaturas { font-size:9px; margin-top:6px; }
  .assinaturas .risco { margin:18px 6px 3px; }

  /* nunca partir um bloco entre páginas */
  .bloco, .caixa-texto, .valor-caixa, .assinaturas, tr { break-inside:avoid; page-break-inside:avoid; }
}

/* ---- Administração e Visão geral ---- */
.subabas { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px; }
.subabas button { background:none; border:1px solid var(--line2); color:var(--dim); cursor:pointer;
                  font-size:13px; padding:7px 15px; border-radius:20px;
                  transition:background .15s ease, border-color .15s ease, color .15s ease; }
.subabas button:hover { color:var(--txt); border-color:var(--rust); }
.subabas button.ativo { color:var(--rust); border-color:var(--rust); background:rgba(var(--rust-rgb),.1); }
.form-grade { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; }
.grade-modulos { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:8px; margin-top:6px; }
.linha-modulo { display:flex; align-items:center; gap:12px; padding:8px 10px;
                border:1px solid var(--line); border-radius:6px; font-size:13px; }
.linha-modulo .nome { flex:1; }
.linha-modulo label { display:flex; align-items:center; gap:5px; color:var(--dim); font-size:11.5px; }
.acoes { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; align-items:center; }
.aviso { color:var(--dim2); font-size:12px; margin-top:10px; }
.secao { margin-bottom:22px; }
.secao h3 { font-family:var(--serif); font-size:17px; margin:0 0 10px; }
.mini { font-size:12px; padding:4px 9px; }
textarea { width:100%; min-height:230px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
           font-size:12.5px; line-height:1.5; }
.moldura-visao { width:100%; height:60vh; border:1px solid var(--line); border-radius:8px; background:var(--panel); }
.duas-colunas { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
@media (max-width: 900px) { .duas-colunas { grid-template-columns:1fr; } }

/* ---- Lista de pessoas ---- */
.lista-pessoas { display:grid; gap:9px; }
.cartao-pessoa { display:flex; align-items:center; gap:13px; padding:12px 14px;
                 border:1px solid var(--line); border-radius:8px; background:var(--panel);
                 transition:border-color .15s ease; }
.cartao-pessoa:hover { border-color:var(--line2); }
.inicial { width:38px; height:38px; border-radius:50%; flex:none; display:grid; place-items:center;
           background:var(--hover-bg); font-family:var(--serif); font-size:15px; }
.cartao-pessoa .dados { flex:1; min-width:0; }
.cartao-pessoa .nome { font-size:14px; margin-bottom:2px; }
.cartao-pessoa .sub { color:var(--dim2); font-size:12px; overflow:hidden;
                      text-overflow:ellipsis; white-space:nowrap; }
.cartao-pessoa .selos { display:flex; gap:5px; flex:none; align-items:center; }
.cartao-pessoa .botoes { display:flex; gap:6px; flex:none; }
@media (max-width: 720px) {
  .cartao-pessoa { flex-wrap:wrap; }
  .cartao-pessoa .dados { flex-basis:calc(100% - 51px); }
  .cartao-pessoa .selos, .cartao-pessoa .botoes { flex-basis:auto; }
}
.selo { font-size:10px; padding:3px 9px; border-radius:20px; letter-spacing:.5px;
        text-transform:uppercase; border:1px solid var(--line2); color:var(--dim2); }
.selo.forte { border-color:var(--rust); color:var(--rust); background:rgba(var(--rust-rgb),.1); }
.recado { font-size:12.5px; padding:9px 12px; border-radius:6px; margin-top:12px;
          border:1px solid var(--line2); color:var(--dim); }
.linha-inline { display:flex; gap:6px; margin-top:6px; }
.cabeca-secao { display:flex; justify-content:space-between; align-items:baseline;
                gap:12px; margin-bottom:14px; }
.cabeca-secao h3 { margin:0; }

/* ---- Compras ---- */
.status { display:inline-block; font-size:10px; padding:3px 9px; border-radius:20px;
          letter-spacing:.5px; text-transform:uppercase; border:1px solid var(--line2); color:var(--dim2); }
.status.aguardando { border-color:var(--rust); color:var(--rust); background:rgba(var(--rust-rgb),.1); }
.status.aprovada   { border-color:var(--good-text); color:var(--good-text); background:rgba(var(--good-rgb),.12); }
.status.reprovada  { border-color:var(--warn-text); color:var(--warn-text); background:rgba(var(--warn-rgb),.12); }
.status.recebida   { opacity:.6; }
.urgente { color:var(--warn-text); font-size:11px; }
.progresso { display:flex; height:8px; border-radius:20px; overflow:hidden;
             background:var(--hover-bg); margin:10px 0 8px; }
.progresso span { display:block; height:100%; }
.progresso .feito     { background:var(--rust); }
.progresso .andamento { background:var(--rust); opacity:.38; }
.progresso .parado    { background:var(--line2); }
.legenda { display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--dim); }
.legenda i { display:inline-block; width:9px; height:9px; border-radius:50%;
             margin-right:6px; vertical-align:baseline; font-style:normal; }
.legenda .feito i     { background:var(--rust); }
.legenda .andamento i { background:var(--rust); opacity:.38; }
.legenda .parado i    { background:var(--line2); }
.cartao-sol { border:1px solid var(--line); border-radius:8px; background:var(--panel);
              padding:13px 15px; margin-bottom:9px; }
.cartao-sol .linha1 { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.cartao-sol .titulo { font-size:14px; flex:1; min-width:180px; }
.cartao-sol .meta { color:var(--dim2); font-size:12px; margin-top:4px; }
.cartao-sol .botoes { display:flex; gap:6px; }
.ficha { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px 20px; }
.ficha .item .rot { color:var(--dim2); font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; }
.ficha .item .val { font-size:13.5px; margin-top:3px; }
.passo { display:flex; gap:10px; align-items:flex-start; padding:8px 0;
         border-bottom:1px solid var(--line); font-size:13px; }
.passo:last-child { border-bottom:none; }
.passo .quando { color:var(--dim2); font-size:11.5px; flex:none; width:96px; }
.modal-fundo { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50;
               display:flex; align-items:flex-start; justify-content:center; padding:28px 16px; overflow:auto; }
.modal { background:var(--panel); border:1px solid var(--line2); border-radius:10px;
         width:100%; max-width:720px; padding:22px 24px; }
.modal h3 { font-family:var(--serif); margin:0 0 14px; font-size:19px; }
.modal textarea { min-height:110px; }

@media print {
  body * { visibility:hidden; }
  .area-impressao, .area-impressao * { visibility:visible; }
  .area-impressao { position:absolute; inset:0; padding:0; background:#fff; color:#000; }
  .area-impressao .nao-imprime { display:none; }
  .modal-fundo { position:static; background:none; padding:0; }
  .modal { border:none; max-width:100%; padding:0; }
}
</style>

  return `
    <div class="modal area-impressao" style="max-width:920px;padding:0;background:transparent;border:none;">
      <div class="doc">
        <div class="doc-topo">
          <div style="display:flex;align-items:center;gap:16px;">

                 style="background:#fff;border-radius:6px;padding:5px 8px;">
            <div>
              <h2>${titulo}</h2>
              <div class="sub">Grupo Gefoscal${subtitulo ? ' · ' + subtitulo : ''}</div>

        <div class="doc-corpo">${corpo}</div>
      </div>
      <div class="acoes nao-imprime" style="justify-content:center;">${acoes}</div>

}

const fmtNum = (n, d = 2) => (n ?? 0).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d })

function pintarIconeSkin () {
  const atual = document.documentElement.getAttribute('data-skin')
  const svg = ICONES_SKIN[atual] || ICONES_SKIN.sofisticado
  const nomes = { sofisticado: 'Sofisticado', plataforma: 'Plataforma', daylight: 'Daylight' }
  ;['skin-toggle-login', 'skin-toggle-app'].forEach(id => {
    const el = document.getElementById(id)
    if (!el) return
    el.innerHTML = svg
    el.title = 'Tema: ' + nomes[atual] + ' (clique pra trocar)'
  })
}
window.trocarSkin = s => {
  document.documentElement.setAttribute('data-skin', s)
  localStorage.setItem('gefoscal-skin', s)
  pintarIconeSkin()
}
function alternarSkin () {
  const atual = document.documentElement.getAttribute('data-skin')
  const prox = ORDEM_SKINS[(ORDEM_SKINS.indexOf(atual) + 1) % ORDEM_SKINS.length]
  trocarSkin(prox)
}
document.documentElement.setAttribute('data-skin',
  localStorage.getItem('gefoscal-skin') || SKIN_PADRAO)

// Login
// ---------------------------------------------------------------
$('#btn-entrar').onclick = entrar
$('#btn-link').onclick = entrarPorLink
$('#senha').onkeydown = e => { if (e.key === 'Enter') entrar() }

async function entrar () {
  const btn = $('#btn-entrar')
  btn.disabled = true; btn.textContent = 'Entrando...'
  $('#erro-login').textContent = ''
  const { error } = await db.auth.signInWithPassword({
    email: $('#email').value.trim().toLowerCase(),
    password: $('#senha').value
  })
  btn.disabled = false; btn.textContent = 'Entrar'
  if (error) { $('#erro-login').textContent = traduzErro(error.message); return }
  await abrirApp()
}

// Primeiro acesso: quem foi cadastrado ainda não tem senha.
async function entrarPorLink () {
  const email = $('#email').value.trim().toLowerCase()
  if (!email) { $('#erro-login').textContent = 'Escreva seu e-mail acima primeiro.'; return }
  const btn = $('#btn-link')
  btn.disabled = true; btn.textContent = 'Enviando...'
  const { error } = await db.auth.signInWithOtp({
    email, options: { emailRedirectTo: location.origin + location.pathname }
  })
  btn.disabled = false; btn.textContent = 'Receber link de acesso por e-mail'
  $('#erro-login').textContent = error
    ? traduzErro(error.message)
    : 'Link enviado. Abra o e-mail neste mesmo navegador.'
}

function traduzErro (m) {
  if (/invalid login/i.test(m)) return 'E-mail ou senha incorretos.'
  if (/email not confirmed/i.test(m)) return 'E-mail ainda não confirmado.'
  if (/rate limit/i.test(m)) return 'Muitos e-mails em pouco tempo. Espere alguns minutos.'
  if (/signups not allowed/i.test(m)) return 'Cadastro por e-mail desligado no painel do Supabase.'
  return m
}

window.sair = async () => { await db.auth.signOut(); location.reload() }

// Sessão, permissões e menu
// ---------------------------------------------------------------
const CHAVE_ADMIN = 'ti'          // módulo "Administração do sistema"
const PAPEIS_TOTAIS = ['ADMIN', 'DIRETORIA']   // enxergam tudo, por tem_modulo()

let PERFIL = {
  userId: '', email: '', nome: '',
  pessoaId: null, setorId: null,
  papeis: [], modulos: [], permissoes: []
}

async function abrirApp () {
  const { data: { user } } = await db.auth.getUser()
  if (!user) return
  PERFIL.userId = user.id
  PERFIL.email = user.email

  const [{ data: papeis }, { data: modulos }, { data: perfil }] = await Promise.all([
    db.from('usuario_papel').select('papel').eq('user_id', user.id),
    db.from('modulo').select('id,chave,nome,ordem').order('ordem'),
    db.from('usuario_perfil')
      .select('pessoa_id,setor_id,ativo,pessoa:pessoa_id(nome)')
      .eq('user_id', user.id).maybeSingle()
  ])

  PERFIL.papeis = (papeis || []).map(p => p.papel)
  PERFIL.modulos = modulos || []
  PERFIL.pessoaId = perfil?.pessoa_id ?? null
  PERFIL.setorId = perfil?.setor_id ?? null
  PERFIL.nome = perfil?.pessoa?.nome || user.email

  if (PERFIL.papeis.length === 0 || perfil?.ativo === false) {
    $('#erro-login').textContent =
      'Seu usuário entrou, mas ainda não tem acesso liberado. Fale com o administrador do sistema.'
    await db.auth.signOut()
    return
  }

  const { data: perms } = await db.from('modulo_permissao')
    .select('modulo_id,pessoa_id,setor_id,pode_editar')
  // administrador enxerga as permissões de todo mundo; aqui só interessam as minhas
  PERFIL.permissoes = (perms || []).filter(p =>
    (p.pessoa_id && p.pessoa_id === PERFIL.pessoaId) ||
    (p.setor_id && p.setor_id === PERFIL.setorId))

  $('#quem-sou').textContent = PERFIL.nome + ' · ' + PERFIL.papeis.join(', ')
  montarMenu()
  $('#tela-login').classList.add('oculto')
  $('#tela-app').classList.remove('oculto')
  irPara('visao_geral')
}

const ehTotal = () => PERFIL.papeis.some(p => PAPEIS_TOTAIS.includes(p))

function moduloPorChave (chave) { return PERFIL.modulos.find(m => m.chave === chave) }

// 'cobranca' é liberado por PAPEL, não por modulo_permissao: a tabela por trás
// (pedido) já tinha RLS por papel de outra frente de trabalho (vendas), e
// seguimos o mesmo mecanismo em vez de competir com um segundo sistema de
// permissão pra mesma tabela.
const MODULOS_POR_PAPEL = { cobranca: ['ADMIN', 'DIRETORIA', 'COMERCIAL', 'COBRANCA'] }

function podeVer (chave) {
  if (ehTotal()) return true
  if (MODULOS_POR_PAPEL[chave]) return PERFIL.papeis.some(p => MODULOS_POR_PAPEL[chave].includes(p))
  const m = moduloPorChave(chave)
  return !!m && PERFIL.permissoes.some(p => p.modulo_id === m.id)
}

// espelha tem_modulo(chave, true) do banco — o RLS é quem manda de verdade
function podeEditar (chave) {
  if (ehTotal()) return true
  if (MODULOS_POR_PAPEL[chave]) return PERFIL.papeis.some(p => MODULOS_POR_PAPEL[chave].includes(p))
  const m = moduloPorChave(chave)
  return !!m && PERFIL.permissoes.some(p => p.modulo_id === m.id && p.pode_editar)
}

const PAGINAS = {
  visao_geral: { nome: 'Visão geral', render: paginaVisaoGeral, sempre: true },
  expedicao:   { nome: 'Expedição', render: paginaExpedicao },
  compras:     { nome: 'Compras e Recebimento', render: paginaCompras },
  cobranca:    { nome: 'Crédito e Cobrança', render: paginaCobranca },
  financeiro:  { nome: 'Financeiro', render: paginaFinanceiro },
  projetos:    { nome: 'Projetos', render: paginaProjetos },
  ferramentas: { nome: 'Ferramentas', render: paginaFerramentas },
  estoque:     { nome: 'Estoque e Produção', render: paginaEstoque },
  combustivel: { nome: 'Combustível', render: paginaCombustivel },
  manutencao:  { nome: 'Manutenção', render: paginaManutencao },
  ti:          { nome: 'Administração', render: paginaAdministracao }
}

function montarMenu () {
  const fixos = `<a data-chave="visao_geral">Visão geral</a>`
  const doBanco = PERFIL.modulos.map(m => {
    const temPagina = !!PAGINAS[m.chave]
    const liberado = podeVer(m.chave)
    if (!liberado) return ''
    return `<a data-chave="${m.chave}" class="${temPagina ? '' : 'bloqueado'}">${esc(m.nome)}</a>`
  }).join('')
  $('#menu').innerHTML = fixos + doBanco
  $('#menu').querySelectorAll('a').forEach(a => {
    if (!a.classList.contains('bloqueado')) a.onclick = () => irPara(a.dataset.chave)
  })
}

function irPara (chave) {
  const p = PAGINAS[chave]
  if (!p) return
  $('#menu').querySelectorAll('a').forEach(a => a.classList.toggle('ativo', a.dataset.chave === chave))
  $('#titulo-pagina').textContent = p.nome
  $('#subtitulo-pagina').textContent = ''
  $('#kpis').innerHTML = ''; $('#filtros').innerHTML = ''
  $('#cabecalho').innerHTML = ''; $('#corpo').innerHTML = ''
  $('#area-livre').innerHTML = ''; $('#area-livre').classList.add('oculto')
  $('#painel-tabela').classList.remove('oculto')
  $('#rodape').textContent = ''
  p.render()
}

// telas que não usam a tabela padrão
function areaLivre () {
  $('#painel-tabela').classList.add('oculto')
  $('#area-livre').classList.remove('oculto')
  return $('#area-livre')
}

function kpi (rotulo, valor, nota = '') {
  return `<div class="card kpi"><div class="rotulo">${esc(rotulo)}</div>
    <div class="valor">${valor}</div><div class="nota">${esc(nota)}</div></div>`
}

// avisa quando a migração ainda não rodou, em vez de quebrar calado
function faltaMigracao (erro) {
  return erro && /does not exist|schema cache/i.test(erro.message || '')
}

// ---------------------------------------------------------------
// Página: Visão geral (tela inicial)
// ---------------------------------------------------------------
async function paginaVisaoGeral () {
  $('#subtitulo-pagina').textContent = 'O painel montado para você'
  const area = areaLivre()

  if (!PERFIL.pessoaId) {
    area.innerHTML = `<div class="panel" style="padding:22px;">
      <p class="texto-dim">Seu login ainda não está ligado a uma pessoa do cadastro,
      então não há painel para montar. O administrador resolve isso em
      Administração → Usuários.</p></div>`
    return
  }

  // avisos não lidos primeiro
  const { data: avisos } = await db.from('aviso')
    .select('id,titulo,texto,criado_em').is('lido_em', null)
    .eq('pessoa_id', PERFIL.pessoaId).order('criado_em', { ascending: false })

  if (avisos?.length) {
    const bloco = document.createElement('div')
    bloco.className = 'panel'
    bloco.style.cssText = 'padding:18px;margin-bottom:16px;'
    bloco.innerHTML = `
      <div class="cabeca-secao">
        <h3 style="font-family:var(--serif);font-size:17px;">
          ${avisos.length} aviso${avisos.length > 1 ? 's' : ''}</h3>
        <button class="btn-secundario mini" id="av-limpar">marcar como lidos</button>
      </div>
      ${avisos.map(a => `<div class="passo">
        <span class="quando">${fmtQuando(a.criado_em) ?? '—'}</span>
        <span><b>${esc(a.titulo)}</b>${a.texto ? '<br>' + esc(a.texto) : ''}</span>
      </div>`).join('')}`
    area.appendChild(bloco)
    bloco.querySelector('#av-limpar').onclick = async () => {
      await db.from('aviso').update({ lido_em: new Date().toISOString() })
        .in('id', avisos.map(a => a.id))
      irPara('visao_geral')
    }
  }

  // painel do financeiro, para quem trabalha nele
  await minhasCompras(area)
  await areaDeTrabalho(area)

  if (podeVer('financeiro')) await painelFinanceiro(area)

  const { data, error } = await db.from('visao_geral_pessoa')
    .select('html_conteudo,atualizado_em').eq('pessoa_id', PERFIL.pessoaId).maybeSingle()

  if (faltaMigracao(error)) {
    area.insertAdjacentHTML('beforeend', `<div class="panel" style="padding:22px;">
      <p class="texto-dim">A tabela <code>visao_geral_pessoa</code> ainda não existe no banco.
      Rode a migração no SQL Editor do Supabase para ligar esta tela.</p></div>`)
    return
  }

  if (!data?.html_conteudo) {
    area.insertAdjacentHTML('beforeend', `<div class="panel" style="padding:22px;">
      <h3 style="font-family:var(--serif);margin-top:0;">Olá, ${esc(PERFIL.nome.split(' ')[0])}</h3>
      <p class="texto-dim">Ainda não há um painel montado para você. Use o menu ao lado
      para abrir os módulos liberados${podeEditar(CHAVE_ADMIN)
        ? ', ou monte um painel em Administração → Visão geral.' : '.'}</p></div>`)
    return
  }

  // conteúdo montado por administrador: isolado em iframe para não injetar script na página
  const quadro = document.createElement('iframe')
  quadro.className = 'moldura-visao'
  quadro.setAttribute('sandbox', '')
  quadro.srcdoc = data.html_conteudo
  area.appendChild(quadro)
  $('#rodape').textContent = 'Atualizado em ' + (fmtQuando(data.atualizado_em) || '—')
}

// ---------------------------------------------------------------
// Página: Administração  (módulo 'ti')
// ---------------------------------------------------------------
async function paginaAdministracao () {
  if (!podeVer(CHAVE_ADMIN)) { areaLivre().innerHTML =
    `<div class="panel" style="padding:22px;"><p class="texto-dim">
     Você não tem acesso à Administração.</p></div>`; return }

  const editavel = podeEditar(CHAVE_ADMIN)
  $('#subtitulo-pagina').textContent = editavel
    ? 'Usuários, cadastros de apoio e painéis'
    : 'Somente leitura — você pode consultar, mas não alterar'

  const area = areaLivre()
  area.innerHTML = `
    <div class="subabas">
      <button data-sub="usuarios" class="ativo">Usuários</button>
      <button data-sub="apoio">Cargos e setores</button>
      <button data-sub="visao">Visão geral</button>
    </div>
    <div id="sub-conteudo"></div>`

  area.querySelectorAll('.subabas button').forEach(b => {
    b.onclick = () => {
      area.querySelectorAll('.subabas button').forEach(x => x.classList.toggle('ativo', x === b))
      abrirSub(b.dataset.sub, editavel)
    }
  })
  abrirSub('usuarios', editavel)
}

function abrirSub (sub, editavel) {
  const alvo = $('#sub-conteudo')
  alvo.innerHTML = `<p class="texto-dim2">carregando...</p>`
  if (sub === 'usuarios') subUsuarios(alvo, editavel)
  if (sub === 'apoio') subApoio(alvo, editavel)
  if (sub === 'visao') subVisao(alvo, editavel)
}

// ----- Administração › Usuários -----
async function subUsuarios (alvo, editavel) {
  const [{ data: pessoas }, { data: cargos, error: erroCargo },
         { data: setores }, { data: pre }, { data: perms }] = await Promise.all([
    db.from('pessoa').select('id,nome,email,cargo_id,setor_id,status').order('nome'),
    db.from('cargo').select('id,nome').order('nome'),
    db.from('setor').select('id,nome').order('nome'),
    db.from('usuario_precadastro').select('email,papeis,pessoa_id,usado_em,convite_enviado_em'),
    db.from('modulo_permissao').select('modulo_id,pessoa_id,pode_editar')
  ])

  if (faltaMigracao(erroCargo)) {
    alvo.innerHTML = `<div class="panel" style="padding:22px;"><p class="texto-dim">
      A tabela <code>cargo</code> ainda não existe. Rode a migração no SQL Editor
      do Supabase antes de usar esta tela.</p></div>`
    return
  }

  const preDe = e => (pre || []).find(p => p.email === (e || '').toLowerCase())
  const nivelDe = p => (p?.papeis || []).includes('ADMIN') ? 'Administrador' : 'Usuário'

  alvo.innerHTML = `
    <div class="secao panel" style="padding:20px;">
      <div class="cabeca-secao">
        <h3>${editavel ? 'Cadastrar ou atualizar pessoa' : 'Consultar pessoa'}</h3>
        <span class="texto-dim2" style="font-size:12px;">o e-mail é o que liga a pessoa ao login</span>
      </div>
      <div class="form-grade">
        <div class="campo"><label>Nome</label><input id="u-nome" ${editavel ? '' : 'disabled'}></div>
        <div class="campo"><label>E-mail</label><input id="u-email" type="email" ${editavel ? '' : 'disabled'}></div>
        <div class="campo"><label>Cargo</label>
          <div style="display:flex;gap:6px;">
            <select id="u-cargo" style="flex:1;" ${editavel ? '' : 'disabled'}></select>
            ${editavel ? '<button class="btn-secundario mini" id="u-novo-cargo" title="novo cargo">+</button>' : ''}
          </div>
          <div class="linha-inline oculto" id="linha-cargo">
            <input id="nome-cargo" placeholder="nome do cargo" style="flex:1;">
            <button class="btn mini" id="criar-cargo">criar</button>
          </div>
        </div>
        <div class="campo"><label>Setor</label>
          <div style="display:flex;gap:6px;">
            <select id="u-setor" style="flex:1;" ${editavel ? '' : 'disabled'}></select>
            ${editavel ? '<button class="btn-secundario mini" id="u-novo-setor" title="novo setor">+</button>' : ''}
          </div>
          <div class="linha-inline oculto" id="linha-setor">
            <input id="nome-setor" placeholder="nome do setor" style="flex:1;">
            <button class="btn mini" id="criar-setor">criar</button>
          </div>
        </div>
        <div class="campo"><label>Nível de acesso</label>
          <select id="u-nivel" ${editavel ? '' : 'disabled'}>
            <option value="usuario">Usuário — só consulta</option>
            <option value="administrador">Administrador — consulta e altera</option>
          </select></div>
        ${editavel ? `<div class="campo"><label>Senha de acesso</label>
          <input id="u-senha" type="text" autocomplete="off" placeholder="mínimo 8 caracteres">
          <span class="texto-dim2" style="font-size:11px;">deixe vazio para não mexer na senha</span>
        </div>` : ''}
      </div>

      <div class="secao" style="margin-top:18px;">
        <label class="texto-dim2" style="font-size:11px;text-transform:uppercase;letter-spacing:.4px;">
          Abas que esta pessoa enxerga</label>
        <div class="grade-modulos" id="u-modulos"></div>
      </div>

      ${editavel ? `<div class="acoes">
        <button class="btn" id="u-salvar">Salvar cadastro</button>
        <button class="btn-secundario" id="u-limpar">Limpar</button>
      </div>
      <div class="recado oculto" id="u-recado"></div>` : ''}
      <p class="aviso">O nível de acesso e as abas são independentes: dá para liberar
      todas as abas para alguém que só consulta.</p>
    </div>

    <div class="cabeca-secao">
      <h3 style="font-family:var(--serif);font-size:17px;">Pessoas cadastradas</h3>
      <span class="texto-dim2" style="font-size:12px;">${(pessoas || []).length} no total</span>
    </div>
    <div class="lista-pessoas" id="u-lista"></div>`

  // selects de apoio
  const encher = (sel, itens) => {
    sel.innerHTML = '<option value="">—</option>' +
      itens.map(i => `<option value="${i.id}">${esc(i.nome)}</option>`).join('')
  }
  encher($('#u-cargo'), cargos || [])
  encher($('#u-setor'), setores || [])

  // checkboxes de módulo
  $('#u-modulos').innerHTML = PERFIL.modulos.map(m => `
    <div class="linha-modulo">
      <span class="nome">${esc(m.nome)}</span>
      <label><input type="checkbox" data-ver="${m.id}" ${editavel ? '' : 'disabled'}> ver</label>
      <label><input type="checkbox" data-editar="${m.id}" ${editavel ? '' : 'disabled'}> editar</label>
    </div>`).join('')

  // "editar" implica "ver"
  $('#u-modulos').querySelectorAll('[data-editar]').forEach(c => {
    c.onchange = () => { if (c.checked) $(`#u-modulos [data-ver="${c.dataset.editar}"]`).checked = true }
  })

  const recado = (texto, alerta = false) => {
    const el = $('#u-recado'); if (!el) return
    el.textContent = texto
    el.classList.remove('oculto')
    el.style.borderColor = alerta ? 'var(--warn-text)' : 'var(--line2)'
    el.style.color = alerta ? 'var(--warn-text)' : 'var(--dim)'
  }

  // lista em cartões
  const iniciais = n => n.split(' ').filter(Boolean).slice(0, 2).map(x => x[0]).join('').toUpperCase()

  $('#u-lista').innerHTML = (pessoas || []).map(p => {
    const pc = preDe(p.email)
    const n = (perms || []).filter(x => x.pessoa_id === p.id).length
    const estado = !pc ? 'sem cadastro de acesso'
      : pc.usado_em ? 'último acesso em ' + fmtQuando(pc.usado_em)
      : 'cadastrado, aguardando primeiro acesso'
    return `<div class="cartao-pessoa">
      <div class="inicial">${esc(iniciais(p.nome))}</div>
      <div class="dados">
        <div class="nome">${esc(p.nome)}</div>
        <div class="sub">${esc(p.email || 'sem e-mail')} · ${esc(estado)}${n ? ` · ${n} aba${n > 1 ? 's' : ''}` : ''}</div>
      </div>
      <div class="selos">
        ${pc ? `<span class="selo ${nivelDe(pc) === 'Administrador' ? 'forte' : ''}">${nivelDe(pc)}</span>` : ''}
      </div>
      <div class="botoes">
        <button class="btn-secundario mini" data-abrir="${p.id}">abrir</button>
        ${editavel && pc ? `<button class="btn-secundario mini" data-senha="${esc(p.email)}">senha</button>` : ''}
      </div>
    </div>`
  }).join('') || `<p class="vazio">Nenhuma pessoa cadastrada ainda.</p>`

  // abrir uma pessoa no formulário
  $('#u-lista').querySelectorAll('[data-abrir]').forEach(b => {
    b.onclick = () => {
      const p = pessoas.find(x => x.id === b.dataset.abrir)
      const pc = preDe(p.email)
      $('#u-nome').value = p.nome || ''
      $('#u-email').value = p.email || ''
      $('#u-cargo').value = p.cargo_id || ''
      $('#u-setor').value = p.setor_id || ''
      $('#u-nivel').value = (pc?.papeis || []).includes('ADMIN') ? 'administrador' : 'usuario'
      const meus = (perms || []).filter(x => x.pessoa_id === p.id)
      $('#u-modulos').querySelectorAll('[data-ver]').forEach(c => {
        const r = meus.find(x => x.modulo_id === c.dataset.ver)
        c.checked = !!r
        $(`#u-modulos [data-editar="${c.dataset.ver}"]`).checked = !!r?.pode_editar
      })
      window.scrollTo({ top: 0, behavior: 'smooth' })
    }
  })

  if (!editavel) return

  // definir senha direto na lista, sem passar pelo formulário inteiro
  $('#u-lista').querySelectorAll('[data-senha]').forEach(b => {
    b.onclick = async () => {
      const email = b.dataset.senha
      const nova = window.prompt(`Senha de acesso para ${email}\n(mínimo 8 caracteres)`)
      if (nova === null) return
      if (nova.trim().length < 8) { recado('A senha precisa de pelo menos 8 caracteres.', true); return }
      b.disabled = true; const antes = b.textContent; b.textContent = 'salvando...'
      const { data: r, error } = await db.functions.invoke('criar-usuario', {
        body: { email, senha: nova.trim() }
      })
      b.disabled = false; b.textContent = antes
      if (error || r?.erro) { recado('Não deu certo: ' + (r?.erro || error.message), true); return }
      recado(r.acao === 'usuario_criado'
        ? `${email} já pode entrar com essa senha.`
        : `Senha de ${email} atualizada.`)
      setTimeout(() => abrirSub('usuarios', true), 1200)
    }
  })

  // + cargo / + setor, sem prompt do navegador
  const criador = (btnAbrir, linha, campo, tabela, select) => {
    $(btnAbrir).onclick = () => {
      $(linha).classList.toggle('oculto')
      if (!$(linha).classList.contains('oculto')) $(campo).focus()
    }
    $(campo).onkeydown = e => { if (e.key === 'Enter') criar() }
    $('#criar-' + tabela).onclick = criar
    async function criar () {
      const nome = $(campo).value.trim(); if (!nome) return
      const { data, error } = await db.from(tabela).insert({ nome }).select('id,nome').single()
      if (error) { recado('Não deu para criar: ' + error.message, true); return }
      $(select).add(new Option(data.nome, data.id))
      $(select).value = data.id
      $(campo).value = ''
      $(linha).classList.add('oculto')
      recado(`${tabela === 'cargo' ? 'Cargo' : 'Setor'} "${data.nome}" criado.`)
    }
  }
  criador('#u-novo-cargo', '#linha-cargo', '#nome-cargo', 'cargo', '#u-cargo')
  criador('#u-novo-setor', '#linha-setor', '#nome-setor', 'setor', '#u-setor')

  $('#u-limpar').onclick = () => {
    ;['u-nome','u-email','u-cargo','u-setor','u-senha'].forEach(i => {
      const el = $('#' + i); if (el) el.value = ''
    })
    $('#u-nivel').value = 'usuario'
    $('#u-modulos').querySelectorAll('input').forEach(c => c.checked = false)
    $('#u-recado').classList.add('oculto')
  }

  $('#u-salvar').onclick = async () => {
    const nome = $('#u-nome').value.trim()
    const email = $('#u-email').value.trim().toLowerCase()
    if (!nome) { recado('Escreva o nome.', true); return }
    if (!email) { recado('Escreva o e-mail — é ele que liga a pessoa ao login.', true); return }

    const btn = $('#u-salvar'); btn.disabled = true; btn.textContent = 'Salvando...'

    const { data: pessoa, error: e1 } = await db.from('pessoa').upsert({
      nome, email,
      cargo_id: $('#u-cargo').value || null,
      setor_id: $('#u-setor').value || null
    }, { onConflict: 'email' }).select('id,setor_id').single()

    if (e1) { recado(e1.message, true); btn.disabled = false; btn.textContent = 'Salvar cadastro'; return }

    const papeis = $('#u-nivel').value === 'administrador' ? ['ADMIN', 'DIRETORIA'] : ['LEITOR']
    const { error: e2 } = await db.from('usuario_precadastro').upsert({
      email, papeis, pessoa_id: pessoa.id, setor_id: pessoa.setor_id
    }, { onConflict: 'email' })
    if (e2) { recado(e2.message, true); btn.disabled = false; btn.textContent = 'Salvar cadastro'; return }

    // permissões: apaga as antigas e grava as marcadas
    const marcadas = [...$('#u-modulos').querySelectorAll('[data-ver]:checked')].map(c => ({
      modulo_id: c.dataset.ver,
      pessoa_id: pessoa.id,
      pode_editar: $(`#u-modulos [data-editar="${c.dataset.ver}"]`).checked
    }))
    await db.from('modulo_permissao').delete().eq('pessoa_id', pessoa.id)
    if (marcadas.length) await db.from('modulo_permissao').insert(marcadas)

    // senha: cria o login de verdade, sem depender de e-mail
    const senha = $('#u-senha')?.value.trim()
    if (senha) {
      if (senha.length < 8) {
        btn.disabled = false; btn.textContent = 'Salvar cadastro'
        recado('Cadastro salvo, mas a senha precisa de pelo menos 8 caracteres.', true)
        abrirSub('usuarios', true)
        return
      }
      const { data: r, error: e3 } = await db.functions.invoke('criar-usuario', {
        body: { email, senha }
      })
      btn.disabled = false; btn.textContent = 'Salvar cadastro'
      if (e3 || r?.erro) {
        recado('Cadastro salvo, mas a senha não foi definida: ' + (r?.erro || e3.message), true)
      } else {
        recado(r.acao === 'usuario_criado'
          ? `Pronto. ${email} já pode entrar com essa senha.`
          : `Senha de ${email} atualizada.`)
      }
    } else {
      btn.disabled = false; btn.textContent = 'Salvar cadastro'
      recado('Cadastro salvo. Sem senha definida, essa pessoa ainda não consegue entrar.')
    }

    setTimeout(() => abrirSub('usuarios', true), 1200)
  }
}

// ----- Administração › Cargos e setores -----
async function subApoio (alvo, editavel) {
  const [{ data: cargos, error: erroCargo }, { data: setores }] = await Promise.all([
    db.from('cargo').select('id,nome').order('nome'),
    db.from('setor').select('id,nome').order('nome')
  ])

  if (faltaMigracao(erroCargo)) {
    alvo.innerHTML = `<div class="panel" style="padding:22px;"><p class="texto-dim">
      A tabela <code>cargo</code> ainda não existe. Rode a migração no Supabase.</p></div>`
    return
  }

  const bloco = (titulo, tabela, itens) => `
    <div class="panel" style="padding:18px;">
      <h3>${titulo}</h3>
      ${editavel ? `<div style="display:flex;gap:6px;margin-bottom:12px;">
        <input id="novo-${tabela}" placeholder="nome" style="flex:1;">
        <button class="btn" data-add="${tabela}">Adicionar</button></div>` : ''}
      <table><tbody>${(itens || []).map(i => `<tr>
        <td>${esc(i.nome)}</td>
        <td style="text-align:right;">${editavel
          ? `<button class="btn-secundario mini" data-del="${tabela}" data-id="${i.id}">remover</button>` : ''}</td>
      </tr>`).join('') || `<tr><td class="vazio">Nada cadastrado ainda.</td></tr>`}</tbody></table>
    </div>`

  alvo.innerHTML = `<div class="duas-colunas">
    ${bloco('Cargos', 'cargo', cargos)}
    ${bloco('Setores', 'setor', setores)}
  </div>`

  if (!editavel) return

  alvo.querySelectorAll('[data-add]').forEach(b => {
    b.onclick = async () => {
      const t = b.dataset.add
      const nome = $('#novo-' + t).value.trim(); if (!nome) return
      const { error } = await db.from(t).insert({ nome })
      if (error) { alert(error.message); return }
      abrirSub('apoio', true)
    }
  })
  alvo.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = async () => {
      if (!confirm('Remover?')) return
      const { error } = await db.from(b.dataset.del).delete().eq('id', b.dataset.id)
      if (error) { alert('Não deu para remover — provavelmente há gente usando este registro.'); return }
      abrirSub('apoio', true)
    }
  })
}

// ---------------------------------------------------------------
// Agenda e bloco de notas — área de trabalho pessoal
// Cada pessoa só enxerga as próprias notas e tarefas: a RLS filtra
// pelo pessoa_id do perfil, não pelo que o navegador manda.
// ---------------------------------------------------------------
async function areaDeTrabalho (area) {
  const hoje = new Date().toISOString().slice(0, 10)

  const [{ data: tarefas }, { data: notas }] = await Promise.all([
    db.from('tarefa').select('*').order('concluida_em', { nullsFirst: true })
      .order('prazo', { nullsFirst: false }).limit(60),
    db.from('nota_pessoal').select('*')
      .order('fixada', { ascending: false }).order('atualizado_em', { ascending: false })
  ])

  const abertas = (tarefas || []).filter(t => !t.concluida_em)
  const feitas = (tarefas || []).filter(t => t.concluida_em)
  const feitasHoje = feitas.filter(t => t.concluida_em.slice(0, 10) === hoje)
  const atrasadas = abertas.filter(t => t.prazo && t.prazo < hoje)

  const bloco = document.createElement('div')
  bloco.className = 'grade-trabalho'
  bloco.innerHTML = `
    <div class="panel" style="padding:18px;">
      <div class="cabeca-secao">
        <h3 style="font-family:var(--serif);font-size:17px;">Minha agenda</h3>
        <span class="texto-dim2" style="font-size:12px;">
          ${abertas.length} aberta(s)${atrasadas.length ? ` · ${atrasadas.length} atrasada(s)` : ''}
          ${feitasHoje.length ? ` · ${feitasHoje.length} concluída(s) hoje` : ''}</span>
      </div>

      <div class="linha-add">
        <input id="tf-nova" placeholder="O que precisa ser feito?">
        <input type="date" id="tf-prazo" style="flex:none;width:145px;">
        <button class="btn mini" id="tf-add">Adicionar</button>
      </div>

      <div id="tf-lista"></div>

      ${feitas.length ? `<div style="margin-top:14px;">
        <button class="btn-secundario mini" id="tf-ver-feitas">
          ver ${feitas.length} concluída(s)</button>
        <div id="tf-feitas" class="oculto" style="margin-top:8px;"></div>
      </div>` : ''}
    </div>

    <div class="panel" style="padding:18px;">
      <div class="cabeca-secao">
        <h3 style="font-family:var(--serif);font-size:17px;">Bloco de notas</h3>
        <button class="btn-secundario mini" id="nt-nova">+ nota</button>
      </div>
      <div id="nt-lista"></div>
      <p class="aviso">Só você enxerga estas notas. Ainda assim, evite guardar aqui
      senha de banco ou de sistema crítico — para isso o certo é um cofre de senhas.</p>
    </div>`

  area.appendChild(bloco)

  // ---- tarefas ----
  const marcaPrazo = t => {
    if (!t.prazo) return ''
    const classe = t.prazo < hoje ? 'atrasada' : t.prazo === hoje ? 'hoje' : ''
    const texto = t.prazo === hoje ? 'hoje' : fmtData(t.prazo)
    return `<span class="prazo ${classe}">${texto}</span>`
  }

  const linhaTarefa = t => `
    <div class="tarefa ${t.concluida_em ? 'feita' : ''}">
      <input type="checkbox" data-check="${t.id}" ${t.concluida_em ? 'checked' : ''}>
      <div class="txt">${esc(t.titulo)}
        ${t.detalhe ? `<small>${esc(t.detalhe)}</small>` : ''}
        ${t.concluida_em ? `<small>concluída em ${fmtQuando(t.concluida_em)}</small>` : ''}
      </div>
      ${t.concluida_em ? '' : marcaPrazo(t)}
      <button class="apagar" data-apagar="${t.id}" title="apagar">×</button>
    </div>`

  $('#tf-lista').innerHTML = abertas.map(linhaTarefa).join('') ||
    `<p class="texto-dim2" style="font-size:13px;padding:10px 0;">
      Nada pendente. Escreva acima o que precisa fazer.</p>`

  if (feitas.length) {
    $('#tf-feitas').innerHTML = feitas.map(linhaTarefa).join('')
    $('#tf-ver-feitas').onclick = () => {
      const el = $('#tf-feitas')
      el.classList.toggle('oculto')
      $('#tf-ver-feitas').textContent = el.classList.contains('oculto')
        ? `ver ${feitas.length} concluída(s)` : 'esconder concluídas'
    }
  }

  const recarregar = () => irPara('visao_geral')

  bloco.querySelectorAll('[data-check]').forEach(c => {
    c.onchange = async () => {
      await db.from('tarefa').update({
        concluida_em: c.checked ? new Date().toISOString() : null
      }).eq('id', c.dataset.check)
      recarregar()
    }
  })
  bloco.querySelectorAll('[data-apagar]').forEach(b => {
    b.onclick = async () => {
      await db.from('tarefa').delete().eq('id', b.dataset.apagar)
      recarregar()
    }
  })

  const adicionar = async () => {
    const titulo = $('#tf-nova').value.trim()
    if (!titulo) return
    await db.from('tarefa').insert({
      pessoa_id: PERFIL.pessoaId, titulo,
      prazo: $('#tf-prazo').value || null
    })
    recarregar()
  }
  $('#tf-add').onclick = adicionar
  $('#tf-nova').onkeydown = e => { if (e.key === 'Enter') adicionar() }

  // ---- notas ----
  $('#nt-lista').innerHTML = (notas || []).map(n => `
    <div class="nota ${n.fixada ? 'fixa' : ''}" data-nota="${n.id}">
      <div class="tit">${esc(n.titulo)}
        ${n.categoria && n.categoria !== 'geral'
          ? `<span class="marca">${esc(n.categoria)}</span>` : ''}</div>
      <div class="prev ${n.categoria === 'senha' ? 'oculto-senha' : ''}">${esc(n.conteudo ?? '')}</div>
    </div>`).join('') ||
    `<p class="texto-dim2" style="font-size:13px;padding:10px 0;">
      Nenhuma nota ainda. Use para guardar procedimentos, contatos e lembretes.</p>`

  bloco.querySelectorAll('[data-nota]').forEach(el => {
    el.onclick = () => formNota((notas || []).find(n => n.id === el.dataset.nota))
  })
  $('#nt-nova').onclick = () => formNota(null)
}

function formNota (n) {
  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = `
    <div class="modal">
      <h3>${n ? 'Editar nota' : 'Nova nota'}</h3>
      <div class="form-grade">
        <div class="campo" style="grid-column:1/-1;"><label>Título *</label>
          <input id="nota-titulo" value="${esc(n?.titulo ?? '')}"></div>
        <div class="campo"><label>Categoria</label>
          <select id="nota-cat">
            ${['geral','senha','procedimento','contato','lembrete'].map(c =>
              `<option ${n?.categoria === c ? 'selected' : ''}>${c}</option>`).join('')}
          </select></div>
        <div class="campo"><label>Destaque</label>
          <select id="nota-fixa">
            <option value="nao" ${!n?.fixada ? 'selected' : ''}>normal</option>
            <option value="sim" ${n?.fixada ? 'selected' : ''}>fixar no topo</option>
          </select></div>
      </div>
      <div class="campo" style="margin-top:12px;"><label>Conteúdo</label>
        <textarea id="nota-conteudo" style="min-height:180px;">${esc(n?.conteudo ?? '')}</textarea></div>
      <div class="acoes">
        <button class="btn" id="nota-salvar">Salvar</button>
        ${n ? '<button class="btn-secundario" id="nota-excluir">Excluir</button>' : ''}
        <button class="btn-secundario" id="nota-cancelar">Cancelar</button>
      </div>
      <div class="recado oculto" id="nota-recado"></div>
      <p class="aviso">Categoria "senha" deixa o texto borrado na lista — só aparece
      ao passar o mouse. É proteção contra olhar por cima do ombro, não criptografia.</p>
    </div>`

  document.body.appendChild(fundo)
  const q = id => fundo.querySelector(id)
  const fechar = () => fundo.remove()
  q('#nota-cancelar').onclick = fechar
  fundo.onclick = e => { if (e.target === fundo) fechar() }

  q('#nota-salvar').onclick = async () => {
    const titulo = q('#nota-titulo').value.trim()
    if (!titulo) {
      const el = q('#nota-recado'); el.textContent = 'Escreva o título.'
      el.classList.remove('oculto'); el.style.color = 'var(--warn-text)'
      el.style.borderColor = 'var(--warn-text)'; return
    }
    const corpo = {
      pessoa_id: PERFIL.pessoaId, titulo,
      conteudo: q('#nota-conteudo').value,
      categoria: q('#nota-cat').value,
      fixada: q('#nota-fixa').value === 'sim',
      atualizado_em: new Date().toISOString()
    }
    const { error } = n
      ? await db.from('nota_pessoal').update(corpo).eq('id', n.id)
      : await db.from('nota_pessoal').insert(corpo)
    if (error) {
      const el = q('#nota-recado'); el.textContent = error.message
      el.classList.remove('oculto'); el.style.color = 'var(--warn-text)'
      el.style.borderColor = 'var(--warn-text)'; return
    }
    fechar(); irPara('visao_geral')
  }

  const bx = q('#nota-excluir')
  if (bx) bx.onclick = async () => {
    if (!confirm('Excluir esta nota?')) return
    await db.from('nota_pessoal').delete().eq('id', n.id)
    fechar(); irPara('visao_geral')
  }
}

// mês corrente dentro da série de compras
function mesAtual (serie) {
  const hoje = new Date().toISOString().slice(0, 7)
  return (serie || []).find(x => x.competencia === hoje)
}

// barras horizontais simples: proporção ao maior mês da série
function barrasMes (serie) {
  const lista = (serie || []).slice().sort((a, b) => a.competencia.localeCompare(b.competencia))
  const maior = Math.max(...lista.map(x => Number(x.valor)), 1)
  const nomeMes = c => {
    const [a, m] = c.split('-')
    return ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+m - 1]
      + '/' + a.slice(2)
  }
  return lista.map(x => `
    <div class="row" style="display:grid;grid-template-columns:64px 1fr auto;
         gap:12px;align-items:center;padding:5px 0;">
      <span class="texto-dim2" style="font-size:12px;">${nomeMes(x.competencia)}</span>
      <span style="background:var(--hover-bg);border-radius:20px;height:9px;display:block;">
        <i style="display:block;height:100%;border-radius:20px;background:var(--rust);
           width:${(Number(x.valor) / maior * 100).toFixed(1)}%;"></i></span>
      <span style="font-size:12.5px;font-variant-numeric:tabular-nums;">
        R$ ${fmtNum(x.valor)} <span class="texto-dim2">· ${x.quantidade}</span></span>
    </div>`).join('')
}

// ----- Minhas solicitações de compra, no painel pessoal -----
// Cada um acompanha o que pediu, e vê o motivo de cada decisão.
async function minhasCompras (area) {
  if (!PERFIL.pessoaId || !podeVer('compras')) return

  const { data } = await db.from('solicitacao_compra')
    .select(`id,numero,produto_servico,status,data_solicitacao,valor_estimado,valor_aprovado,
             parecer_aprovacao,parecer_coordenacao,parecer_cotacao,motivo_cancelamento,decidido_em,
             setor:setor_id(nome)`)
    .eq('solicitante_id', PERFIL.pessoaId)
    .order('data_solicitacao', { ascending: false }).limit(40)

  if (!data?.length) return

  const andando = data.filter(s => !ENCERRADOS.includes(s.status))
  const decididas = data.filter(s => ENCERRADOS.includes(s.status))
  const recentes = decididas.filter(s =>
    new Date(s.decidido_em ?? s.data_solicitacao) > new Date(Date.now() - 30 * 864e5))

  const motivo = s =>
    ['REPROVADA', 'CANCELADA'].includes(s.status)
      ? (s.motivo_cancelamento || s.parecer_aprovacao || 'sem motivo registrado')
      : (s.parecer_aprovacao || s.parecer_cotacao || s.parecer_coordenacao || '')

  const linha = s => `
    <div class="passo">
      <span class="quando">${fmtQuando(s.decidido_em ?? s.data_solicitacao) ?? '—'}</span>
      <span>
        <b>${esc(s.produto_servico ?? '')}</b> ${selo(s.status)}
        <br><span class="texto-dim2" style="font-size:11.5px;">
          ${esc(s.numero ?? '')}
          ${s.valor_aprovado ? '· aprovado R$ ' + fmtNum(s.valor_aprovado)
            : s.valor_estimado ? '· estimado R$ ' + fmtNum(s.valor_estimado) : ''}
        </span>
        ${motivo(s) ? `<br><span style="font-size:12.5px;">${esc(motivo(s))}</span>` : ''}
      </span>
    </div>`

  const bloco = document.createElement('div')
  bloco.className = 'panel'
  bloco.style.cssText = 'padding:18px;margin-bottom:18px;'
  bloco.innerHTML = `
    <div class="cabeca-secao">
      <h3 style="font-family:var(--serif);font-size:17px;">Minhas compras</h3>
      <span class="texto-dim2" style="font-size:12px;">
        ${andando.length ? `${andando.length} em andamento` : 'nada em andamento'}</span>
    </div>
    ${andando.length ? andando.map(linha).join('')
      : '<p class="texto-dim2" style="font-size:13px;">Nenhuma solicitação sua em andamento.</p>'}
    ${recentes.length ? `
      <div class="rot texto-dim2" style="font-size:10.5px;text-transform:uppercase;
           letter-spacing:.4px;margin-top:14px;">Decididas nos últimos 30 dias</div>
      ${recentes.map(linha).join('')}` : ''}
    ${decididas.length > recentes.length ? `
      <details class="gaveta" style="margin-top:12px;">
        <summary>Todas as anteriores<span class="conta">${decididas.length - recentes.length}</span></summary>
        <div class="corpo">${decididas.filter(s => !recentes.includes(s)).map(linha).join('')}</div>
      </details>` : ''}`

  area.appendChild(bloco)
}

    <div class="duas-colunas" style="margin-bottom:14px;">
