        <p style="margin:4px 0 0;font-size:13.5px;white-space:pre-wrap;">${esc(s.dados_pagamento)}</p></div>` : ''}

      <div class="secao">
        <div class="rot texto-dim2" style="font-size:10.5px;text-transform:uppercase;">Autorizações</div>
        ${s.parecer_coordenacao ? `<div class="passo"><span class="quando">${fmtQuando(s.coordenado_em) ?? '—'}</span>
          <span><b>Coordenação</b> — ${esc(s.gestor?.nome ?? '—')}<br>${esc(s.parecer_coordenacao)}</span></div>` : ''}
        ${s.parecer_cotacao ? `<div class="passo"><span class="quando">${fmtQuando(s.cotado_em) ?? '—'}</span>
          <span><b>Cotação</b> — ${esc(s.analista?.nome ?? '—')}<br>${esc(s.parecer_cotacao)}</span></div>` : ''}
        ${s.parecer_aprovacao ? `<div class="passo"><span class="quando">${fmtQuando(s.decidido_em) ?? '—'}</span>
          <span><b>Aprovação</b> — ${esc(s.aprovador?.nome ?? '—')}<br>${esc(s.parecer_aprovacao)}</span></div>` : ''}
      </div>

      <div class="acoes nao-imprime">
        <button class="btn" id="op-imprimir">Imprimir</button>
        <button class="btn-secundario" id="op-fechar">Fechar</button>
      </div>
    </div>`

  document.body.appendChild(fundo)
  fundo.querySelector('#op-fechar').onclick = () => fundo.remove()
  fundo.querySelector('#op-imprimir').onclick = () => window.print()
  fundo.onclick = e => { if (e.target === fundo) fundo.remove() }
}

// ----- Baixa do pagamento -----
function telaBaixa (s, contas, categorias, centros) {
  if (!s) return
  const despesas = categorias.filter(c => c.tipo !== 'ENTRADA')

  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = `
    <div class="modal">
      <h3>Dar baixa no pagamento</h3>
      <div class="ficha" style="margin-bottom:16px;">
        <div class="item"><div class="rot">Item</div><div class="val">${esc(s.produto_servico)}</div></div>
        <div class="item"><div class="rot">Solicitante</div>
          <div class="val">${esc(s.solicitante?.nome ?? '—')}</div></div>
        <div class="item"><div class="rot">Fornecedor</div>
          <div class="val">${esc(s.fornecedor?.nome ?? '—')}</div></div>
      </div>

      <div class="form-grade">
        <div class="campo"><label>Valor pago (R$) *</label>
          <input id="b-valor" inputmode="decimal" value="${s.valor_estimado ?? ''}"></div>
        <div class="campo"><label>Data do pagamento</label>
          <input type="date" id="b-data" value="${new Date().toISOString().slice(0, 10)}"></div>
        <div class="campo"><label>Conta</label>
          <select id="b-conta"><option value="">—</option>
            ${contas.map(c => `<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></div>
        <div class="campo"><label>Categoria</label>
          <select id="b-categoria"><option value="">—</option>
            ${despesas.map(c => `<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></div>
        <div class="campo"><label>Centro de custo</label>
          <select id="b-centro"><option value="">—</option>
            ${centros.map(c => `<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></div>
        <div class="campo"><label>Comprovante (link)</label><input id="b-comp" placeholder="https://..."></div>
      </div>

      <label class="linha-modulo" style="margin-top:12px;">
        <input type="checkbox" id="b-lancar" checked>
        <span class="nome">Gerar lançamento no Financeiro</span></label>

      <div class="acoes">
        <button class="btn" id="b-confirmar">Confirmar baixa</button>
        <button class="btn-secundario" id="b-cancelar">Cancelar</button>
      </div>
      <div class="recado oculto" id="b-recado"></div>
      <p class="aviso">Ao confirmar, ${esc(s.solicitante?.nome ?? 'o solicitante')} recebe o aviso
      de que a compra foi aprovada e paga.</p>
    </div>`

  document.body.appendChild(fundo)
  const q = id => fundo.querySelector(id)
  const fechar = () => fundo.remove()
  q('#b-cancelar').onclick = fechar
  fundo.onclick = e => { if (e.target === fundo) fechar() }

  const aviso = t => {
    const el = q('#b-recado'); el.textContent = t; el.classList.remove('oculto')
    el.style.borderColor = 'var(--warn-text)'; el.style.color = 'var(--warn-text)'
  }

  q('#b-confirmar').onclick = async () => {
    const valor = numeroBR(q('#b-valor').value)
    if (valor === null) { aviso('Informe o valor pago.'); return }

    const btn = q('#b-confirmar'); btn.disabled = true; btn.textContent = 'Registrando...'
    let lancamentoId = null

    if (q('#b-lancar').checked) {
      const { data: lanc, error: eL } = await db.from('lancamento_financeiro').insert({
        tipo: 'SAIDA',
        descricao: `Compra: ${s.produto_servico}`,
        valor,
        data_lancamento: q('#b-data').value || new Date().toISOString().slice(0, 10),
        conta_id: q('#b-conta').value || null,
        categoria_id: q('#b-categoria').value || null,
        centro_custo_id: q('#b-centro').value || null,
        situacao: 'EFETIVADO',
        observacao: `Solicitação de ${s.solicitante?.nome ?? '—'}`,
        registrado_por: PERFIL.pessoaId
      }).select('id').single()

      if (eL) { aviso('Não deu para lançar no financeiro: ' + eL.message)
        btn.disabled = false; btn.textContent = 'Confirmar baixa'; return }
      lancamentoId = lanc.id
    }

    const { error } = await db.from('solicitacao_compra').update({
      status: 'PAGA',
      pago_por_id: PERFIL.pessoaId,
      pago_em: new Date(q('#b-data').value || Date.now()).toISOString(),
      valor_pago: valor,
      comprovante_link: q('#b-comp').value.trim() || null,
      lancamento_id: lancamentoId
    }).eq('id', s.id)

    if (error) { aviso(error.message); btn.disabled = false; btn.textContent = 'Confirmar baixa'; return }

    // avisa o solicitante
    if (s.solicitante?.nome) {
      const { data: p } = await db.from('pessoa').select('id')
        .eq('nome', s.solicitante.nome).maybeSingle()
      if (p) {
        await db.from('aviso').insert({
          pessoa_id: p.id,
          titulo: 'Sua compra foi aprovada e paga',
          texto: `${s.produto_servico} — pago em ${fmtData(q('#b-data').value)} `
               + `no valor de R$ ${fmtNum(valor)}.`,
          origem: 'compras',
          registro_id: s.id
        })
        await db.from('solicitacao_compra')
          .update({ avisado_em: new Date().toISOString() }).eq('id', s.id)
      }
    }

    fechar()
    abrirCompras('pagar', true)
  }
}

// ----- Decisão, sempre com parecer escrito -----
function telaDecisao (s, nomeEtapa) {
  if (!s) return
  const etapa = ETAPAS[nomeEtapa]

  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = `
    <div class="modal">
      <h3>${nomeEtapa === 'coordenacao' ? 'Coordenação' : 'Aprovação'} da solicitação</h3>
      <div class="ficha" style="margin-bottom:16px;">
        <div class="item"><div class="rot">Produto ou serviço</div>
          <div class="val">${esc(s.produto_servico)}</div></div>
        <div class="item"><div class="rot">Solicitante</div>
          <div class="val">${esc(s.solicitante?.nome ?? '—')}</div></div>
        <div class="item"><div class="rot">Valor estimado</div>
          <div class="val">${s.valor_estimado ? 'R$ ' + fmtNum(s.valor_estimado) : '—'}</div></div>
        <div class="item"><div class="rot">Urgência</div>
          <div class="val">${esc(URGENCIA[s.urgencia] ?? '—')}</div></div>
      </div>

      ${s.justificativa ? `<div class="secao">
        <div class="rot texto-dim2" style="font-size:10.5px;text-transform:uppercase;">Justificativa do solicitante</div>
        <p style="margin:4px 0 0;font-size:13.5px;">${esc(s.justificativa)}</p></div>` : ''}

      ${s.parecer_coordenacao ? `<div class="secao">
        <div class="rot texto-dim2" style="font-size:10.5px;text-transform:uppercase;">Justificativa da coordenação</div>
        <p style="margin:4px 0 0;font-size:13.5px;">${esc(s.parecer_coordenacao)}</p></div>` : ''}

      ${s.parecer_cotacao ? `<div class="secao">
        <div class="rot texto-dim2" style="font-size:10.5px;text-transform:uppercase;">Cotação — ${esc(s.analista?.nome ?? '')}</div>
        <p style="margin:4px 0 0;font-size:13.5px;">${esc(s.parecer_cotacao)}</p></div>` : ''}

      <div id="d-orcamentos"></div>

      <div class="campo"><label>${etapa.rotuloParecer} *</label>
        <textarea id="d-parecer" placeholder="Por que está ${nomeEtapa === 'coordenacao' ? 'encaminhando ou devolvendo' : 'aprovando ou reprovando'}"></textarea></div>

      <div class="acoes">
        <button class="btn" id="d-avancar">${etapa.avancar.rotulo}</button>
        <button class="btn-secundario" id="d-recusar">${etapa.recusar.rotulo}</button>
        <button class="btn-secundario" id="d-cancelar">Cancelar</button>
      </div>
      <div class="recado oculto" id="d-recado"></div>
      <p class="aviso">${etapa.explica}</p>
    </div>`

  document.body.appendChild(fundo)
  const q = id => fundo.querySelector(id)
  const fechar = () => fundo.remove()
  q('#d-cancelar').onclick = fechar
  fundo.onclick = e => { if (e.target === fundo) fechar() }

  const aviso = t => {
    const el = q('#d-recado'); el.textContent = t; el.classList.remove('oculto')
    el.style.borderColor = 'var(--warn-text)'; el.style.color = 'var(--warn-text)'
  }

  const decidir = async novoStatus => {
    const parecer = q('#d-parecer').value.trim()
    if (!parecer) { aviso('Escreva o parecer antes de decidir.'); return }

    const corpo = { status: novoStatus }
    corpo[etapa.campoParecer] = parecer
    corpo[etapa.campoData] = new Date().toISOString()
    corpo[etapa.campoPessoa] = PERFIL.pessoaId

    const { error } = await db.from('solicitacao_compra').update(corpo).eq('id', s.id)
    if (error) { aviso(error.message); return }
    fechar()
    abrirCompras(nomeEtapa === 'coordenacao' ? 'coordenar' : 'aprovar', true)
  }

  q('#d-avancar').onclick = () => decidir(etapa.avancar.status)
  q('#d-recusar').onclick = () => decidir(etapa.recusar.status)

  // na aprovação, mostra o quadro de orçamentos abaixo do parecer da cotação
  if (nomeEtapa === 'aprovacao') {
    db.from('orcamento')
      .select('valor,prazo_entrega,forma_pagamento,condicao_pagamento,escolhido,fornecedor_avulso,fornecedor:fornecedor_id(nome)')
      .eq('solicitacao_id', s.id).order('valor')
      .then(({ data: orcs }) => {
        if (!orcs?.length) return
        const menor = Math.min(...orcs.map(o => Number(o.valor)))
        q('#d-orcamentos').innerHTML = `
          <div class="secao">
            <div class="rot texto-dim2" style="font-size:10.5px;text-transform:uppercase;">Orçamentos levantados</div>
            <table style="margin-top:6px;"><thead><tr>
              <th>Fornecedor</th><th class="num">Valor</th><th>Prazo</th><th>Pagamento</th><th></th>
            </tr></thead><tbody>
              ${orcs.map(o => `<tr>
                <td>${esc(o.fornecedor?.nome || o.fornecedor_avulso || '—')}</td>
                <td class="num ${Number(o.valor) === menor ? 'badge-bom' : ''}">R$ ${fmtNum(o.valor)}</td>
                <td>${esc(o.prazo_entrega ?? '—')}</td>
                <td>${esc([o.forma_pagamento, o.condicao_pagamento].filter(Boolean).join(' · ') || '—')}</td>
                <td>${o.escolhido ? '<span class="status aprovada">escolhido</span>' : ''}</td>
              </tr>`).join('')}
            </tbody></table>
            ${s.dados_pagamento || s.vencimento || s.parcelas ? `
              <p class="aviso" style="margin-top:8px;">
                ${s.parcelas ? s.parcelas + 'x · ' : ''}
                ${s.vencimento ? 'vence ' + fmtData(s.vencimento) + ' · ' : ''}
                ${esc(s.dados_pagamento ?? '')}</p>` : ''}
          </div>`
      })
  }
}

// ----- Compras › Recebimento -----
async function comprasReceber (alvo, editavel) {
  const [{ data: recs }, { data: aprovadas }] = await Promise.all([
    db.from('recebimento_mercadoria').select(`
      id, numero_nf, data_recebimento, observacoes,
      recebido_por:recebido_por_id ( nome ),
      fornecedor:fornecedor_id ( nome ),
      setor:setor_id ( nome ),
      solicitacao:solicitacao_id ( produto_servico )
    `).order('data_recebimento', { ascending: false }).limit(200),
    db.from('solicitacao_compra').select('id,produto_servico')
      .eq('status', 'APROVADA').order('data_solicitacao')
  ])

  alvo.innerHTML = `
    ${editavel ? `<div class="secao panel" style="padding:20px;">
      <h3>Registrar recebimento</h3>
      <div class="form-grade">
        <div class="campo"><label>Solicitação</label>
          <select id="r-sol"><option value="">— avulso —</option>
            ${(aprovadas || []).map(a =>
              `<option value="${a.id}">${esc(a.produto_servico)}</option>`).join('')}
          </select></div>
        <div class="campo"><label>Fornecedor</label>
          <select id="r-forn"><option value="">—</option>
            ${COMPRAS_CACHE.fornecedores.map(f =>
              `<option value="${f.id}">${esc(f.nome)}</option>`).join('')}
          </select></div>
        <div class="campo"><label>Nota fiscal</label><input id="r-nf"></div>
        <div class="campo"><label>Data</label>
          <input type="date" id="r-data" value="${new Date().toISOString().slice(0, 10)}"></div>
        <div class="campo"><label>Setor</label>
          <select id="r-setor"><option value="">—</option>
            ${COMPRAS_CACHE.setores.map(x =>
              `<option value="${x.id}">${esc(x.nome)}</option>`).join('')}
          </select></div>
      </div>
      <div class="campo" style="margin-top:12px;"><label>Observações</label>
        <textarea id="r-obs" style="min-height:60px;"></textarea></div>
      <div class="acoes"><button class="btn" id="r-salvar">Registrar</button></div>
      <div class="recado oculto" id="r-recado"></div>
    </div>` : ''}

    <div class="cabeca-secao">
      <h3 style="font-family:var(--serif);font-size:17px;">Recebimentos</h3>
      <span class="texto-dim2" style="font-size:12px;">${(recs || []).length} registro(s)</span>
    </div>
    <div class="panel" style="padding:0;"><div class="tabela-scroll">
      <table><thead><tr>
        <th>Data</th><th>Item</th><th>Fornecedor</th><th>NF</th><th>Setor</th><th>Recebido por</th>
      </tr></thead><tbody>
        ${(recs || []).map(r => `<tr>
          <td>${fmtQuando(r.data_recebimento) ?? '—'}</td>
          <td>${esc(r.solicitacao?.produto_servico ?? 'avulso')}</td>
          <td>${esc(r.fornecedor?.nome ?? '—')}</td>
          <td>${esc(r.numero_nf ?? '—')}</td>
          <td>${esc(r.setor?.nome ?? '—')}</td>
          <td class="texto-dim">${esc(r.recebido_por?.nome ?? '—')}</td>
        </tr>`).join('') || `<tr><td colspan="6" class="vazio">Nenhum recebimento registrado.</td></tr>`}
      </tbody></table>
    </div></div>`

  if (!editavel) return

  $('#r-salvar').onclick = async () => {
    const aviso = (t, alerta = true) => {
      const el = $('#r-recado'); el.textContent = t; el.classList.remove('oculto')
      el.style.borderColor = alerta ? 'var(--warn-text)' : 'var(--line2)'
      el.style.color = alerta ? 'var(--warn-text)' : 'var(--dim)'
    }

      .update({ status: 'RECEBIDA' }).eq('id', solId)

    abrirCompras('receber', true)
  }
}

async function paginaExpedicao () {
  $('#subtitulo-pagina').textContent = 'Carregamentos migrados da planilha'

    <div class="campo"><label>Cliente</label><select id="f-cliente"><option value="">todos</option></select></div>
    <div class="campo"><label>Vendedor</label><select id="f-vendedor"><option value="">todos</option></select></div>

    <div class="campo"><label>Até</label><input type="date" id="f-ate"></div>
    <button class="btn" id="f-aplicar">Filtrar</button>
    <button class="btn-secundario" id="f-limpar">Limpar</button>`

  const [{ data: clientes }, { data: vendedores }] = await Promise.all([
    db.from('cliente').select('id,razao_social').order('razao_social'),
    db.from('pessoa').select('id,nome').eq('eh_vendedor', true).order('nome')
  ])

  ;(vendedores || []).forEach(v => $('#f-vendedor').add(new Option(v.nome, v.id)))

  $('#f-aplicar').onclick = carregar
  $('#f-limpar').onclick = () => {
    $('#f-cliente').value = ''; $('#f-vendedor').value = ''
    $('#f-de').value = ''; $('#f-ate').value = ''; carregar()
  }

  $('#cabecalho').innerHTML = `<tr>
    <th>Linha</th><th>Data</th><th>Cliente</th><th>Vendedor</th>
    <th>Produto</th><th>Placa</th><th class="num">Qtd (t)</th>
    <th>NF</th><th>UF</th><th>Anexos</th></tr>`
  await carregar()

  async function carregar () {
    $('#corpo').innerHTML = `<tr><td colspan="10" class="vazio">carregando...</td></tr>`
    let q = db.from('carregamento').select(`
      origem_linha, data_carregamento, quantidade_t, numero_nf, uf_destino,
      cliente:cliente_id ( razao_social ),
      vendedor:vendedor_id ( nome ),
      produto:produto_id ( nome ),
      veiculo:veiculo_id ( placa )
    `).order('data_carregamento', { ascending: false }).limit(500)

    if ($('#f-cliente').value) q = q.eq('cliente_id', $('#f-cliente').value)
    if ($('#f-vendedor').value) q = q.eq('vendedor_id', $('#f-vendedor').value)
    if ($('#f-de').value) q = q.gte('data_carregamento', $('#f-de').value)
    if ($('#f-ate').value) q = q.lte('data_carregamento', $('#f-ate').value)

    const { data, error } = await q
    if (error) { $('#corpo').innerHTML = `<tr><td colspan="10" class="vazio">${esc(error.message)}</td></tr>`; return }
    if (!data.length) { $('#corpo').innerHTML = `<tr><td colspan="10" class="vazio">Nenhum carregamento no filtro.</td></tr>`; return }

    const total = data.reduce((s, c) => s + Number(c.quantidade_t || 0), 0)
    const nClientes = new Set(data.map(c => c.cliente?.razao_social)).size
    $('#kpis').innerHTML =
      kpi('Carregamentos', data.length, data.length === 500 ? 'limite de 500 atingido' : '') +
      kpi('Toneladas', fmtNum(total), 'soma do período') +
      kpi('Clientes', nClientes) +
      kpi('Média por carga', fmtNum(total / data.length) + ' t')

    $('#corpo').innerHTML = data.map(c => `<tr>
      <td class="texto-dim2">${c.origem_linha ?? '—'}</td>
      <td>${fmtData(c.data_carregamento)}</td>
      <td>${esc(c.cliente?.razao_social)}</td>
      <td>${c.vendedor?.nome ? esc(c.vendedor.nome) : '<span class="badge-alerta">sem vendedor</span>'}</td>
      <td><span class="chip">${esc(c.produto?.nome ?? '—')}</span></td>
      <td>${esc(c.veiculo?.placa ?? '—')}</td>
      <td class="num">${fmtNum(c.quantidade_t, 3)}</td>
      <td>${esc(c.numero_nf ?? '—')}</td>
      <td>${esc(c.uf_destino ?? '—')}</td>
      <td><a class="anexo-link" data-linha="${c.origem_linha}">ver</a></td>
    </tr>`).join('')

    $('#corpo').querySelectorAll('.anexo-link').forEach(a => { a.onclick = () => verAnexos(a.dataset.linha) })
    $('#rodape').textContent = `${data.length} registros · ${fmtNum(total)} t`
  }

  async function verAnexos (linha) {
    const { data: c } = await db.from('carregamento').select('id').eq('origem_linha', linha).maybeSingle()
    if (!c) return
    const { data: anexos } = await db.from('anexo').select('tipo, drive_file_id')
      .eq('entidade', 'CARREGAMENTO').eq('registro_id', c.id)
    if (!anexos?.length) { alert('Sem anexos nesta linha.'); return }
    anexos.forEach(a => window.open('https://drive.google.com/open?id=' + a.drive_file_id, '_blank'))
  }
}

let FIN_CACHE = { contas: [], categorias: [], centros: [] }

async function paginaFinanceiro () {
  if (!podeVer('financeiro')) { areaLivre().innerHTML =
    `<div class="panel" style="padding:22px;"><p class="texto-dim">
     Você não tem acesso ao Financeiro.</p></div>`; return }

  const editavel = podeEditar('financeiro')
  $('#subtitulo-pagina').textContent = 'Lançamentos, faturamento e contas'
  const area = areaLivre()
  area.innerHTML = `<p class="texto-dim2">carregando...</p>`

  const [{ data: contas }, { data: categorias }, { data: centros }] = await Promise.all([
    db.from('conta_financeira').select('id,nome,instituicao,tipo,saldo_ini,status').order('nome'),
    db.from('categoria_financeira').select('id,nome,tipo,status').order('nome'),
    db.from('centro_de_custo').select('id,nome').order('nome')
  ])
  FIN_CACHE = { contas: contas || [], categorias: categorias || [], centros: centros || [] }

  const abas = [
    { chave: 'lancamentos', nome: 'Lançamentos' },
    { chave: 'faturar',     nome: 'Faturamento de NF' },
    { chave: 'contas',      nome: 'Contas' },
    { chave: 'cadastros',   nome: 'Categorias e centros' }
  ]

  area.innerHTML = `
    <div class="subabas">
      ${abas.map((a, i) => `<button data-sub="${a.chave}" class="${i === 0 ? 'ativo' : ''}">${a.nome}</button>`).join('')}
    </div>
    <div id="sub-fin"></div>`

  area.querySelectorAll('.subabas button').forEach(b => {
    b.onclick = () => {
      area.querySelectorAll('.subabas button').forEach(x => x.classList.toggle('ativo', x === b))
      abrirFin(b.dataset.sub, editavel)
    }
  })
  abrirFin('lancamentos', editavel)
}

function abrirFin (sub, editavel) {
  const alvo = $('#sub-fin')
  alvo.innerHTML = `<p class="texto-dim2">carregando...</p>`
  if (sub === 'lancamentos') finLancamentos(alvo, editavel)
  if (sub === 'faturar') finFaturar(alvo, editavel)
  if (sub === 'contas') finContas(alvo, editavel)
  if (sub === 'cadastros') finCadastros(alvo, editavel)
}

// ----- Financeiro › Lançamentos -----
async function finLancamentos (alvo, editavel) {
  const { data, error } = await db.from('lancamento_financeiro').select(`
    id, data_lancamento, descricao, tipo, valor, situacao, observacao,
    categoria:categoria_id ( nome, tipo ),
    centro:centro_custo_id ( nome ),
    conta:conta_id ( nome )
  `).order('data_lancamento', { ascending: false }).limit(400)

  if (error) { alvo.innerHTML = `<p class="vazio">${esc(error.message)}</p>`; return }

  const receitas = (data || []).filter(l => l.tipo === 'ENTRADA').reduce((s, l) => s + Number(l.valor), 0)
  const despesas = (data || []).filter(l => l.tipo === 'SAIDA').reduce((s, l) => s + Number(l.valor), 0)
  const pendentes = (data || []).filter(l => l.situacao === 'PENDENTE').length

  $('#kpis').innerHTML =
    kpi('Receitas', 'R$ ' + fmtNum(receitas)) +
    kpi('Despesas', 'R$ ' + fmtNum(despesas)) +
    kpi('Resultado', 'R$ ' + fmtNum(receitas - despesas),
        receitas - despesas >= 0 ? 'positivo' : 'negativo') +
    kpi('Pendentes', pendentes, 'a efetivar')

  alvo.innerHTML = `
    ${editavel ? `<div class="acoes" style="margin:0 0 16px;">
      <button class="btn" id="l-nova-entrada">Registrar recebimento</button>
      <button class="btn-secundario" id="l-nova-saida">Registrar gasto</button>
    </div>` : ''}
    <div class="filtros" style="margin-bottom:14px;">
      <div class="campo"><label>Tipo</label>
        <select id="l-f-tipo"><option value="">todos</option>
          <option value="ENTRADA">recebimentos</option>
          <option value="SAIDA">gastos</option></select></div>
      <div class="campo"><label>Situação</label>
        <select id="l-f-sit"><option value="">todas</option>
          <option value="EFETIVADO">efetivados</option>
          <option value="PENDENTE">pendentes</option></select></div>
      <div class="campo"><label>Buscar</label><input id="l-f-txt" placeholder="descrição"></div>
    </div>
    <div class="panel" style="padding:0;"><div class="tabela-scroll">
      <table><thead><tr>
        <th>Data</th><th>Descrição</th><th>Categoria</th><th>Centro</th>
        <th>Conta</th><th>Situação</th><th class="num">Valor</th>
      </tr></thead><tbody id="l-corpo"></tbody></table>
    </div></div>`

  const desenhar = () => {
    const t = $('#l-f-tipo').value, si = $('#l-f-sit').value
    const q = $('#l-f-txt').value.trim().toLowerCase()
    const lista = (data || []).filter(l =>
      (!t || l.tipo === t) && (!si || l.situacao === si) &&
      (!q || (l.descricao || '').toLowerCase().includes(q)))

    $('#l-corpo').innerHTML = lista.map(l => `<tr>
      <td>${fmtData(l.data_lancamento)}</td>
      <td>${esc(l.descricao)}</td>
      <td><span class="chip">${esc(l.categoria?.nome ?? '—')}</span></td>
      <td>${esc(l.centro?.nome ?? '—')}</td>
      <td>${esc(l.conta?.nome ?? '—')}</td>
      <td class="${l.situacao === 'EFETIVADO' ? 'badge-bom' : 'badge-alerta'}">${esc(l.situacao)}</td>
      <td class="num ${l.tipo === 'ENTRADA' ? 'badge-bom' : ''}">
        ${l.tipo === 'SAIDA' ? '−' : '+'} ${fmtNum(l.valor)}</td>
    </tr>`).join('') || `<tr><td colspan="7" class="vazio">
      ${(data || []).length ? 'Nenhum lançamento com esse filtro.'
        : 'Nenhum lançamento ainda. Use os botões acima para registrar o primeiro.'}</td></tr>`

    $('#rodape').textContent = `${lista.length} lançamento(s)`
  }

  ;['#l-f-tipo', '#l-f-sit'].forEach(i => $(i).onchange = desenhar)
  $('#l-f-txt').oninput = desenhar
  desenhar()

  if (!editavel) return
  $('#l-nova-entrada').onclick = () => formLancamento('ENTRADA')
  $('#l-nova-saida').onclick = () => formLancamento('SAIDA')
}

// ----- Formulário de lançamento -----
function formLancamento (tipo, preencher = {}) {
  const ehEntrada = tipo === 'ENTRADA'
  const cats = FIN_CACHE.categorias.filter(c =>
    ehEntrada ? c.tipo === 'RECEITA' : c.tipo === 'DESPESA')

  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = `
    <div class="modal">
      <h3>${ehEntrada ? 'Registrar recebimento' : 'Registrar gasto'}</h3>
      <div class="form-grade">
        <div class="campo" style="grid-column:1/-1;"><label>Descrição *</label>
          <input id="n-desc" value="${esc(preencher.descricao ?? '')}"></div>
        <div class="campo"><label>Valor (R$) *</label>
          <input id="n-valor" inputmode="decimal" value="${preencher.valor ?? ''}" placeholder="1.250,00"></div>
        <div class="campo"><label>Data *</label>
          <input type="date" id="n-data" value="${preencher.data ?? new Date().toISOString().slice(0, 10)}"></div>
        <div class="campo"><label>Categoria</label>
          <select id="n-cat"><option value="">—</option>
            ${cats.map(c => `<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></div>
        <div class="campo"><label>Conta</label>
          <select id="n-conta"><option value="">—</option>
            ${FIN_CACHE.contas.map(c => `<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></div>
        <div class="campo"><label>Centro de custo</label>
          <select id="n-centro"><option value="">—</option>
            ${FIN_CACHE.centros.map(c => `<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></div>
        <div class="campo"><label>Situação</label>
          <select id="n-sit">
            <option value="EFETIVADO">efetivado</option>
            <option value="PENDENTE">pendente</option></select></div>
      </div>
      <div class="campo" style="margin-top:12px;"><label>Observação</label>
        <textarea id="n-obs" style="min-height:60px;">${esc(preencher.observacao ?? '')}</textarea></div>
      <div class="acoes">
        <button class="btn" id="n-salvar">Salvar</button>
        <button class="btn-secundario" id="n-cancelar">Cancelar</button>
      </div>
      <div class="recado oculto" id="n-recado"></div>
      ${!FIN_CACHE.contas.length ? `<p class="aviso">
        Nenhuma conta cadastrada ainda. Dá para salvar sem conta, mas o saldo
        por conta só funciona depois que você cadastrar uma em Contas.</p>` : ''}
    </div>`

  document.body.appendChild(fundo)
  const q = id => fundo.querySelector(id)
  const fechar = () => fundo.remove()
  q('#n-cancelar').onclick = fechar
  fundo.onclick = e => { if (e.target === fundo) fechar() }

  const aviso = t => {
    const el = q('#n-recado'); el.textContent = t; el.classList.remove('oculto')
    el.style.borderColor = 'var(--warn-text)'; el.style.color = 'var(--warn-text)'
  }

  q('#n-salvar').onclick = async () => {
    const desc = q('#n-desc').value.trim()
    const valor = numeroBR(q('#n-valor').value)
    if (!desc) { aviso('Escreva a descrição.'); return }
    if (valor === null || valor <= 0) { aviso('Informe um valor maior que zero.'); return }

    const btn = q('#n-salvar'); btn.disabled = true; btn.textContent = 'Salvando...'
    const { error } = await db.from('lancamento_financeiro').insert({
      tipo, descricao: desc, valor,
      data_lancamento: q('#n-data').value,
      categoria_id: q('#n-cat').value || null,
      conta_id: q('#n-conta').value || null,
      centro_custo_id: q('#n-centro').value || null,
      situacao: q('#n-sit').value,
      observacao: q('#n-obs').value.trim() || null,
      registrado_por: PERFIL.pessoaId
    })
    btn.disabled = false; btn.textContent = 'Salvar'
    if (error) { aviso(error.message); return }
    fechar()
    abrirFin('lancamentos', true)
  }
}

// ----- Financeiro › Faturamento de NF -----

    .select('*').order('data_carregamento', { ascending: false }).limit(400)

  if (error) { alvo.innerHTML = `<p class="vazio">${esc(error.message)}</p>`; return }

  const totalSugerido = (data || []).reduce((t, c) => t + Number(c.valor_sugerido || 0), 0)

  $('#kpis').innerHTML =

        semValor ? `${semValor} sem preço` : 'com base no preço cadastrado') +
    kpi('Toneladas', fmtNum((data || []).reduce((t, c) => t + Number(c.quantidade_t || 0), 0), 2))

  alvo.innerHTML = `
    <p class="aviso" style="margin-top:0;">
      Cada carregamento com nota fiscal pode virar um recebimento no financeiro.
      Faturado uma vez, sai desta lista.</p>
    ${semValor ? `<div class="badge-alerta" style="padding:9px 12px;border-radius:6px;font-size:12.5px;margin-bottom:14px;">
      ${semValor} carregamento(s) sem preço. Cadastre o preço em Categorias e centros →
      preços de venda, ou digite o valor na hora de faturar.</div>` : ''}
    <div class="panel" style="padding:0;"><div class="tabela-scroll">
      <table><thead><tr>
        <th>Data</th><th>NF</th><th>Cliente</th><th>Produto</th>
        <th class="num">Qtd (t)</th><th class="num">Valor</th><th></th>
      </tr></thead><tbody id="fat-corpo"></tbody></table>
    </div></div>`

  $('#fat-corpo').innerHTML = (data || []).map(c => `<tr>
    <td>${fmtData(c.data_carregamento)}</td>
    <td>${esc(c.numero_nf ?? '—')}</td>
    <td>${esc(c.cliente ?? '—')}</td>
    <td><span class="chip">${esc(c.produto ?? '—')}</span></td>
    <td class="num">${fmtNum(c.quantidade_t, 3)}</td>
    <td class="num ${c.valor_sugerido == null ? 'texto-dim2' : ''}">
      ${c.valor_sugerido == null ? 'sem preço' : 'R$ ' + fmtNum(c.valor_sugerido)}</td>
    <td style="text-align:right;">${editavel
      ? `<button class="btn-secundario mini" data-faturar="${c.id}">faturar</button>` : ''}</td>
  </tr>`).join('') || `<tr><td colspan="7" class="vazio">

  if (!editavel) return
  $('#fat-corpo').querySelectorAll('[data-faturar]').forEach(b => {
    b.onclick = () => telaFaturar((data || []).find(c => c.id === b.dataset.faturar))
  })
}

// ----- Faturar um carregamento -----
function telaFaturar (c) {
  if (!c) return
  const receitas = FIN_CACHE.categorias.filter(x => x.tipo === 'RECEITA')

  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = `
    <div class="modal">
      <h3>Faturar NF ${esc(c.numero_nf ?? '')}</h3>
      <div class="ficha" style="margin-bottom:16px;">
        <div class="item"><div class="rot">Cliente</div><div class="val">${esc(c.cliente ?? '—')}</div></div>
        <div class="item"><div class="rot">Produto</div><div class="val">${esc(c.produto ?? '—')}</div></div>
        <div class="item"><div class="rot">Quantidade</div>
          <div class="val">${fmtNum(c.quantidade_t, 3)} t</div></div>
        <div class="item"><div class="rot">Data</div>
          <div class="val">${fmtData(c.data_carregamento)}</div></div>
      </div>

      <div class="form-grade">
        <div class="campo"><label>Preço por tonelada (R$)</label>
          <input id="ft-preco" inputmode="decimal" value="${c.preco_unitario ?? ''}"></div>
        <div class="campo"><label>Valor da nota (R$) *</label>
          <input id="ft-valor" inputmode="decimal" value="${c.valor_sugerido ?? ''}"></div>
        <div class="campo"><label>Categoria</label>
          <select id="ft-cat"><option value="">—</option>
            ${receitas.map(x => `<option value="${x.id}">${esc(x.nome)}</option>`).join('')}</select></div>
        <div class="campo"><label>Conta</label>
          <select id="ft-conta"><option value="">—</option>
            ${FIN_CACHE.contas.map(x => `<option value="${x.id}">${esc(x.nome)}</option>`).join('')}</select></div>
        <div class="campo"><label>Situação</label>
          <select id="ft-sit">
            <option value="PENDENTE">a receber</option>
            <option value="EFETIVADO">já recebido</option></select></div>
      </div>

      <div class="acoes">
        <button class="btn" id="ft-ok">Gerar recebimento</button>
        <button class="btn-secundario" id="ft-cancelar">Cancelar</button>
      </div>
      <div class="recado oculto" id="ft-recado"></div>
      <p class="aviso">O preço por tonelada fica gravado no carregamento.
      Para não digitar toda vez, cadastre um preço de venda do produto.</p>
    </div>`

  document.body.appendChild(fundo)
  const q = id => fundo.querySelector(id)
  const fechar = () => fundo.remove()
  q('#ft-cancelar').onclick = fechar
  fundo.onclick = e => { if (e.target === fundo) fechar() }

  const aviso = t => {
    const el = q('#ft-recado'); el.textContent = t; el.classList.remove('oculto')
    el.style.borderColor = 'var(--warn-text)'; el.style.color = 'var(--warn-text)'
  }

  // digitou o preço: recalcula o valor
  q('#ft-preco').oninput = () => {
    const p = numeroBR(q('#ft-preco').value)
    if (p !== null) q('#ft-valor').value = (p * Number(c.quantidade_t || 0)).toFixed(2).replace('.', ',')
  }

  q('#ft-ok').onclick = async () => {
    const valor = numeroBR(q('#ft-valor').value)
    if (valor === null || valor <= 0) { aviso('Informe o valor da nota.'); return }

    const btn = q('#ft-ok'); btn.disabled = true; btn.textContent = 'Gerando...'

    const { data: lanc, error: eL } = await db.from('lancamento_financeiro').insert({
      tipo: 'ENTRADA',
      descricao: `NF ${c.numero_nf ?? ''} — ${c.cliente ?? ''}`.trim(),
      valor,
      data_lancamento: c.data_carregamento,
      categoria_id: q('#ft-cat').value || null,
      conta_id: q('#ft-conta').value || null,
      situacao: q('#ft-sit').value,
      observacao: `${fmtNum(c.quantidade_t, 3)} t de ${c.produto ?? '—'}`,
      registrado_por: PERFIL.pessoaId
    }).select('id').single()

    if (eL) { aviso(eL.message); btn.disabled = false; btn.textContent = 'Gerar recebimento'; return }

    const { error } = await db.from('carregamento').update({
      preco_unitario: numeroBR(q('#ft-preco').value),
      valor_nf: valor,
      lancamento_id: lanc.id,
      faturado_em: new Date().toISOString()
    }).eq('id', c.id)

    if (error) { aviso(error.message); btn.disabled = false; btn.textContent = 'Gerar recebimento'; return }
    fechar()
    abrirFin('faturar', true)
  }
}

        <td class="num">${porId[c.id] != null ? 'R$ ' + fmtNum(porId[c.id]) : '—'}</td>
      </tr>`).join('') || `<tr><td colspan="4" class="vazio">
        Nenhuma conta cadastrada. Sem conta, os lançamentos funcionam,
        mas não há saldo para acompanhar.</td></tr>`}
      </tbody></table>
    </div></div>`

  if (!editavel) return
  $('#ct-salvar').onclick = async () => {
    const nome = $('#ct-nome').value.trim()
    const el = $('#ct-recado')
    const falhar = t => { el.textContent = t; el.classList.remove('oculto')
      el.style.borderColor = 'var(--warn-text)'; el.style.color = 'var(--warn-text)' }
    if (!nome) { falhar('Escreva o nome da conta.'); return }

    const { error } = await db.from('conta_financeira').insert({
      nome,
      instituicao: $('#ct-inst').value.trim() || null,
      saldo_ini: numeroBR($('#ct-saldo').value) ?? 0
    })
    if (error) { falhar(error.message); return }
    paginaFinanceiro()
  }
}

// ----- Financeiro › Categorias, centros e preços -----
async function finCadastros (alvo, editavel) {
  const { data: precos } = await db.from('preco_venda')
    .select('id,preco,vigente_de,produto:produto_id(nome),cliente:cliente_id(razao_social)')
    .order('vigente_de', { ascending: false })
  const { data: produtos } = await db.from('produto').select('id,nome').order('nome')

  const bloco = (titulo, itens, extra = i => '') => `
    <div class="panel" style="padding:18px;">
      <h3>${titulo}</h3>
      <table><tbody>${itens.map(i => `<tr>
        <td>${esc(i.nome)}</td><td style="text-align:right;">${extra(i)}</td>
      </tr>`).join('') || `<tr><td class="vazio">Nada cadastrado.</td></tr>`}</tbody></table>
    </div>`

  alvo.innerHTML = `
    <div class="duas-colunas" style="margin-bottom:18px;">
      ${bloco('Categorias', FIN_CACHE.categorias,
        c => `<span class="chip">${esc(c.tipo)}</span>`)}
      ${bloco('Centros de custo', FIN_CACHE.centros)}
    </div>

    <div class="panel" style="padding:20px;">
      <div class="cabeca-secao">
        <h3>Preços de venda</h3>
        <span class="texto-dim2" style="font-size:12px;">usados para sugerir o valor da NF</span>
      </div>
      ${editavel ? `<div class="form-grade" style="margin-bottom:12px;">
        <div class="campo"><label>Produto</label>
          <select id="pv-produto">${(produtos || []).map(p =>
            `<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select></div>
        <div class="campo"><label>Preço por tonelada (R$)</label>
          <input id="pv-preco" inputmode="decimal" placeholder="1.250,00"></div>
        <div class="campo"><label>Vigente a partir de</label>
          <input type="date" id="pv-data" value="${new Date().toISOString().slice(0, 10)}"></div>
      </div>
      <div class="acoes" style="margin-top:0;">
        <button class="btn" id="pv-salvar">Adicionar preço</button></div>
      <div class="recado oculto" id="pv-recado"></div>` : ''}

      <table style="margin-top:14px;"><thead><tr>
        <th>Produto</th><th>Cliente</th><th class="num">Preço/t</th><th>Vigente de</th>
      </tr></thead><tbody>
        ${(precos || []).map(p => `<tr>
          <td>${esc(p.produto?.nome ?? '—')}</td>
          <td class="texto-dim">${esc(p.cliente?.razao_social ?? 'todos')}</td>
          <td class="num">R$ ${fmtNum(p.preco)}</td>
          <td>${fmtData(p.vigente_de)}</td>
        </tr>`).join('') || `<tr><td colspan="4" class="vazio">
          Nenhum preço cadastrado — por isso o faturamento pede o valor a cada NF.</td></tr>`}
      </tbody></table>
    </div>`

  if (!editavel) return
  $('#pv-salvar').onclick = async () => {
    const el = $('#pv-recado')
    const falhar = t => { el.textContent = t; el.classList.remove('oculto')
      el.style.borderColor = 'var(--warn-text)'; el.style.color = 'var(--warn-text)' }
    const preco = numeroBR($('#pv-preco').value)
    if (preco === null || preco <= 0) { falhar('Informe o preço por tonelada.'); return }

    const { error } = await db.from('preco_venda').insert({
      produto_id: $('#pv-produto').value,
      preco,
      vigente_de: $('#pv-data').value
    })
    if (error) { falhar(error.message); return }
    abrirFin('cadastros', true)
  }
}

// ---------------------------------------------------------------
// Página: Estoque
// ---------------------------------------------------------------
async function paginaEstoque () {
  $('#subtitulo-pagina').textContent = 'Saldo e valor por produto e por local'
  $('#cabecalho').innerHTML = `<tr>
    <th>Produto</th><th>Local</th><th>Unidade</th>
    <th class="num">Saldo</th><th class="num">Preço ref.</th><th class="num">Valor</th></tr>`

  const [{ data: total }, { data: porLocal }] = await Promise.all([
    db.from('valor_estoque').select('*').order('nome'),
    db.from('valor_estoque_por_local').select('*').order('produto')
  ])

  const valorTotal = (total || []).reduce((s, p) => s + Number(p.valor || 0), 0)
  const semPreco = (total || []).filter(p => p.sem_preco && Number(p.saldo) !== 0)

  $('#kpis').innerHTML =
    kpi('Valor do estoque', 'R$ ' + fmtNum(valorTotal),
        semPreco.length ? `${semPreco.length} produto(s) sem preço` : 'saldo × preço de referência') +
    (total || []).map(p => kpi(p.nome, fmtNum(p.saldo, 3), p.unidade)).join('')

  if (semPreco.length) {
    $('#filtros').innerHTML = `<div class="badge-alerta" style="padding:8px 12px;border-radius:6px;font-size:12.5px;">
      Sem preço de referência: ${esc(semPreco.map(p => p.nome).join(', '))}.
      Esses produtos entram como zero no valor total.</div>`
  }

  if (!porLocal?.length) {
    $('#corpo').innerHTML = `<tr><td colspan="6" class="vazio">
      Nenhuma movimentação de estoque carregada ainda.</td></tr>`
    return
  }

  $('#corpo').innerHTML = porLocal.map(s => `<tr>
    <td>${esc(s.produto)}</td><td><span class="chip">${esc(s.local)}</span></td>
    <td>${esc(s.unidade)}</td>
    <td class="num">${fmtNum(s.saldo, 3)}</td>
    <td class="num ${s.sem_preco ? 'texto-dim2' : ''}">${s.sem_preco ? '—' : fmtNum(s.preco_ref)}</td>
    <td class="num">${s.sem_preco ? '<span class="texto-dim2">—</span>' : 'R$ ' + fmtNum(s.valor)}</td>
  </tr>`).join('')

  $('#rodape').textContent =
    `${porLocal.length} linhas · valor total R$ ${fmtNum(valorTotal)}`
}

// ---------------------------------------------------------------
// Se já houver sessão salva, entra direto
// ---------------------------------------------------------------
const { data: { session } } = await db.auth.getSession()
if (session) await abrirApp()
</script>
