      veiculo:veiculo_id ( placa, descricao ), equipamento:equipamento_id ( tag, descricao ),
      bombista:bombista_id ( nome )
    `).gte('data_abastecimento', de).lte('data_abastecimento', ate + 'T23:59:59')
      .order('data_abastecimento', { ascending: false }).limit(1000)
    if (tipoFiltro) q = q.eq('tipo', tipoFiltro)
    if (alvoFiltro?.startsWith('v:')) q = q.eq('veiculo_id', alvoFiltro.slice(2))
    if (alvoFiltro?.startsWith('e:')) q = q.eq('equipamento_id', alvoFiltro.slice(2))

    const [{ data: periodo, error }, { data: todasEntradas }, { data: todosAbastec }] = await Promise.all([
      q,
      db.from('entrada_combustivel').select('tipo,litros'),
      db.from('abastecimento').select('tipo,litros')
    ])
    if (faltaMigracao(error)) { $('#pn-conteudo').innerHTML = `<p class="vazio">${esc(error.message)}</p>`; return }
    if (error) { $('#pn-conteudo').innerHTML = `<p class="vazio">${esc(error.message)}</p>`; return }

    const lista = periodo || []
    const precoDe = t => COMB_CACHE.precos[t] ?? 0
    const valorEstimado = a => Number(a.litros || 0) * precoDe(a.tipo)

    // estoque (lifetime, não filtrado por período — é saldo do tanque agora)
    const saldoPorTipo = {}
    TIPOS_COMBUSTIVEL.forEach(t => { saldoPorTipo[t] = { entrou: 0, saiu: 0 } })
    ;(todasEntradas || []).forEach(e => { saldoPorTipo[e.tipo].entrou += Number(e.litros || 0) })
    ;(todosAbastec || []).forEach(s => { saldoPorTipo[s.tipo].saiu += Number(s.litros || 0) })
    const estoqueTotal = TIPOS_COMBUSTIVEL.reduce((s, t) => s + (saldoPorTipo[t].entrou - saldoPorTipo[t].saiu), 0)

    // kpis do período
    const totalLitros = lista.reduce((s, a) => s + Number(a.litros || 0), 0)
    const totalValor = lista.reduce((s, a) => s + valorEstimado(a), 0)
    const litrosHoje = lista.filter(a => (a.data_abastecimento || '').slice(0, 10) === hoje)
      .reduce((s, a) => s + Number(a.litros || 0), 0)
    const valorHoje = lista.filter(a => (a.data_abastecimento || '').slice(0, 10) === hoje)
      .reduce((s, a) => s + valorEstimado(a), 0)
    const mediaAbastecimento = lista.length ? totalLitros / lista.length : 0
    const custoMedioAbastecimento = lista.length ? totalValor / lista.length : 0
    const custoMedioLitro = totalLitros ? totalValor / totalLitros : 0
    const ultimaLeitura = lista[0] ?? null

    const gastoPorAlvo = {}
    lista.forEach(a => {
      const k = nomeAlvoAbastecimento(a)
      gastoPorAlvo[k] = (gastoPorAlvo[k] || 0) + valorEstimado(a)
    })
    const maiorVeiculo = Object.entries(gastoPorAlvo).sort((a, b) => b[1] - a[1])[0]

    const gastoPorTipo = {}
    TIPOS_COMBUSTIVEL.forEach(t => { gastoPorTipo[t] = 0 })
    lista.forEach(a => { gastoPorTipo[a.tipo] += valorEstimado(a) })
    const maiorCombustivel = Object.entries(gastoPorTipo).sort((a, b) => b[1] - a[1])[0]

    const kpiCard = (rot, val, nota) => `
      <div class="bloco"><div class="rot">${esc(rot)}</div>
        <div class="val" style="font-size:22px;">${val}</div>
        ${nota ? `<div class="nota">${esc(nota)}</div>` : ''}
      </div>`

    // série diária
    const porDia = {}
    lista.forEach(a => {
      const dia = (a.data_abastecimento || '').slice(0, 10)
      porDia[dia] = (porDia[dia] || 0) + Number(a.litros || 0)
    })
    const diasOrdenados = Object.keys(porDia).sort()
    const pontosLinha = diasOrdenados.map(d => ({ rotulo: fmtData(d), valor: porDia[d] }))

    // por combustível
    const litrosPorTipo = {}
    TIPOS_COMBUSTIVEL.forEach(t => { litrosPorTipo[t] = 0 })
    lista.forEach(a => { litrosPorTipo[a.tipo] += Number(a.litros || 0) })
    const fatiasDonut = TIPOS_COMBUSTIVEL.filter(t => litrosPorTipo[t] > 0).map(t => ({ rotulo: ROTULO_COMBUSTIVEL[t], valor: litrosPorTipo[t] }))

    // financeiro por combustível
    const barrasFinanceiro = TIPOS_COMBUSTIVEL.filter(t => gastoPorTipo[t] > 0).map(t => ({ rotulo: ROTULO_COMBUSTIVEL[t], valor: gastoPorTipo[t] }))

    // consumo por veículo (top 8)
    const litrosPorAlvo = {}
    lista.forEach(a => { const k = nomeAlvoAbastecimento(a); litrosPorAlvo[k] = (litrosPorAlvo[k] || 0) + Number(a.litros || 0) })
    const topAlvos = Object.entries(litrosPorAlvo).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([rotulo, valor]) => ({ rotulo, valor }))

    $('#pn-conteudo').innerHTML = `
      <div class="panel" style="padding:22px;margin-bottom:16px;background:var(--rust);color:#fff;
        display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;">
        <div>
          <div style="font-size:12px;text-transform:uppercase;letter-spacing:.5px;opacity:.85;">Total abastecido no período</div>
          <div style="font-family:var(--serif);font-size:38px;margin-top:4px;">${fmtNum(totalLitros)} <span style="font-size:18px;opacity:.8;">L</span></div>
        </div>
        <div style="display:flex;gap:20px;flex-wrap:wrap;">
          <div><div style="font-size:11px;opacity:.8;">Valor estimado</div><div style="font-size:19px;">R$ ${fmtNum(totalValor)}</div></div>
          <div><div style="font-size:11px;opacity:.8;">Abastecimentos</div><div style="font-size:19px;">${lista.length}</div></div>
          <div><div style="font-size:11px;opacity:.8;">Estoque total</div><div style="font-size:19px;">${fmtNum(estoqueTotal)} L</div></div>
        </div>
      </div>

      <div class="resumo-topo" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px;">
        ${kpiCard('Total abastecido (L)', fmtNum(totalLitros), 'no período filtrado')}
        ${kpiCard('Qtd. abastecimentos', lista.length, 'registros filtrados')}
        ${kpiCard('Média por abastecimento', fmtNum(mediaAbastecimento) + ' L', 'média por lançamento')}
        ${kpiCard('Total de hoje (L)', fmtNum(litrosHoje), 'consumo do dia atual')}
        ${kpiCard('Estoque total (L)', fmtNum(estoqueTotal), 'saldo consolidado')}
        ${kpiCard('Valor total estimado', 'R$ ' + fmtNum(totalValor), 'litros × preço configurado')}
        ${kpiCard('Custo hoje', 'R$ ' + fmtNum(valorHoje), 'valor estimado do dia')}
        ${kpiCard('Custo médio / abastecimento', 'R$ ' + fmtNum(custoMedioAbastecimento))}
        ${kpiCard('Custo médio / litro', 'R$ ' + fmtNum(custoMedioLitro, 3))}
        ${kpiCard('Maior gasto (veículo)', maiorVeiculo ? 'R$ ' + fmtNum(maiorVeiculo[1]) : '—', maiorVeiculo ? maiorVeiculo[0] : '')}
        ${kpiCard('Maior gasto (combustível)', maiorCombustivel && maiorCombustivel[1] > 0 ? 'R$ ' + fmtNum(maiorCombustivel[1]) : '—', maiorCombustivel && maiorCombustivel[1] > 0 ? ROTULO_COMBUSTIVEL[maiorCombustivel[0]] : '')}
        ${kpiCard('Último lançamento', ultimaLeitura ? fmtQuando(ultimaLeitura.data_abastecimento) : '—', ultimaLeitura ? nomeAlvoAbastecimento(ultimaLeitura) : '')}
      </div>

      <div class="cabeca-secao" style="margin-top:6px;">
        <h3 style="font-family:var(--serif);font-size:16px;">Estoque por combustível</h3>
        <span class="texto-dim2" style="font-size:11px;">saldo = entradas − saídas (tempo todo)</span>
      </div>
      <div class="resumo-topo" style="margin-bottom:18px;">
        ${TIPOS_COMBUSTIVEL.map(t => {
          const v = saldoPorTipo[t]; const saldo = v.entrou - v.saiu
          if (!v.entrou && !v.saiu) return ''
          return `<div class="bloco ${saldo < 0 ? 'alerta' : ''}">
            <div class="rot">${esc(ROTULO_COMBUSTIVEL[t])}</div>
            <div class="val">${fmtNum(saldo)} <span style="font-size:14px;color:var(--dim2);">L</span></div>
            <div style="display:flex;gap:10px;margin-top:8px;font-size:11.5px;">
              <span class="texto-dim">entrada<br><b class="texto-dim2">${fmtNum(v.entrou)}</b></span>
              <span class="texto-dim">saída<br><b class="texto-dim2">${fmtNum(v.saiu)}</b></span>
            </div>
          </div>`
        }).join('') || `<p class="vazio">Nenhum lançamento de combustível ainda.</p>`}
      </div>

      <div class="cabeca-secao">
        <h3 style="font-family:var(--serif);font-size:16px;">Controle financeiro</h3>
        <span class="texto-dim2" style="font-size:11px;">preços usados para estimar o valor gasto</span>
      </div>
      <div class="resumo-topo" style="margin-bottom:18px;">
        ${TIPOS_COMBUSTIVEL.map(t => `<div class="bloco">
          <div class="rot">${esc(ROTULO_COMBUSTIVEL[t])}</div>
          <div class="val" style="font-size:20px;color:var(--gold, #c8a11a);">R$ ${fmtNum(COMB_CACHE.precos[t] ?? 0, 2)}</div>
          <div class="nota">preço por litro</div>
        </div>`).join('')}
      </div>

      <div style="display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px;" class="grade-painel-comb">
        <div class="panel" style="padding:18px;">
          <h3 style="font-family:var(--serif);font-size:15px;margin:0 0 12px;">Abastecimento por dia</h3>
          ${svgLinha(pontosLinha)}
        </div>
        <div class="panel" style="padding:18px;">
          <h3 style="font-family:var(--serif);font-size:15px;margin:0 0 12px;">Por combustível</h3>
          ${svgDonut(fatiasDonut)}
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;" class="grade-painel-comb">
        <div class="panel" style="padding:18px;">
          <h3 style="font-family:var(--serif);font-size:15px;margin:0 0 12px;">Financeiro por combustível (R$)</h3>
          ${barrasVerticais(barrasFinanceiro)}
        </div>
        <div class="panel" style="padding:18px;">
          <h3 style="font-family:var(--serif);font-size:15px;margin:0 0 12px;">Consumo por veículo (L)</h3>
          ${barrasHorizontais(topAlvos)}
        </div>
      </div>

      <div class="cabeca-secao">
        <h3 style="font-family:var(--serif);font-size:16px;">Histórico de abastecimentos</h3>
        <div style="display:flex;gap:8px;">
          <input id="pn-busca" placeholder="buscar veículo, placa, combustível..." style="min-width:220px;">
          <button class="btn-secundario mini" id="pn-csv">Exportar CSV</button>
        </div>
      </div>
      <div class="panel" style="padding:0;"><div class="tabela-scroll">
        <table><thead><tr>
          <th>Data</th><th>Veículo/Equip.</th><th>Placa</th><th>Combustível</th>
          <th class="num">Litros</th><th class="num">Valor estimado</th><th>Destino</th><th>Responsável</th>
        </tr></thead><tbody id="pn-tbody"></tbody></table>
      </div></div>
      <p class="texto-dim2" style="font-size:12px;margin-top:8px;">
        Mostrando até 1000 lançamentos do período. Para editar ou excluir, use a aba Abastecimentos.</p>`

    const preencherTabela = () => {
      const termo = $('#pn-busca').value.trim().toLowerCase()
      const filtrada = termo ? lista.filter(a =>
        `${a.veiculo?.placa ?? ''} ${a.veiculo?.descricao ?? ''} ${a.equipamento?.tag ?? ''} ${ROTULO_COMBUSTIVEL[a.tipo]}`
          .toLowerCase().includes(termo)) : lista

      $('#pn-tbody').innerHTML = filtrada.map(a => `<tr>
        <td>${fmtQuando(a.data_abastecimento) ?? '—'}</td>
        <td>${esc(a.veiculo?.descricao ?? a.equipamento?.tag ?? '—')}</td>
        <td class="texto-dim2">${esc(a.veiculo?.placa ?? '—')}</td>
        <td><span class="chip">${esc(ROTULO_COMBUSTIVEL[a.tipo] ?? a.tipo)}</span></td>
        <td class="num">${fmtNum(a.litros)}</td>
        <td class="num">R$ ${fmtNum(valorEstimado(a))}</td>
        <td class="texto-dim">${esc(ROTULO_DESTINO_ABASTECIMENTO[a.destino] ?? '—')}</td>
        <td class="texto-dim">${esc(a.bombista?.nome ?? '—')}</td>
      </tr>`).join('') || `<tr><td colspan="8" class="vazio">Nenhum abastecimento no filtro.</td></tr>`

      return filtrada
    }
    let filtrada = preencherTabela()
    $('#pn-busca').oninput = () => { filtrada = preencherTabela() }

    $('#pn-csv').onclick = () => {
      exportarCsv('abastecimentos.csv',
        ['Data', 'Veículo/Equip.', 'Placa', 'Combustível', 'Litros', 'Valor estimado', 'Destino', 'Responsável'],
        filtrada.map(a => [
          fmtQuando(a.data_abastecimento) ?? '', a.veiculo?.descricao ?? a.equipamento?.tag ?? '',
          a.veiculo?.placa ?? '', ROTULO_COMBUSTIVEL[a.tipo] ?? a.tipo,
          fmtNum(a.litros), fmtNum(valorEstimado(a)), ROTULO_DESTINO_ABASTECIMENTO[a.destino] ?? '', a.bombista?.nome ?? ''
        ]))
    }
  }

  carregar()
}

// busca a última leitura final da bomba para aquele combustível, pra sugerir
// a leitura inicial do próximo abastecimento (a bomba é cumulativa)
async function ultimaLeituraBomba (tipo) {
  const { data } = await db.from('abastecimento').select('leitura_final')
    .eq('tipo', tipo).not('leitura_final', 'is', null)
    .order('data_abastecimento', { ascending: false }).limit(1)
  return data?.[0]?.leitura_final ?? null
}

function campoAbastecimento (a) {
  const agora = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16)
  const dataInicial = a?.data_abastecimento ? new Date(a.data_abastecimento.slice(0, 19)).toISOString().slice(0, 16) : agora
  const ehVeiculo = a ? !!a.veiculo_id : true
  return `
    <div class="form-grade">
      <div class="campo"><label>Combustível *</label>
        <select id="ab-tipo">${TIPOS_COMBUSTIVEL.map(t => `<option value="${t}" ${a?.tipo === t ? 'selected' : ''}>${ROTULO_COMBUSTIVEL[t]}</option>`).join('')}</select></div>
      <div class="campo"><label>Aplicar a *</label>
        <select id="ab-alvo-tipo">
          <option value="veiculo" ${ehVeiculo ? 'selected' : ''}>Veículo</option>
          <option value="equipamento" ${!ehVeiculo ? 'selected' : ''}>Equipamento</option>
        </select></div>
      <div class="campo ${ehVeiculo ? '' : 'oculto'}" id="ab-campo-veiculo"><label>Veículo *</label>
        <select id="ab-veiculo">${COMB_CACHE.veiculos.map(v => `<option value="${v.id}" ${a?.veiculo_id === v.id ? 'selected' : ''}>${esc(v.placa)}${v.descricao ? ' — ' + esc(v.descricao) : ''}</option>`).join('')}</select></div>
      <div class="campo ${ehVeiculo ? 'oculto' : ''}" id="ab-campo-equipamento"><label>Equipamento *</label>
        <select id="ab-equipamento">${COMB_CACHE.equipamentos.map(e => `<option value="${e.id}" ${a?.equipamento_id === e.id ? 'selected' : ''}>${esc(e.tag)}${e.descricao ? ' — ' + esc(e.descricao) : ''}</option>`).join('')}</select></div>
      <div class="campo"><label>Data e hora *</label><input type="datetime-local" id="ab-data" value="${dataInicial}"></div>
      <div class="campo"><label>Horímetro / odômetro do veículo</label>
        <input id="ab-horimetro" inputmode="decimal" placeholder="se aplicável" value="${a?.horimetro_odometro ?? ''}"></div>
      <div class="campo"><label>Leitura inicial da bomba (L)</label>
        <input id="ab-leitura-ini" inputmode="decimal" placeholder="preenche sozinho" value="${a?.leitura_inicial ?? ''}"></div>
      <div class="campo"><label>Leitura final da bomba (L)</label>
        <input id="ab-leitura-fim" inputmode="decimal" placeholder="Ex: 541081" value="${a?.leitura_final ?? ''}"></div>
      <div class="campo"><label>Litros abastecidos *</label>
        <input id="ab-litros" inputmode="decimal" placeholder="calculado pela leitura" value="${a?.litros ?? ''}"></div>
      <div class="campo"><label>Responsável pelo abastecimento (bombista)</label>
        <select id="ab-bombista"><option value="">—</option>${COMB_CACHE.pessoas.map(p => `<option value="${p.id}" ${a?.bombista_id === p.id ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}</select></div>
      <div class="campo"><label>Operador responsável pelo equipamento</label>
        <select id="ab-operador"><option value="">—</option>${COMB_CACHE.pessoas.map(p => `<option value="${p.id}" ${a?.operador_id === p.id ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}</select></div>
      <div class="campo"><label>Setor de destino *</label>
        <select id="ab-destino">${DESTINOS_ABASTECIMENTO.map(d => `<option value="${d}" ${a?.destino === d ? 'selected' : ''}>${ROTULO_DESTINO_ABASTECIMENTO[d]}</option>`).join('')}</select></div>
    </div>
    <p class="texto-dim2" id="ab-conf" style="font-size:12px;margin-top:8px;min-height:16px;"></p>`
}

function ligarCalculoLitros (raiz = document) {
  const ini = raiz.querySelector('#ab-leitura-ini'), fim = raiz.querySelector('#ab-leitura-fim')
  const litros = raiz.querySelector('#ab-litros'), conf = raiz.querySelector('#ab-conf')
  const recalcular = () => {
    const i = numeroBR(ini.value), f = numeroBR(fim.value)
    if (i === null || f === null) { conf.textContent = ''; return }
    if (f < i) { conf.textContent = 'A leitura final não pode ser menor que a inicial.'; conf.style.color = 'var(--warn-text)'; return }
    litros.value = fmtNum(f - i)
    conf.textContent = 'Confirmo que a leitura final é maior ou igual à inicial.'
    conf.style.color = 'var(--dim2)'
  }
  ini.oninput = recalcular; fim.oninput = recalcular
}

// ----- Abastecer -----
function combAbastecer (alvo, editavel) {
  if (!editavel) { alvo.innerHTML = `<div class="panel" style="padding:22px;">
    <p class="texto-dim">Você pode consultar, mas não lançar abastecimentos.</p></div>`; return }

  alvo.innerHTML = `
    <div class="panel" style="padding:20px;max-width:860px;">
      <h3 style="font-family:var(--serif);font-size:18px;margin:0 0 14px;">Novo abastecimento</h3>
      ${campoAbastecimento()}
      <div class="campo" style="margin-top:12px;"><label>Comprovante (foto do painel da bomba)</label>
        <input type="file" id="ab-arquivo1" accept="image/*,application/pdf">
        <span class="texto-dim2" style="font-size:11px;">opcional — até 2 arquivos</span></div>
      <div class="campo" style="margin-top:8px;">
        <input type="file" id="ab-arquivo2" accept="image/*,application/pdf"></div>
      <div class="acoes"><button class="btn" id="ab-salvar">Salvar abastecimento</button></div>
      <div class="recado oculto" id="ab-recado"></div>
    </div>`

  ligarCalculoLitros()
  $('#ab-alvo-tipo').onchange = () => {
    const ehVeiculo = $('#ab-alvo-tipo').value === 'veiculo'
    $('#ab-campo-veiculo').classList.toggle('oculto', !ehVeiculo)
    $('#ab-campo-equipamento').classList.toggle('oculto', ehVeiculo)
  }
  $('#ab-tipo').onchange = async () => {
    const ultima = await ultimaLeituraBomba($('#ab-tipo').value)
    if (ultima !== null) { $('#ab-leitura-ini').value = fmtNum(ultima) }
  }
  $('#ab-tipo').onchange()

  const aviso = (t, alerta = true) => {
    const el = $('#ab-recado'); el.textContent = t; el.classList.remove('oculto')
    el.style.borderColor = alerta ? 'var(--warn-text)' : 'var(--line2)'
    el.style.color = alerta ? 'var(--warn-text)' : 'var(--dim)'
  }

  $('#ab-salvar').onclick = async () => {
    const litros = numeroBR($('#ab-litros').value)
    if (!litros || litros <= 0) { aviso('Informe os litros abastecidos.'); return }
    const ehVeiculo = $('#ab-alvo-tipo').value === 'veiculo'
    if (ehVeiculo && !COMB_CACHE.veiculos.length) { aviso('Cadastre um veículo na aba Frota antes de abastecer.'); return }
    if (!ehVeiculo && !COMB_CACHE.equipamentos.length) { aviso('Cadastre um equipamento em Manutenção antes de abastecer.'); return }
    const ini = numeroBR($('#ab-leitura-ini').value), fim = numeroBR($('#ab-leitura-fim').value)
    if (ini !== null && fim !== null && fim < ini) { aviso('A leitura final não pode ser menor que a inicial.'); return }

    const btn = $('#ab-salvar'); btn.disabled = true; btn.textContent = 'Salvando...'
    const { data: novo, error } = await db.from('abastecimento').insert({
      tipo: $('#ab-tipo').value,
      veiculo_id: ehVeiculo ? $('#ab-veiculo').value : null,
      equipamento_id: ehVeiculo ? null : $('#ab-equipamento').value,
      data_abastecimento: new Date($('#ab-data').value).toISOString(),
      litros,
      horimetro_odometro: numeroBR($('#ab-horimetro').value),
      leitura_inicial: ini,
      leitura_final: fim,
      bombista_id: $('#ab-bombista').value || null,
      operador_id: $('#ab-operador').value || null,
      destino: $('#ab-destino').value
    }).select('id').single()

    if (error) { btn.disabled = false; btn.textContent = 'Salvar abastecimento'; aviso(error.message); return }

    try {
      for (const inputId of ['ab-arquivo1', 'ab-arquivo2']) {
        const arquivo = $('#' + inputId).files[0]
        if (!arquivo) continue
        const { caminho, nome } = await subirComprovante(arquivo, `abastecimento/${novo.id}`)
        await db.from('anexo').insert({ entidade: 'ABASTECIMENTO', registro_id: novo.id, tipo: 'comprovante', nome_arquivo: nome, storage_path: caminho })
      }
    } catch (e) { aviso('Abastecimento salvo, mas o comprovante falhou: ' + e.message); btn.disabled = false; btn.textContent = 'Salvar abastecimento'; return }

    btn.disabled = false; btn.textContent = 'Salvar abastecimento'
    aviso('Abastecimento salvo.', false)
    $('#ab-litros').value = ''; $('#ab-horimetro').value = ''
    $('#ab-leitura-fim').value = ''; $('#ab-conf').textContent = ''
    $('#ab-arquivo1').value = ''; $('#ab-arquivo2').value = ''
    $('#ab-tipo').onchange()
  }
}

// ----- Editar um abastecimento já lançado -----
function editarAbastecimento (a, aoFechar) {
  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = `<div class="modal" style="max-width:820px;">
    <h3>Editar abastecimento</h3>
    ${campoAbastecimento(a)}
    <div class="acoes"><button class="btn" id="ea-salvar">Salvar alterações</button>
      <button class="btn-secundario" id="ea-cancelar">Cancelar</button></div>
    <div class="recado oculto" id="ea-recado"></div>
  </div>`
  document.body.appendChild(fundo)
  const fechar = () => fundo.remove()
  fundo.querySelector('#ea-cancelar').onclick = fechar
  fundo.onclick = e => { if (e.target === fundo) fechar() }

  ligarCalculoLitros(fundo)
  fundo.querySelector('#ab-alvo-tipo').onchange = () => {
    const ehVeiculo = fundo.querySelector('#ab-alvo-tipo').value === 'veiculo'
    fundo.querySelector('#ab-campo-veiculo').classList.toggle('oculto', !ehVeiculo)
    fundo.querySelector('#ab-campo-equipamento').classList.toggle('oculto', ehVeiculo)
  }

  const aviso = t => {
    const el = fundo.querySelector('#ea-recado'); el.textContent = t; el.classList.remove('oculto')
    el.style.borderColor = 'var(--warn-text)'; el.style.color = 'var(--warn-text)'
  }

  fundo.querySelector('#ea-salvar').onclick = async () => {
    const litros = numeroBR(fundo.querySelector('#ab-litros').value)
    if (!litros || litros <= 0) { aviso('Informe os litros abastecidos.'); return }
    const ehVeiculo = fundo.querySelector('#ab-alvo-tipo').value === 'veiculo'
    const ini = numeroBR(fundo.querySelector('#ab-leitura-ini').value)
    const fim = numeroBR(fundo.querySelector('#ab-leitura-fim').value)
    if (ini !== null && fim !== null && fim < ini) { aviso('A leitura final não pode ser menor que a inicial.'); return }

    const { error } = await db.from('abastecimento').update({
      tipo: fundo.querySelector('#ab-tipo').value,
      veiculo_id: ehVeiculo ? fundo.querySelector('#ab-veiculo').value : null,
      equipamento_id: ehVeiculo ? null : fundo.querySelector('#ab-equipamento').value,
      data_abastecimento: new Date(fundo.querySelector('#ab-data').value).toISOString(),
      litros,
      horimetro_odometro: numeroBR(fundo.querySelector('#ab-horimetro').value),
      leitura_inicial: ini,
      leitura_final: fim,
      bombista_id: fundo.querySelector('#ab-bombista').value || null,
      operador_id: fundo.querySelector('#ab-operador').value || null,
      destino: fundo.querySelector('#ab-destino').value
    }).eq('id', a.id)
    if (error) { aviso(error.message); return }
    fechar(); aoFechar()
  }
}

// ----- Abastecimentos (histórico) — editar é de quem lança; excluir é só do Administrador -----
async function combAbastecimentos (alvo, editavel) {
  const hoje = new Date().toISOString().slice(0, 10)
  const de = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10)
  const podeExcluir = ehAdminSistema()

  alvo.innerHTML = `
    <div class="filtros" style="margin-bottom:14px;">
      <div class="campo"><label>De</label><input type="date" id="ah-de" value="${de}"></div>
      <div class="campo"><label>Até</label><input type="date" id="ah-ate" value="${hoje}"></div>
      <div class="campo"><label>Combustível</label>
        <select id="ah-tipo"><option value="">todos</option>
          ${TIPOS_COMBUSTIVEL.map(t => `<option value="${t}">${ROTULO_COMBUSTIVEL[t]}</option>`).join('')}</select></div>
      <div class="campo" style="flex:1;min-width:180px;"><label>Buscar</label>
        <input id="ah-busca" placeholder="placa, tag ou pessoa"></div>
      <button class="btn" id="ah-buscar">Buscar</button>
    </div>
    <div id="ah-lista"></div>`

  const buscar = async () => {
    const { data, error } = await db.from('abastecimento').select(`
      id, tipo, litros, data_abastecimento, horimetro_odometro, leitura_inicial, leitura_final,
      veiculo_id, equipamento_id, bombista_id, operador_id, destino,
      veiculo:veiculo_id ( placa, descricao ), equipamento:equipamento_id ( tag, descricao ),
      bombista:bombista_id ( nome ), operador:operador_id ( nome )
    `).gte('data_abastecimento', $('#ah-de').value)
      .lte('data_abastecimento', $('#ah-ate').value + 'T23:59:59')
      .order('data_abastecimento', { ascending: false }).limit(500)

    if (error) { $('#ah-lista').innerHTML = `<p class="vazio">${esc(error.message)}</p>`; return }

    let lista = $('#ah-tipo').value ? data.filter(a => a.tipo === $('#ah-tipo').value) : data
    const termo = $('#ah-busca').value.trim().toLowerCase()
    if (termo) lista = lista.filter(a =>
      `${a.veiculo?.placa ?? ''} ${a.equipamento?.tag ?? ''} ${a.bombista?.nome ?? ''} ${a.operador?.nome ?? ''}`
        .toLowerCase().includes(termo))

    const total = lista.reduce((s, a) => s + Number(a.litros || 0), 0)
    $('#kpis').innerHTML = kpi('Abastecimentos', lista.length) + kpi('Total de litros', fmtNum(total) + ' L')

    const nCols = 8 + (editavel ? 1 : 0) + (podeExcluir ? 1 : 0)
    $('#ah-lista').innerHTML = `
      <div class="panel" style="padding:0;"><div class="tabela-scroll">
        <table><thead><tr>
          <th>Quando</th><th>Combustível</th><th>Veículo / equipamento</th>
          <th class="num">Litros</th><th>Bombista</th><th>Operador</th><th>Destino</th><th>Comprov.</th>
          ${editavel ? '<th></th>' : ''}${podeExcluir ? '<th></th>' : ''}
        </tr></thead><tbody>
          ${lista.map(a => `<tr>
            <td>${fmtQuando(a.data_abastecimento) ?? '—'}</td>
            <td><span class="chip">${esc(ROTULO_COMBUSTIVEL[a.tipo] ?? a.tipo)}</span></td>
            <td>${esc(nomeAlvoAbastecimento(a))}</td>
            <td class="num">${fmtNum(a.litros)}</td>
            <td class="texto-dim">${esc(a.bombista?.nome ?? '—')}</td>
            <td class="texto-dim">${esc(a.operador?.nome ?? '—')}</td>
            <td class="texto-dim">${esc(ROTULO_DESTINO_ABASTECIMENTO[a.destino] ?? '—')}</td>
            <td><button class="btn-secundario mini" data-ver-anexo="${a.id}">ver</button></td>
            ${editavel ? `<td><button class="btn-secundario mini" data-edit-ab="${a.id}">editar</button></td>` : ''}
            ${podeExcluir ? `<td><button class="btn-secundario mini" data-del-ab="${a.id}">excluir</button></td>` : ''}
          </tr>`).join('') || `<tr><td colspan="${nCols}" class="vazio">Nenhum abastecimento no filtro.</td></tr>`}
        </tbody></table>
      </div></div>`

    $('#ah-lista').querySelectorAll('[data-ver-anexo]').forEach(b => {
      b.onclick = () => verAnexosAbastecimento(b.dataset.verAnexo)
    })

    if (editavel) {
      $('#ah-lista').querySelectorAll('[data-edit-ab]').forEach(b => {
        b.onclick = () => {
          const a = data.find(x => x.id === b.dataset.editAb)
          if (a) editarAbastecimento(a, buscar)
        }
      })
    }

    if (podeExcluir) {
      $('#ah-lista').querySelectorAll('[data-del-ab]').forEach(b => {
        b.onclick = async () => {
          if (!confirm('Excluir este abastecimento? Essa ação é só do administrador e não tem volta.')) return
          const { error } = await db.from('abastecimento').delete().eq('id', b.dataset.delAb)
          if (error) { alert(error.message); return }
          buscar()
        }
      })
    }
  }

  $('#ah-buscar').onclick = buscar
  $('#ah-busca').oninput = buscar
  $('#ah-tipo').onchange = buscar
  buscar()
}

// ----- Registrar entrada (compra de combustível) -----
// Campos do formulário: Data e Hora da Entrada, Tipo de Combustível, Quantidade (L),
// Responsável pelo Recebimento, Documento de Referência (NF/OC/link), Observações,
// Valor total da Nota — mesmos campos do Google Forms usado hoje pela equipe.
function campoEntradaCombustivel (e) {
  const agora = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16)
  const dataInicial = e?.data_entrada ? new Date(e.data_entrada.slice(0, 19)).toISOString().slice(0, 16) : agora
  return `
    <div class="form-grade">
      <div class="campo"><label>Data e hora da entrada *</label>
        <input type="datetime-local" id="en-data" value="${dataInicial}"></div>
      <div class="campo"><label>Tipo de combustível *</label>
        <select id="en-tipo">${TIPOS_COMBUSTIVEL.map(t => `<option value="${t}" ${e?.tipo === t ? 'selected' : ''}>${ROTULO_COMBUSTIVEL[t]}</option>`).join('')}</select></div>
      <div class="campo"><label>Quantidade recebida (litros) *</label>
        <input id="en-litros" inputmode="decimal" placeholder="Ex: 5000" value="${e?.litros ?? ''}"></div>
      <div class="campo"><label>Responsável pelo recebimento *</label>
        <select id="en-recebido">${COMB_CACHE.pessoas.map(p => `<option value="${p.id}" ${(e ? e.recebido_por === p.id : p.id === PERFIL.pessoaId) ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}</select></div>
      <div class="campo"><label>Documento de referência</label>
        <input id="en-nf" placeholder="NF, OC ou link do comprovante" value="${esc(e?.numero_nf ?? '')}"></div>
      <div class="campo"><label>Valor total da nota (R$)</label>
        <input id="en-valor" inputmode="decimal" placeholder="opcional" value="${e?.valor_total ?? ''}"></div>
    </div>
    <div class="campo" style="margin-top:12px;"><label>Observações</label>
      <textarea id="en-obs" style="min-height:70px;" placeholder="opcional">${esc(e?.observacoes ?? '')}</textarea></div>`
}

function lerCampoEntradaCombustivel (raiz = document) {
  return {
    tipo: raiz.querySelector('#en-tipo').value,
    litros: numeroBR(raiz.querySelector('#en-litros').value),
    data_entrada: raiz.querySelector('#en-data').value ? new Date(raiz.querySelector('#en-data').value).toISOString() : null,
    recebido_por: raiz.querySelector('#en-recebido').value || null,
    numero_nf: raiz.querySelector('#en-nf').value.trim() || null,
    valor_total: numeroBR(raiz.querySelector('#en-valor').value),
    observacoes: raiz.querySelector('#en-obs').value.trim() || null
  }
}

function combEntrada (alvo, editavel) {
  if (!editavel) { alvo.innerHTML = `<div class="panel" style="padding:22px;">
    <p class="texto-dim">Você pode consultar, mas não registrar entradas.</p></div>`; return }

  alvo.innerHTML = `
    <div class="panel" style="padding:20px;max-width:760px;">
      <h3 style="font-family:var(--serif);font-size:18px;margin:0 0 14px;">Registrar entrada de combustível</h3>
      ${campoEntradaCombustivel()}
      <div class="acoes"><button class="btn" id="en-salvar">Salvar entrada</button></div>
      <div class="recado oculto" id="en-recado"></div>
    </div>`

  const aviso = (t, alerta = true) => {
    const el = $('#en-recado'); el.textContent = t; el.classList.remove('oculto')
    el.style.borderColor = alerta ? 'var(--warn-text)' : 'var(--line2)'
    el.style.color = alerta ? 'var(--warn-text)' : 'var(--dim)'
  }

  $('#en-salvar').onclick = async () => {
    const corpo = lerCampoEntradaCombustivel()
    if (!corpo.litros || corpo.litros <= 0) { aviso('Informe os litros recebidos.'); return }
    if (!corpo.recebido_por) { aviso('Escolha quem recebeu.'); return }

    const btn = $('#en-salvar'); btn.disabled = true; btn.textContent = 'Salvando...'
    const { error } = await db.from('entrada_combustivel').insert(corpo)
    btn.disabled = false; btn.textContent = 'Salvar entrada'
    if (error) { aviso(error.message); return }
    aviso('Entrada registrada.', false)
    $('#en-litros').value = ''; $('#en-nf').value = ''; $('#en-valor').value = ''; $('#en-obs').value = ''
  }
}

// ----- Editar uma entrada já lançada (não mexe em quem pode excluir) -----
function editarEntradaCombustivel (e, aoFechar) {
  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = `<div class="modal" style="max-width:700px;">
    <h3>Editar entrada de combustível</h3>
    ${campoEntradaCombustivel(e)}
    <div class="acoes"><button class="btn" id="ee-salvar">Salvar alterações</button>
      <button class="btn-secundario" id="ee-cancelar">Cancelar</button></div>
    <div class="recado oculto" id="ee-recado"></div>
  </div>`
  document.body.appendChild(fundo)
  const fechar = () => fundo.remove()
  fundo.querySelector('#ee-cancelar').onclick = fechar
  fundo.onclick = ev => { if (ev.target === fundo) fechar() }

  const aviso = t => {
    const el = fundo.querySelector('#ee-recado'); el.textContent = t; el.classList.remove('oculto')
    el.style.borderColor = 'var(--warn-text)'; el.style.color = 'var(--warn-text)'
  }

  fundo.querySelector('#ee-salvar').onclick = async () => {
    const corpo = lerCampoEntradaCombustivel(fundo)
    if (!corpo.litros || corpo.litros <= 0) { aviso('Informe os litros recebidos.'); return }
    if (!corpo.recebido_por) { aviso('Escolha quem recebeu.'); return }
    const { error } = await db.from('entrada_combustivel').update(corpo).eq('id', e.id)
    if (error) { aviso(error.message); return }
    fechar(); aoFechar()
  }
}

// ----- Relatório -----
function combRelatorio (alvo) {
  const hoje = new Date().toISOString().slice(0, 10)
  const inicio = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0, 10)

  alvo.innerHTML = `
    <div class="panel" style="padding:20px;max-width:720px;">
      <h3 style="font-family:var(--serif);font-size:18px;margin:0 0 6px;">Gerar relatório</h3>
      <p class="texto-dim" style="font-size:13px;margin-top:0;">Escolha o período e gere um relatório pronto para imprimir ou salvar em PDF.</p>
      <div class="form-grade">
        <div class="campo"><label>De</label><input type="date" id="cr-de" value="${inicio}"></div>
        <div class="campo"><label>Até</label><input type="date" id="cr-ate" value="${hoje}"></div>
      </div>
      <div class="acoes"><button class="btn" id="cr-gerar">Gerar relatório</button></div>
    </div>`

  $('#cr-gerar').onclick = async () => {
    const de = $('#cr-de').value, ate = $('#cr-ate').value
    const [{ data: entradas }, { data: saidas }] = await Promise.all([
      db.from('entrada_combustivel').select('tipo,litros,valor_total,data_entrada,fornecedor:fornecedor_id(nome)')
        .gte('data_entrada', de).lte('data_entrada', ate + 'T23:59:59'),
      db.from('abastecimento').select('tipo,litros,data_abastecimento,veiculo:veiculo_id(placa),equipamento:equipamento_id(tag)')
        .gte('data_abastecimento', de).lte('data_abastecimento', ate + 'T23:59:59')
    ])

    const porTipo = {}
    TIPOS_COMBUSTIVEL.forEach(t => { porTipo[t] = { entrou: 0, saiu: 0, custo: 0 } })
    ;(entradas || []).forEach(e => { porTipo[e.tipo].entrou += Number(e.litros || 0); porTipo[e.tipo].custo += Number(e.valor_total || 0) })
    ;(saidas || []).forEach(s => { porTipo[s.tipo].saiu += Number(s.litros || 0) })

    const porVeiculo = {}
    ;(saidas || []).forEach(s => {
      const k = s.veiculo?.placa || s.equipamento?.tag || '—'
      porVeiculo[k] = (porVeiculo[k] || 0) + Number(s.litros || 0)
    })

    const custoTotal = Object.values(porTipo).reduce((s, v) => s + v.custo, 0)
    const litrosTotal = Object.values(porTipo).reduce((s, v) => s + v.entrou, 0)

    const corpo = `
      <div class="doc-linha">
        ${docBloco('Período', docLinha('De', fmtData(de)) + docLinha('Até', fmtData(ate)) + docLinha('Emitido por', PERFIL.nome))}
        ${docBloco('Resumo', docLinha('Litros comprados', fmtNum(litrosTotal)) + docLinha('Gasto total', 'R$ ' + fmtNum(custoTotal)))}
      </div>

      ${docBloco('Movimento por combustível', `
        <table><thead><tr><th>Combustível</th><th class="num">Entradas (L)</th>
          <th class="num">Abastecido (L)</th><th class="num">Gasto (R$)</th></tr></thead><tbody>
          ${TIPOS_COMBUSTIVEL.map(t => `<tr>
            <td>${esc(ROTULO_COMBUSTIVEL[t])}</td>
            <td class="num">${fmtNum(porTipo[t].entrou)}</td>
            <td class="num">${fmtNum(porTipo[t].saiu)}</td>
            <td class="num">${fmtNum(porTipo[t].custo)}</td>
          </tr>`).join('')}
        </tbody></table>`)}

      ${docBloco('Consumo por veículo/equipamento', `
        <table><thead><tr><th>Veículo / equipamento</th><th class="num">Litros</th></tr></thead><tbody>
          ${Object.entries(porVeiculo).sort((a, b) => b[1] - a[1]).map(([n, l]) => `<tr>
            <td>${esc(n)}</td><td class="num">${fmtNum(l)}</td></tr>`).join('') ||
            `<tr><td colspan="2" class="vazio">Sem abastecimentos no período.</td></tr>`}
        </tbody></table>`)}

      ${docAssinaturas([['Emitido por', PERFIL.nome], ['Frota', ''], ['Diretoria', '']])}`

    const fundo = document.createElement('div')
    fundo.className = 'modal-fundo'
    fundo.innerHTML = documentoPDF({
      titulo: 'RELATÓRIO DE COMBUSTÍVEL',
      subtitulo: `${fmtData(de)} a ${fmtData(ate)}`, corpo,
      acoes: `<button class="btn" id="crp-imprimir">Gerar PDF</button>
        <button class="btn-secundario" id="crp-fechar">Fechar</button>`
    })
    document.body.appendChild(fundo)
    fundo.querySelector('#crp-fechar').onclick = () => fundo.remove()
    fundo.querySelector('#crp-imprimir').onclick = () => window.print()
    fundo.onclick = e => { if (e.target === fundo) fundo.remove() }
  }
}

// ---------------------------------------------------------------
// Página: Manutenção  (módulo 'manutencao')
// Sub-abas: Ordens de serviço · Abrir chamado · Equipamentos · Relatório.
// Qualquer pessoa autenticada pode ABRIR uma OS (RLS libera insert
// geral); só ADMIN/DIRETORIA/MANUTENCAO decidem status, materiais e
// cadastro de equipamento — por isso "editavel" só trava essas partes.
// ---------------------------------------------------------------
const STATUS_OS = ['ABERTA', 'EM_PROGRAMACAO', 'EM_EXECUCAO', 'AGUARDANDO_PECA', 'SERVICO_TERCEIRO', 'CONCLUIDA', 'CANCELADA']
const ROTULO_STATUS_OS = { ABERTA: 'Aberta', EM_PROGRAMACAO: 'Em programação', EM_EXECUCAO: 'Em execução',
                            AGUARDANDO_PECA: 'Aguardando peça', SERVICO_TERCEIRO: 'Serviço terceiro',
                            CONCLUIDA: 'Concluída', CANCELADA: 'Cancelada' }
const PRIORIDADE_OS = ['BAIXA', 'MEDIA', 'ALTA', 'CRITICA']
const ROTULO_PRIORIDADE_OS = { BAIXA: 'Baixa', MEDIA: 'Média', ALTA: 'Alta', CRITICA: 'Crítica' }
const AREAS_OS = ['INDUSTRIA_PLANTA', 'PATIO_ESTOQUE_CARREGAMENTO', 'EXTRACAO_MINA', 'ADMINISTRATIVO_COMERCIAL', 'OUTRO']
const ROTULO_AREA_OS = { INDUSTRIA_PLANTA: 'Indústria / Planta', PATIO_ESTOQUE_CARREGAMENTO: 'Pátio / Estoque / Carregamento',
                          ADMINISTRATIVO_COMERCIAL: 'Administrativo / Comercial (carros fora da indústria)',
                          EXTRACAO_MINA: 'Extração / Mina', OUTRO: 'Outro' }

let MANUT_CACHE = { equipamentos: [], veiculos: [], pessoas: [], setores: [], fornecedores: [] }

async function garantirManutCache () {
  if (MANUT_CACHE.pessoas.length) return
  const [{ data: equipamentos }, { data: veiculos }, { data: pessoas }, { data: setores }, { data: fornecedores }] = await Promise.all([
    db.from('equipamento').select('id,tag,descricao,setor_id,veiculo_id,status').order('tag'),
    db.from('veiculo').select('id,placa,descricao').order('placa'),
    db.from('pessoa').select('id,nome').eq('status', 'ATIVO').order('nome'),
    db.from('setor').select('id,nome').order('nome'),
    db.from('fornecedor').select('id,nome,cnpj_cpf,contato,status').order('nome')
  ])
  MANUT_CACHE = { equipamentos: equipamentos || [], veiculos: veiculos || [], pessoas: pessoas || [],
                   setores: setores || [], fornecedores: fornecedores || [] }
}

function corStatusOS (s) {
  if (s === 'CONCLUIDA') return 'badge-bom'
  if (s === 'CANCELADA') return 'texto-dim2'
  if (s === 'ABERTA') return 'badge-alerta'
  return 'chip'
}

// alvo unificado: equipamento (sem placa) ou veículo (com placa) numa lista só,
// pra usar num único dropdown de "o que recebeu a manutenção"
function alvosManutencao () {
  return [
    ...MANUT_CACHE.equipamentos.map(e => ({ valor: 'e:' + e.id, rotulo: `${e.tag}${e.descricao ? ' — ' + e.descricao : ''}` })),
    ...MANUT_CACHE.veiculos.map(v => ({ valor: 'v:' + v.id, rotulo: `${v.placa}${v.descricao ? ' — ' + v.descricao : ''}` }))
  ].sort((a, b) => a.rotulo.localeCompare(b.rotulo))
}
const nomeAlvoOS = os => os.equipamento?.tag ? `${os.equipamento.tag}${os.equipamento.descricao ? ' — ' + os.equipamento.descricao : ''}`
  : os.veiculo?.placa ? `${os.veiculo.placa}${os.veiculo.descricao ? ' — ' + os.veiculo.descricao : ''}` : (os.local_descricao || '—')

async function paginaManutencao () {
  if (!podeVer('manutencao')) { areaLivre().innerHTML =
    `<div class="panel" style="padding:22px;"><p class="texto-dim">
     Você não tem acesso à Manutenção.</p></div>`; return }

  const editavel = podeEditar('manutencao')
  $('#subtitulo-pagina').textContent = 'Ordens de serviço e equipamentos'
  const area = areaLivre()
  area.innerHTML = `<p class="texto-dim2">carregando...</p>`

  const [{ data: equipamentos }, { data: veiculos }, { data: pessoas }, { data: setores }] = await Promise.all([
    db.from('equipamento').select('id,tag,descricao,setor_id,veiculo_id,status').order('tag'),
    db.from('veiculo').select('id,placa,descricao').order('placa'),
    db.from('pessoa').select('id,nome').eq('status', 'ATIVO').order('nome'),
    db.from('setor').select('id,nome').order('nome')
  ])
  const { data: fornecedores } = await db.from('fornecedor').select('id,nome,cnpj_cpf,contato,status').order('nome')
  MANUT_CACHE = { equipamentos: equipamentos || [], veiculos: veiculos || [], pessoas: pessoas || [],
                   setores: setores || [], fornecedores: fornecedores || [] }

  const abas = [['painel', 'Painel'], ['lancar', 'Lançar manutenção'], ['os', 'Ordens de serviço'],
                ['nova', 'Abrir chamado'], ['terceiros', 'Terceiros'], ['custos', 'Custos'],
                ['equipamentos', 'Equipamentos'], ['relatorio', 'Relatório']]

  area.innerHTML = `
    <div class="subabas">
      ${abas.map((a, i) => `<button data-sub="${a[0]}" class="${i === 0 ? 'ativo' : ''}">${a[1]}</button>`).join('')}
    </div>
    <div id="sub-manutencao"></div>`

  area.querySelectorAll('.subabas button').forEach(b => {
    b.onclick = () => {
      area.querySelectorAll('.subabas button').forEach(x => x.classList.toggle('ativo', x === b))
      abrirManutencao(b.dataset.sub, editavel)
    }
  })
  abrirManutencao('painel', editavel)
}

function abrirManutencao (sub, editavel) {
  const alvo = $('#sub-manutencao')
  alvo.innerHTML = `<p class="texto-dim2">carregando...</p>`
  $('#kpis').innerHTML = ''
  if (sub === 'painel') manutPainel(alvo, editavel)
  if (sub === 'lancar') manutLancar(alvo, editavel)
  if (sub === 'os') manutOS(alvo, editavel)
  if (sub === 'nova') manutNova(alvo)
  if (sub === 'terceiros') manutTerceiros(alvo, editavel)
  if (sub === 'custos') manutCustos(alvo, editavel)
  if (sub === 'equipamentos') manutEquipamentos(alvo, editavel)
  if (sub === 'relatorio') manutRelatorio(alvo)
}

// ---------------------------------------------------------------
// Painel de Manutenção — mesmo padrão visual do Painel de Combustível
// (reaproveita svgDonut/barrasHorizontais/barrasVerticais).
// ---------------------------------------------------------------
async function manutPainel (alvo, editavel) {
  alvo.innerHTML = `<p class="texto-dim2">carregando...</p>`

  const { data, error } = await db.from('ordem_servico').select(`
    id, codigo, status, prioridade, area, data_solicitacao, data_limite, data_conclusao,
    valor_pecas, valor_terceiros, valor_total, tipo,
    equipamento:equipamento_id ( tag, descricao ), veiculo:veiculo_id ( placa, descricao ),
    solicitante:solicitante_id ( nome ), responsavel:responsavel_id ( nome )
  `).order('data_solicitacao', { ascending: false }).limit(2000)

  if (faltaMigracao(error)) { alvo.innerHTML = `<p class="vazio">${esc(error.message)}</p>`; return }
  const lista = data || []
  const hoje = hojeISO()

  const porStatus = {}
  STATUS_OS.forEach(s => { porStatus[s] = 0 })
  lista.forEach(os => { porStatus[os.status] = (porStatus[os.status] || 0) + 1 })

  const emAndamento = (porStatus.EM_PROGRAMACAO || 0) + (porStatus.EM_EXECUCAO || 0)
  const criticas = lista.filter(os => os.prioridade === 'CRITICA').length
  const atrasadas = lista.filter(os => os.data_limite && os.data_limite < hoje &&
    !['CONCLUIDA', 'CANCELADA'].includes(os.status)).length
  const valorTotal = lista.reduce((s, os) => s + Number(os.valor_total || 0), 0)

  const kpiCard = (rot, val, nota, cor) => `
    <div class="bloco" style="${cor ? `background:${cor};color:#fff;` : ''}">
      <div class="rot" style="${cor ? 'color:rgba(255,255,255,.85);' : ''}">${esc(rot)}</div>
      <div class="val" style="${cor ? 'color:#fff;' : ''}">${val}</div>
      ${nota ? `<div class="nota" style="${cor ? 'color:rgba(255,255,255,.75);' : ''}">${esc(nota)}</div>` : ''}
    </div>`

  const statusItens = [
    ['ABERTA', 'Abertas'], ['EM_PROGRAMACAO', 'Em programação'], ['EM_EXECUCAO', 'Em execução'],
    ['AGUARDANDO_PECA', 'Aguard. peça'], ['SERVICO_TERCEIRO', 'Serviço terceiro'], ['CONCLUIDA', 'Concluídas']
  ]
  const barrasStatus = statusItens.map(([k, rot]) => ({ rotulo: rot, valor: porStatus[k] || 0 }))

  const donutStatus = [
    { rotulo: 'Concluídas', valor: porStatus.CONCLUIDA || 0 },
    { rotulo: 'Em andamento', valor: emAndamento },
    { rotulo: 'Demais', valor: lista.length - (porStatus.CONCLUIDA || 0) - emAndamento }
  ]

  // consumo por equipamento/veículo (valor total)
  const gastoPorAlvo = {}
  lista.forEach(os => {
    const v = Number(os.valor_total || 0)
    if (!v) return
    const k = nomeAlvoOS(os)
    gastoPorAlvo[k] = (gastoPorAlvo[k] || 0) + v
  })
  const topGasto = Object.entries(gastoPorAlvo).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([rotulo, valor]) => ({ rotulo, valor }))

  alvo.innerHTML = `
    <div class="panel" style="padding:22px;margin-bottom:16px;background:var(--rust);color:#fff;
      display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;">
      <div>
        <div style="font-size:12px;text-transform:uppercase;letter-spacing:.5px;opacity:.85;">Total geral de ordens de serviço</div>
        <div style="font-family:var(--serif);font-size:38px;margin-top:4px;">${lista.length}</div>
      </div>
      <div style="display:flex;gap:20px;flex-wrap:wrap;">
        <div><div style="font-size:11px;opacity:.8;">Em andamento</div><div style="font-size:19px;">${emAndamento}</div></div>
        <div><div style="font-size:11px;opacity:.8;">Concluídas</div><div style="font-size:19px;">${porStatus.CONCLUIDA || 0}</div></div>
        <div><div style="font-size:11px;opacity:.8;">Críticas</div><div style="font-size:19px;">${criticas}</div></div>
        <div><div style="font-size:11px;opacity:.8;">Atrasadas</div><div style="font-size:19px;">${atrasadas}</div></div>
      </div>
    </div>

    <div class="resumo-topo" style="margin-bottom:18px;">
      ${kpiCard('Total', lista.length, 'ordens registradas', 'var(--rust)')}
      ${kpiCard('Concluídas', porStatus.CONCLUIDA || 0, 'finalizadas', '#3f8f5f')}
      ${kpiCard('Abertas', porStatus.ABERTA || 0, 'aguardando ação', '#4b5fd0')}
      ${kpiCard('Em programação', porStatus.EM_PROGRAMACAO || 0, 'em planejamento', '#c8a11a')}
      ${kpiCard('Em execução', porStatus.EM_EXECUCAO || 0, 'em atendimento', '#3a8fc8')}
      ${kpiCard('Aguard. peça', porStatus.AGUARDANDO_PECA || 0, 'dependência externa', '#8a5fc8')}
      ${kpiCard('Serviço terceiro', porStatus.SERVICO_TERCEIRO || 0, 'fornecedor externo', '#c85050')}
      ${kpiCard('Críticas', criticas, 'maior prioridade', '#8a2020')}
      ${kpiCard('Atrasadas', atrasadas, 'prazo vencido', '#4a4a55')}
      ${kpiCard('Valor total', 'R$ ' + fmtNum(valorTotal), 'peças + terceiros')}
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;" class="grade-painel-comb">
      <div class="panel" style="padding:18px;">
        <h3 style="font-family:var(--serif);font-size:15px;margin:0 0 12px;">Status das OS</h3>
        ${barrasHorizontais(barrasStatus, { unidade: '', casas: 0 })}
      </div>
      <div class="panel" style="padding:18px;">
        <h3 style="font-family:var(--serif);font-size:15px;margin:0 0 12px;">Proporção geral</h3>
        ${svgDonut(donutStatus)}
      </div>
    </div>

    <div class="panel" style="padding:18px;margin-bottom:16px;">
      <h3 style="font-family:var(--serif);font-size:15px;margin:0 0 12px;">Maior gasto por equipamento/veículo (R$)</h3>
      ${barrasVerticais(topGasto)}
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;" class="grade-painel-comb">
      <div class="panel" style="padding:0;">
        <div style="padding:16px 18px;" class="cabeca-secao">
          <h3 style="font-family:var(--serif);font-size:15px;">Em andamento <span class="chip">${emAndamento}</span></h3>
        </div>
        <div id="mp-andamento" style="max-height:340px;overflow:auto;"></div>
      </div>
      <div class="panel" style="padding:0;">
        <div style="padding:16px 18px;" class="cabeca-secao">
          <h3 style="font-family:var(--serif);font-size:15px;">Concluídas <span class="chip">${porStatus.CONCLUIDA || 0}</span></h3>
        </div>
        <div id="mp-concluidas" style="max-height:340px;overflow:auto;"></div>
      </div>
    </div>`

  const linhaOS = os => `<div class="passo" style="cursor:pointer;padding:10px 18px;" data-abrir-os="${os.id}">
      <span class="quando" style="width:auto;">
        <span class="${corStatusOS(os.status)}" style="font-size:10px;">${esc(ROTULO_STATUS_OS[os.status] ?? os.status)}</span>
      </span>
      <span><b>${esc(os.codigo)}</b>
        <span class="texto-dim2"> — ${esc(nomeAlvoOS(os))}</span>
        ${os.prioridade ? `<br><span class="texto-dim2" style="font-size:11.5px;">${esc(ROTULO_PRIORIDADE_OS[os.prioridade] ?? '')}${os.tipo ? ' · ' + esc(os.tipo) : ''}</span>` : ''}
      </span>
    </div>`

  const andamento = lista.filter(os => ['EM_PROGRAMACAO', 'EM_EXECUCAO', 'AGUARDANDO_PECA', 'SERVICO_TERCEIRO', 'ABERTA'].includes(os.status))
  const concluidas = lista.filter(os => os.status === 'CONCLUIDA')
  $('#mp-andamento').innerHTML = andamento.map(linhaOS).join('') || `<p class="vazio">Nenhuma OS em andamento.</p>`
  $('#mp-concluidas').innerHTML = concluidas.slice(0, 100).map(linhaOS).join('') || `<p class="vazio">Nenhuma OS concluída.</p>`

  alvo.querySelectorAll('[data-abrir-os]').forEach(el => {
    el.onclick = () => {
      const os = lista.find(x => x.id === el.dataset.abrirOs)
      if (os) detalheOS(os, editavel, () => abrirManutencao('painel', editavel))
    }
  })
}

// ---------------------------------------------------------------
// Lançar manutenção — tela única (abre já com todos os campos,
// pensada pra quem faz a manutenção registrar o que já foi feito,
// não só abrir um chamado). Cobre tanto máquina industrial quanto
// carro/caminhão da Gefoscal, com setor/área.
// ---------------------------------------------------------------
// Área ADMINISTRATIVO_COMERCIAL (carros fora da indústria) exige 2 orçamentos,
// prazo de entrega e nota fiscal antes de aprovar — regra pedida pelo cliente.
function campoOrcamentosAdministrativo (prefixo, os) {
  return `
    <div class="oculto" id="${prefixo}-bloco-admin">
      <div class="aviso-bloqueio" style="margin-top:12px;">
        <div><b>Área administrativa/comercial exige 2 orçamentos antes de aprovar</b></div>
        <div class="form-grade" style="margin-top:8px;">
          <div class="campo"><label>Orçamento 1 — fornecedor</label>
            <select id="${prefixo}-orc1-forn"><option value="">—</option>${MANUT_CACHE.fornecedores.map(f => `<option value="${f.id}" ${f.id === os?.orcamento1_fornecedor_id ? 'selected' : ''}>${esc(f.nome)}</option>`).join('')}</select></div>
          <div class="campo"><label>Orçamento 1 — valor (R$)</label><input id="${prefixo}-orc1-valor" inputmode="decimal" value="${os?.orcamento1_valor ?? ''}"></div>
          <div class="campo"><label>Orçamento 2 — fornecedor</label>
            <select id="${prefixo}-orc2-forn"><option value="">—</option>${MANUT_CACHE.fornecedores.map(f => `<option value="${f.id}" ${f.id === os?.orcamento2_fornecedor_id ? 'selected' : ''}>${esc(f.nome)}</option>`).join('')}</select></div>
          <div class="campo"><label>Orçamento 2 — valor (R$)</label><input id="${prefixo}-orc2-valor" inputmode="decimal" value="${os?.orcamento2_valor ?? ''}"></div>
          <div class="campo"><label>Prazo de entrega *</label><input type="date" id="${prefixo}-prazo-entrega" value="${os?.prazo_entrega ?? ''}"></div>
          <div class="campo"><label>Nº da nota fiscal *</label><input id="${prefixo}-nf-numero" value="${esc(os?.numero_nota_fiscal ?? '')}"></div>
        </div>
        <div class="campo" style="margin-top:8px;"><label>Anexar nota fiscal</label>
          <input type="file" id="${prefixo}-nf-arquivo" accept="image/*,application/pdf"></div>
      </div>
    </div>`
}

function ligarBlocoAdministrativo (prefixo, raiz = document) {
  const alternar = () => {
    const area = raiz.querySelector(`#${prefixo}-area`).value
    raiz.querySelector(`#${prefixo}-bloco-admin`).classList.toggle('oculto', area !== 'ADMINISTRATIVO_COMERCIAL')
  }
  raiz.querySelector(`#${prefixo}-area`).onchange = alternar
  alternar()
}

function lerOrcamentosAdministrativo (prefixo, raiz = document) {
  const q = s => raiz.querySelector(s)
  return {
    orcamento1_fornecedor_id: q(`#${prefixo}-orc1-forn`).value || null,
    orcamento1_valor: numeroBR(q(`#${prefixo}-orc1-valor`).value),
    orcamento2_fornecedor_id: q(`#${prefixo}-orc2-forn`).value || null,
    orcamento2_valor: numeroBR(q(`#${prefixo}-orc2-valor`).value),
    prazo_entrega: q(`#${prefixo}-prazo-entrega`).value || null,
    numero_nota_fiscal: q(`#${prefixo}-nf-numero`).value.trim() || null
  }
}

function validarAdministrativo (area, dados) {
  if (area !== 'ADMINISTRATIVO_COMERCIAL') return null
  if (!dados.orcamento1_valor || !dados.orcamento2_valor) return 'Área administrativa/comercial exige os 2 orçamentos preenchidos (valor de cada um).'
  if (!dados.prazo_entrega) return 'Informe o prazo de entrega.'
  if (!dados.numero_nota_fiscal) return 'Informe o número da nota fiscal.'
  return null
}

function manutLancar (alvo, editavel) {
  if (!editavel) { alvo.innerHTML = `<div class="panel" style="padding:22px;">
    <p class="texto-dim">Você pode consultar, mas não lançar manutenções.</p></div>`; return }

  const agora = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16)
  const alvos = alvosManutencao()

  alvo.innerHTML = `
    <div class="panel" style="padding:20px;max-width:900px;">
      <h3 style="font-family:var(--serif);font-size:18px;margin:0 0 14px;">Lançar manutenção</h3>
      <div class="form-grade">
        <div class="campo" style="grid-column:1/-1;"><label>Equipamento / veículo *</label>
          <select id="ml-alvo"><option value="">Selecione...</option>
            ${alvos.map(a => `<option value="${a.valor}">${esc(a.rotulo)}</option>`).join('')}
          </select></div>
        <div class="campo"><label>Setor / área *</label>
          <select id="ml-area">${AREAS_OS.map(a => `<option value="${a}">${ROTULO_AREA_OS[a]}</option>`).join('')}</select></div>
        <div class="campo"><label>Tipo</label>
          <select id="ml-tipo">${['Mecânica', 'Elétrica', 'Estrutural / Civil', 'Ajuste operacional', 'Manutenção preventiva', 'Manutenção corretiva (quebrou / parou)'].map(t => `<option>${t}</option>`).join('')}</select></div>
        <div class="campo"><label>Prioridade</label>
          <select id="ml-prioridade">${PRIORIDADE_OS.map(p => `<option value="${p}" ${p === 'MEDIA' ? 'selected' : ''}>${ROTULO_PRIORIDADE_OS[p]}</option>`).join('')}</select></div>
        <div class="campo"><label>Status</label>
          <select id="ml-status">${STATUS_OS.filter(s => s !== 'CANCELADA').map(s => `<option value="${s}">${ROTULO_STATUS_OS[s]}</option>`).join('')}</select></div>
        <div class="campo oculto" id="ml-campo-fornecedor"><label>Terceiro / fornecedor</label>
          <select id="ml-fornecedor"><option value="">—</option>${MANUT_CACHE.fornecedores.map(f => `<option value="${f.id}">${esc(f.nome)}</option>`).join('')}</select></div>
        <div class="campo"><label>Data/hora *</label><input type="datetime-local" id="ml-data" value="${agora}"></div>
        <div class="campo"><label>Prazo</label><input type="date" id="ml-prazo"></div>
        <div class="campo"><label>Data de conclusão</label><input type="date" id="ml-conclusao"></div>
        <div class="campo"><label>Solicitante</label>
          <select id="ml-solicitante"><option value="">—</option>${MANUT_CACHE.pessoas.map(p => `<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select></div>
        <div class="campo"><label>Responsável pela manutenção</label>
          <select id="ml-responsavel"><option value="">—</option>${MANUT_CACHE.pessoas.map(p => `<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select></div>
        <div class="campo"><label>Valor peças (R$)</label><input id="ml-pecas" inputmode="decimal" placeholder="opcional"></div>
        <div class="campo"><label>Valor terceiros (R$)</label><input id="ml-terceiros" inputmode="decimal" placeholder="opcional"></div>
      </div>
      <div class="campo" style="margin-top:12px;"><label>O que precisa ser feito / problema *</label>
        <textarea id="ml-problema" style="min-height:80px;" placeholder="descreva o problema ou serviço"></textarea></div>
      <div class="campo" style="margin-top:10px;"><label>Diagnóstico / o que foi feito</label>
        <textarea id="ml-diagnostico" style="min-height:70px;" placeholder="opcional — preencha quando concluir"></textarea></div>
      ${campoOrcamentosAdministrativo('ml')}
      <div class="acoes"><button class="btn" id="ml-salvar">Lançar manutenção</button></div>
      <div class="recado oculto" id="ml-recado"></div>
    </div>`

  ligarBlocoAdministrativo('ml')

  const aviso = (t, alerta = true) => {
    const el = $('#ml-recado'); el.textContent = t; el.classList.remove('oculto')
    el.style.borderColor = alerta ? 'var(--warn-text)' : 'var(--line2)'
    el.style.color = alerta ? 'var(--warn-text)' : 'var(--dim)'
  }

  const alternarFornecedor = () => $('#ml-campo-fornecedor').classList.toggle('oculto', $('#ml-status').value !== 'SERVICO_TERCEIRO')
  $('#ml-status').onchange = alternarFornecedor
  alternarFornecedor()

  $('#ml-salvar').onclick = async () => {
    const alvoVal = $('#ml-alvo').value
    const problema = $('#ml-problema').value.trim()
    if (!alvoVal) { aviso('Escolha o equipamento ou veículo.'); return }
    if (!problema) { aviso('Descreva o que precisa ser feito.'); return }

    const area = $('#ml-area').value
    const dadosAdmin = lerOrcamentosAdministrativo('ml')
    const erroAdmin = validarAdministrativo(area, dadosAdmin)
    if (erroAdmin) { aviso(erroAdmin); return }

    const [tipoAlvo, id] = alvoVal.split(':')
    const btn = $('#ml-salvar'); btn.disabled = true; btn.textContent = 'Salvando...'
    const { data: novaOS, error } = await db.from('ordem_servico').insert({
      equipamento_id: tipoAlvo === 'e' ? id : null,
      veiculo_id: tipoAlvo === 'v' ? id : null,
      area,
      tipo: $('#ml-tipo').value,
      prioridade: $('#ml-prioridade').value,
      status: $('#ml-status').value,
      fornecedor_id: $('#ml-fornecedor').value || null,
      descricao_problema: problema,
      diagnostico: $('#ml-diagnostico').value.trim() || null,
      data_solicitacao: new Date($('#ml-data').value).toISOString(),
      data_limite: $('#ml-prazo').value || null,
      data_conclusao: $('#ml-conclusao').value || null,
      solicitante_id: $('#ml-solicitante').value || null,
      responsavel_id: $('#ml-responsavel').value || null,
      valor_pecas: numeroBR($('#ml-pecas').value),
      valor_terceiros: numeroBR($('#ml-terceiros').value),
      ...(area === 'ADMINISTRATIVO_COMERCIAL' ? dadosAdmin : {})
    }).select('id').single()

    if (error) { btn.disabled = false; btn.textContent = 'Lançar manutenção'; aviso(error.message); return }

    const arquivoNF = $('#ml-nf-arquivo')?.files[0]
    if (arquivoNF) {
      try {
        const { caminho, nome } = await subirComprovante(arquivoNF, `ordem_servico/${novaOS.id}`)
        await db.from('anexo').insert({ entidade: 'ORDEM_SERVICO', registro_id: novaOS.id, tipo: 'nota_fiscal', nome_arquivo: nome, storage_path: caminho })
      } catch (e) { aviso('OS salva, mas a nota fiscal falhou: ' + e.message); btn.disabled = false; btn.textContent = 'Lançar manutenção'; return }
    }

    btn.disabled = false; btn.textContent = 'Lançar manutenção'
    aviso('Manutenção lançada.', false)
    $('#ml-problema').value = ''; $('#ml-diagnostico').value = ''
    $('#ml-pecas').value = ''; $('#ml-terceiros').value = ''
  }
}

// ----- Ordens de serviço (lista + detalhe) -----
async function manutOS (alvo, editavel) {
  alvo.innerHTML = `
    <div class="filtros" style="margin-bottom:14px;">
      <div class="campo"><label>Status</label>
        <select id="mo-status"><option value="">todos</option>
          ${STATUS_OS.map(s => `<option value="${s}">${ROTULO_STATUS_OS[s]}</option>`).join('')}</select></div>
      <div class="campo"><label>Prioridade</label>
        <select id="mo-prioridade"><option value="">todas</option>
          ${PRIORIDADE_OS.map(p => `<option value="${p}">${ROTULO_PRIORIDADE_OS[p]}</option>`).join('')}</select></div>
      <div class="campo" style="flex:1;min-width:180px;"><label>Buscar</label>
        <input id="mo-busca" placeholder="código, equipamento ou problema"></div>
      <button class="btn" id="mo-buscar">Buscar</button>
    </div>
    <div id="mo-lista"></div>`

  let cache = []

  const buscar = async () => {
    let q = db.from('ordem_servico').select(`
      id, codigo, data_solicitacao, tipo, prioridade, status, descricao_problema, area,
      data_limite, data_conclusao, valor_pecas, valor_terceiros, valor_total,
      equipamento:equipamento_id ( tag, descricao ), veiculo:veiculo_id ( placa, descricao ),
      solicitante:solicitante_id ( nome ), responsavel:responsavel_id ( nome )
    `).order('data_solicitacao', { ascending: false }).limit(500)
    if ($('#mo-status').value) q = q.eq('status', $('#mo-status').value)
    if ($('#mo-prioridade').value) q = q.eq('prioridade', $('#mo-prioridade').value)

    const { data, error } = await q
    if (error) { $('#mo-lista').innerHTML = `<p class="vazio">${esc(error.message)}</p>`; return }
    cache = data || []

    const termo = $('#mo-busca').value.trim().toLowerCase()
    const lista = termo ? cache.filter(o =>
      `${o.codigo} ${nomeAlvoOS(o)} ${o.descricao_problema ?? ''}`.toLowerCase().includes(termo)) : cache

    const abertas = cache.filter(o => !['CONCLUIDA', 'CANCELADA'].includes(o.status)).length
    const criticas = cache.filter(o => o.prioridade === 'CRITICA' && !['CONCLUIDA', 'CANCELADA'].includes(o.status)).length
    const valorAberto = cache.filter(o => !['CONCLUIDA', 'CANCELADA'].includes(o.status))
      .reduce((s, o) => s + Number(o.valor_total || 0), 0)
    $('#kpis').innerHTML = kpi('OS listadas', cache.length) + kpi('Em aberto', abertas) +
      kpi('Críticas em aberto', criticas) + kpi('Valor em aberto', 'R$ ' + fmtNum(valorAberto))

    $('#mo-lista').innerHTML = `
      <div class="panel" style="padding:0;"><div class="tabela-scroll">
        <table><thead><tr>
          <th>Código</th><th>Aberta em</th><th>Equipamento/veículo</th><th>Problema</th>
          <th>Prioridade</th><th>Status</th><th>Responsável</th><th class="num">Valor</th>
        </tr></thead><tbody>
          ${lista.map(o => `<tr style="cursor:pointer;" data-abrir-os="${o.id}">
            <td><b>${esc(o.codigo)}</b></td>
            <td class="texto-dim">${fmtQuando(o.data_solicitacao) ?? '—'}</td>
            <td>${esc(nomeAlvoOS(o))}</td>
            <td class="texto-dim2" style="max-width:280px;">${esc((o.descricao_problema ?? '').slice(0, 70))}</td>
            <td><span class="chip">${esc(ROTULO_PRIORIDADE_OS[o.prioridade] ?? '—')}</span></td>
            <td><span class="${corStatusOS(o.status)}">${esc(ROTULO_STATUS_OS[o.status] ?? o.status)}</span></td>
            <td class="texto-dim">${esc(o.responsavel?.nome ?? '—')}</td>
            <td class="num">${o.valor_total ? 'R$ ' + fmtNum(o.valor_total) : '—'}</td>
          </tr>`).join('') || `<tr><td colspan="8" class="vazio">Nenhuma ordem de serviço no filtro.</td></tr>`}
        </tbody></table>
      </div></div>
      <p class="texto-dim2" style="font-size:12px;margin-top:8px;">${lista.length} ordem(ns) de serviço</p>`

    $('#mo-lista').querySelectorAll('[data-abrir-os]').forEach(tr => {
      tr.onclick = () => {
        const os = cache.find(o => o.id === tr.dataset.abrirOs)
        if (os) detalheOS(os, editavel, buscar)
      }
    })
  }

  $('#mo-buscar').onclick = buscar
  $('#mo-busca').oninput = buscar
  $('#mo-status').onchange = buscar
  $('#mo-prioridade').onchange = buscar
  buscar()
}

// ----- Detalhe / edição de uma OS -----
async function detalheOS (os, editavel, aoFechar) {
  const { data: materiais } = await db.from('os_material')
    .select('id,descricao,quantidade,unidade,retirado_por_nome,criado_em,solicitacao_compra_id,solicitacao:solicitacao_compra_id(numero,status)')
    .eq('ordem_servico_id', os.id).order('criado_em')

  const nomeFornecedor = os.fornecedor?.nome ?? MANUT_CACHE.fornecedores.find(f => f.id === os.fornecedor_id)?.nome ?? null

  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = `
    <div class="modal" style="max-width:780px;">
      <div class="cabeca-secao">
        <h3>${esc(os.codigo)}</h3>
        <span class="${corStatusOS(os.status)}">${esc(ROTULO_STATUS_OS[os.status] ?? os.status)}</span>
      </div>
      <p class="texto-dim2" style="font-size:12px;margin:-8px 0 14px;">
        Aberta em ${fmtQuando(os.data_solicitacao) ?? '—'} por ${esc(os.solicitante?.nome ?? '—')}
        · ${esc(os.area ? ROTULO_AREA_OS[os.area] : 'sem área')} · ${esc(nomeAlvoOS(os))}
        ${nomeFornecedor ? ` · terceiro: ${esc(nomeFornecedor)}` : ''}</p>

      <div class="caixa-texto" style="margin-bottom:12px;">
        <div class="rot">Problema relatado</div>
        <p>${esc(os.descricao_problema ?? 'não informado')}</p>
      </div>

      ${editavel ? `
        <div class="form-grade">
          <div class="campo"><label>Status</label>
            <select id="do-status">${STATUS_OS.map(s => `<option value="${s}" ${s === os.status ? 'selected' : ''}>${ROTULO_STATUS_OS[s]}</option>`).join('')}</select></div>
          <div class="campo"><label>Área</label>
            <select id="do-area"><option value="">—</option>${AREAS_OS.map(a => `<option value="${a}" ${a === os.area ? 'selected' : ''}>${ROTULO_AREA_OS[a]}</option>`).join('')}</select></div>
          <div class="campo"><label>Prioridade</label>
            <select id="do-prioridade">${PRIORIDADE_OS.map(p => `<option value="${p}" ${p === os.prioridade ? 'selected' : ''}>${ROTULO_PRIORIDADE_OS[p]}</option>`).join('')}</select></div>
          <div class="campo"><label>Responsável</label>
            <select id="do-responsavel"><option value="">—</option>
              ${MANUT_CACHE.pessoas.map(p => `<option value="${p.id}" ${p.nome === os.responsavel?.nome ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}</select></div>
          <div class="campo"><label>Terceiro / fornecedor</label>
            <select id="do-fornecedor"><option value="">—</option>
              ${MANUT_CACHE.fornecedores.map(f => `<option value="${f.id}" ${f.id === os.fornecedor_id ? 'selected' : ''}>${esc(f.nome)}</option>`).join('')}</select></div>
          <div class="campo"><label>Prazo</label><input type="date" id="do-prazo" value="${os.data_limite ?? ''}"></div>
          <div class="campo"><label>Concluída em</label><input type="date" id="do-conclusao" value="${os.data_conclusao ?? ''}"></div>
          <div class="campo"><label>Valor peças (R$)</label><input id="do-pecas" inputmode="decimal" value="${os.valor_pecas ?? ''}"></div>
          <div class="campo"><label>Valor terceiros (R$)</label><input id="do-terceiros" inputmode="decimal" value="${os.valor_terceiros ?? ''}"></div>
        </div>
        <div class="campo" style="margin-top:10px;"><label>Diagnóstico / o que foi feito</label>
          <textarea id="do-diagnostico" style="min-height:70px;">${esc(os.diagnostico ?? '')}</textarea></div>
        ${campoOrcamentosAdministrativo('do', os)}
        <div class="acoes"><button class="btn" id="do-salvar">Salvar alterações</button>
          ${!os.lancamento_id ? `<button class="btn-secundario" id="do-financeiro">Gerar lançamento financeiro</button>` :
            `<span class="badge-bom" style="align-self:center;">lançamento financeiro já gerado</span>`}</div>
        <div class="recado oculto" id="do-recado"></div>
      ` : `
        ${os.diagnostico ? `<div class="caixa-texto"><div class="rot">Diagnóstico / o que foi feito</div><p>${esc(os.diagnostico)}</p></div>` : ''}
        <p class="texto-dim2" style="font-size:12px;">Responsável: ${esc(os.responsavel?.nome ?? '—')}
          ${os.data_limite ? ` · Prazo: ${fmtData(os.data_limite)}` : ''}
          ${os.data_conclusao ? ` · Concluída em: ${fmtData(os.data_conclusao)}` : ''}</p>
      `}

      <div class="cabeca-secao" style="margin-top:18px;">
        <h3 style="font-family:var(--serif);font-size:16px;">Materiais utilizados</h3>
      </div>
      <div id="do-materiais">
        ${(materiais || []).map(m => `<div class="passo">
          <span class="quando">${fmtQuando(m.criado_em) ?? '—'}</span>
          <span><b>${esc(m.descricao)}</b> — ${fmtNum(m.quantidade ?? 0, 2)} ${esc(m.unidade ?? '')}
            ${m.retirado_por_nome ? `<br><span class="texto-dim2" style="font-size:11.5px;">retirado por ${esc(m.retirado_por_nome)}</span>` : ''}
            ${m.solicitacao ? `<br><span class="chip" style="font-size:10.5px;">pedido Compras ${esc(m.solicitacao.numero ?? '')} · ${esc(m.solicitacao.status ?? '')}</span>` : ''}</span>
        </div>`).join('') || `<p class="texto-dim2" style="font-size:12.5px;">Nenhum material lançado.</p>`}
      </div>

      ${editavel ? `<div class="form-grade" style="margin-top:10px;">
        <div class="campo"><label>Material / peça</label><input id="do-mat-desc" placeholder="Ex: filtro de óleo"></div>
        <div class="campo"><label>Quantidade</label><input id="do-mat-qtd" inputmode="decimal" placeholder="Ex: 1"></div>
        <div class="campo"><label>Unidade</label><input id="do-mat-un" placeholder="un, L, kg..."></div>
        <div class="campo"><label>Retirado por</label><input id="do-mat-quem" placeholder="opcional" value="${esc(PERFIL.nome)}"></div>
      </div>
      <div class="acoes">
        <button class="btn-secundario" id="do-mat-add">Lançar material (já usado)</button>
        <button class="btn-secundario" id="do-mat-pedir">Pedir peça pro Compras</button>
      </div>
      <p class="aviso">"Lançar material" registra algo que já foi usado. "Pedir peça pro Compras" cria uma
        solicitação de compra vinculada a esta OS — quando ela for atendida, a peça já fica marcada aqui.</p>` : ''}

      <div class="acoes" style="margin-top:18px;">
        ${editavel ? `<button class="btn-secundario" id="do-excluir">Excluir OS</button>` : ''}
        <button class="btn-secundario" id="do-fechar">Fechar</button>
      </div>
    </div>`

  document.body.appendChild(fundo)
  const fechar = () => fundo.remove()
  fundo.querySelector('#do-fechar').onclick = fechar
  fundo.onclick = e => { if (e.target === fundo) fechar() }

  if (!editavel) return

  ligarBlocoAdministrativo('do', fundo)

  const aviso = t => {
    const el = fundo.querySelector('#do-recado'); el.textContent = t; el.classList.remove('oculto')
    el.style.borderColor = 'var(--warn-text)'; el.style.color = 'var(--warn-text)'
  }

  fundo.querySelector('#do-salvar').onclick = async () => {
    const area = fundo.querySelector('#do-area').value || null
    const dadosAdmin = lerOrcamentosAdministrativo('do', fundo)
    const status = fundo.querySelector('#do-status').value
    // só cobra os orçamentos/nota fiscal quando a OS já está concluindo — dá pra
    // ir preenchendo aos poucos enquanto ainda está aberta/em execução
    if (status === 'CONCLUIDA') {
      const erroAdmin = validarAdministrativo(area, dadosAdmin)
      if (erroAdmin) { aviso(erroAdmin); return }
    }
    const corpo = {
      status,
      area,
      prioridade: fundo.querySelector('#do-prioridade').value,
      responsavel_id: fundo.querySelector('#do-responsavel').value || null,
      fornecedor_id: fundo.querySelector('#do-fornecedor').value || null,
      data_limite: fundo.querySelector('#do-prazo').value || null,
      data_conclusao: fundo.querySelector('#do-conclusao').value || null,
      valor_pecas: numeroBR(fundo.querySelector('#do-pecas').value),
      valor_terceiros: numeroBR(fundo.querySelector('#do-terceiros').value),
      diagnostico: fundo.querySelector('#do-diagnostico').value.trim() || null,
      ...(area === 'ADMINISTRATIVO_COMERCIAL' ? dadosAdmin : {})
    }
    const { error } = await db.from('ordem_servico').update(corpo).eq('id', os.id)
    if (error) { aviso(error.message); return }

    const arquivoNF = fundo.querySelector('#do-nf-arquivo')?.files[0]
    if (arquivoNF) {
      try {
        const { caminho, nome } = await subirComprovante(arquivoNF, `ordem_servico/${os.id}`)
        await db.from('anexo').insert({ entidade: 'ORDEM_SERVICO', registro_id: os.id, tipo: 'nota_fiscal', nome_arquivo: nome, storage_path: caminho })
      } catch (e) { aviso('Salvo, mas a nota fiscal falhou: ' + e.message); return }
    }
    fechar(); aoFechar()
  }

  fundo.querySelector('#do-mat-add').onclick = async () => {
    const descricao = fundo.querySelector('#do-mat-desc').value.trim()
    if (!descricao) { aviso('Descreva o material.'); return }
    const { error } = await db.from('os_material').insert({
      ordem_servico_id: os.id,
      descricao,
      quantidade: numeroBR(fundo.querySelector('#do-mat-qtd').value),
      unidade: fundo.querySelector('#do-mat-un').value.trim() || null,
      retirado_por_id: PERFIL.pessoaId,
      retirado_por_nome: fundo.querySelector('#do-mat-quem').value.trim() || null
    })
    if (error) { aviso(error.message); return }
    fechar(); detalheOS(os, editavel, aoFechar)
  }

  fundo.querySelector('#do-mat-pedir').onclick = async () => {
    const descricao = fundo.querySelector('#do-mat-desc').value.trim()
    if (!descricao) { aviso('Descreva a peça que precisa pedir.'); return }
    const qtd = numeroBR(fundo.querySelector('#do-mat-qtd').value)
    const { data: novaSolic, error: erroSolic } = await db.from('solicitacao_compra').insert({
      solicitante_id: PERFIL.pessoaId,
      tipo_solicitacao: 'Peça de manutenção',
      produto_servico: descricao,
      quantidade: qtd ? String(qtd) : null,
      unidade: fundo.querySelector('#do-mat-un').value.trim() || null,
      finalidade: `Manutenção — OS ${os.codigo}${os.equipamento?.tag ? ' · ' + os.equipamento.tag : os.veiculo?.placa ? ' · ' + os.veiculo.placa : ''}`,
      urgencia: 'NAO_URGENTE_5D'
    }).select('id').single()
    if (erroSolic) { aviso(erroSolic.message); return }

    const { error: erroMat } = await db.from('os_material').insert({
      ordem_servico_id: os.id,
      descricao,
      quantidade: qtd,
      unidade: fundo.querySelector('#do-mat-un').value.trim() || null,
      solicitacao_compra_id: novaSolic.id
    })
    if (erroMat) { aviso(erroMat.message); return }
    fechar(); detalheOS(os, editavel, aoFechar)
  }

  const btnFin = fundo.querySelector('#do-financeiro')
  if (btnFin) btnFin.onclick = async () => {
    const valor = Number(os.valor_total || 0)
    if (!valor) { aviso('Essa OS ainda não tem valor de peças ou terceiros lançado.'); return }
    const { data: cat } = await db.from('categoria_financeira').select('id').eq('nome', 'Manutenção').maybeSingle()
    const { data: novo, error } = await db.from('lancamento_financeiro').insert({
      tipo: 'SAIDA',
      descricao: `Manutenção ${os.codigo} — ${nomeAlvoOS(os)}`,
      valor,
      data_lancamento: os.data_conclusao || hojeISO(),
      categoria_id: cat?.id || null,
      registrado_por: PERFIL.pessoaId
    }).select('id').single()
    if (error) { aviso(error.message); return }
    await db.from('ordem_servico').update({ lancamento_id: novo.id }).eq('id', os.id)
    fechar(); aoFechar()
  }

  const bx = fundo.querySelector('#do-excluir')
  if (bx) bx.onclick = async () => {
    if (!confirm('Excluir esta ordem de serviço? Os materiais lançados também somem.')) return
    const { error } = await db.from('ordem_servico').delete().eq('id', os.id)
    if (error) { alert(error.message); return }
    fechar(); aoFechar()
  }
}
