// ----- Financeiro › Planos e metas -----
async function finPlanos (alvo, editavel) {
  const { data, error } = await db.from('plano_meta').select('id,nome,tipo,valor_alvo,valor_acumulado,prazo,status').order('criado_em')
  if (error) { alvo.innerHTML = `<p class="vazio">${esc(error.message)}</p>`; return }
  const planos = data || []
  const alvoTot = planos.reduce((s, p) => s + Number(p.valor_alvo), 0)
  const atualTot = planos.reduce((s, p) => s + Number(p.valor_acumulado), 0)
  const pctGeral = alvoTot ? Math.round(atualTot / alvoTot * 100) : 0

  alvo.innerHTML = `
    <div class="kpis" style="margin-bottom:16px;">
      ${kpi('Planos ativos', planos.filter(p => p.status === 'ATIVO').length)}
      ${kpi('Total a alcançar', 'R$ ' + fmtNum(alvoTot))}
      ${kpi('Acumulado', 'R$ ' + fmtNum(atualTot), pctGeral + '% do total')}
      ${kpi('Falta', 'R$ ' + fmtNum(alvoTot - atualTot))}
    </div>
    <div class="aneis-linha">${planos.slice(0, 3).map(p => anelHtml(
      Number(p.valor_alvo) ? Math.min(100, Math.round(p.valor_acumulado / p.valor_alvo * 100)) : 0, p.nome)).join('')}</div>
    <div class="panel" style="padding:0;"><div class="tabela-scroll">
      <table><thead><tr>
        <th>Plano</th><th>Tipo</th><th>Prazo</th><th class="num">Alvo</th>
        <th class="num">Atual</th><th class="num">Falta</th><th style="width:140px;">Progresso</th>${editavel ? '<th></th>' : ''}
      </tr></thead><tbody>
      ${planos.map(p => {
        const pct = Number(p.valor_alvo) ? Math.min(100, Math.round(p.valor_acumulado / p.valor_alvo * 100)) : 0
        return `<tr>
          <td><b>${esc(p.nome)}</b></td>
          <td class="texto-dim">${p.tipo === 'quitacao' ? 'quitação' : 'objetivo'}</td>
          <td class="texto-dim">${fmtData(p.prazo)}</td>
          <td class="num">R$ ${fmtNum(p.valor_alvo)}</td>
          <td class="num">${editavel
            ? `<input type="number" step="0.01" value="${p.valor_acumulado}" data-atual="${p.id}" style="width:100px;text-align:right;">`
            : 'R$ ' + fmtNum(p.valor_acumulado)}</td>
          <td class="num">R$ ${fmtNum(p.valor_alvo - p.valor_acumulado)}</td>
          <td><div class="barra"><span style="width:${pct}%"></span></div><span class="texto-dim2" style="font-size:11px;">${pct}%</span></td>
          ${editavel ? `<td class="num"><button class="btn-secundario mini" data-del-plano="${p.id}">×</button></td>` : ''}
        </tr>`
      }).join('') || `<tr><td colspan="${editavel ? 8 : 7}" class="vazio">Nenhum plano cadastrado.</td></tr>`}
      </tbody></table>
    </div></div>
    ${editavel ? `<div class="secao panel" style="padding:18px;margin-top:16px;">
      <h3>Novo plano</h3>
      <div class="form-grade">
        <div class="campo"><label>Nome *</label><input id="pl-nome" placeholder="ex: quitar cartão"></div>
        <div class="campo"><label>Tipo</label><select id="pl-tipo"><option value="objetivo">objetivo</option><option value="quitacao">quitação</option></select></div>
        <div class="campo"><label>Valor alvo *</label><input id="pl-alvo" type="number" step="0.01"></div>
        <div class="campo"><label>Já acumulado</label><input id="pl-atual" type="number" step="0.01"></div>
        <div class="campo"><label>Prazo</label><input id="pl-prazo" type="date"></div>
      </div>
      <div class="acoes"><button class="btn" id="pl-salvar">Adicionar</button></div>
      <div class="recado oculto" id="pl-recado"></div>
    </div>` : ''}`

  if (!editavel) return
  alvo.querySelectorAll('[data-atual]').forEach(inp => {
    inp.onchange = async () => { await db.from('plano_meta').update({ valor_acumulado: Number(inp.value) || 0 }).eq('id', inp.dataset.atual); finPlanos(alvo, true) }
  })
  alvo.querySelectorAll('[data-del-plano]').forEach(b => {
    b.onclick = async () => { if (!confirm('Excluir este plano?')) return
      await db.from('plano_meta').delete().eq('id', b.dataset.delPlano); finPlanos(alvo, true) }
  })
  $('#pl-salvar').onclick = async () => {
    const nome = $('#pl-nome').value.trim(), alvoVal = Number($('#pl-alvo').value)
    const el = $('#pl-recado')
    const aviso = t => { el.textContent = t; el.classList.remove('oculto'); el.style.borderColor = 'var(--warn-text)'; el.style.color = 'var(--warn-text)' }
    if (!nome || !alvoVal) { aviso('Preencha nome e valor alvo.'); return }
    const { error } = await db.from('plano_meta').insert({
      nome, tipo: $('#pl-tipo').value, valor_alvo: alvoVal,
      valor_acumulado: Number($('#pl-atual').value) || 0, prazo: $('#pl-prazo').value || null

    finPlanos(alvo, true)
  }
}

// ----- Financeiro › Investimentos -----
async function finInvestimentos (alvo, editavel) {
  const { data, error } = await db.from('investimento')
    .select('id,nome,emissor,instituicao,classe,valor_aplicado,saldo_atual,indexador,vencimento').order('criado_em')
  if (error) { alvo.innerHTML = `<p class="vazio">${esc(error.message)}</p>`; return }
  const inv = data || []
  const apl = inv.reduce((s, i) => s + Number(i.valor_aplicado), 0)
  const sal = inv.reduce((s, i) => s + Number(i.saldo_atual), 0)
  const rend = sal - apl
  const rf = inv.filter(i => i.classe === 'RENDA_FIXA').reduce((s, i) => s + Number(i.saldo_atual), 0)
  const rv = inv.filter(i => i.classe === 'RENDA_VARIAVEL').reduce((s, i) => s + Number(i.saldo_atual), 0)
  const rotClasse = { RENDA_FIXA: 'renda fixa', RENDA_VARIAVEL: 'renda variável', OUTROS: 'outros' }

  alvo.innerHTML = `
    <div class="kpis" style="margin-bottom:16px;">
      ${kpi('Aplicado', 'R$ ' + fmtNum(apl))}
      ${kpi('Saldo atual', 'R$ ' + fmtNum(sal))}
      ${kpi('Rendimento', 'R$ ' + fmtNum(rend), apl ? (rend / apl * 100).toFixed(2) + '%' : '—')}
      ${kpi('Renda fixa', (sal ? (rf / sal * 100).toFixed(1) : '0') + '%', 'variável ' + (sal ? (rv / sal * 100).toFixed(1) : '0') + '%')}
    </div>
    <div class="panel" style="padding:0;margin-bottom:16px;"><div class="tabela-scroll">
      <table><thead><tr>
        <th>Investimento</th><th>Emissor</th><th>Instituição</th><th>Classe</th><th>Indexador</th>

      </tr></thead><tbody>
      ${inv.map(i => {
        const r = Number(i.saldo_atual) - Number(i.valor_aplicado)
        return `<tr>
          <td><b>${esc(i.nome)}</b></td>
          <td class="texto-dim">${esc(i.emissor ?? '—')}</td>
          <td class="texto-dim">${esc(i.instituicao ?? '—')}</td>
          <td class="texto-dim">${rotClasse[i.classe] ?? i.classe}</td>
          <td class="texto-dim">${esc(i.indexador ?? '—')}</td>
          <td class="texto-dim">${fmtData(i.vencimento)}</td>
          <td class="num">R$ ${fmtNum(i.valor_aplicado)}</td>
          <td class="num">${editavel
            ? `<input type="number" step="0.01" value="${i.saldo_atual}" data-saldo="${i.id}" style="width:100px;text-align:right;">`
            : 'R$ ' + fmtNum(i.saldo_atual)}</td>
          <td class="num ${r >= 0 ? 'badge-bom' : 'badge-alerta'}">R$ ${fmtNum(r)}</td>
          ${editavel ? `<td class="num"><button class="btn-secundario mini" data-del-inv="${i.id}">×</button></td>` : ''}
        </tr>`
      }).join('') || `<tr><td colspan="${editavel ? 10 : 9}" class="vazio">Nenhum investimento cadastrado.</td></tr>`}
      </tbody></table>
    </div></div>
    ${editavel ? `<div class="secao panel" style="padding:18px;">
      <h3>Novo investimento</h3>
      <div class="form-grade">
        <div class="campo"><label>Nome *</label><input id="iv-nome" placeholder="ex: CDB 110% CDI"></div>
        <div class="campo"><label>Emissor</label><input id="iv-emissor"></div>
        <div class="campo"><label>Instituição</label><input id="iv-inst" placeholder="corretora"></div>
        <div class="campo"><label>Classe</label><select id="iv-classe">
          <option value="RENDA_FIXA">renda fixa</option><option value="RENDA_VARIAVEL">renda variável</option><option value="OUTROS">outros</option>
        </select></div>

        <div class="campo"><label>Aplicado</label><input id="iv-apl" type="number" step="0.01"></div>
        <div class="campo"><label>Saldo atual</label><input id="iv-sal" type="number" step="0.01"></div>
        <div class="campo"><label>Vencimento</label><input id="iv-venc" type="date"></div>
      </div>
      <div class="acoes"><button class="btn" id="iv-salvar">Adicionar</button></div>
      <div class="recado oculto" id="iv-recado"></div>
    </div>` : ''}`

  if (!editavel) return
  alvo.querySelectorAll('[data-saldo]').forEach(inp => {
    inp.onchange = async () => { await db.from('investimento').update({ saldo_atual: Number(inp.value) || 0 }).eq('id', inp.dataset.saldo); finInvestimentos(alvo, true) }
  })
  alvo.querySelectorAll('[data-del-inv]').forEach(b => {
    b.onclick = async () => { if (!confirm('Excluir este investimento?')) return
      await db.from('investimento').delete().eq('id', b.dataset.delInv); finInvestimentos(alvo, true) }
  })
  $('#iv-salvar').onclick = async () => {
    const nome = $('#iv-nome').value.trim()
    const el = $('#iv-recado')
    const aviso = t => { el.textContent = t; el.classList.remove('oculto'); el.style.borderColor = 'var(--warn-text)'; el.style.color = 'var(--warn-text)' }

    finInvestimentos(alvo, true)
  }
}

// ----- Financeiro › Relatórios -----
async function finRelatorios (alvo, editavel) {
  const meses = []
  for (let k = 11; k >= 0; k--) meses.push(new Date(FIN_MES.getFullYear(), FIN_MES.getMonth() - k, 1))
  const inicio = isoMes(meses[0])
  const fimExcl = isoMes(new Date(FIN_MES.getFullYear(), FIN_MES.getMonth() + 1, 1))

  const { data: lancs, error } = await db.from('lancamento_financeiro')
    .select('data_lancamento,valor,tipo,categoria_id,centro_custo_id')
    .gte('data_lancamento', inicio).lt('data_lancamento', fimExcl)
  if (error) { alvo.innerHTML = `<p class="vazio">${esc(error.message)}</p>`; return }

  const chaveMes = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')
  const serie = meses.map(m => {
    const chave = chaveMes(m)
    const doMes = (lancs || []).filter(l => l.data_lancamento.slice(0, 7) === chave)
    return { m, r: doMes.filter(l => l.tipo === 'ENTRADA').reduce((s, l) => s + Number(l.valor), 0),
      d: doMes.filter(l => l.tipo === 'SAIDA').reduce((s, l) => s + Number(l.valor), 0) }
  })
  const max = Math.max(1, ...serie.map(s => Math.max(s.r, s.d)))
  const recA = serie.reduce((s, x) => s + x.r, 0), desA = serie.reduce((s, x) => s + x.d, 0)

  const mesAtualLancs = (lancs || []).filter(l => l.data_lancamento.slice(0, 7) === chaveMes(FIN_MES))
  const porCat = FIN_CACHE.categorias.filter(c => c.tipo === 'DESPESA').map(c => ({
    n: c.nome, v: mesAtualLancs.filter(l => l.categoria_id === c.id).reduce((s, l) => s + Number(l.valor), 0)
  })).filter(x => x.v > 0).sort((a, b) => b.v - a.v)
  const maxCat = Math.max(1, ...porCat.map(x => x.v))

  const porCC = FIN_CACHE.centros.map(cc => ({
    n: cc.nome, v: mesAtualLancs.filter(l => l.centro_custo_id === cc.id && l.tipo === 'SAIDA').reduce((s, l) => s + Number(l.valor), 0)
  })).filter(x => x.v > 0).sort((a, b) => b.v - a.v)
  const totCC = porCC.reduce((s, x) => s + x.v, 0)
  const nomesMes = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez']

  alvo.innerHTML = navMesHtml() + `
    <div class="secao panel" style="padding:18px;">
      <h3>Receitas e despesas · 12 meses</h3>
      <div class="grafico12">${serie.map(s => `<div class="coluna">
        <div class="barras"><span class="b-rec" style="height:${s.r / max * 100}%"></span><span class="b-desp" style="height:${s.d / max * 100}%"></span></div>
        <div class="mes">${nomesMes[s.m.getMonth()]}</div></div>`).join('')}</div>
      <div class="duas-colunas" style="margin-top:14px;">
        <div><span class="texto-dim">receitas 12m</span> <span class="badge-bom" style="font-variant-numeric:tabular-nums;">R$ ${fmtNum(recA)}</span></div>
        <div><span class="texto-dim">despesas 12m</span> <span class="badge-alerta" style="font-variant-numeric:tabular-nums;">R$ ${fmtNum(desA)}</span></div>
      </div>
    </div>
    <div class="duas-colunas" style="margin-top:16px;">
      <div class="panel" style="padding:18px;">
        <h3>Despesas por categoria · ${nomeMes(FIN_MES)}</h3>
        ${porCat.map(x => `<div style="margin-bottom:9px;">
          <div style="display:flex;justify-content:space-between;font-size:13px;"><span>${esc(x.n)}</span><span>R$ ${fmtNum(x.v)}</span></div>
          <div class="barra"><span style="width:${x.v / maxCat * 100}%"></span></div></div>`).join('') || '<p class="vazio">Sem lançamentos neste mês.</p>'}
      </div>
      <div class="panel" style="padding:18px;">
        <h3>Por centro de custo</h3>
        ${porCC.map(x => `<div style="margin-bottom:9px;">
          <div style="display:flex;justify-content:space-between;font-size:13px;"><span>${esc(x.n)}</span>
          <span>R$ ${fmtNum(x.v)} <span class="texto-dim2">${totCC ? Math.round(x.v / totCC * 100) : 0}%</span></span></div>
          <div class="barra"><span style="width:${totCC ? x.v / totCC * 100 : 0}%;background:var(--gold);"></span></div></div>`).join('') || '<p class="vazio">Sem lançamentos neste mês.</p>'}
      </div>
    </div>`

  ligarNavMes('relatorios', editavel)
}

// ----- Compras › Pagamento (financeiro) -----
async function comprasPagar (alvo) {
  if (!podePagar()) {
    alvo.innerHTML = `<div class="panel" style="padding:22px;"><p class="texto-dim">
      A baixa de pagamento é de quem edita o módulo <b>Financeiro</b>.</p></div>`
    return
  }

  const [{ data, error }, { data: contas }, { data: categorias }, { data: centros }] =
    await Promise.all([
      db.from('solicitacao_compra').select(selSolicitacao)
        .in('status', ['APROVADA', 'PAGA'])
        .order('status').order('vencimento', { nullsFirst: false }),
      db.from('conta_financeira').select('id,nome').order('nome'),
      db.from('categoria_financeira').select('id,nome,tipo').order('nome'),
      db.from('centro_de_custo').select('id,nome').order('nome')
    ])

  if (error) { alvo.innerHTML = `<p class="vazio">${esc(error.message)}</p>`; return }

  const aPagar = (data || []).filter(s => s.status === 'APROVADA')
  const pagas = (data || []).filter(s => s.status === 'PAGA')
  const total = aPagar.reduce((t, s) => t + Number(s.valor_estimado || 0), 0)

  alvo.innerHTML = `
    <div class="cabeca-secao">
      <h3 style="font-family:var(--serif);font-size:17px;">A pagar</h3>
      <span class="texto-dim2" style="font-size:12px;">
        ${aPagar.length} pendente(s)${total ? ' · aprox. R$ ' + fmtNum(total) : ''}</span>
    </div>
    <p class="aviso" style="margin-top:0;margin-bottom:14px;">
      Imprima a ordem de pagamento, efetue e dê a baixa. O solicitante é avisado automaticamente.</p>
    <div id="c-pagar"></div>

    ${pagas.length ? `<div class="cabeca-secao" style="margin-top:26px;">
      <h3 style="font-family:var(--serif);font-size:17px;">Pagas</h3>
      <span class="texto-dim2" style="font-size:12px;">${pagas.length}</span></div>
      <div id="c-pagas"></div>` : ''}`

  const cartao = (s, feito) => `
    <div class="cartao-sol">
      <div class="linha1">
        <span class="titulo">${esc(s.produto_servico)}</span>
        ${s.urgencia === 'URGENTE_4H' && !feito ? '<span class="urgente">● urgente</span>' : ''}
        ${feito ? selo('PAGA') : ''}
        <div class="botoes">
          <button class="btn-secundario mini" data-ordem="${s.id}">ordem</button>
          ${feito ? '' : `<button class="btn mini" data-baixa="${s.id}">dar baixa</button>`}
        </div>
      </div>
      <div class="meta">
        solicitado por ${esc(s.solicitante?.nome ?? '—')}
        ${s.setor?.nome ? '· ' + esc(s.setor.nome) : ''}
        ${s.fornecedor?.nome ? '· ' + esc(s.fornecedor.nome) : ''}
        ${feito
          ? `· pago em ${fmtQuando(s.pago_em) ?? '—'} · R$ ${fmtNum(s.valor_pago)}`
          : `${s.vencimento ? '· vence ' + fmtData(s.vencimento) : ''}
             ${s.parcelas ? '· ' + s.parcelas + 'x' : ''}`}
      </div>
    </div>`

  $('#c-pagar').innerHTML = aPagar.map(s => cartao(s, false)).join('') ||
    `<p class="vazio">Nada aguardando pagamento.</p>`
  if (pagas.length) $('#c-pagas').innerHTML = pagas.map(s => cartao(s, true)).join('')

  alvo.querySelectorAll('[data-ordem]').forEach(b => {
    b.onclick = () => ordemPagamento((data || []).find(x => x.id === b.dataset.ordem))
  })
  alvo.querySelectorAll('[data-baixa]').forEach(b => {
    b.onclick = () => telaBaixa((data || []).find(x => x.id === b.dataset.baixa),
                                contas || [], categorias || [], centros || [])
  })
}

// ----- Ordem de pagamento, para imprimir -----
async function ordemPagamento (s) {
  if (!s) return
  const { data: o } = await db.from('orcamento')
    .select('valor,prazo_entrega,forma_pagamento,condicao_pagamento,fornecedor_avulso,fornecedor:fornecedor_id(nome)')
    .eq('solicitacao_id', s.id).eq('escolhido', true).maybeSingle()

  const forn = o?.fornecedor?.nome || o?.fornecedor_avulso || s.fornecedor?.nome
  const valor = s.valor_aprovado ?? o?.valor ?? s.valor_estimado

  const corpo = `
    <div class="doc-linha">
      ${docBloco('Pedido',
        docLinha('Nº', s.numero) +
        docLinha('Produto ou serviço', s.produto_servico) +
        docLinha('Quantidade', s.quantidade ? `${s.quantidade} ${s.unidade ?? ''}` : null) +
        docLinha('Local de entrega', s.local_entrega))}

      ${docBloco('Solicitante',
        docLinha('Nome', s.solicitante?.nome) +
        docLinha('Setor', s.setor?.nome) +
        docLinha('Data do pedido', fmtQuando(s.data_solicitacao)))}

      ${docBloco('Pagamento',
        docLinha('Fornecedor', forn) +
        docLinha('Forma', s.forma_pagamento || o?.forma_pagamento) +
        docLinha('Condição', s.condicao_pagamento || o?.condicao_pagamento) +
        docLinha('Parcelas', s.parcelas ? s.parcelas + 'x' : null) +
        docLinha('Vencimento', s.vencimento ? fmtData(s.vencimento) : null))}
    </div>

    ${docBloco('Valor a pagar',
      docValor('Valor autorizado', 'aprovado pela diretoria', valor, true))}

    ${s.dados_pagamento ? docTexto('Dados de pagamento', s.dados_pagamento) : ''}

    ${docBloco('Autorizações',
      docLinha('Coordenação', s.gestor?.nome ? `${s.gestor.nome} — ${s.parecer_coordenacao ?? ''}` : null) +
      docLinha('Cotação', s.analista?.nome ? `${s.analista.nome} — ${s.parecer_cotacao ?? ''}` : null) +
      docLinha('Aprovação', s.aprovador?.nome ? `${s.aprovador.nome} — ${s.parecer_aprovacao ?? ''}` : null))}

    ${docAssinaturas([['Aprovação', s.aprovador?.nome],
                      ['Financeiro', ''],
                      ['Recebido pelo fornecedor', '']])}`

  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = documentoPDF({
    titulo: 'ORDEM DE PAGAMENTO',
    subtitulo: 'autorização financeira',
    corpo,
    acoes: `<button class="btn" id="op-imprimir">Gerar PDF</button>
      <button class="btn-secundario" id="op-fechar">Fechar</button>`
  })
  document.body.appendChild(fundo)
  fundo.querySelector('#op-fechar').onclick = () => fundo.remove()
  fundo.querySelector('#op-imprimir').onclick = () => window.print()
  fundo.onclick = e => { if (e.target === fundo) fundo.remove() }
}

// ----- Baixa do pagamento -----
function telaBaixa (s, contas, categorias, centros) {
  if (!s) return
  const despesas = categorias.filter(c => c.tipo === 'DESPESA')

  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = `
    <div class="modal">
      <h3>Dar baixa no pagamento</h3>
      <div class="ficha" style="margin-bottom:16px;">
        <div class="item"><div class="rot">Item</div><div class="val">${esc(s.produto_servico)}</div></div>
        <div class="item"><div class="rot">Solicitante</div>
          <div class="val">${esc(s.solicitante?.nome ?? '—')}</div></div>
        <div class="item"><div class="rot">Fornecedor</div>
          <div class="val">${esc(s.fornecedor?.nome ?? '—')}</div></div>
      </div>

      <div class="form-grade">
        <div class="campo"><label>Valor pago (R$) *</label>
          <input id="b-valor" inputmode="decimal" value="${s.valor_estimado ?? ''}"></div>
        <div class="campo"><label>Data do pagamento</label>
          <input type="date" id="b-data" value="${new Date().toISOString().slice(0, 10)}"></div>
        <div class="campo"><label>Conta</label>
          <select id="b-conta"><option value="">—</option>
            ${contas.map(c => `<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></div>
        <div class="campo"><label>Categoria</label>
          <select id="b-categoria"><option value="">—</option>
            ${despesas.map(c => `<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></div>
        <div class="campo"><label>Centro de custo</label>
          <select id="b-centro"><option value="">—</option>
            ${centros.map(c => `<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></div>
        <div class="campo"><label>Comprovante (link)</label><input id="b-comp" placeholder="https://..."></div>
        ${campoArquivo('b-arq-comprovante', 'Anexar comprovante')}
        ${campoArquivo('b-arq-boleto', 'Anexar boleto')}
      </div>

      <label class="linha-modulo" style="margin-top:12px;">
        <input type="checkbox" id="b-lancar" checked>
        <span class="nome">Gerar lançamento no Financeiro</span></label>

      <div class="acoes">
        <button class="btn" id="b-confirmar">Confirmar baixa</button>
        <button class="btn-secundario" id="b-cancelar">Cancelar</button>
      </div>
      <div class="recado oculto" id="b-recado"></div>
      <p class="aviso">Ao confirmar, ${esc(s.solicitante?.nome ?? 'o solicitante')} recebe o aviso
      de que a compra foi aprovada e paga.</p>
    </div>`

  document.body.appendChild(fundo)
  const q = id => fundo.querySelector(id)
  const fechar = () => fundo.remove()
  q('#b-cancelar').onclick = fechar
  fundo.onclick = e => { if (e.target === fundo) fechar() }

  const aviso = t => {
    const el = q('#b-recado'); el.textContent = t; el.classList.remove('oculto')
    el.style.borderColor = 'var(--warn-text)'; el.style.color = 'var(--warn-text)'
  }

  q('#b-confirmar').onclick = async () => {
    const valor = numeroBR(q('#b-valor').value)
    if (valor === null) { aviso('Informe o valor pago.'); return }

    const btn = q('#b-confirmar'); btn.disabled = true; btn.textContent = 'Registrando...'
    let lancamentoId = null

    if (q('#b-lancar').checked) {
      const { data: lanc, error: eL } = await db.from('lancamento_financeiro').insert({
        tipo: 'SAIDA',
        descricao: `Compra: ${s.produto_servico}`,
        valor,
        data_lancamento: q('#b-data').value || new Date().toISOString().slice(0, 10),
        conta_id: q('#b-conta').value || null,
        categoria_id: q('#b-categoria').value || null,
        centro_custo_id: q('#b-centro').value || null,
        situacao: 'EFETIVADO',
        observacao: `Solicitação de ${s.solicitante?.nome ?? '—'}`,
        registrado_por: PERFIL.pessoaId
      }).select('id').single()

      if (eL) { aviso('Não deu para lançar no financeiro: ' + eL.message)
        btn.disabled = false; btn.textContent = 'Confirmar baixa'; return }
      lancamentoId = lanc.id
    }

    const { error } = await db.from('solicitacao_compra').update({
      status: 'PAGA',
      pago_por_id: PERFIL.pessoaId,
      pago_em: new Date(q('#b-data').value || Date.now()).toISOString(),
      valor_pago: valor,
      comprovante_link: q('#b-comp').value.trim() || null,
      lancamento_id: lancamentoId
    }).eq('id', s.id)

    if (error) { aviso(error.message); btn.disabled = false; btn.textContent = 'Confirmar baixa'; return }

    // se essa peça foi pedida de dentro de uma OS de manutenção ("Pedir peça
    // pro Compras"), o valor pago soma no valor_pecas daquela OS — dali o
    // valor_total (gerado automático) já reflete em Manutenção e em Frota.
    const { data: materiaisLigados } = await db.from('os_material')
      .select('ordem_servico_id').eq('solicitacao_compra_id', s.id)
    if (materiaisLigados?.length) {
      const osIds = [...new Set(materiaisLigados.map(m => m.ordem_servico_id))]
      for (const osId of osIds) {
        const { data: osAtual } = await db.from('ordem_servico').select('valor_pecas').eq('id', osId).single()
        await db.from('ordem_servico').update({
          valor_pecas: Number(osAtual?.valor_pecas || 0) + valor
        }).eq('id', osId)
      }
    }

    // boleto e comprovante entram no fechamento do mes
    const competencia = (q('#b-data').value || new Date().toISOString().slice(0, 10)).slice(0, 7)
    try {
      const docs = []
      const comprovante = await enviarArquivo(q('#b-arq-comprovante').files[0], competencia)
      if (comprovante) docs.push({
        tipo: 'COMPROVANTE', descricao: s.produto_servico,
        valor, pago_em: q('#b-data').value || null, competencia,
        arquivo_caminho: comprovante.caminho, arquivo_nome: comprovante.nome,
        solicitacao_id: s.id, lancamento_id: lancamentoId, criado_por: PERFIL.pessoaId
      })
      const boleto = await enviarArquivo(q('#b-arq-boleto').files[0], competencia)
      if (boleto) docs.push({
        tipo: 'BOLETO', descricao: s.produto_servico,
        valor, vencimento: s.vencimento ?? null, competencia,
        arquivo_caminho: boleto.caminho, arquivo_nome: boleto.nome,
        solicitacao_id: s.id, lancamento_id: lancamentoId, criado_por: PERFIL.pessoaId
      })
      if (docs.length) await db.from('documento_pagamento').insert(docs)
    } catch (e) {
      // a baixa já foi dada: avisa mas não desfaz
      aviso('Baixa registrada, mas o anexo falhou: ' + String(e.message ?? e))
      setTimeout(() => { fechar(); abrirFinanceiro('pagar', true) }, 2500)
      return
    }

    // avisa o solicitante
    if (s.solicitante?.nome) {
      const { data: p } = await db.from('pessoa').select('id')
        .eq('nome', s.solicitante.nome).maybeSingle()
      if (p) {
        await db.from('aviso').insert({
          pessoa_id: p.id,
          titulo: 'Sua compra foi aprovada e paga',
          texto: `${s.produto_servico} — pago em ${fmtData(q('#b-data').value)} `
               + `no valor de R$ ${fmtNum(valor)}.`,
          origem: 'compras',
          registro_id: s.id
        })
        await db.from('solicitacao_compra')
          .update({ avisado_em: new Date().toISOString() }).eq('id', s.id)
      }
    }

    fechar()
    abrirFinanceiro('pagar', true)
  }
}


// Resumo grande do topo: poucos números, grandes, sem gráfico.
// Cada bloco aceita destaque (ocre) ou alerta (vermelho).
function resumoTopo (blocos) {
  return `<div class="resumo-topo">` + blocos.filter(Boolean).map(b => `
    <div class="bloco ${b.classe ?? ''}">
      <div class="rot">${esc(b.rotulo)}</div>
      <div class="val">${b.valor}</div>
      ${b.nota ? `<div class="nota">${esc(b.nota)}</div>` : ''}
    </div>`).join('') + `</div>`
}

// ----- Financeiro › A pagar, separado por origem -----
// O que vem do Compras fica em cima, com a baixa que gera lançamento.
// Títulos do relatório contábil e lançamentos manuais ficam abaixo.
async function finAPagar (alvo, editavel) {
  const hoje = new Date().toISOString().slice(0, 10)
  const em7 = new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10)

  const { data, error } = await db.from('contas_a_pagar').select('*')
    .neq('origem', 'compra')
    .order('vencimento', { nullsFirst: false })
  if (error) { alvo.innerHTML = `<p class="vazio">${esc(error.message)}</p>`; return }

  const tudo = data || []
  const soma = l => l.reduce((s, x) => s + Number(x.valor || 0), 0)
  const vencidas = tudo.filter(x => x.vencimento && x.vencimento < hoje)
  const semana = tudo.filter(x => x.vencimento && x.vencimento >= hoje && x.vencimento <= em7)
  const titulos = tudo.filter(x => x.origem === 'título')
  const manuais = tudo.filter(x => x.origem === 'lançamento')

  $('#kpis').innerHTML = ''

  const tabela = (lista, vazio) => `
    <div class="panel" style="padding:0;"><div class="tabela-scroll">
      <table><thead><tr>
        <th>Vencimento</th><th>Documento</th><th>Descrição</th><th>Centro</th><th class="num">Valor</th>
      </tr></thead><tbody>
        ${lista.map(x => {
          const atrasado = x.vencimento && x.vencimento < hoje
          return `<tr>
            <td class="${atrasado ? 'badge-alerta' : ''}">${x.vencimento ? fmtData(x.vencimento) : '—'}</td>
            <td class="texto-dim2">${esc(x.documento ?? '—')}</td>
            <td>${esc((x.descricao ?? '').slice(0, 60))}</td>
            <td class="texto-dim">${esc(x.setor ?? '—')}</td>
            <td class="num">R$ ${fmtNum(x.valor)}</td>
          </tr>`
        }).join('') || `<tr><td colspan="5" class="vazio">${vazio}</td></tr>`}
      </tbody></table>
    </div></div>`

  alvo.innerHTML = resumoTopo([
    { rotulo: 'Total a pagar', valor: 'R$ ' + fmtNum(soma(tudo)),
      nota: `${tudo.length} conta(s) em aberto`, classe: 'destaque' },
    vencidas.length
      ? { rotulo: 'Vencido', valor: 'R$ ' + fmtNum(soma(vencidas)),
          nota: `${vencidas.length} conta(s) em atraso`, classe: 'alerta' }
      : { rotulo: 'Vencido', valor: 'nada', nota: 'em dia', classe: 'bom' },
    { rotulo: 'Vence em 7 dias', valor: 'R$ ' + fmtNum(soma(semana)),
      nota: `${semana.length} conta(s)` },
    { rotulo: 'Do relatório contábil', valor: 'R$ ' + fmtNum(soma(titulos)),
      nota: `${titulos.length} título(s) importado(s)` }
  ]) + `
    <p class="aviso" style="margin-top:0;">
      As compras aprovadas ficam na aba <b>Compras</b>, onde a baixa anexa comprovante
      e gera o lançamento.</p>

    <div class="cabeca-secao" style="margin-top:20px;">
      <h3 style="font-family:var(--serif);font-size:17px;">Títulos do relatório contábil</h3>
      <span class="texto-dim2" style="font-size:12px;">${titulos.length} · R$ ${fmtNum(soma(titulos))}</span>
    </div>
    ${tabela(titulos, 'Nenhum título em aberto. Importe o relatório em Cadastros.')}

    <div class="cabeca-secao" style="margin-top:26px;">
      <h3 style="font-family:var(--serif);font-size:17px;">Lançamentos pendentes</h3>
      <span class="texto-dim2" style="font-size:12px;">${manuais.length} · R$ ${fmtNum(soma(manuais))}</span>
    </div>
    ${tabela(manuais, 'Nenhum lançamento pendente de efetivação.')}`
}

// ----- Financeiro › Compras -----
// A fila que vem do módulo de Compras, com resumo próprio.
async function finCompras (alvo, editavel) {
  const hoje = new Date().toISOString().slice(0, 10)

  const [{ data: fila }, { data: porMes }] = await Promise.all([
    db.from('contas_a_pagar').select('*').eq('origem', 'compra'),
    db.from('compras_por_mes').select('*').order('competencia', { ascending: false }).limit(6)
  ])

  const lista = fila || []
  const soma = l => l.reduce((s, x) => s + Number(x.valor || 0), 0)
  const vencidas = lista.filter(x => x.vencimento && x.vencimento < hoje)
  const urgentes = lista.filter(x => x.urgencia === 'URGENTE_4H')
  const mes = (porMes || [])[0]

  $('#kpis').innerHTML = ''

  alvo.innerHTML = resumoTopo([
    { rotulo: 'Compras a pagar', valor: 'R$ ' + fmtNum(soma(lista)),
      nota: `${lista.length} aprovada(s) esperando pagamento`, classe: 'destaque' },
    vencidas.length
      ? { rotulo: 'Passou do prazo', valor: String(vencidas.length),
          nota: 'R$ ' + fmtNum(soma(vencidas)), classe: 'alerta' }
      : { rotulo: 'Passou do prazo', valor: 'nenhuma', nota: 'tudo dentro do prazo', classe: 'bom' },
    urgentes.length
      ? { rotulo: 'Marcadas como urgentes', valor: String(urgentes.length),
          nota: 'R$ ' + fmtNum(soma(urgentes)), classe: 'alerta' }
      : null,
    mes ? { rotulo: 'Aprovado neste mês', valor: 'R$ ' + fmtNum(mes.valor),
            nota: `${mes.quantidade} compra(s)` } : null
  ]) + `
    ${(porMes || []).length > 1 ? `
    <div class="panel" style="padding:16px 18px;margin-bottom:18px;">
      <div class="rot texto-dim2" style="font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;">
        Aprovado por mês</div>
      <div style="margin-top:10px;">${barrasMes(porMes)}</div>
    </div>` : ''}

    <div class="card-gaveta" id="fc-card">
      <div class="barra">
        <span class="seta-card">▶</span>
        <span class="titulo-card">Buscar na fila</span>
        <span class="resumo-card">
          <b>${lista.length}</b> compra(s) · <b>R$ ${fmtNum(soma(lista))}</b><br>
          <span style="font-size:11.5px;">clique para ver e pesquisar</span>
        </span>
      </div>
      <div class="miolo">
        <div class="filtros" style="margin-bottom:14px;">
          <div class="campo" style="flex:1;min-width:240px;">
            <label>Buscar</label>
            <input id="fc-busca" placeholder="item, número do pedido, valor ou data">
          </div>
          <div class="campo"><label>Ordenar por</label>
            <select id="fc-ordem">
              <option value="venc">vencimento</option>
              <option value="valor">maior valor</option>
              <option value="item">item</option>
            </select></div>
        </div>
        <div id="fc-tabela"></div>
      </div>
    </div>`

  const pintar = () => {
    const termo = ($('#fc-busca').value || '').trim().toLowerCase()
    const n = numeroBR(termo)

    let filtrada = lista.filter(x => {
      if (!termo) return true
      const alvo = `${x.descricao ?? ''} ${x.documento ?? ''} ${x.setor ?? ''} `
        + `${x.vencimento ? fmtData(x.vencimento) : ''}`
      if (alvo.toLowerCase().includes(termo)) return true
      if (n !== null && Math.abs(Number(x.valor || 0) - n) < 0.01) return true
      return false
    })

    const ordem = $('#fc-ordem').value
    filtrada = filtrada.slice().sort((a, b) =>
      ordem === 'valor' ? Number(b.valor) - Number(a.valor)
      : ordem === 'item' ? String(a.descricao ?? '').localeCompare(String(b.descricao ?? ''))
      : String(a.vencimento ?? '9999').localeCompare(String(b.vencimento ?? '9999')))

    $('#fc-tabela').innerHTML = `
      <div class="panel" style="padding:0;margin-bottom:16px;"><div class="tabela-scroll">
        <table><thead><tr>
          <th>Vencimento</th><th>Pedido</th><th>Item</th><th>Setor</th><th class="num">Valor</th>
        </tr></thead><tbody>
          ${filtrada.map(x => {
            const atrasado = x.vencimento && x.vencimento < hoje
            return `<tr class="abrivel" data-abrir="${x.id}">
              <td class="${atrasado ? 'badge-alerta' : ''}">
                <span class="seta">▶</span>
                ${x.vencimento ? fmtData(x.vencimento) : '<span class="texto-dim2">sem data</span>'}
                ${x.urgencia === 'URGENTE_4H' ? '<br><span class="urgente">urgente</span>' : ''}</td>
              <td class="texto-dim2">${esc(x.documento ?? '—')}</td>
              <td>${esc((x.descricao ?? '').slice(0, 55))}</td>
              <td class="texto-dim">${esc(x.setor ?? '—')}</td>
              <td class="num">R$ ${fmtNum(x.valor)}</td>
            </tr>
            <tr class="detalhe oculto" data-detalhe="${x.id}">
              <td colspan="5"><div class="conteudo">carregando...</div></td>
            </tr>`
          }).join('') || `<tr><td colspan="5" class="vazio">
            ${termo ? 'Nada encontrado com esse termo.' : 'Nenhuma compra aguardando pagamento.'}</td></tr>`}
        </tbody></table>
      </div>
      ${termo ? `<div style="padding:9px 14px;border-top:1px solid var(--line);">
        <span class="texto-dim2" style="font-size:12px;">${filtrada.length} de ${lista.length}
        · R$ ${fmtNum(filtrada.reduce((s, x) => s + Number(x.valor || 0), 0))}</span></div>` : ''}
      </div>`
  }

  const ligarLinhas = () => {
    $('#fc-tabela').querySelectorAll('[data-abrir]').forEach(tr => {
      tr.onclick = async () => {
        const id = tr.dataset.abrir
        const det = $('#fc-tabela').querySelector(`[data-detalhe="${id}"]`)
        const abrindo = det.classList.contains('oculto')

        // uma aberta por vez: mais fácil de ler
        $('#fc-tabela').querySelectorAll('[data-detalhe]').forEach(d => d.classList.add('oculto'))
        $('#fc-tabela').querySelectorAll('[data-abrir]').forEach(l => l.classList.remove('aberta'))
        if (!abrindo) return

        det.classList.remove('oculto')
        tr.classList.add('aberta')
        await detalheCompra(id, det.querySelector('.conteudo'))
      }
    })
  }

  const pintarELigar = () => { pintar(); ligarLinhas() }
  $('#fc-busca').oninput = pintarELigar
  $('#fc-ordem').onchange = pintarELigar
  pintarELigar()

  const card = $('#fc-card')
  card.querySelector('.barra').onclick = () => {
    card.classList.toggle('aberto')
    if (card.classList.contains('aberto')) $('#fc-busca').focus()
  }

  // a fila com a baixa continua abaixo, inteira
  const caixaFila = document.createElement('div')
  caixaFila.id = 'fc-fila'
  alvo.appendChild(caixaFila)
  await comprasPagar(caixaFila)
}

// Detalhe da compra aberto dentro da própria linha da tabela.
// Busca só quando a pessoa abre — evita carregar 300 solicitações inteiras.
const CACHE_DETALHE = {}
async function detalheCompra (id, alvo) {
  if (CACHE_DETALHE[id]) {
    alvo.innerHTML = CACHE_DETALHE[id]
    ligarBotoesDetalhe(id, alvo)
    return
  }

  const [{ data: s }, { data: orcs }, { data: docs }] = await Promise.all([
    db.from('solicitacao_compra').select(`
      numero, produto_servico, quantidade, unidade, especificacoes, finalidade,
      local_entrega, urgencia, tipo_solicitacao, recorrencia, tem_risco, descricao_risco,
      justificativa, parecer_coordenacao, parecer_cotacao, parecer_aprovacao,
      observacao_compras, onde_mais_barato, forma_pagamento, condicao_pagamento,
      parcelas, vencimento, dados_pagamento, valor_estimado, valor_aprovado,
      data_solicitacao, solicitante_nome, gestor_nome, aprovador_nome,
      solicitante:solicitante_id(nome), analista:analista_id(nome),
      aprovador:aprovador_id(nome), setor:setor_id(nome), fornecedor:fornecedor_id(nome)
    `).eq('id', id).maybeSingle(),
    db.from('orcamento').select('valor,prazo_entrega,forma_pagamento,escolhido,fornecedor_avulso,fornecedor:fornecedor_id(nome)')
      .eq('solicitacao_id', id).order('valor'),
    db.from('documento_pagamento')
      .select('id,tipo,descricao,valor,vencimento,pago_em,arquivo_caminho,arquivo_nome,criado_em,criado:criado_por(nome)')
      .eq('solicitacao_id', id).order('criado_em')
  ])

  if (!s) { alvo.innerHTML = '<p class="texto-dim2">Não encontrei os detalhes.</p>'; return }

  const item = (rot, val) => val
    ? `<div><div class="rot">${esc(rot)}</div><div class="val">${esc(val)}</div></div>` : ''
  const texto = (rot, val) => val
    ? `<div class="det-texto"><b>${esc(rot)}</b>${esc(val)}</div>` : ''
  const nomeF = o => o?.fornecedor?.nome || o?.fornecedor_avulso || null
  const escolhido = (orcs || []).find(o => o.escolhido)

  const html = `
    <div class="det-grade">
      ${item('Solicitante', s.solicitante?.nome ?? s.solicitante_nome)}
      ${item('Setor', s.setor?.nome)}
      ${item('Aberta em', fmtQuando(s.data_solicitacao))}
      ${item('Quantidade', s.quantidade ? `${s.quantidade} ${s.unidade ?? ''}` : null)}
      ${item('Tipo', s.tipo_solicitacao)}
      ${item('Urgência', URGENCIA[s.urgencia] ?? s.urgencia)}
      ${item('Entrega', s.local_entrega)}
      ${item('Recorrência', s.recorrencia)}
      ${item('Fornecedor', nomeF(escolhido) ?? s.fornecedor?.nome)}
      ${item('Pagamento', [s.forma_pagamento, s.condicao_pagamento].filter(Boolean).join(' · '))}
      ${item('Parcelas', s.parcelas ? `${s.parcelas}x` : null)}
      ${item('Vencimento', s.vencimento ? fmtData(s.vencimento) : null)}
      ${item('Valor estimado', s.valor_estimado ? 'R$ ' + fmtNum(s.valor_estimado) : null)}
      ${item('Valor aprovado', s.valor_aprovado ? 'R$ ' + fmtNum(s.valor_aprovado) : null)}
      ${item('Coordenação', s.gestor_nome)}
      ${item('Cotação', s.analista?.nome)}
      ${item('Aprovação', s.aprovador?.nome ?? s.aprovador_nome)}
    </div>

    ${(orcs || []).length ? `
      <table style="margin:4px 0 10px;"><thead><tr>
        <th>Orçamento</th><th class="num">Valor</th><th>Prazo</th><th></th>
      </tr></thead><tbody>
        ${orcs.map(o => `<tr>
          <td>${esc(nomeF(o) ?? '—')}</td>
          <td class="num">R$ ${fmtNum(o.valor)}</td>
          <td>${esc(o.prazo_entrega ?? '—')}</td>
          <td>${o.escolhido ? '<b>escolhido</b>' : ''}</td>
        </tr>`).join('')}
      </tbody></table>` : ''}

    ${(docs || []).length ? `
      <div class="rot texto-dim2" style="font-size:10px;text-transform:uppercase;
           letter-spacing:.1em;margin-top:6px;">Documentos anexados</div>
      <div class="docs-anexos">
        ${docs.map(d => {
          const rotulo = { BOLETO: 'boleto', COMPROVANTE: 'comprovante',
                           NOTA: 'nota fiscal', OUTRO: 'documento' }[d.tipo] ?? 'documento'
          const icone = { BOLETO: '▤', COMPROVANTE: '✓', NOTA: '▦', OUTRO: '▢' }[d.tipo] ?? '▢'
          const quando = d.pago_em ? 'pago em ' + fmtData(d.pago_em)
            : d.vencimento ? 'vence ' + fmtData(d.vencimento)
            : 'anexado em ' + (fmtQuando(d.criado_em) ?? '—')
          return `
            <div class="doc-card ${d.tipo.toLowerCase()}">
              <div class="icone">${icone}</div>
              <div class="corpo">
                <div class="tipo">${esc(rotulo)}</div>
                <div class="valor">${d.valor ? 'R$ ' + fmtNum(d.valor) : esc(d.descricao ?? '—')}</div>
                <div class="quando">${esc(quando)}${
                  d.criado?.nome ? ' · ' + esc(d.criado.nome) : ''}</div>
                ${d.arquivo_nome ? `<div class="nome">${esc(d.arquivo_nome)}</div>` : ''}
                ${d.arquivo_caminho
                  ? `<button class="btn-secundario mini" style="margin-top:7px;"
                       data-ver-doc="${esc(d.arquivo_caminho)}">abrir arquivo</button>`
                  : '<div class="nome">sem arquivo anexado</div>'}
              </div>
            </div>`
        }).join('')}
      </div>` : `
      <div class="sem-doc">Nenhum boleto ou comprovante anexado ainda.
        Eles entram aqui quando a baixa é feita na fila abaixo.</div>`}

    ${texto('Finalidade', s.finalidade)}
    ${texto('Especificações', s.especificacoes)}
    ${texto('Justificativa do solicitante', s.justificativa)}
    ${s.tem_risco ? texto('Risco apontado', s.descricao_risco || 'sim, sem descrição') : ''}
    ${texto('Coordenação', s.parecer_coordenacao)}
    ${texto('Cotação', s.parecer_cotacao)}
    ${texto('Onde achou mais barato', s.onde_mais_barato)}
    ${texto('Observação do compras', s.observacao_compras)}
    ${texto('Parecer da aprovação', s.parecer_aprovacao)}
    ${texto('Dados de pagamento', s.dados_pagamento)}

    <div class="acoes" style="margin-top:12px;">
      <button class="btn-secundario mini" data-ficha-det="${id}">abrir ficha em PDF</button>
    </div>`

  CACHE_DETALHE[id] = html
  alvo.innerHTML = html
  // os botões precisam ser religados a cada abertura, mesmo vindo do cache
  ligarBotoesDetalhe(id, alvo)
}

function ligarBotoesDetalhe (id, alvo) {
  alvo.querySelectorAll('[data-ver-doc]').forEach(b => {
    b.onclick = e => { e.stopPropagation(); abrirArquivo(b.dataset.verDoc) }
  })
  const ficha = alvo.querySelector('[data-ficha-det]')
  if (ficha) ficha.onclick = async e => {
    e.stopPropagation()
    const { data } = await db.from('solicitacao_compra').select(selSolicitacao).eq('id', id).maybeSingle()
    if (data) abrirFicha(data, false).catch(err => console.error(err))
  }
}

// ----- Financeiro › Gastos por setor -----
async function finGastos (alvo) {
  const hoje = new Date()
  const inicio = new Date(hoje.getFullYear(), hoje.getMonth() - 5, 1)
  const de = `${inicio.getFullYear()}-${String(inicio.getMonth() + 1).padStart(2, '0')}`

  const { data, error } = await db.from('gasto_por_setor').select('*')
    .gte('competencia', de).order('competencia', { ascending: false })
  if (error) { alvo.innerHTML = `<p class="vazio">${esc(error.message)}</p>`; return }

  const tudo = data || []
  const meses = [...new Set(tudo.map(x => x.competencia))].sort().reverse()

  alvo.innerHTML = `
    <div class="filtros" style="margin-bottom:14px;">
      <div class="campo"><label>Mês</label>
        <select id="g-mes"><option value="">últimos 6 meses</option>
          ${meses.map(m => `<option value="${m}">${m}</option>`).join('')}
        </select></div>
      <div class="campo"><label>Origem</label>
        <select id="g-origem"><option value="">tudo</option>
          <option value="compras">compras</option>
          <option value="lançamento">lançamentos</option>
        </select></div>
      <button class="btn-secundario" id="g-pdf">Gerar PDF</button>
    </div>
    <div id="g-topo"></div>
    <div id="g-resultado"></div>`

  const desenhar = () => {
    const mes = $('#g-mes').value, origem = $('#g-origem').value
    const lista = tudo.filter(x => (!mes || x.competencia === mes) && (!origem || x.origem === origem))

    const porSetor = {}
    lista.forEach(x => {
      porSetor[x.setor] = porSetor[x.setor] || { valor: 0, qtd: 0, meses: new Set() }
      porSetor[x.setor].valor += Number(x.valor)
      porSetor[x.setor].qtd += Number(x.quantidade)
      porSetor[x.setor].meses.add(x.competencia)
    })

    const ordenado = Object.entries(porSetor).sort((a, b) => b[1].valor - a[1].valor)
    const total = ordenado.reduce((s, [, v]) => s + v.valor, 0)
    const maior = ordenado[0]

    $('#kpis').innerHTML = ''
    $('#g-topo').innerHTML = resumoTopo([
      { rotulo: 'Gasto total', valor: 'R$ ' + fmtNum(total),
        nota: mes || `últimos ${meses.length} meses`, classe: 'destaque' },
      maior ? { rotulo: 'Quem mais gastou', valor: esc(maior[0]),
        nota: `R$ ${fmtNum(maior[1].valor)} · ${(maior[1].valor / total * 100).toFixed(0)}% do total` } : null,
      { rotulo: 'Média por mês', valor: 'R$ ' + fmtNum(total / Math.max(1, mes ? 1 : meses.length)),
        nota: `${ordenado.length} setor(es)` }
    ])

    $('#g-resultado').innerHTML = `
      <div class="panel" style="padding:18px;margin-bottom:14px;">
        ${ordenado.map(([setor, v]) => `
          <div style="display:grid;grid-template-columns:150px 1fr auto;gap:12px;
               align-items:center;padding:7px 0;">
            <span style="font-size:13.5px;">${esc(setor)}</span>
            <span style="background:var(--hover-bg);border-radius:20px;height:10px;display:block;">
              <i style="display:block;height:100%;border-radius:20px;background:var(--rust);
                 width:${(v.valor / (maior?.[1].valor || 1) * 100).toFixed(1)}%;"></i></span>
            <span style="font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;">
              R$ ${fmtNum(v.valor)}
              <span class="texto-dim2">· ${(v.valor / total * 100).toFixed(1)}%
              · média R$ ${fmtNum(v.valor / v.meses.size)}/mês</span></span>
          </div>`).join('') || '<p class="vazio">Nada no período.</p>'}
      </div>

      <div class="panel" style="padding:0;"><div class="tabela-scroll">
        <table><thead><tr>
          <th>Mês</th><th>Setor</th><th>Origem</th><th class="num">Itens</th><th class="num">Valor</th>
        </tr></thead><tbody>
          ${lista.sort((a, b) => b.competencia.localeCompare(a.competencia) ||
                                 Number(b.valor) - Number(a.valor)).map(x => `<tr>
            <td>${esc(x.competencia)}</td>
            <td>${esc(x.setor)}</td>
            <td><span class="chip">${esc(x.origem)}</span></td>
            <td class="num">${x.quantidade}</td>
            <td class="num">R$ ${fmtNum(x.valor)}</td>
          </tr>`).join('')}
        </tbody></table>
      </div></div>`

    return { ordenado, total, mes, lista }
  }

  let atual = desenhar()
  $('#g-mes').onchange = () => { atual = desenhar() }
  $('#g-origem').onchange = () => { atual = desenhar() }

  $('#g-pdf').onclick = () => {
    const corpo = `
      <div class="doc-linha">
        ${docBloco('Período', docLinha('Referência', atual.mes || `últimos ${meses.length} meses`) +
          docLinha('Emitido em', fmtQuando(new Date().toISOString())) +
          docLinha('Emitido por', PERFIL.nome))}
        ${docBloco('Total', docValor('Gasto no período', 'compras e lançamentos', atual.total, true))}
      </div>
      ${docBloco('Por setor', `
        <table><thead><tr><th>Setor</th><th class="num">Itens</th>
          <th class="num">Valor</th><th class="num">Participação</th></tr></thead><tbody>
          ${atual.ordenado.map(([s, v]) => `<tr>
            <td>${esc(s)}</td><td class="num">${v.qtd}</td>
            <td class="num">R$ ${fmtNum(v.valor)}</td>
            <td class="num">${(v.valor / atual.total * 100).toFixed(1)}%</td>
          </tr>`).join('')}
        </tbody></table>`)}
      ${docAssinaturas([['Emitido por', PERFIL.nome], ['Financeiro', ''], ['Diretoria', '']])}`

    const fundo = document.createElement('div')
    fundo.className = 'modal-fundo'
    fundo.innerHTML = documentoPDF({
      titulo: 'GASTOS POR SETOR', subtitulo: atual.mes || 'últimos meses', corpo,
      acoes: `<button class="btn" id="gp-imprimir">Gerar PDF</button>
        <button class="btn-secundario" id="gp-fechar">Fechar</button>`
    })
    document.body.appendChild(fundo)
    fundo.querySelector('#gp-fechar').onclick = () => fundo.remove()
    fundo.querySelector('#gp-imprimir').onclick = () => window.print()
    fundo.onclick = e => { if (e.target === fundo) fundo.remove() }
  }
}

// ----- Editar ou excluir lançamento -----
// Lançamento é dinheiro: toda alteração fica registrada com quem fez,
// quando e o que mudou. Excluir pede motivo.
function telaLancamento (l, acao) {
  if (!l) return
  const excluindo = acao === 'EXCLUSAO'

  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = `
    <div class="modal">
      <h3>${excluindo ? 'Excluir lançamento' : 'Editar lançamento'}</h3>

      ${excluindo ? `
        <div class="ficha" style="margin-bottom:14px;">
          <div class="item"><div class="rot">Descrição</div>
            <div class="val">${esc(l.descricao)}</div></div>
          <div class="item"><div class="rot">Valor</div>
            <div class="val">${l.tipo === 'SAIDA' ? '−' : '+'} R$ ${fmtNum(l.valor)}</div></div>
          <div class="item"><div class="rot">Data</div>
            <div class="val">${fmtData(l.data_lancamento)}</div></div>
        </div>
        <p class="aviso" style="margin-top:0;">
          O lançamento some do caixa e dos relatórios. Fica o registro de que existiu,
          com o motivo, para a conciliação fazer sentido depois.
          Se ele veio da baixa de uma compra, essa compra volta para
          <b>aprovada a pagar</b> — o pagamento deixa de constar.</p>
        <div class="campo"><label>Por que está excluindo *</label>
          <textarea id="tl-motivo" style="min-height:80px;"
            placeholder="lançado em duplicidade, valor errado, teste..."></textarea></div>
      ` : `
        <div class="form-grade">
          <div class="campo" style="grid-column:1/-1;"><label>Descrição *</label>
            <input id="tl-desc" value="${esc(l.descricao ?? '')}"></div>
          <div class="campo"><label>Valor (R$) *</label>
            <input id="tl-valor" inputmode="decimal" value="${l.valor ?? ''}"></div>
          <div class="campo"><label>Tipo *</label>
            <select id="tl-tipo">
              <option value="SAIDA" ${l.tipo === 'SAIDA' ? 'selected' : ''}>saída — despesa</option>
              <option value="ENTRADA" ${l.tipo === 'ENTRADA' ? 'selected' : ''}>entrada — receita</option>
            </select></div>
          <div class="campo"><label>Data</label>
            <input type="date" id="tl-data" value="${l.data_lancamento ?? ''}"></div>
          <div class="campo"><label>Conta</label>
            <select id="tl-conta">${opcoesFin(FIN_CACHE.contas.filter(c => c.tipo !== 'PASSIVO'), 'selecione…', l.conta_id)}</select></div>
          <div class="campo"><label>Categoria</label>
            <select id="tl-cat">${opcoesFin(FIN_CACHE.categorias, 'selecione…', l.categoria_id)}</select></div>
          <div class="campo"><label>Centro de custo</label>
            <select id="tl-centro">${opcoesFin(FIN_CACHE.centros, 'selecione…', l.centro_custo_id)}</select></div>
          <div class="campo"><label>Situação</label>
            <select id="tl-sit">
              <option value="EFETIVADO" ${l.situacao === 'EFETIVADO' ? 'selected' : ''}>efetivado</option>
              <option value="PENDENTE" ${l.situacao === 'PENDENTE' ? 'selected' : ''}>pendente</option>
            </select></div>
        </div>
        <div class="campo" style="margin-top:12px;"><label>Observação</label>
          <input id="tl-obs" value="${esc(l.observacao ?? '')}"></div>
        <div class="campo" style="margin-top:12px;"><label>Por que está alterando</label>
          <input id="tl-motivo-edit" placeholder="opcional, mas ajuda na conferência depois"></div>
        <p class="aviso">Trocar o tipo entre saída e entrada muda o resultado do mês.
        A categoria não muda sozinha — confira se ela combina com o novo tipo.</p>
      `}

      <div class="acoes">
        <button class="btn" id="tl-ok" ${excluindo ? 'style="background:var(--warn-text);"' : ''}>
          ${excluindo ? 'Excluir' : 'Salvar'}</button>
        <button class="btn-secundario" id="tl-cancelar">Cancelar</button>
      </div>
      <div class="recado oculto" id="tl-recado"></div>
    </div>`

  document.body.appendChild(fundo)
  const q = id => fundo.querySelector(id)
  const fechar = () => fundo.remove()
  q('#tl-cancelar').onclick = fechar
  fundo.onclick = e => { if (e.target === fundo) fechar() }

  const aviso = t => {
    const el = q('#tl-recado'); el.textContent = t; el.classList.remove('oculto')
    el.style.borderColor = 'var(--warn-text)'; el.style.color = 'var(--warn-text)'
  }

  const antes = {
    descricao: l.descricao, valor: l.valor, tipo: l.tipo, situacao: l.situacao,
    data_lancamento: l.data_lancamento, categoria_id: l.categoria_id,
    conta_id: l.conta_id, centro_custo_id: l.centro_custo_id, observacao: l.observacao
  }

  q('#tl-ok').onclick = async () => {
    const motivo = (q('#tl-motivo') ?? q('#tl-motivo-edit')).value.trim()
    const btn = q('#tl-ok'); btn.disabled = true

    if (excluindo) {
      if (motivo.length < 5) { aviso('Escreva o motivo da exclusão.'); btn.disabled = false; return }
      // quem apontava para este lançamento volta a ficar em aberto
      const { data: compras } = await db.from('solicitacao_compra')
        .select('id, numero, produto_servico').eq('lancamento_id', l.id)

      await db.from('lancamento_historico').insert({
        lancamento_id: l.id, acao: 'EXCLUSAO',
        antes: { ...antes, compras_vinculadas: (compras || []).map(c => c.numero) },
        motivo, pessoa_id: PERFIL.pessoaId
      })

      const { error } = await db.from('lancamento_financeiro').delete().eq('id', l.id)
      if (error) { aviso(error.message); btn.disabled = false; return }

      // a compra volta para "aprovada a pagar": ela nunca foi paga de fato
      if (compras?.length) {
        await db.from('solicitacao_compra').update({
          status: 'APROVADA', pago_em: null, valor_pago: null, pago_por_id: null
        }).in('id', compras.map(c => c.id))
        alert(`Lançamento excluído.\n\n${compras.length} compra(s) voltaram para "aprovada a pagar":\n`
          + compras.map(c => `· ${c.numero} — ${c.produto_servico}`).join('\n'))
      }

      fechar(); abrirFinanceiro('lancamentos', true)
      return
    }

    const desc = q('#tl-desc').value.trim()
    const valor = numeroBR(q('#tl-valor').value)
    if (!desc) { aviso('Escreva a descrição.'); btn.disabled = false; return }
    if (valor === null || valor <= 0) { aviso('Informe um valor maior que zero.'); btn.disabled = false; return }

    const depois = {
      descricao: desc, valor, tipo: q('#tl-tipo').value, situacao: q('#tl-sit').value,
      data_lancamento: q('#tl-data').value || l.data_lancamento,
      categoria_id: q('#tl-cat').value || null,
      conta_id: q('#tl-conta').value || null,
      centro_custo_id: q('#tl-centro').value || null,
      observacao: q('#tl-obs').value.trim() || null
    }

    const { error } = await db.from('lancamento_financeiro')
      .update({ ...depois, editado_em: new Date().toISOString(), editado_por: PERFIL.pessoaId })
      .eq('id', l.id)
    if (error) { aviso(error.message); btn.disabled = false; return }

    await db.from('lancamento_historico').insert({
      lancamento_id: l.id, acao: 'EDICAO', antes, depois,
      motivo: motivo || null, pessoa_id: PERFIL.pessoaId
    })
    fechar(); abrirFinanceiro('lancamentos', true)
  }
}

// ----- Financeiro › Faturamento de NF -----
async function finFaturar (alvo, editavel) {
  const { data, error } = await db.from('carregamento_a_faturar')
    .select('*').order('data_carregamento', { ascending: false }).limit(400)

  if (error) { alvo.innerHTML = `<p class="vazio">${esc(error.message)}</p>`; return }

  const semValor = (data || []).filter(c => c.valor_sugerido == null).length
  const totalSugerido = (data || []).reduce((t, c) => t + Number(c.valor_sugerido || 0), 0)

  $('#kpis').innerHTML =
    kpi('NFs a faturar', (data || []).length, 'ainda sem lançamento') +
    kpi('Valor sugerido', 'R$ ' + fmtNum(totalSugerido),
        semValor ? `${semValor} sem preço` : 'com base no preço cadastrado') +
    kpi('Toneladas', fmtNum((data || []).reduce((t, c) => t + Number(c.quantidade_t || 0), 0), 2))

  alvo.innerHTML = `
    <p class="aviso" style="margin-top:0;">
      Cada carregamento com nota fiscal pode virar um recebimento no financeiro.
      Faturado uma vez, sai desta lista.</p>
    ${semValor ? `<div class="badge-alerta" style="padding:9px 12px;border-radius:6px;font-size:12.5px;margin-bottom:14px;">
      ${semValor} carregamento(s) sem preço. Cadastre o preço em Categorias e centros →
      preços de venda, ou digite o valor na hora de faturar.</div>` : ''}

// ----- Faturar um carregamento -----
function telaFaturar (c) {
  if (!c) return
  const receitas = FIN_CACHE.categorias.filter(x => x.tipo === 'RECEITA')

  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = `
    <div class="modal">
      <h3>Faturar NF ${esc(c.numero_nf ?? '')}</h3>
      <div class="ficha" style="margin-bottom:16px;">
        <div class="item"><div class="rot">Cliente</div><div class="val">${esc(c.cliente ?? '—')}</div></div>
        <div class="item"><div class="rot">Produto</div><div class="val">${esc(c.produto ?? '—')}</div></div>
        <div class="item"><div class="rot">Quantidade</div>
          <div class="val">${fmtNum(c.quantidade_t, 3)} t</div></div>
        <div class="item"><div class="rot">Data</div>
          <div class="val">${fmtData(c.data_carregamento)}</div></div>
      </div>

      <div class="form-grade">
        <div class="campo"><label>Preço por tonelada (R$)</label>
          <input id="ft-preco" inputmode="decimal" value="${c.preco_unitario ?? ''}"></div>
        <div class="campo"><label>Valor da nota (R$) *</label>
          <input id="ft-valor" inputmode="decimal" value="${c.valor_sugerido ?? ''}"></div>
        <div class="campo"><label>Categoria</label>
          <select id="ft-cat"><option value="">—</option>
            ${receitas.map(x => `<option value="${x.id}">${esc(x.nome)}</option>`).join('')}</select></div>
        <div class="campo"><label>Conta</label>
          <select id="ft-conta"><option value="">—</option>
            ${FIN_CACHE.contas.map(x => `<option value="${x.id}">${esc(x.nome)}</option>`).join('')}</select></div>
        <div class="campo"><label>Situação</label>
          <select id="ft-sit">
            <option value="PENDENTE">a receber</option>
            <option value="EFETIVADO">já recebido</option></select></div>
      </div>

      <div class="acoes">
        <button class="btn" id="ft-ok">Gerar recebimento</button>
        <button class="btn-secundario" id="ft-cancelar">Cancelar</button>
      </div>
      <div class="recado oculto" id="ft-recado"></div>
      <p class="aviso">O preço por tonelada fica gravado no carregamento.
      Para não digitar toda vez, cadastre um preço de venda do produto.</p>
    </div>`

  document.body.appendChild(fundo)
  const q = id => fundo.querySelector(id)
  const fechar = () => fundo.remove()
  q('#ft-cancelar').onclick = fechar
  fundo.onclick = e => { if (e.target === fundo) fechar() }

  const aviso = t => {
    const el = q('#ft-recado'); el.textContent = t; el.classList.remove('oculto')
    el.style.borderColor = 'var(--warn-text)'; el.style.color = 'var(--warn-text)'
  }

  // digitou o preço: recalcula o valor
  q('#ft-preco').oninput = () => {
    const p = numeroBR(q('#ft-preco').value)
    if (p !== null) q('#ft-valor').value = (p * Number(c.quantidade_t || 0)).toFixed(2).replace('.', ',')
  }

  q('#ft-ok').onclick = async () => {
    const valor = numeroBR(q('#ft-valor').value)
    if (valor === null || valor <= 0) { aviso('Informe o valor da nota.'); return }

    const btn = q('#ft-ok'); btn.disabled = true; btn.textContent = 'Gerando...'

    const { data: lanc, error: eL } = await db.from('lancamento_financeiro').insert({
      tipo: 'ENTRADA',
      descricao: `NF ${c.numero_nf ?? ''} — ${c.cliente ?? ''}`.trim(),
      valor,
      data_lancamento: c.data_carregamento,
      categoria_id: q('#ft-cat').value || null,
      conta_id: q('#ft-conta').value || null,
      situacao: q('#ft-sit').value,
      observacao: `${fmtNum(c.quantidade_t, 3)} t de ${c.produto ?? '—'}`,
      registrado_por: PERFIL.pessoaId
    }).select('id').single()

    if (eL) { aviso(eL.message); btn.disabled = false; btn.textContent = 'Gerar recebimento'; return }

    const { error } = await db.from('carregamento').update({
      preco_unitario: numeroBR(q('#ft-preco').value),
      valor_nf: valor,
      lancamento_id: lanc.id,
      faturado_em: new Date().toISOString()
    }).eq('id', c.id)

    if (error) { aviso(error.message); btn.disabled = false; btn.textContent = 'Gerar recebimento'; return }
    fechar()
    abrirCobranca('faturar')
  }
}

// ---------------------------------------------------------------
// Boletos e comprovantes
// Os arquivos ficam num bucket privado. O link de leitura é gerado
// na hora e expira, então documento financeiro não fica em URL aberta.
// ---------------------------------------------------------------
async function enviarArquivo (arquivo, pasta) {
  if (!arquivo) return null
  const limpo = arquivo.name.replace(/[^\w.\-]/g, '_').slice(-80)
  const caminho = `${pasta}/${Date.now()}_${limpo}`
  const { error } = await db.storage.from('documentos')
    .upload(caminho, arquivo, { upsert: false })
  if (error) throw new Error('Não deu para enviar o arquivo: ' + error.message)
  return { caminho, nome: arquivo.name }
}

async function abrirArquivo (caminho) {
  if (!caminho) return
  const { data, error } = await db.storage.from('documentos')
    .createSignedUrl(caminho, 300)          // vale 5 minutos
  if (error) { alert('Não deu para abrir: ' + error.message); return }
  window.open(data.signedUrl, '_blank', 'noopener')
}

// ---------------------------------------------------------------
// Financeiro › Fechamento do mês
// Junta boleto com comprovante e monta o pacote da contabilidade.
// ---------------------------------------------------------------
async function finFechamento (alvo, editavel) {
  // FIN_MES é um Date; a competência é o texto AAAA-MM
  const base = FIN_MES instanceof Date ? FIN_MES : new Date()
  const mes = `${base.getFullYear()}-${String(base.getMonth() + 1).padStart(2, '0')}`

  const [{ data: docs }, { data: resumo }] = await Promise.all([
    db.from('documento_pagamento').select(`
      id, tipo, descricao, valor, vencimento, pago_em, competencia,
      arquivo_caminho, arquivo_nome, enviado_contabilidade_em,
      lancamento:lancamento_id ( descricao, valor ),
      solicitacao:solicitacao_id ( numero, produto_servico )
    `).eq('competencia', mes).order('vencimento', { nullsFirst: false }),
    db.from('fechamento_mensal').select('*').order('competencia', { ascending: false }).limit(12)
  ])

  const lista = docs || []
  const boletos = lista.filter(d => d.tipo === 'BOLETO')
  const comprovantes = lista.filter(d => d.tipo === 'COMPROVANTE')

  // casa boleto com comprovante pelo lançamento ou pela solicitação
  const chave = d => d.lancamento?.descricao ?? d.solicitacao?.numero ?? ('avulso:' + d.id)
  const porChave = {}
  lista.forEach(d => {
    const k = chave(d)
    porChave[k] = porChave[k] || { boleto: null, comprovante: null, itens: [] }
    if (d.tipo === 'BOLETO') porChave[k].boleto = d
    if (d.tipo === 'COMPROVANTE') porChave[k].comprovante = d
    porChave[k].itens.push(d)
  })

  const pares = Object.entries(porChave)
  const completos = pares.filter(([, v]) => v.boleto && v.comprovante)
  const soBoleto = pares.filter(([, v]) => v.boleto && !v.comprovante)
  const soComprovante = pares.filter(([, v]) => !v.boleto && v.comprovante)

  const totalPago = comprovantes.reduce((s, d) => s + Number(d.valor || 0), 0)

  $('#kpis').innerHTML = ''
  const topoFechamento = resumoTopo([
    { rotulo: 'Total comprovado', valor: 'R$ ' + fmtNum(totalPago),
      nota: `${comprovantes.length} comprovante(s) no mês`, classe: 'destaque' },
    { rotulo: 'Documentos', valor: String(lista.length),
      nota: `${boletos.length} boleto(s) · ${comprovantes.length} comprovante(s)` },
    (soBoleto.length + soComprovante.length)
      ? { rotulo: 'Falta parear', valor: String(soBoleto.length + soComprovante.length),
          nota: 'antes de fechar o mês', classe: 'alerta' }
      : { rotulo: 'Conferência', valor: 'tudo pareado', nota: `${completos.length} par(es)`, classe: 'bom' }
  ])

  const linha = d => `
    <tr>
      <td>${esc({ BOLETO: 'boleto', COMPROVANTE: 'comprovante', NOTA: 'nota', OUTRO: 'outro' }[d.tipo])}</td>
      <td>${esc(d.descricao || d.lancamento?.descricao || d.solicitacao?.produto_servico || '—')}</td>
      <td>${d.vencimento ? fmtData(d.vencimento) : d.pago_em ? fmtData(d.pago_em) : '—'}</td>
      <td class="num">${d.valor ? 'R$ ' + fmtNum(d.valor) : '—'}</td>
      <td style="text-align:right;white-space:nowrap;">
        ${d.arquivo_caminho
          ? `<button class="btn-secundario mini" data-ver="${esc(d.arquivo_caminho)}">abrir</button>` : ''}
        ${editavel ? `<button class="btn-secundario mini" data-del-doc="${d.id}">×</button>` : ''}
      </td>
    </tr>`

  alvo.innerHTML = `
    ${navMesHtml()}
    ${topoFechamento}

    ${(soBoleto.length || soComprovante.length) ? `
    <div class="panel" style="padding:16px 18px;margin-bottom:14px;border-color:var(--warn-text);">
      <div class="rot texto-dim2" style="font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;">
        Falta parear antes de fechar o mês</div>
      ${soBoleto.map(([k, v]) => `<div class="passo">
        <span class="quando">sem comprovante</span>
        <span>${esc(v.boleto.descricao || k)}${v.boleto.valor ? ' — R$ ' + fmtNum(v.boleto.valor) : ''}</span>
      </div>`).join('')}
      ${soComprovante.map(([k, v]) => `<div class="passo">
        <span class="quando">sem boleto</span>
        <span>${esc(v.comprovante.descricao || k)}${v.comprovante.valor ? ' — R$ ' + fmtNum(v.comprovante.valor) : ''}</span>
      </div>`).join('')}
    </div>` : ''}

    ${editavel ? `<div class="acoes" style="margin:0 0 14px;">
      <button class="btn" id="fe-novo">Adicionar documento</button>
      <button class="btn-secundario" id="fe-pacote">Gerar pacote da contabilidade</button>
      <button class="btn-secundario" id="fe-capa">Capa para conferência</button>
    </div>
    <div class="recado oculto" id="fe-recado"></div>` : ''}

    <div class="panel" style="padding:0;margin-top:14px;"><div class="tabela-scroll">
      <table><thead><tr>
        <th>Tipo</th><th>Referente a</th><th>Data</th><th class="num">Valor</th><th></th>
      </tr></thead><tbody>
        ${lista.map(linha).join('') || `<tr><td colspan="5" class="vazio">
          Nenhum documento neste mês. Os boletos e comprovantes anexados na baixa
          aparecem aqui automaticamente.</td></tr>`}
      </tbody></table>
    </div></div>

    ${(resumo || []).length ? `
    <div class="cabeca-secao" style="margin-top:22px;">
      <h3 style="font-family:var(--serif);font-size:17px;">Meses anteriores</h3></div>
    <div class="panel" style="padding:0;"><table><tbody>
      ${(resumo || []).map(r => `<tr>
        <td>${esc(r.competencia)}</td>
        <td class="texto-dim">${r.boletos} boleto(s) · ${r.comprovantes} comprovante(s)</td>
        <td class="num">R$ ${fmtNum(r.valor_pago)}</td>
        <td>${r.ja_enviados === r.total && r.total > 0
          ? '<span class="status aprovada">enviado</span>'
          : `<span class="texto-dim2">${r.ja_enviados}/${r.total} enviados</span>`}</td>
      </tr>`).join('')}
    </tbody></table></div>` : ''}`

  ligarNavMes('fechamento', editavel)

  alvo.querySelectorAll('[data-ver]').forEach(b => {
    b.onclick = () => abrirArquivo(b.dataset.ver)
  })

  if (!editavel) return

  const aviso = (t, alerta = false) => {
    const el = $('#fe-recado'); el.innerHTML = t; el.classList.remove('oculto')
    el.style.borderColor = alerta ? 'var(--warn-text)' : 'var(--line2)'
    el.style.color = alerta ? 'var(--warn-text)' : 'var(--dim)'
  }

  alvo.querySelectorAll('[data-del-doc]').forEach(b => {
    b.onclick = async () => {
      if (!confirm('Remover este documento do fechamento?')) return
      const d = lista.find(x => x.id === b.dataset.delDoc)
      if (d?.arquivo_caminho) await db.storage.from('documentos').remove([d.arquivo_caminho])
      await db.from('documento_pagamento').delete().eq('id', b.dataset.delDoc)
      abrirFinanceiro('fechamento', true)
    }
  })

  $('#fe-novo').onclick = () => formDocumento(mes)
  $('#fe-capa').onclick = () => capaFechamento(mes, lista, completos, soBoleto, soComprovante)

  $('#fe-pacote').onclick = async () => {
    const comArquivo = lista.filter(d => d.arquivo_caminho)
    if (!comArquivo.length) { aviso('Nenhum documento com arquivo anexado neste mês.', true); return }

    const btn = $('#fe-pacote'); btn.disabled = true
    aviso(`Montando o pacote com ${comArquivo.length} arquivo(s)...`)

    try {
      const { default: JSZip } = await import('https://esm.sh/jszip@3.10.1')
      const zip = new JSZip()
      const pastas = { BOLETO: 'boletos', COMPROVANTE: 'comprovantes', NOTA: 'notas', OUTRO: 'outros' }

      for (let i = 0; i < comArquivo.length; i++) {
        const d = comArquivo[i]
        btn.textContent = `baixando ${i + 1} de ${comArquivo.length}...`
        const { data, error } = await db.storage.from('documentos').download(d.arquivo_caminho)
        if (error) continue
        const nome = (d.arquivo_nome || d.arquivo_caminho.split('/').pop())
        zip.folder(pastas[d.tipo] ?? 'outros').file(nome, data)
      }

      // índice do pacote, para a contabilidade conferir
      zip.file('indice.txt',
        `GRUPO GEFOSCAL — documentos de ${mes}\n` +
        `Gerado em ${new Date().toLocaleString('pt-BR')} por ${PERFIL.nome}\n\n` +
        comArquivo.map(d =>
          `[${d.tipo}] ${d.descricao || d.lancamento?.descricao || '—'} · ` +
          `${d.valor ? 'R$ ' + fmtNum(d.valor) : 'sem valor'} · ` +
          `${d.vencimento ? 'venc ' + fmtData(d.vencimento) : ''}` +
          `${d.pago_em ? ' pago ' + fmtData(d.pago_em) : ''}`
        ).join('\n') +
        `\n\nTotal comprovado: R$ ${fmtNum(totalPago)}\n`)

      btn.textContent = 'compactando...'
      const blob = await zip.generateAsync({ type: 'blob' })
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      a.href = url; a.download = `gefoscal_${mes}_contabilidade.zip`
      a.click(); URL.revokeObjectURL(url)

      await db.from('documento_pagamento')
        .update({ enviado_contabilidade_em: new Date().toISOString() })
        .eq('competencia', mes).is('enviado_contabilidade_em', null)

      aviso(`Pacote com ${comArquivo.length} arquivo(s) baixado. Os documentos foram marcados como enviados.`)
    } catch (e) {
      aviso('Não deu para montar o pacote: ' + esc(String(e.message ?? e)), true)
    }
    btn.disabled = false; btn.textContent = 'Gerar pacote da contabilidade'
  }
}

  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = `
    <div class="modal">
      <h3>Adicionar documento</h3>
      <div class="form-grade">

          <select id="dc-tipo">
