<!DOCTYPE html>
<html lang="pt-BR" data-skin="plataforma">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema Gefoscal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="skins_gefoscal.css">
<style>
/* Layout do app. Usa só os tokens das skins — nenhuma cor fixa aqui. */
.app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
@media (max-width: 860px) { .app { grid-template-columns: 1fr; } .nav { display: none; } }
.nav { background: var(--panel); border-right: 1px solid var(--line); padding: 18px 12px; }
.nav h1 { font-family: var(--serif); font-size: 19px; margin: 0 0 2px; }
.nav .sub { color: var(--dim2); font-size: 11px; margin-bottom: 22px; }
.nav a { display:block; padding:9px 11px; border-radius:6px; color:var(--dim);
         text-decoration:none; font-size:14px; margin-bottom:2px; cursor:pointer; }
.nav a:hover { background: var(--hover-bg); color: var(--txt); }
.nav a.ativo { background: var(--hover-bg); color: var(--txt); border-left:3px solid var(--rust); }
.nav a.bloqueado { opacity:.35; cursor:not-allowed; }
.conteudo { padding: 22px 26px; max-width: 1400px; }
.topo { display:flex; justify-content:space-between; align-items:flex-start;
        gap:16px; flex-wrap:wrap; margin-bottom:20px; }
.topo h2 { font-family: var(--serif); margin:0 0 4px; font-size:24px; }
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); gap:12px; margin-bottom:20px; }
.kpi .rotulo { color:var(--dim2); font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
.kpi .valor { font-family:var(--serif); font-size:26px; margin-top:6px; }
.kpi .nota { color:var(--dim); font-size:12px; margin-top:2px; }
.filtros { display:flex; gap:10px; flex-wrap:wrap; align-items:end; margin-bottom:16px; }
.campo { display:flex; flex-direction:column; gap:4px; }
.campo label { color:var(--dim2); font-size:11px; text-transform:uppercase; letter-spacing:.4px; }
table { width:100%; border-collapse:collapse; font-size:13.5px; }
th { text-align:left; color:var(--dim2); font-weight:600; font-size:11px;
     text-transform:uppercase; letter-spacing:.4px; padding:9px 10px;
     border-bottom:1px solid var(--line2); position:sticky; top:0; background:var(--panel); }
td { padding:9px 10px; border-bottom:1px solid var(--line); }
tbody tr:hover { background: var(--hover-bg); }
.num { text-align:right; font-variant-numeric: tabular-nums; }
.tabela-scroll { max-height: 62vh; overflow:auto; }
.chip { display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px;
        border:1px solid var(--line2); color:var(--dim); }
.anexo-link { color:var(--rust); text-decoration:none; font-size:12px; margin-right:6px; }
.anexo-link:hover { text-decoration:underline; }
.login-wrap { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
.login { width:100%; max-width:380px; }
.login h1 { font-family:var(--serif); margin:0 0 4px; }
.login .campo { margin-bottom:12px; }
.login input { width:100%; }
.erro { color:var(--warn-text); font-size:13px; margin-top:10px; min-height:18px; }
.vazio { color:var(--dim2); padding:28px; text-align:center; }
.oculto { display:none !important; }
.barra-skin { display:flex; gap:6px; }
.barra-skin button { font-size:11px; padding:5px 9px; }

/* ---- Administração e Visão geral ---- */
.subabas { display:flex; gap:2px; margin-bottom:18px; border-bottom:1px solid var(--line2); }
.subabas button { background:none; border:none; color:var(--dim); cursor:pointer;
                  font-size:13px; padding:9px 14px; border-bottom:2px solid transparent; }
.subabas button:hover { color:var(--txt); }
.subabas button.ativo { color:var(--txt); border-bottom-color:var(--rust); }
.form-grade { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; }
.grade-modulos { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:8px; margin-top:6px; }
.linha-modulo { display:flex; align-items:center; gap:12px; padding:8px 10px;
                border:1px solid var(--line); border-radius:6px; font-size:13px; }
.linha-modulo .nome { flex:1; }
.linha-modulo label { display:flex; align-items:center; gap:5px; color:var(--dim); font-size:11.5px; }
.acoes { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; align-items:center; }
.aviso { color:var(--dim2); font-size:12px; margin-top:10px; }
.secao { margin-bottom:22px; }
.secao h3 { font-family:var(--serif); font-size:17px; margin:0 0 10px; }
.mini { font-size:12px; padding:4px 9px; }
textarea { width:100%; min-height:230px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
           font-size:12.5px; line-height:1.5; }
.moldura-visao { width:100%; height:60vh; border:1px solid var(--line); border-radius:8px; background:var(--panel); }
.duas-colunas { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
@media (max-width: 900px) { .duas-colunas { grid-template-columns:1fr; } }

/* ---- Lista de pessoas ---- */
.lista-pessoas { display:grid; gap:9px; }
.cartao-pessoa { display:flex; align-items:center; gap:13px; padding:12px 14px;
                 border:1px solid var(--line); border-radius:8px; background:var(--panel);
                 transition:border-color .15s ease; }
.cartao-pessoa:hover { border-color:var(--line2); }
.inicial { width:38px; height:38px; border-radius:50%; flex:none; display:grid; place-items:center;
           background:var(--hover-bg); font-family:var(--serif); font-size:15px; }
.cartao-pessoa .dados { flex:1; min-width:0; }
.cartao-pessoa .nome { font-size:14px; margin-bottom:2px; }
.cartao-pessoa .sub { color:var(--dim2); font-size:12px; overflow:hidden;
                      text-overflow:ellipsis; white-space:nowrap; }
.cartao-pessoa .selos { display:flex; gap:5px; flex:none; align-items:center; }
.cartao-pessoa .botoes { display:flex; gap:6px; flex:none; }
@media (max-width: 720px) {
  .cartao-pessoa { flex-wrap:wrap; }
  .cartao-pessoa .dados { flex-basis:calc(100% - 51px); }
  .cartao-pessoa .selos, .cartao-pessoa .botoes { flex-basis:auto; }
}
.selo { font-size:10px; padding:3px 9px; border-radius:20px; letter-spacing:.5px;
        text-transform:uppercase; border:1px solid var(--line2); color:var(--dim2); }
.selo.forte { border-color:var(--rust); color:var(--rust); }
.recado { font-size:12.5px; padding:9px 12px; border-radius:6px; margin-top:12px;
          border:1px solid var(--line2); color:var(--dim); }
.linha-inline { display:flex; gap:6px; margin-top:6px; }
.cabeca-secao { display:flex; justify-content:space-between; align-items:baseline;
                gap:12px; margin-bottom:14px; }
.cabeca-secao h3 { margin:0; }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="tela-login" class="login-wrap">
  <div class="login panel" style="padding:26px;">
    <h1 class="titulo-serif">Gefoscal</h1>
    <p class="texto-dim" style="margin-top:0;font-size:13px;">Sistema interno</p>

    <div class="campo">
      <label>E-mail</label>
      <input id="email" type="email" autocomplete="username" placeholder="voce@grupogefoscal.com.br">
    </div>
    <div class="campo">
      <label>Senha</label>
      <input id="senha" type="password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <button class="btn" id="btn-entrar" style="width:100%;margin-top:6px;">Entrar</button>
    <button class="btn-secundario" id="btn-link" style="width:100%;margin-top:8px;">
      Receber link de acesso por e-mail
    </button>
    <div class="erro" id="erro-login"></div>

    <div class="linha-divisoria" style="margin:18px 0 12px;"></div>
    <div class="barra-skin">
      <button class="btn-secundario" onclick="trocarSkin('sofisticado')">Sofisticado</button>
      <button class="btn-secundario" onclick="trocarSkin('plataforma')">Plataforma</button>
      <button class="btn-secundario" onclick="trocarSkin('daylight')">Daylight</button>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="tela-app" class="app oculto">
  <nav class="nav">
    <h1 class="titulo-serif">Gefoscal</h1>
    <div class="sub" id="quem-sou"></div>
    <div id="menu"></div>
    <div class="linha-divisoria" style="margin:18px 0 12px;"></div>
    <div class="barra-skin" style="flex-direction:column;">
      <button class="btn-secundario" onclick="trocarSkin('sofisticado')">Sofisticado</button>
      <button class="btn-secundario" onclick="trocarSkin('plataforma')">Plataforma</button>
      <button class="btn-secundario" onclick="trocarSkin('daylight')">Daylight</button>
    </div>
    <button class="btn-secundario" style="width:100%;margin-top:14px;" onclick="sair()">Sair</button>
  </nav>

  <main class="conteudo">
    <div class="topo">
      <div>
        <h2 id="titulo-pagina">Visão geral</h2>
        <div class="texto-dim" id="subtitulo-pagina" style="font-size:13px;"></div>
      </div>
    </div>

    <div class="kpis" id="kpis"></div>
    <div class="filtros" id="filtros"></div>

    <!-- área livre: telas que não são tabela (Visão geral, Administração) -->
    <div id="area-livre" class="oculto"></div>

    <div class="panel" id="painel-tabela">
      <div class="tabela-scroll">
        <table>
          <thead id="cabecalho"></thead>
          <tbody id="corpo"></tbody>
        </table>
      </div>
    </div>

    <div class="texto-dim2" id="rodape" style="font-size:12px;margin-top:10px;"></div>
  </main>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
import { SUPABASE_URL, SUPABASE_KEY, SKIN_PADRAO } from './config.js'

const db = createClient(SUPABASE_URL, SUPABASE_KEY)
const $ = s => document.querySelector(s)
const fmtNum = (n, d = 2) => (n ?? 0).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d })
const fmtData = d => d ? d.split('-').reverse().join('/') : '—'
const fmtQuando = t => t ? new Date(t).toLocaleDateString('pt-BR') : null
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))

window.trocarSkin = s => {
  document.documentElement.setAttribute('data-skin', s)
  localStorage.setItem('gefoscal-skin', s)
}
document.documentElement.setAttribute('data-skin',
  localStorage.getItem('gefoscal-skin') || SKIN_PADRAO)

// ---------------------------------------------------------------
// Login
// ---------------------------------------------------------------
$('#btn-entrar').onclick = entrar
$('#btn-link').onclick = entrarPorLink
$('#senha').onkeydown = e => { if (e.key === 'Enter') entrar() }

async function entrar () {
  const btn = $('#btn-entrar')
  btn.disabled = true; btn.textContent = 'Entrando...'
  $('#erro-login').textContent = ''
  const { error } = await db.auth.signInWithPassword({
    email: $('#email').value.trim().toLowerCase(),
    password: $('#senha').value
  })
  btn.disabled = false; btn.textContent = 'Entrar'
  if (error) { $('#erro-login').textContent = traduzErro(error.message); return }
  await abrirApp()
}

// Primeiro acesso: quem foi cadastrado ainda não tem senha.
async function entrarPorLink () {
  const email = $('#email').value.trim().toLowerCase()
  if (!email) { $('#erro-login').textContent = 'Escreva seu e-mail acima primeiro.'; return }
  const btn = $('#btn-link')
  btn.disabled = true; btn.textContent = 'Enviando...'
  const { error } = await db.auth.signInWithOtp({
    email, options: { emailRedirectTo: location.origin + location.pathname }
  })
  btn.disabled = false; btn.textContent = 'Receber link de acesso por e-mail'
  $('#erro-login').textContent = error
    ? traduzErro(error.message)
    : 'Link enviado. Abra o e-mail neste mesmo navegador.'
}

function traduzErro (m) {
  if (/invalid login/i.test(m)) return 'E-mail ou senha incorretos.'
  if (/email not confirmed/i.test(m)) return 'E-mail ainda não confirmado.'
  if (/rate limit/i.test(m)) return 'Muitos e-mails em pouco tempo. Espere alguns minutos.'
  if (/signups not allowed/i.test(m)) return 'Cadastro por e-mail desligado no painel do Supabase.'
  return m
}

window.sair = async () => { await db.auth.signOut(); location.reload() }

// ---------------------------------------------------------------
// Sessão, permissões e menu
// ---------------------------------------------------------------
const CHAVE_ADMIN = 'ti'          // módulo "Administração do sistema"
const PAPEIS_TOTAIS = ['ADMIN', 'DIRETORIA']   // enxergam tudo, por tem_modulo()

let PERFIL = {
  userId: '', email: '', nome: '',
  pessoaId: null, setorId: null,
  papeis: [], modulos: [], permissoes: []
}

async function abrirApp () {
  const { data: { user } } = await db.auth.getUser()
  if (!user) return
  PERFIL.userId = user.id
  PERFIL.email = user.email

  const [{ data: papeis }, { data: modulos }, { data: perfil }] = await Promise.all([
    db.from('usuario_papel').select('papel').eq('user_id', user.id),
    db.from('modulo').select('id,chave,nome,ordem').order('ordem'),
    db.from('usuario_perfil')
      .select('pessoa_id,setor_id,ativo,pessoa:pessoa_id(nome)')
      .eq('user_id', user.id).maybeSingle()
  ])

  PERFIL.papeis = (papeis || []).map(p => p.papel)
  PERFIL.modulos = modulos || []
  PERFIL.pessoaId = perfil?.pessoa_id ?? null
  PERFIL.setorId = perfil?.setor_id ?? null
  PERFIL.nome = perfil?.pessoa?.nome || user.email

  if (PERFIL.papeis.length === 0 || perfil?.ativo === false) {
    $('#erro-login').textContent =
      'Seu usuário entrou, mas ainda não tem acesso liberado. Fale com o administrador do sistema.'
    await db.auth.signOut()
    return
  }

  const { data: perms } = await db.from('modulo_permissao')
    .select('modulo_id,pessoa_id,setor_id,pode_editar')
  // administrador enxerga as permissões de todo mundo; aqui só interessam as minhas
  PERFIL.permissoes = (perms || []).filter(p =>
    (p.pessoa_id && p.pessoa_id === PERFIL.pessoaId) ||
    (p.setor_id && p.setor_id === PERFIL.setorId))

  $('#quem-sou').textContent = PERFIL.nome + ' · ' + PERFIL.papeis.join(', ')
  montarMenu()
  $('#tela-login').classList.add('oculto')
  $('#tela-app').classList.remove('oculto')
  irPara('visao_geral')
}

const ehTotal = () => PERFIL.papeis.some(p => PAPEIS_TOTAIS.includes(p))

function moduloPorChave (chave) { return PERFIL.modulos.find(m => m.chave === chave) }

function podeVer (chave) {
  if (ehTotal()) return true
  const m = moduloPorChave(chave)
  return !!m && PERFIL.permissoes.some(p => p.modulo_id === m.id)
}

// espelha tem_modulo(chave, true) do banco — o RLS é quem manda de verdade
function podeEditar (chave) {
  if (ehTotal()) return true
  const m = moduloPorChave(chave)
  return !!m && PERFIL.permissoes.some(p => p.modulo_id === m.id && p.pode_editar)
}

const PAGINAS = {
  visao_geral: { nome: 'Visão geral', render: paginaVisaoGeral, sempre: true },
  expedicao:   { nome: 'Expedição', render: paginaExpedicao },
  financeiro:  { nome: 'Financeiro', render: paginaFinanceiro },
  estoque:     { nome: 'Estoque e Produção', render: paginaEstoque },
  ti:          { nome: 'Administração', render: paginaAdministracao }
}

function montarMenu () {
  const fixos = `<a data-chave="visao_geral">Visão geral</a>`
  const doBanco = PERFIL.modulos.map(m => {
    const temPagina = !!PAGINAS[m.chave]
    const liberado = podeVer(m.chave)
    if (!liberado) return ''
    return `<a data-chave="${m.chave}" class="${temPagina ? '' : 'bloqueado'}">${esc(m.nome)}</a>`
  }).join('')
  $('#menu').innerHTML = fixos + doBanco
  $('#menu').querySelectorAll('a').forEach(a => {
    if (!a.classList.contains('bloqueado')) a.onclick = () => irPara(a.dataset.chave)
  })
}

function irPara (chave) {
  const p = PAGINAS[chave]
  if (!p) return
  $('#menu').querySelectorAll('a').forEach(a => a.classList.toggle('ativo', a.dataset.chave === chave))
  $('#titulo-pagina').textContent = p.nome
  $('#subtitulo-pagina').textContent = ''
  $('#kpis').innerHTML = ''; $('#filtros').innerHTML = ''
  $('#cabecalho').innerHTML = ''; $('#corpo').innerHTML = ''
  $('#area-livre').innerHTML = ''; $('#area-livre').classList.add('oculto')
  $('#painel-tabela').classList.remove('oculto')
  $('#rodape').textContent = ''
  p.render()
}

// telas que não usam a tabela padrão
function areaLivre () {
  $('#painel-tabela').classList.add('oculto')
  $('#area-livre').classList.remove('oculto')
  return $('#area-livre')
}

function kpi (rotulo, valor, nota = '') {
  return `<div class="card kpi"><div class="rotulo">${esc(rotulo)}</div>
    <div class="valor">${valor}</div><div class="nota">${esc(nota)}</div></div>`
}

function semAcesso (modulo) {
  $('#corpo').innerHTML = `<tr><td class="vazio">
    Você não tem acesso ao módulo <b>${esc(modulo)}</b>.<br>
    Peça a liberação ao administrador do sistema.</td></tr>`
}

// avisa quando a migração ainda não rodou, em vez de quebrar calado
function faltaMigracao (erro) {
  return erro && /does not exist|schema cache/i.test(erro.message || '')
}

// ---------------------------------------------------------------
// Página: Visão geral (tela inicial)
// ---------------------------------------------------------------
async function paginaVisaoGeral () {
  $('#subtitulo-pagina').textContent = 'O painel montado para você'
  const area = areaLivre()

  if (!PERFIL.pessoaId) {
    area.innerHTML = `<div class="panel" style="padding:22px;">
      <p class="texto-dim">Seu login ainda não está ligado a uma pessoa do cadastro,
      então não há painel para montar. O administrador resolve isso em
      Administração → Usuários.</p></div>`
    return
  }

  const { data, error } = await db.from('visao_geral_pessoa')
    .select('html_conteudo,atualizado_em').eq('pessoa_id', PERFIL.pessoaId).maybeSingle()

  if (faltaMigracao(error)) {
    area.innerHTML = `<div class="panel" style="padding:22px;">
      <p class="texto-dim">A tabela <code>visao_geral_pessoa</code> ainda não existe no banco.
      Rode a migração no SQL Editor do Supabase para ligar esta tela.</p></div>`
    return
  }

  if (!data?.html_conteudo) {
    area.innerHTML = `<div class="panel" style="padding:22px;">
      <h3 style="font-family:var(--serif);margin-top:0;">Olá, ${esc(PERFIL.nome.split(' ')[0])}</h3>
      <p class="texto-dim">Ainda não há um painel montado para você. Use o menu ao lado
      para abrir os módulos liberados${podeEditar(CHAVE_ADMIN)
        ? ', ou monte um painel em Administração → Visão geral.' : '.'}</p></div>`
    return
  }

  // conteúdo montado por administrador: isolado em iframe para não injetar script na página
  const quadro = document.createElement('iframe')
  quadro.className = 'moldura-visao'
  quadro.setAttribute('sandbox', '')
  quadro.srcdoc = data.html_conteudo
  area.appendChild(quadro)
  $('#rodape').textContent = 'Atualizado em ' + (fmtQuando(data.atualizado_em) || '—')
}

// ---------------------------------------------------------------
// Página: Administração  (módulo 'ti')
// ---------------------------------------------------------------
async function paginaAdministracao () {
  if (!podeVer(CHAVE_ADMIN)) { areaLivre().innerHTML =
    `<div class="panel" style="padding:22px;"><p class="texto-dim">
     Você não tem acesso à Administração.</p></div>`; return }

  const editavel = podeEditar(CHAVE_ADMIN)
  $('#subtitulo-pagina').textContent = editavel
    ? 'Usuários, cadastros de apoio e painéis'
    : 'Somente leitura — você pode consultar, mas não alterar'

  const area = areaLivre()
  area.innerHTML = `
    <div class="subabas">
      <button data-sub="usuarios" class="ativo">Usuários</button>
      <button data-sub="apoio">Cargos e setores</button>
      <button data-sub="visao">Visão geral</button>
    </div>
    <div id="sub-conteudo"></div>`

  area.querySelectorAll('.subabas button').forEach(b => {
    b.onclick = () => {
      area.querySelectorAll('.subabas button').forEach(x => x.classList.toggle('ativo', x === b))
      abrirSub(b.dataset.sub, editavel)
    }
  })
  abrirSub('usuarios', editavel)
}

function abrirSub (sub, editavel) {
  const alvo = $('#sub-conteudo')
  alvo.innerHTML = `<p class="texto-dim2">carregando...</p>`
  if (sub === 'usuarios') subUsuarios(alvo, editavel)
  if (sub === 'apoio') subApoio(alvo, editavel)
  if (sub === 'visao') subVisao(alvo, editavel)
}

// ----- Administração › Usuários -----
async function subUsuarios (alvo, editavel) {
  const [{ data: pessoas }, { data: cargos, error: erroCargo },
         { data: setores }, { data: pre }, { data: perms }] = await Promise.all([
    db.from('pessoa').select('id,nome,email,cargo_id,setor_id,status').order('nome'),
    db.from('cargo').select('id,nome').order('nome'),
    db.from('setor').select('id,nome').order('nome'),
    db.from('usuario_precadastro').select('email,papeis,pessoa_id,usado_em,convite_enviado_em'),
    db.from('modulo_permissao').select('modulo_id,pessoa_id,pode_editar')
  ])

  if (faltaMigracao(erroCargo)) {
    alvo.innerHTML = `<div class="panel" style="padding:22px;"><p class="texto-dim">
      A tabela <code>cargo</code> ainda não existe. Rode a migração no SQL Editor
      do Supabase antes de usar esta tela.</p></div>`
    return
  }

  const preDe = e => (pre || []).find(p => p.email === (e || '').toLowerCase())
  const nivelDe = p => (p?.papeis || []).includes('ADMIN') ? 'Administrador' : 'Usuário'

  alvo.innerHTML = `
    <div class="secao panel" style="padding:20px;">
      <div class="cabeca-secao">
        <h3>${editavel ? 'Cadastrar ou atualizar pessoa' : 'Consultar pessoa'}</h3>
        <span class="texto-dim2" style="font-size:12px;">o e-mail é o que liga a pessoa ao login</span>
      </div>
      <div class="form-grade">
        <div class="campo"><label>Nome</label><input id="u-nome" ${editavel ? '' : 'disabled'}></div>
        <div class="campo"><label>E-mail</label><input id="u-email" type="email" ${editavel ? '' : 'disabled'}></div>
        <div class="campo"><label>Cargo</label>
          <div style="display:flex;gap:6px;">
            <select id="u-cargo" style="flex:1;" ${editavel ? '' : 'disabled'}></select>
            ${editavel ? '<button class="btn-secundario mini" id="u-novo-cargo" title="novo cargo">+</button>' : ''}
          </div>
          <div class="linha-inline oculto" id="linha-cargo">
            <input id="nome-cargo" placeholder="nome do cargo" style="flex:1;">
            <button class="btn mini" id="criar-cargo">criar</button>
          </div>
        </div>
        <div class="campo"><label>Setor</label>
          <div style="display:flex;gap:6px;">
            <select id="u-setor" style="flex:1;" ${editavel ? '' : 'disabled'}></select>
            ${editavel ? '<button class="btn-secundario mini" id="u-novo-setor" title="novo setor">+</button>' : ''}
          </div>
          <div class="linha-inline oculto" id="linha-setor">
            <input id="nome-setor" placeholder="nome do setor" style="flex:1;">
            <button class="btn mini" id="criar-setor">criar</button>
          </div>
        </div>
        <div class="campo"><label>Nível de acesso</label>
          <select id="u-nivel" ${editavel ? '' : 'disabled'}>
            <option value="usuario">Usuário — só consulta</option>
            <option value="administrador">Administrador — consulta e altera</option>
          </select></div>
        ${editavel ? `<div class="campo"><label>Senha de acesso</label>
          <input id="u-senha" type="text" autocomplete="off" placeholder="mínimo 8 caracteres">
          <span class="texto-dim2" style="font-size:11px;">deixe vazio para não mexer na senha</span>
        </div>` : ''}
      </div>

      <div class="secao" style="margin-top:18px;">
        <label class="texto-dim2" style="font-size:11px;text-transform:uppercase;letter-spacing:.4px;">
          Abas que esta pessoa enxerga</label>
        <div class="grade-modulos" id="u-modulos"></div>
      </div>

      ${editavel ? `<div class="acoes">
        <button class="btn" id="u-salvar">Salvar cadastro</button>
        <button class="btn-secundario" id="u-limpar">Limpar</button>
      </div>
      <div class="recado oculto" id="u-recado"></div>` : ''}
      <p class="aviso">O nível de acesso e as abas são independentes: dá para liberar
      todas as abas para alguém que só consulta.</p>
    </div>

    <div class="cabeca-secao">
      <h3 style="font-family:var(--serif);font-size:17px;">Pessoas cadastradas</h3>
      <span class="texto-dim2" style="font-size:12px;">${(pessoas || []).length} no total</span>
    </div>
    <div class="lista-pessoas" id="u-lista"></div>`

  // selects de apoio
  const encher = (sel, itens) => {
    sel.innerHTML = '<option value="">—</option>' +
      itens.map(i => `<option value="${i.id}">${esc(i.nome)}</option>`).join('')
  }
  encher($('#u-cargo'), cargos || [])
  encher($('#u-setor'), setores || [])

  // checkboxes de módulo
  $('#u-modulos').innerHTML = PERFIL.modulos.map(m => `
    <div class="linha-modulo">
      <span class="nome">${esc(m.nome)}</span>
      <label><input type="checkbox" data-ver="${m.id}" ${editavel ? '' : 'disabled'}> ver</label>
      <label><input type="checkbox" data-editar="${m.id}" ${editavel ? '' : 'disabled'}> editar</label>
    </div>`).join('')

  // "editar" implica "ver"
  $('#u-modulos').querySelectorAll('[data-editar]').forEach(c => {
    c.onchange = () => { if (c.checked) $(`#u-modulos [data-ver="${c.dataset.editar}"]`).checked = true }
  })

  const recado = (texto, alerta = false) => {
    const el = $('#u-recado'); if (!el) return
    el.textContent = texto
    el.classList.remove('oculto')
    el.style.borderColor = alerta ? 'var(--warn-text)' : 'var(--line2)'
    el.style.color = alerta ? 'var(--warn-text)' : 'var(--dim)'
  }

  // lista em cartões
  const iniciais = n => n.split(' ').filter(Boolean).slice(0, 2).map(x => x[0]).join('').toUpperCase()

  $('#u-lista').innerHTML = (pessoas || []).map(p => {
    const pc = preDe(p.email)
    const n = (perms || []).filter(x => x.pessoa_id === p.id).length
    const estado = !pc ? 'sem cadastro de acesso'
      : pc.usado_em ? 'último acesso em ' + fmtQuando(pc.usado_em)
      : 'cadastrado, aguardando primeiro acesso'
    return `<div class="cartao-pessoa">
      <div class="inicial">${esc(iniciais(p.nome))}</div>
      <div class="dados">
        <div class="nome">${esc(p.nome)}</div>
        <div class="sub">${esc(p.email || 'sem e-mail')} · ${esc(estado)}${n ? ` · ${n} aba${n > 1 ? 's' : ''}` : ''}</div>
      </div>
      <div class="selos">
        ${pc ? `<span class="selo ${nivelDe(pc) === 'Administrador' ? 'forte' : ''}">${nivelDe(pc)}</span>` : ''}
      </div>
      <div class="botoes">
        <button class="btn-secundario mini" data-abrir="${p.id}">abrir</button>
        ${editavel && pc ? `<button class="btn-secundario mini" data-senha="${esc(p.email)}">senha</button>` : ''}
      </div>
    </div>`
  }).join('') || `<p class="vazio">Nenhuma pessoa cadastrada ainda.</p>`

  // abrir uma pessoa no formulário
  $('#u-lista').querySelectorAll('[data-abrir]').forEach(b => {
    b.onclick = () => {
      const p = pessoas.find(x => x.id === b.dataset.abrir)
      const pc = preDe(p.email)
      $('#u-nome').value = p.nome || ''
      $('#u-email').value = p.email || ''
      $('#u-cargo').value = p.cargo_id || ''
      $('#u-setor').value = p.setor_id || ''
      $('#u-nivel').value = (pc?.papeis || []).includes('ADMIN') ? 'administrador' : 'usuario'
      const meus = (perms || []).filter(x => x.pessoa_id === p.id)
      $('#u-modulos').querySelectorAll('[data-ver]').forEach(c => {
        const r = meus.find(x => x.modulo_id === c.dataset.ver)
        c.checked = !!r
        $(`#u-modulos [data-editar="${c.dataset.ver}"]`).checked = !!r?.pode_editar
      })
      window.scrollTo({ top: 0, behavior: 'smooth' })
    }
  })

  if (!editavel) return

  // definir senha direto na lista, sem passar pelo formulário inteiro
  $('#u-lista').querySelectorAll('[data-senha]').forEach(b => {
    b.onclick = async () => {
      const email = b.dataset.senha
      const nova = window.prompt(`Senha de acesso para ${email}\n(mínimo 8 caracteres)`)
      if (nova === null) return
      if (nova.trim().length < 8) { recado('A senha precisa de pelo menos 8 caracteres.', true); return }
      b.disabled = true; const antes = b.textContent; b.textContent = 'salvando...'
      const { data: r, error } = await db.functions.invoke('criar-usuario', {
        body: { email, senha: nova.trim() }
      })
      b.disabled = false; b.textContent = antes
      if (error || r?.erro) { recado('Não deu certo: ' + (r?.erro || error.message), true); return }
      recado(r.acao === 'usuario_criado'
        ? `${email} já pode entrar com essa senha.`
        : `Senha de ${email} atualizada.`)
      setTimeout(() => abrirSub('usuarios', true), 1200)
    }
  })

  // + cargo / + setor, sem prompt do navegador
  const criador = (btnAbrir, linha, campo, tabela, select) => {
    $(btnAbrir).onclick = () => {
      $(linha).classList.toggle('oculto')
      if (!$(linha).classList.contains('oculto')) $(campo).focus()
    }
    $(campo).onkeydown = e => { if (e.key === 'Enter') criar() }
    $('#criar-' + tabela).onclick = criar
    async function criar () {
      const nome = $(campo).value.trim(); if (!nome) return
      const { data, error } = await db.from(tabela).insert({ nome }).select('id,nome').single()
      if (error) { recado('Não deu para criar: ' + error.message, true); return }
      $(select).add(new Option(data.nome, data.id))
      $(select).value = data.id
      $(campo).value = ''
      $(linha).classList.add('oculto')
      recado(`${tabela === 'cargo' ? 'Cargo' : 'Setor'} "${data.nome}" criado.`)
    }
  }
  criador('#u-novo-cargo', '#linha-cargo', '#nome-cargo', 'cargo', '#u-cargo')
  criador('#u-novo-setor', '#linha-setor', '#nome-setor', 'setor', '#u-setor')

  $('#u-limpar').onclick = () => {
    ;['u-nome','u-email','u-cargo','u-setor','u-senha'].forEach(i => {
      const el = $('#' + i); if (el) el.value = ''
    })
    $('#u-nivel').value = 'usuario'
    $('#u-modulos').querySelectorAll('input').forEach(c => c.checked = false)
    $('#u-recado').classList.add('oculto')
  }

  $('#u-salvar').onclick = async () => {
    const nome = $('#u-nome').value.trim()
    const email = $('#u-email').value.trim().toLowerCase()
    if (!nome) { recado('Escreva o nome.', true); return }
    if (!email) { recado('Escreva o e-mail — é ele que liga a pessoa ao login.', true); return }

    const btn = $('#u-salvar'); btn.disabled = true; btn.textContent = 'Salvando...'

    const { data: pessoa, error: e1 } = await db.from('pessoa').upsert({
      nome, email,
      cargo_id: $('#u-cargo').value || null,
      setor_id: $('#u-setor').value || null
    }, { onConflict: 'email' }).select('id,setor_id').single()

    if (e1) { recado(e1.message, true); btn.disabled = false; btn.textContent = 'Salvar cadastro'; return }

    const papeis = $('#u-nivel').value === 'administrador' ? ['ADMIN', 'DIRETORIA'] : ['LEITOR']
    const { error: e2 } = await db.from('usuario_precadastro').upsert({
      email, papeis, pessoa_id: pessoa.id, setor_id: pessoa.setor_id
    }, { onConflict: 'email' })
    if (e2) { recado(e2.message, true); btn.disabled = false; btn.textContent = 'Salvar cadastro'; return }

    // permissões: apaga as antigas e grava as marcadas
    const marcadas = [...$('#u-modulos').querySelectorAll('[data-ver]:checked')].map(c => ({
      modulo_id: c.dataset.ver,
      pessoa_id: pessoa.id,
      pode_editar: $(`#u-modulos [data-editar="${c.dataset.ver}"]`).checked
    }))
    await db.from('modulo_permissao').delete().eq('pessoa_id', pessoa.id)
    if (marcadas.length) await db.from('modulo_permissao').insert(marcadas)

    // senha: cria o login de verdade, sem depender de e-mail
    const senha = $('#u-senha')?.value.trim()
    if (senha) {
      if (senha.length < 8) {
        btn.disabled = false; btn.textContent = 'Salvar cadastro'
        recado('Cadastro salvo, mas a senha precisa de pelo menos 8 caracteres.', true)
        abrirSub('usuarios', true)
        return
      }
      const { data: r, error: e3 } = await db.functions.invoke('criar-usuario', {
        body: { email, senha }
      })
      btn.disabled = false; btn.textContent = 'Salvar cadastro'
      if (e3 || r?.erro) {
        recado('Cadastro salvo, mas a senha não foi definida: ' + (r?.erro || e3.message), true)
      } else {
        recado(r.acao === 'usuario_criado'
          ? `Pronto. ${email} já pode entrar com essa senha.`
          : `Senha de ${email} atualizada.`)
      }
    } else {
      btn.disabled = false; btn.textContent = 'Salvar cadastro'
      recado('Cadastro salvo. Sem senha definida, essa pessoa ainda não consegue entrar.')
    }

    setTimeout(() => abrirSub('usuarios', true), 1200)
  }
}

// ----- Administração › Cargos e setores -----
async function subApoio (alvo, editavel) {
  const [{ data: cargos, error: erroCargo }, { data: setores }] = await Promise.all([
    db.from('cargo').select('id,nome').order('nome'),
    db.from('setor').select('id,nome').order('nome')
  ])

  if (faltaMigracao(erroCargo)) {
    alvo.innerHTML = `<div class="panel" style="padding:22px;"><p class="texto-dim">
      A tabela <code>cargo</code> ainda não existe. Rode a migração no Supabase.</p></div>`
    return
  }

  const bloco = (titulo, tabela, itens) => `
    <div class="panel" style="padding:18px;">
      <h3>${titulo}</h3>
      ${editavel ? `<div style="display:flex;gap:6px;margin-bottom:12px;">
        <input id="novo-${tabela}" placeholder="nome" style="flex:1;">
        <button class="btn" data-add="${tabela}">Adicionar</button></div>` : ''}
      <table><tbody>${(itens || []).map(i => `<tr>
        <td>${esc(i.nome)}</td>
        <td style="text-align:right;">${editavel
          ? `<button class="btn-secundario mini" data-del="${tabela}" data-id="${i.id}">remover</button>` : ''}</td>
      </tr>`).join('') || `<tr><td class="vazio">Nada cadastrado ainda.</td></tr>`}</tbody></table>
    </div>`

  alvo.innerHTML = `<div class="duas-colunas">
    ${bloco('Cargos', 'cargo', cargos)}
    ${bloco('Setores', 'setor', setores)}
  </div>`

  if (!editavel) return

  alvo.querySelectorAll('[data-add]').forEach(b => {
    b.onclick = async () => {
      const t = b.dataset.add
      const nome = $('#novo-' + t).value.trim(); if (!nome) return
      const { error } = await db.from(t).insert({ nome })
      if (error) { alert(error.message); return }
      abrirSub('apoio', true)
    }
  })
  alvo.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = async () => {
      if (!confirm('Remover?')) return
      const { error } = await db.from(b.dataset.del).delete().eq('id', b.dataset.id)
      if (error) { alert('Não deu para remover — provavelmente há gente usando este registro.'); return }
      abrirSub('apoio', true)
    }
  })
}

// ----- Administração › Visão geral -----
async function subVisao (alvo, editavel) {
  if (!editavel) {
    alvo.innerHTML = `<div class="panel" style="padding:22px;"><p class="texto-dim">
      Só quem pode editar a Administração monta os painéis.</p></div>`
    return
  }

  const { data: pessoas } = await db.from('pessoa')
    .select('id,nome,email').not('email', 'is', null).order('nome')

  alvo.innerHTML = `<div class="panel" style="padding:18px;">
    <h3>Painel de abertura por pessoa</h3>
    <div class="campo" style="max-width:340px;margin-bottom:12px;">
      <label>Pessoa</label>
      <select id="v-pessoa">${(pessoas || []).map(p =>
        `<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select>
    </div>
    <textarea id="v-html" placeholder="Cole aqui o HTML do painel desta pessoa"></textarea>
    <div class="acoes">
      <button class="btn" id="v-salvar">Salvar painel</button>
      <button class="btn-secundario" id="v-limpar">Apagar painel</button>
      <span class="texto-dim2" id="v-recado" style="font-size:12.5px;"></span>
    </div>
    <p class="aviso">O conteúdo é exibido isolado, sem acesso ao resto do sistema.
    Ainda assim, cole só HTML de origem conhecida.</p>
  </div>`

  const carregar = async () => {
    const { data, error } = await db.from('visao_geral_pessoa')
      .select('html_conteudo').eq('pessoa_id', $('#v-pessoa').value).maybeSingle()
    if (faltaMigracao(error)) { $('#v-recado').textContent = 'Tabela ainda não criada no banco.'; return }
    $('#v-html').value = data?.html_conteudo || ''
  }
  $('#v-pessoa').onchange = carregar
  await carregar()

  $('#v-salvar').onclick = async () => {
    const { error } = await db.from('visao_geral_pessoa').upsert({
      pessoa_id: $('#v-pessoa').value,
      html_conteudo: $('#v-html').value,
      atualizado_em: new Date().toISOString()
    }, { onConflict: 'pessoa_id' })
    $('#v-recado').textContent = error ? error.message : 'Painel salvo.'
  }
  $('#v-limpar').onclick = async () => {
    if (!confirm('Apagar o painel desta pessoa?')) return
    await db.from('visao_geral_pessoa').delete().eq('pessoa_id', $('#v-pessoa').value)
    $('#v-html').value = ''; $('#v-recado').textContent = 'Painel apagado.'
  }
}

// Página: Expedição
// ---------------------------------------------------------------
async function paginaExpedicao () {
  $('#subtitulo-pagina').textContent = 'Carregamentos migrados da planilha'
  $('#filtros').innerHTML = `
    <div class="campo"><label>Cliente</label><select id="f-cliente"><option value="">todos</option></select></div>
    <div class="campo"><label>Vendedor</label><select id="f-vendedor"><option value="">todos</option></select></div>
    <div class="campo"><label>De</label><input type="date" id="f-de"></div>
    <div class="campo"><label>Até</label><input type="date" id="f-ate"></div>
    <button class="btn" id="f-aplicar">Filtrar</button>
    <button class="btn-secundario" id="f-limpar">Limpar</button>`

  const [{ data: clientes }, { data: vendedores }] = await Promise.all([
    db.from('cliente').select('id,razao_social').order('razao_social'),
    db.from('pessoa').select('id,nome').eq('eh_vendedor', true).order('nome')
  ])
  ;(clientes || []).forEach(c => $('#f-cliente').add(new Option(c.razao_social, c.id)))
  ;(vendedores || []).forEach(v => $('#f-vendedor').add(new Option(v.nome, v.id)))

  $('#f-aplicar').onclick = carregar
  $('#f-limpar').onclick = () => {
    $('#f-cliente').value = ''; $('#f-vendedor').value = ''
    $('#f-de').value = ''; $('#f-ate').value = ''; carregar()
  }

  $('#cabecalho').innerHTML = `<tr>
    <th>Linha</th><th>Data</th><th>Cliente</th><th>Vendedor</th>
    <th>Produto</th><th>Placa</th><th class="num">Qtd (t)</th>
    <th>NF</th><th>UF</th><th>Anexos</th></tr>`
  await carregar()

  async function carregar () {
    $('#corpo').innerHTML = `<tr><td colspan="10" class="vazio">carregando...</td></tr>`
    let q = db.from('carregamento').select(`
      origem_linha, data_carregamento, quantidade_t, numero_nf, uf_destino,
      cliente:cliente_id ( razao_social ),
      vendedor:vendedor_id ( nome ),
      produto:produto_id ( nome ),
      veiculo:veiculo_id ( placa )
    `).order('data_carregamento', { ascending: false }).limit(500)

    if ($('#f-cliente').value) q = q.eq('cliente_id', $('#f-cliente').value)
    if ($('#f-vendedor').value) q = q.eq('vendedor_id', $('#f-vendedor').value)
    if ($('#f-de').value) q = q.gte('data_carregamento', $('#f-de').value)
    if ($('#f-ate').value) q = q.lte('data_carregamento', $('#f-ate').value)

    const { data, error } = await q
    if (error) { $('#corpo').innerHTML = `<tr><td colspan="10" class="vazio">${esc(error.message)}</td></tr>`; return }
    if (!data.length) { $('#corpo').innerHTML = `<tr><td colspan="10" class="vazio">Nenhum carregamento no filtro.</td></tr>`; return }

    const total = data.reduce((s, c) => s + Number(c.quantidade_t || 0), 0)
    const nClientes = new Set(data.map(c => c.cliente?.razao_social)).size
    $('#kpis').innerHTML =
      kpi('Carregamentos', data.length, data.length === 500 ? 'limite de 500 atingido' : '') +
      kpi('Toneladas', fmtNum(total), 'soma do período') +
      kpi('Clientes', nClientes) +
      kpi('Média por carga', fmtNum(total / data.length) + ' t')

    $('#corpo').innerHTML = data.map(c => `<tr>
      <td class="texto-dim2">${c.origem_linha ?? '—'}</td>
      <td>${fmtData(c.data_carregamento)}</td>
      <td>${esc(c.cliente?.razao_social)}</td>
      <td>${c.vendedor?.nome ? esc(c.vendedor.nome) : '<span class="badge-alerta">sem vendedor</span>'}</td>
      <td><span class="chip">${esc(c.produto?.nome ?? '—')}</span></td>
      <td>${esc(c.veiculo?.placa ?? '—')}</td>
      <td class="num">${fmtNum(c.quantidade_t, 3)}</td>
      <td>${esc(c.numero_nf ?? '—')}</td>
      <td>${esc(c.uf_destino ?? '—')}</td>
      <td><a class="anexo-link" data-linha="${c.origem_linha}">ver</a></td>
    </tr>`).join('')

    $('#corpo').querySelectorAll('.anexo-link').forEach(a => { a.onclick = () => verAnexos(a.dataset.linha) })
    $('#rodape').textContent = `${data.length} registros · ${fmtNum(total)} t`
  }

  async function verAnexos (linha) {
    const { data: c } = await db.from('carregamento').select('id').eq('origem_linha', linha).maybeSingle()
    if (!c) return
    const { data: anexos } = await db.from('anexo').select('tipo, drive_file_id')
      .eq('entidade', 'CARREGAMENTO').eq('registro_id', c.id)
    if (!anexos?.length) { alert('Sem anexos nesta linha.'); return }
    anexos.forEach(a => window.open('https://drive.google.com/open?id=' + a.drive_file_id, '_blank'))
  }
}

async function paginaFinanceiro () {
  $('#subtitulo-pagina').textContent = 'Lançamentos, contas e resultado'
  $('#cabecalho').innerHTML = `<tr>
    <th>Data</th><th>Descrição</th><th>Categoria</th><th>Centro de custo</th>
    <th>Conta</th><th>Situação</th><th class="num">Valor</th></tr>`

  const { data, error } = await db.from('lancamento_financeiro').select(`
    data_lancamento, descricao, tipo, valor, situacao,
    categoria:categoria_id ( nome, tipo ),
    centro:centro_custo_id ( nome ),
    conta:conta_id ( nome )
  `).order('data_lancamento', { ascending: false }).limit(300)

  if (error) { semAcesso('Financeiro'); return }

  const { data: contas } = await db.from('saldo_conta').select('*')
  const receitas = (data || []).filter(l => l.tipo === 'ENTRADA').reduce((s, l) => s + Number(l.valor), 0)
  const despesas = (data || []).filter(l => l.tipo === 'SAIDA').reduce((s, l) => s + Number(l.valor), 0)
  const pendentes = (data || []).filter(l => l.situacao === 'PENDENTE').length

  $('#kpis').innerHTML =
    kpi('Receitas', 'R$ ' + fmtNum(receitas)) +
    kpi('Despesas', 'R$ ' + fmtNum(despesas)) +
    kpi('Resultado', 'R$ ' + fmtNum(receitas - despesas)) +
    kpi('Pendentes', pendentes, 'a efetivar') +
    kpi('Saldo em contas', 'R$ ' + fmtNum((contas || []).reduce((s, c) => s + Number(c.saldo), 0)))

  if (!data?.length) {
    $('#corpo').innerHTML = `<tr><td colspan="7" class="vazio">
      Nenhum lançamento ainda. As categorias e centros de custo da empresa já estão cadastrados.</td></tr>`
    return
  }

  $('#corpo').innerHTML = data.map(l => `<tr>
    <td>${fmtData(l.data_lancamento)}</td>
    <td>${esc(l.descricao)}</td>
    <td><span class="chip">${esc(l.categoria?.nome ?? '—')}</span></td>
    <td>${esc(l.centro?.nome ?? '—')}</td>
    <td>${esc(l.conta?.nome ?? '—')}</td>
    <td class="${l.situacao === 'EFETIVADO' ? 'badge-bom' : 'badge-alerta'}">${esc(l.situacao)}</td>
    <td class="num ${l.tipo === 'ENTRADA' ? 'badge-bom' : ''}">
      ${l.tipo === 'SAIDA' ? '−' : '+'} ${fmtNum(l.valor)}</td>
  </tr>`).join('')
}

// ---------------------------------------------------------------
// Página: Estoque
// ---------------------------------------------------------------
async function paginaEstoque () {
  $('#subtitulo-pagina').textContent = 'Saldo e valor por produto e por local'
  $('#cabecalho').innerHTML = `<tr>
    <th>Produto</th><th>Local</th><th>Unidade</th>
    <th class="num">Saldo</th><th class="num">Preço ref.</th><th class="num">Valor</th></tr>`

  const [{ data: total }, { data: porLocal }] = await Promise.all([
    db.from('valor_estoque').select('*').order('nome'),
    db.from('valor_estoque_por_local').select('*').order('produto')
  ])

  const valorTotal = (total || []).reduce((s, p) => s + Number(p.valor || 0), 0)
  const semPreco = (total || []).filter(p => p.sem_preco && Number(p.saldo) !== 0)

  $('#kpis').innerHTML =
    kpi('Valor do estoque', 'R$ ' + fmtNum(valorTotal),
        semPreco.length ? `${semPreco.length} produto(s) sem preço` : 'saldo × preço de referência') +
    (total || []).map(p => kpi(p.nome, fmtNum(p.saldo, 3), p.unidade)).join('')

  if (semPreco.length) {
    $('#filtros').innerHTML = `<div class="badge-alerta" style="padding:8px 12px;border-radius:6px;font-size:12.5px;">
      Sem preço de referência: ${esc(semPreco.map(p => p.nome).join(', '))}.
      Esses produtos entram como zero no valor total.</div>`
  }

  if (!porLocal?.length) {
    $('#corpo').innerHTML = `<tr><td colspan="6" class="vazio">
      Nenhuma movimentação de estoque carregada ainda.</td></tr>`
    return
  }

  $('#corpo').innerHTML = porLocal.map(s => `<tr>
    <td>${esc(s.produto)}</td><td><span class="chip">${esc(s.local)}</span></td>
    <td>${esc(s.unidade)}</td>
    <td class="num">${fmtNum(s.saldo, 3)}</td>
    <td class="num ${s.sem_preco ? 'texto-dim2' : ''}">${s.sem_preco ? '—' : fmtNum(s.preco_ref)}</td>
    <td class="num">${s.sem_preco ? '<span class="texto-dim2">—</span>' : 'R$ ' + fmtNum(s.valor)}</td>
  </tr>`).join('')

  $('#rodape').textContent =
    `${porLocal.length} linhas · valor total R$ ${fmtNum(valorTotal)}`
}

// ---------------------------------------------------------------
// Se já houver sessão salva, entra direto
// ---------------------------------------------------------------
const { data: { session } } = await db.auth.getSession()
if (session) await abrirApp()
</script>
