            return `<tr>
              <td style="width:74px;" class="${atrasado ? 'badge-alerta' : ''}">${fmtData(t.vencimento)}</td>
              <td>${esc(t.parceiro || t.descricao || t.documento || '—')}
                <span class="chip">${t.tipo === 'PAGAR' ? 'pagar' : 'receber'}</span></td>
              <td class="num">R$ ${fmtNum(t.valor)}</td>
            </tr>`
          }).join('') || `<tr><td class="vazio" style="padding:18px;">
            Nenhum título importado. Use Financeiro → Cadastros para trazer o relatório do mês.</td></tr>`}
        </tbody></table>
      </div>

      <div class="panel" style="padding:0;">
        <div style="padding:13px 16px 0;">
          <div class="rot texto-dim2" style="font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;">
            Compras aprovadas a pagar</div>
        </div>
        <table style="margin-top:6px;"><tbody>
          ${(compras || []).map(c => `<tr>
            <td style="width:74px;">${c.vencimento ? fmtData(c.vencimento) : '<span class="texto-dim2">sem data</span>'}</td>
            <td>${esc(c.produto_servico)}
              ${c.urgencia === 'URGENTE_4H' ? '<span class="urgente">● urgente</span>' : ''}
              <br><span class="texto-dim2" style="font-size:11.5px;">
                ${esc(c.numero ?? '')} · ${esc(c.solicitante?.nome ?? '—')}</span></td>
            <td class="num">R$ ${fmtNum(c.valor_aprovado ?? c.valor_estimado)}</td>
          </tr>`).join('') || `<tr><td class="vazio" style="padding:18px;">
            Nenhuma compra aguardando pagamento.</td></tr>`}
        </tbody></table>
      </div>
    </div>

    <div class="panel" style="padding:0;">
      <div style="padding:13px 16px 0;display:flex;justify-content:space-between;align-items:baseline;">
        <div class="rot texto-dim2" style="font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;">
          Caixa de entrada do setor</div>
        <span class="texto-dim2" style="font-size:11.5px;">${
          (sync || []).length
            ? ((sync[0].erro
                ? '<span class="badge-alerta">falha na leitura</span> '
                : 'lido ') + fmtQuando(sync[0].quando))
            : 'ponte ainda não ligada'}</span>
      </div>
      <table style="margin-top:6px;"><tbody>
        ${(emails || []).map(e => `<tr>
          <td style="width:74px;" class="texto-dim2">${fmtQuando(e.recebido_em) ?? '—'}</td>
          <td>${esc(e.assunto ?? '(sem assunto)')}
            ${e.tem_anexo ? '<span class="chip">anexo</span>' : ''}
            <br><span class="texto-dim2" style="font-size:11.5px;">
              ${esc(e.remetente ?? '—')} → ${esc(e.conta)}</span></td>
          <td style="text-align:right;white-space:nowrap;">
            ${e.link ? `<a class="anexo-link" href="${esc(e.link)}" target="_blank" rel="noopener">abrir</a>` : ''}
            <button class="btn-secundario mini" data-tratado="${e.id}">tratado</button></td>
        </tr>`).join('') || `<tr><td class="vazio" style="padding:18px;">
          A ponte com os e-mails do setor ainda não está ligada.</td></tr>`}
      </tbody></table>
    </div>`

  area.appendChild(bloco)

  bloco.querySelectorAll('[data-ir]').forEach(el => {
    el.onclick = () => {
      irPara(el.dataset.ir)
      if (el.dataset.sub) setTimeout(() => abrirFinanceiro(el.dataset.sub, podeEditar('financeiro')), 350)
    }
  })
  bloco.querySelectorAll('[data-tratado]').forEach(b => {
    b.onclick = async () => {
      await db.from('email_financeiro').update({
        tratado_em: new Date().toISOString(), tratado_por: PERFIL.pessoaId
      }).eq('id', b.dataset.tratado)
      irPara('visao_geral')
    }
  })
}

// ---------------------------------------------------------------
// Página: Compras e Recebimento  (módulo 'compras')
// Modelada sobre as tabelas que já existem:
//   solicitacao_compra · recebimento_mercadoria · fornecedor
// ---------------------------------------------------------------
const STATUS_COMPRA = {
  AGUARDANDO_COORD:     { rotulo: 'Aguardando coordenação', classe: 'aguardando' },
  AGUARDANDO_COTACAO:   { rotulo: 'Em cotação',             classe: 'aguardando' },
  AGUARDANDO_APROVACAO: { rotulo: 'Aguardando aprovação',   classe: 'aguardando' },
  DEVOLVIDA:            { rotulo: 'Devolvida',              classe: 'reprovada' },
  APROVADA:             { rotulo: 'Aprovada — a pagar',    classe: 'aprovada' },
  PAGA:                 { rotulo: 'Paga',                  classe: 'aprovada' },
  REPROVADA:            { rotulo: 'Reprovada',              classe: 'reprovada' },
  RECEBIDA:             { rotulo: 'Recebida',               classe: 'recebida' },
  CANCELADA:            { rotulo: 'Cancelada',              classe: 'recebida' }
}
const selo = s => {
  const e = STATUS_COMPRA[s] || { rotulo: s || '—', classe: '' }
  return `<span class="status ${e.classe}">${esc(e.rotulo)}</span>`
}
const URGENCIA = { URGENTE_4H: 'Urgente — 4h', NAO_URGENTE_5D: 'Normal — 5 dias' }

// Setores que exigem passar pela coordenação antes de cotar.
// O resto vai direto para o analista cotar.
const SETORES_COM_COORDENACAO = ['Indústria', 'P-TEC']

// Quem faz o quê:
//   ver e solicitar   -> qualquer um com acesso ao módulo compras
//   coordenação       -> quem é gestor do setor da solicitação (setor.gestor_id)
//   cotação           -> papel COMPRAS (o analista de compras)
//   aprovação final   -> papel DIRETORIA
//   ADMIN passa em todas, para destravar o fluxo
const ehAdminSistema = () => PERFIL.papeis.includes('ADMIN')
const podeCotar     = () => PERFIL.papeis.includes('COMPRAS') || ehAdminSistema()
const podeAprovar   = () => PERFIL.papeis.includes('DIRETORIA') || ehAdminSistema()
// baixa de pagamento: quem edita o módulo financeiro
const podePagar     = () => podeEditar('financeiro') || ehAdminSistema()
// coordenação depende do setor: só aparece para quem gerencia algum
const podeCoordenar = () => COMPRAS_CACHE.meusSetores.length > 0 || ehAdminSistema()

// Quem pode mexer numa solicitação específica. O banco aplica a mesma
// regra na RLS — aqui é só para não mostrar botão que vai falhar.
const ENCERRADOS = ['APROVADA', 'REPROVADA', 'PAGA', 'RECEBIDA', 'CANCELADA']
function podeEditarSolicitacao (s) {
  if (ehAdminSistema()) return true
  if (!s || ENCERRADOS.includes(s.status)) return false
  if (s.solicitante_id && s.solicitante_id === PERFIL.pessoaId) return true
  if (COMPRAS_CACHE.meusSetores.some(x => x.id === s.setor_id)) return true
  if (s.status === 'AGUARDANDO_COTACAO' && podeCotar()) return true
  if (s.status === 'AGUARDANDO_APROVACAO' && podeAprovar()) return true
  return false
}

let COMPRAS_CACHE = { fornecedores: [], setores: [], pessoas: [], meusSetores: [] }

async function paginaCompras () {
  if (!podeVer('compras')) { areaLivre().innerHTML =
    `<div class="panel" style="padding:22px;"><p class="texto-dim">
     Você não tem acesso a Compras.</p></div>`; return }

  const editavel = podeEditar('compras')
  $('#subtitulo-pagina').textContent = 'Solicitações, coordenação, cotação e aprovação'
  const area = areaLivre()
  area.innerHTML = `<p class="texto-dim2">carregando...</p>`

  // carrega antes de montar as abas: quem coordena depende dos setores
  const [{ data: forn }, { data: setores }, { data: pessoas }] = await Promise.all([
    db.from('fornecedor').select('id,nome,cnpj_cpf,contato,status').order('nome'),
    db.from('setor').select('id,nome,gestor_id').order('nome'),
    db.from('pessoa').select('id,nome').order('nome')
  ])
  COMPRAS_CACHE = {
    fornecedores: forn || [],
    setores: setores || [],
    pessoas: pessoas || [],
    meusSetores: (setores || []).filter(s => s.gestor_id && s.gestor_id === PERFIL.pessoaId)
  }

  const abas = [
    { chave: 'solicitacoes', nome: 'Solicitações', mostrar: true },
    { chave: 'coordenar',    nome: 'Coordenação',  mostrar: podeCoordenar() },
    { chave: 'cotar',        nome: 'Cotação',      mostrar: podeCotar() },
    { chave: 'aprovar',      nome: 'Aprovação',    mostrar: podeAprovar() },
    { chave: 'fornecedores', nome: 'Fornecedores', mostrar: true },
    { chave: 'relatorio',    nome: 'Relatório',    mostrar: true }
  ].filter(a => a.mostrar)

  area.innerHTML = `
    <div class="subabas">
      ${abas.map((a, i) => `<button data-sub="${a.chave}" class="${i === 0 ? 'ativo' : ''}">${a.nome}</button>`).join('')}
    </div>
    <div id="sub-compras"></div>`

  area.querySelectorAll('.subabas button').forEach(b => {
    b.onclick = () => {
      area.querySelectorAll('.subabas button').forEach(x => x.classList.toggle('ativo', x === b))
      abrirCompras(b.dataset.sub, editavel)
    }
  })

  abrirCompras('solicitacoes', editavel)
}

function abrirCompras (sub, editavel) {
  const alvo = $('#sub-compras')
  alvo.innerHTML = `<p class="texto-dim2">carregando...</p>`
  if (sub === 'solicitacoes') comprasSolicitacoes(alvo, editavel)
  if (sub === 'coordenar') comprasDecidir(alvo, 'coordenacao')
  if (sub === 'cotar') comprasCotar(alvo)
  if (sub === 'aprovar') comprasDecidir(alvo, 'aprovacao')
  if (sub === 'fornecedores') comprasFornecedores(alvo, editavel)
  if (sub === 'relatorio') comprasRelatorio(alvo)
}

const selSolicitacao = `
  id, status, urgencia, tipo_solicitacao, justificativa, tem_risco, descricao_risco,
  produto_servico, quantidade, unidade, especificacoes, finalidade, local_entrega,
  valor_estimado, recorrencia, data_solicitacao, setor_id,
  numero, valor_aprovado, onde_mais_barato, observacao_compras, solicitante_id,
  parecer_coordenacao, coordenado_em, parecer_aprovacao, decidido_em,
  parecer_cotacao, cotado_em, forma_pagamento, condicao_pagamento,
  parcelas, vencimento, dados_pagamento, orcamento_escolhido_id,
  solicitante:solicitante_id ( nome ),
  gestor:gestor_id ( nome ),
  analista:analista_id ( nome ),
  aprovador:aprovador_id ( nome ),
  setor:setor_id ( nome ),
  fornecedor:fornecedor_id ( nome )`

// ----- Compras › Solicitações -----
async function comprasSolicitacoes (alvo, editavel) {
  const { data, error } = await db.from('solicitacao_compra')
    .select(selSolicitacao).order('data_solicitacao', { ascending: false }).limit(600)

  if (error) { alvo.innerHTML = `<p class="vazio">${esc(error.message)}</p>`; return }

  // Em análise é o que ainda anda. Encerrada é o que já teve desfecho —
  // fica guardado numa gaveta, para não competir com o que precisa de ação.
  const ANDANDO = ['AGUARDANDO_COORD', 'AGUARDANDO_COTACAO', 'AGUARDANDO_APROVACAO']
  const ENCERRADA = ['APROVADA', 'REPROVADA', 'DEVOLVIDA', 'PAGA', 'RECEBIDA', 'CANCELADA']

  const todas = data || []
  const analise = todas.filter(s => ANDANDO.includes(s.status))
  const encerradas = todas.filter(s => ENCERRADA.includes(s.status))
  const aprovadas = encerradas.filter(s => ['APROVADA', 'PAGA', 'RECEBIDA'].includes(s.status))
  const reprovadas = encerradas.filter(s => ['REPROVADA', 'DEVOLVIDA', 'CANCELADA'].includes(s.status))

  const soma = l => l.reduce((t, s) => t + Number(s.valor_aprovado ?? s.valor_estimado ?? 0), 0)

  alvo.innerHTML = `
    ${editavel ? `<div class="acoes" style="margin:0 0 16px;">
      <button class="btn" id="c-nova">Nova solicitação</button>
    </div>` : ''}

    <div class="faixa-etapa" id="c-faixa">
      <button data-etapa="AGUARDANDO_COORD"><span class="n">${
        analise.filter(s => s.status === 'AGUARDANDO_COORD').length}</span>coordenação</button>
      <button data-etapa="AGUARDANDO_COTACAO"><span class="n">${
        analise.filter(s => s.status === 'AGUARDANDO_COTACAO').length}</span>cotação</button>
      <button data-etapa="AGUARDANDO_APROVACAO"><span class="n">${
        analise.filter(s => s.status === 'AGUARDANDO_APROVACAO').length}</span>aprovação</button>
      <button data-etapa=""><span class="n">${analise.length}</span>todas em análise</button>
    </div>

    <div class="filtros" style="margin-bottom:14px;">
      <div class="campo"><label>Setor</label>
        <select id="c-f-setor"><option value="">todos</option>
          ${[...new Set(todas.map(s => s.setor?.nome).filter(Boolean))].sort()
            .map(x => `<option>${esc(x)}</option>`).join('')}
        </select></div>
      <div class="campo"><label>Buscar</label>
        <input id="c-f-texto" placeholder="produto, número ou solicitante"></div>
    </div>

    <div id="c-lista"></div>

    <details class="gaveta">
      <summary>Aprovadas e concluídas
        <span class="conta">${aprovadas.length} · R$ ${fmtNum(soma(aprovadas))}</span></summary>
      <div class="corpo">
        <div class="linha-add" style="margin-bottom:10px;">
          <input id="c-busca-ap" placeholder="buscar por item, número, solicitante ou valor">
        </div>
        <div id="c-aprovadas"></div>
      </div>
    </details>

    <details class="gaveta">
      <summary>Reprovadas, devolvidas e canceladas
        <span class="conta">${reprovadas.length}</span></summary>
      <div class="corpo">
        <div class="linha-add" style="margin-bottom:10px;">
          <input id="c-busca-rep" placeholder="buscar por item, número, solicitante ou valor">
        </div>
        <div id="c-reprovadas"></div>
      </div>
    </details>`

  let etapa = ''

  const cartao = (s, apagado = false) => `
    <div class="cartao-sol" ${apagado ? 'style="opacity:.72;"' : ''}>
      <div class="linha1">
        <span class="titulo">${esc(s.produto_servico ?? '—')}</span>
        ${s.urgencia === 'URGENTE_4H' && !apagado ? '<span class="urgente">● urgente</span>' : ''}
        ${selo(s.status)}
        <div class="botoes">
          <button class="btn-secundario mini" data-ficha="${s.id}">ficha</button>
          ${podeEditarSolicitacao(s)
            ? `<button class="btn-secundario mini" data-editar="${s.id}">editar</button>` : ''}
          ${ehAdminSistema()
            ? `<button class="btn-secundario mini" data-excluir="${s.id}">excluir</button>` : ''}
        </div>
      </div>
      <div class="meta">
        ${esc(s.numero ?? s.origem_id ?? '')}
        · ${esc(s.solicitante?.nome ?? s.solicitante_nome ?? 'sem solicitante')}
        ${s.setor?.nome ? '· ' + esc(s.setor.nome) : ''}
        · ${fmtQuando(s.data_solicitacao) ?? '—'}
        ${s.quantidade ? `· ${esc(s.quantidade)} ${esc(s.unidade ?? '')}` : ''}
        ${s.valor_aprovado ? `· aprovado R$ ${fmtNum(s.valor_aprovado)}`
          : s.valor_estimado ? `· estimado R$ ${fmtNum(s.valor_estimado)}` : ''}
        ${s.origem_id ? '· <span class="texto-dim2">da planilha</span>' : ''}
      </div>
    </div>`

  const ligarFichas = escopo => {
    escopo.querySelectorAll('[data-ficha]').forEach(b => {
      b.onclick = () => { abrirFicha(todas.find(x => x.id === b.dataset.ficha), editavel)
        .catch(e => console.error(e)) }
    })
  }

  // busca solta: casa com texto em qualquer campo, ou com o valor
  const combina = (s, termo) => {
    if (!termo) return true
    const t = termo.trim().toLowerCase()
    const alvo = `${s.produto_servico ?? ''} ${s.numero ?? ''} ${s.origem_id ?? ''} `
      + `${s.solicitante?.nome ?? s.solicitante_nome ?? ''} ${s.setor?.nome ?? ''} `
      + `${s.finalidade ?? ''} ${fmtData((s.data_solicitacao ?? '').slice(0, 10))}`
    if (alvo.toLowerCase().includes(t)) return true
    // número digitado procura também no valor, com tolerância de centavos
    const n = numeroBR(t)
    if (n !== null) {
      const v = Number(s.valor_aprovado ?? s.valor_estimado ?? 0)
      if (Math.abs(v - n) < 0.01) return true
    }
    return false
  }

  const desenharGaveta = (idBusca, idLista, lista) => {
    const pintar = () => {
      const termo = $(idBusca)?.value ?? ''
      const filtrada = lista.filter(s => combina(s, termo))
      $(idLista).innerHTML = filtrada.map(s => cartao(s, true)).join('')
        || `<p class="texto-dim2" style="font-size:13px;">
             ${termo ? 'Nada encontrado com esse termo.' : 'Nada aqui.'}</p>`
      ligarFichas($(idLista))
    }
    if ($(idBusca)) $(idBusca).oninput = pintar
    pintar()
  }

  const desenhar = () => {
    const setor = $('#c-f-setor').value
    const txt = $('#c-f-texto').value.trim().toLowerCase()
    const casa = s => (!setor || s.setor?.nome === setor) &&
      (!txt || `${s.produto_servico ?? ''} ${s.numero ?? ''} ${s.origem_id ?? ''} ${s.solicitante?.nome ?? ''} ${s.solicitante_nome ?? ''}`
        .toLowerCase().includes(txt))

    const lista = analise.filter(s => (!etapa || s.status === etapa) && casa(s))
    $('#c-lista').innerHTML = lista.map(s => cartao(s)).join('') ||
      `<p class="vazio">${analise.length
        ? 'Nada em análise com esse filtro.'
        : 'Nenhuma solicitação em análise. Tudo que existe já teve desfecho — veja nas gavetas abaixo.'}</p>`

    desenharGaveta('#c-busca-ap', '#c-aprovadas', aprovadas)
    desenharGaveta('#c-busca-rep', '#c-reprovadas', reprovadas)

    ligarFichas(alvo)
    alvo.querySelectorAll('[data-editar]').forEach(b => {
      b.onclick = () => formSolicitacao(todas.find(x => x.id === b.dataset.editar))
    })
    alvo.querySelectorAll('[data-excluir]').forEach(b => {
      b.onclick = () => excluirSolicitacao(todas.find(x => x.id === b.dataset.excluir))
    })
  }

  $('#c-faixa').querySelectorAll('[data-etapa]').forEach(b => {
    b.onclick = () => {
      etapa = b.dataset.etapa
      $('#c-faixa').querySelectorAll('button').forEach(x => x.classList.toggle('ativo', x === b))
      desenhar()
    }
  })
  $('#c-f-setor').onchange = desenhar
  $('#c-f-texto').oninput = desenhar
  desenhar()

  if (!editavel) return
  $('#c-nova').onclick = () => formSolicitacao()
}


// ----- Excluir solicitação em definitivo (só administrador) -----
// Existe para limpar teste e lançamento duplicado. Para pedido real
// que não vai acontecer, o certo é cancelar: preserva o histórico.
function excluirSolicitacao (s) {
  if (!s) return
  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = `
    <div class="modal">
      <h3>Excluir solicitação ${esc(s.numero ?? '')}</h3>
      <div class="ficha" style="margin-bottom:14px;">
        <div class="item"><div class="rot">Item</div>
          <div class="val">${esc(s.produto_servico ?? '—')}</div></div>
        <div class="item"><div class="rot">Situação</div><div class="val">${selo(s.status)}</div></div>
        <div class="item"><div class="rot">Valor</div>
          <div class="val">${s.valor_estimado ? 'R$ ' + fmtNum(s.valor_estimado) : '—'}</div></div>
      </div>
      ${s.origem_id ? `<div class="recado" style="border-color:var(--warn-text);
        color:var(--warn-text);margin:0 0 12px;">
        Esta solicitação veio da planilha antiga (${esc(s.origem_id)}). Apagar remove
        um registro do histórico da empresa. Tem certeza de que é um lançamento indevido?</div>` : ''}
      <p class="aviso" style="margin-top:0;">
        Apaga em definitivo, com os orçamentos e o histórico dela. Não há como desfazer.
        Para pedido real que não vai acontecer, cancele em vez de apagar.</p>
      <div class="campo"><label>Por que está excluindo *</label>
        <textarea id="ex-motivo" style="min-height:70px;"
          placeholder="lançamento de teste, duplicidade..."></textarea></div>
      <div class="acoes">
        <button class="btn" id="ex-ok" style="background:var(--warn-text);">Excluir</button>
        <button class="btn-secundario" id="ex-cancelar">Cancelar</button>
      </div>
      <div class="recado oculto" id="ex-recado"></div>
    </div>`

  document.body.appendChild(fundo)
  const q = id => fundo.querySelector(id)
  const fechar = () => fundo.remove()
  q('#ex-cancelar').onclick = fechar
  fundo.onclick = e => { if (e.target === fundo) fechar() }

  q('#ex-ok').onclick = async () => {
    const motivo = q('#ex-motivo').value.trim()
    if (motivo.length < 5) {
      const el = q('#ex-recado'); el.textContent = 'Escreva o motivo.'
      el.classList.remove('oculto'); el.style.color = 'var(--warn-text)'
      el.style.borderColor = 'var(--warn-text)'; return
    }
    const btn = q('#ex-ok'); btn.disabled = true; btn.textContent = 'Excluindo...'

    // registra antes de apagar: se falhar, fica o rastro da tentativa
    await db.from('solicitacao_historico').insert({
      solicitacao_id: s.id, numero: s.numero, acao: 'EXCLUSAO',
      justificativa: motivo,
      antes: { numero: s.numero, produto_servico: s.produto_servico,
               valor: s.valor_estimado, status: s.status, origem_id: s.origem_id },
      pessoa_id: PERFIL.pessoaId
    })

    const { error } = await db.from('solicitacao_compra').delete().eq('id', s.id)
    if (error) {
      const el = q('#ex-recado'); el.textContent = error.message
      el.classList.remove('oculto'); el.style.color = 'var(--warn-text)'
      el.style.borderColor = 'var(--warn-text)'
      btn.disabled = false; btn.textContent = 'Excluir'; return
    }
    fechar(); abrirCompras('solicitacoes', true)
  }
}

// ----- Compras › Relatório -----
// Busca em tudo, inclusive no que já foi encerrado, e fecha o mês.
async function comprasRelatorio (alvo) {
  const hoje = new Date()
  const mesPadrao = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, '0')}`

  alvo.innerHTML = `
    <div class="filtros" style="margin-bottom:14px;">
      <div class="campo"><label>De</label><input type="month" id="r-de" value="${mesPadrao}"></div>
      <div class="campo"><label>Até</label><input type="month" id="r-ate" value="${mesPadrao}"></div>
      <div class="campo"><label>Situação</label>
        <select id="r-status"><option value="">todas</option>
          ${Object.entries(STATUS_COMPRA).map(([k, v]) =>
            `<option value="${k}">${esc(v.rotulo)}</option>`).join('')}
        </select></div>
      <div class="campo"><label>Setor</label>
        <select id="r-setor"><option value="">todos</option>
          ${COMPRAS_CACHE.setores.map(s => `<option value="${s.id}">${esc(s.nome)}</option>`).join('')}
        </select></div>
      <div class="campo" style="flex:1;min-width:200px;">
        <label>Buscar</label>
        <input id="r-busca" placeholder="produto, número, solicitante ou fornecedor"></div>
      <button class="btn" id="r-buscar">Buscar</button>
    </div>
    <div id="r-resultado"><p class="texto-dim2" style="font-size:13px;">
      Escolha o período e clique em Buscar. A busca por texto ignora o período,
      para você achar um pedido antigo sem saber a data.</p></div>`

  const buscar = async () => {
    const texto = $('#r-busca').value.trim()
    const de = $('#r-de').value, ate = $('#r-ate').value

    let q = db.from('solicitacao_compra').select(selSolicitacao).limit(1000)

    // com texto, procura em tudo. sem texto, respeita o período.
    if (texto) {
      q = q.or([
        `produto_servico.ilike.%${texto}%`,
        `numero.ilike.%${texto}%`,
        `origem_id.ilike.%${texto}%`,
        `solicitante_nome.ilike.%${texto}%`,
        `finalidade.ilike.%${texto}%`
      ].join(','))
    } else {
      if (de) q = q.gte('data_solicitacao', de + '-01')
      if (ate) {
        const [a, m] = ate.split('-').map(Number)
        q = q.lt('data_solicitacao', new Date(Date.UTC(a, m, 1)).toISOString())
      }
    }
    if ($('#r-status').value) q = q.eq('status', $('#r-status').value)
    if ($('#r-setor').value) q = q.eq('setor_id', $('#r-setor').value)

    $('#r-resultado').innerHTML = `<p class="texto-dim2">buscando...</p>`
    const { data, error } = await q.order('data_solicitacao', { ascending: false })
    if (error) { $('#r-resultado').innerHTML = `<p class="vazio">${esc(error.message)}</p>`; return }

    const lista = data || []
    const valor = s => Number(s.valor_pago ?? s.valor_aprovado ?? s.valor_estimado ?? 0)
    const total = lista.reduce((t, s) => t + valor(s), 0)
    const pagas = lista.filter(s => s.status === 'PAGA')
    const aPagar = lista.filter(s => s.status === 'APROVADA')

    // agrupa por setor, que é o corte mais útil no fim do mês
    const porSetor = {}
    lista.forEach(s => {
      const k = s.setor?.nome ?? 'sem setor'
      porSetor[k] = porSetor[k] || { n: 0, v: 0 }
      porSetor[k].n++; porSetor[k].v += valor(s)
    })

    $('#r-resultado').innerHTML = `
      <div class="kpis" style="margin-bottom:14px;">
        ${kpi('Solicitações', lista.length, texto ? 'busca em todo o histórico' : `${de} a ${ate}`)}
        ${kpi('Valor total', 'R$ ' + fmtNum(total))}
        ${kpi('Já pagas', pagas.length, 'R$ ' + fmtNum(pagas.reduce((t, s) => t + valor(s), 0)))}
        ${kpi('A pagar', aPagar.length, 'R$ ' + fmtNum(aPagar.reduce((t, s) => t + valor(s), 0)))}
      </div>

      ${Object.keys(porSetor).length > 1 ? `
      <div class="panel" style="padding:16px 18px;margin-bottom:14px;">
        <div class="rot texto-dim2" style="font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;">
          Por setor</div>
        ${Object.entries(porSetor).sort((a, b) => b[1].v - a[1].v).map(([k, v]) => `
          <div class="passo">
            <span class="quando">R$ ${fmtNum(v.v)}</span>
            <span>${esc(k)} <span class="texto-dim2">· ${v.n} solicitação(ões)</span></span>
          </div>`).join('')}
      </div>` : ''}

      <div class="acoes" style="margin:0 0 12px;">
        <button class="btn-secundario" id="r-pdf">Gerar relatório em PDF</button>
        <span class="texto-dim2" style="font-size:12px;">${lista.length} resultado(s)</span>
      </div>

      <div class="panel" style="padding:0;"><div class="tabela-scroll">
        <table><thead><tr>
          <th>Número</th><th>Data</th><th>Item</th><th>Setor</th>
          <th>Solicitante</th><th class="num">Valor</th><th>Situação</th><th></th>
        </tr></thead><tbody>
          ${lista.map(s => `<tr>
            <td class="texto-dim2">${esc(s.numero ?? s.origem_id ?? '—')}</td>
            <td>${fmtQuando(s.data_solicitacao) ?? '—'}</td>
            <td>${esc((s.produto_servico ?? '').slice(0, 60))}</td>
            <td>${esc(s.setor?.nome ?? '—')}</td>
            <td class="texto-dim">${esc(s.solicitante?.nome ?? s.solicitante_nome ?? '—')}</td>
            <td class="num">R$ ${fmtNum(valor(s))}</td>
            <td>${selo(s.status)}</td>
            <td><button class="btn-secundario mini" data-ficha="${s.id}">ver</button></td>
          </tr>`).join('') || `<tr><td colspan="8" class="vazio">Nada encontrado.</td></tr>`}
        </tbody></table>
      </div></div>`

    $('#r-resultado').querySelectorAll('[data-ficha]').forEach(b => {
      b.onclick = () => { abrirFicha(lista.find(x => x.id === b.dataset.ficha), false)
        .catch(e => console.error(e)) }
    })
    $('#r-pdf').onclick = () => pdfRelatorioCompras(lista, texto ? 'busca: ' + texto : `${de} a ${ate}`,
      { total, porSetor, pagas: pagas.length, aPagar: aPagar.length })
  }

  $('#r-buscar').onclick = buscar
  $('#r-busca').onkeydown = e => { if (e.key === 'Enter') buscar() }
  buscar()
}

// ----- Importar a planilha de compras -----
// Lê a aba de controle (a que tem ID, Status e FluxoEtapa), não a das
// respostas cruas. O ID da planilha vira origem_id, então reimportar
// o arquivo inteiro atualiza em vez de duplicar.
function telaImportarCompras () {
  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = `
    <div class="modal" style="max-width:820px;">
      <h3>Importar solicitações da planilha</h3>
      <p class="aviso" style="margin-top:0;">
        No Google Sheets, abra a <b>aba de controle</b> — a que tem as colunas ID, Status e
        FluxoEtapa. Selecione tudo, incluindo a linha de títulos, copie e cole abaixo.
        O sistema encontra as colunas pelo nome, então a ordem não importa.
        Linhas já importadas são atualizadas, não duplicadas.</p>
      <textarea id="ic-dados" style="min-height:190px;"
        placeholder="Cole aqui (Ctrl+V)"></textarea>
      <div class="acoes">
        <button class="btn" id="ic-conferir">Conferir</button>
        <button class="btn-secundario" id="ic-importar" disabled>Importar</button>
        <button class="btn-secundario" id="ic-cancelar">Fechar</button>
      </div>
      <div class="recado oculto" id="ic-recado"></div>
    </div>`

  document.body.appendChild(fundo)
  const q = id => fundo.querySelector(id)
  const fechar = () => fundo.remove()
  q('#ic-cancelar').onclick = fechar
  fundo.onclick = e => { if (e.target === fundo) fechar() }

  const dizer = (t, alerta = false) => {
    const el = q('#ic-recado'); el.innerHTML = t; el.classList.remove('oculto')
    el.style.borderColor = alerta ? 'var(--warn-text)' : 'var(--line2)'
    el.style.color = alerta ? 'var(--warn-text)' : 'var(--dim)'
  }

  // normaliza cabeçalho: sem acento, minúsculo, sem espaço
  const chave = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase().replace(/[^a-z0-9]/g, '')

  let prontas = []

  const ler = () => {
    const linhas = q('#ic-dados').value.split('\n').filter(l => l.trim())
    if (linhas.length < 2) return { erro: 'Cole ao menos o cabeçalho e uma linha.' }

    const sep = linhas[0].includes('\t') ? '\t' : ';'
    const cab = linhas[0].split(sep).map(chave)
    const col = nome => cab.indexOf(chave(nome))

    const iId = col('ID')
    if (iId < 0) return { erro: 'Não achei a coluna <b>ID</b>. Você colou a aba de controle?' }

    const idx = {
      id: iId, nome: col('Nome'), email: col('Email'), setor: col('Setor'),
      gestor: col('Gestor'), tipo: col('Tipo'), urgencia: col('Urgencia'),
      justificativa: col('Justificativa'), risco: col('Risco'), descricao: col('Descricao'),
      quantidade: col('Quantidade'), unidade: col('Unidade'), especificacoes: col('Especificacoes'),
      finalidade: col('Finalidade'), local: col('Local'), valor: col('Valor'),
      recorrencia: col('Recorrencia'), status: col('Status'), aprovador: col('Aprovador'),
      observacao: col('Observacao'), data: col('Data'), ondeMaisBarato: col('LocalMaisBarato'),
      fornecedorMaisBarato: col('FornecedorMaisBarato'), precoEncontrado: col('PrecoEncontrado'),
      obsCompras: col('ObsCompras'), produto: col('ProdutoServico'),
      valorFinal: col('ValorFinal'), formaPagamento: col('FormaPagamento'),
      fluxo: col('FluxoEtapa'), justCoord: col('JustificativaCoordenador'),
      arquivo: col('Arquivo'), pdfPedido: col('PdfPedidoUrl'), pdfCotacao: col('PdfCotacaoUrl'),
      contato: col('ContatoFornecedor')
    }

    const v = (c, i) => (idx[i] >= 0 ? (c[idx[i]] ?? '').trim() : '')
    const dataBR = t => {
      const m = String(t).match(/^(\d{2})\/(\d{2})\/(\d{4})/)
      if (!m) return null
      const iso = `${m[3]}-${m[2]}-${m[1]}`
      const d = new Date(iso + 'T12:00:00')
      return isNaN(d) ? null : d.toISOString()
    }

    // Status da planilha vira status do sistema. FluxoEtapa ENCERRADO
    // significa que o processo acabou, independente do resultado.
    const traduzir = (status, fluxo) => {
      const s = chave(status)
      if (s === 'aprovado') return 'APROVADA'
      if (s === 'reprovado') return 'REPROVADA'
      if (s === 'cancelado') return 'CANCELADA'
      if (chave(fluxo) === 'encerrado') return 'APROVADA'
      if (!s) return 'AGUARDANDO_COORD'
      return 'AGUARDANDO_APROVACAO'
    }

    const itens = [], erros = []
    linhas.slice(1).forEach((l, i) => {
      const c = l.split(sep)
      const origem = v(c, 'id')
      if (!origem || !/^PC-/i.test(origem)) return          // linha vazia ou fora do padrão
      const produto = v(c, 'produto') || v(c, 'descricao') || v(c, 'finalidade')
      if (!produto) { erros.push(`linha ${i + 2}: sem produto ou descrição`); return }

      itens.push({
        origem_id: origem,
        produto_servico: produto.slice(0, 500),
        solicitante_nome: v(c, 'nome') || null,
        gestor_nome: v(c, 'gestor') || null,
        aprovador_nome: v(c, 'aprovador') || null,
        tipo_solicitacao: v(c, 'tipo') || null,
        urgencia: /4h|urgente/i.test(v(c, 'urgencia')) && !/nao/i.test(chave(v(c, 'urgencia')))
          ? 'URGENTE_4H' : 'NAO_URGENTE_5D',
        justificativa: v(c, 'justificativa') || null,
        tem_risco: /^sim/i.test(v(c, 'risco')),
        descricao_risco: v(c, 'descricao') || null,
        quantidade: v(c, 'quantidade') || null,
        unidade: v(c, 'unidade') || null,
        especificacoes: v(c, 'especificacoes') || null,
        finalidade: v(c, 'finalidade') || null,
        local_entrega: v(c, 'local') || null,
        valor_estimado: numeroBR(v(c, 'valor').replace(/R\$\s*/gi, '')),
        valor_aprovado: numeroBR(v(c, 'valorFinal').replace(/R\$\s*/gi, '')),
        recorrencia: v(c, 'recorrencia') || null,
        onde_mais_barato: v(c, 'ondeMaisBarato') || null,
        observacao_compras: v(c, 'obsCompras') || null,
        parecer_aprovacao: v(c, 'observacao') || null,
        parecer_coordenacao: v(c, 'justCoord') || null,
        forma_pagamento: v(c, 'formaPagamento') || null,
        status_planilha: v(c, 'status') || null,
        fluxo_etapa: v(c, 'fluxo') || null,
        pdf_pedido_url: v(c, 'pdfPedido') || null,
        pdf_cotacao_url: v(c, 'pdfCotacao') || null,
        arquivo_url: v(c, 'arquivo') || null,
        contato_fornecedor: v(c, 'contato') || null,
        status: traduzir(v(c, 'status'), v(c, 'fluxo')),
        data_solicitacao: dataBR(v(c, 'data')) || new Date().toISOString()
      })
    })
    return { itens, erros }
  }

  q('#ic-conferir').onclick = () => {
    const r = ler()
    if (r.erro) { dizer(r.erro, true); q('#ic-importar').disabled = true; return }
    prontas = r.itens
    if (!prontas.length) {
      dizer('Nenhuma linha com ID no formato PC-... foi encontrada.', true)
      q('#ic-importar').disabled = true; return
    }
    const conta = st => prontas.filter(x => x.status === st).length
    dizer(`<b>${prontas.length}</b> solicitação(ões) lida(s):<br>`
      + `${conta('APROVADA')} aprovada(s) · ${conta('REPROVADA')} reprovada(s) · `
      + `${conta('CANCELADA')} cancelada(s) · `
      + `${prontas.length - conta('APROVADA') - conta('REPROVADA') - conta('CANCELADA')} em análise`
      + (r.erros.length ? `<br><b>${r.erros.length} linha(s) ignorada(s):</b><br>`
          + r.erros.slice(0, 5).map(esc).join('<br>') : '')
      + '<br>Nada foi gravado ainda.', r.erros.length > 0)
    q('#ic-importar').disabled = false
  }

  q('#ic-importar').onclick = async () => {
    if (!prontas.length) return
    const btn = q('#ic-importar'); btn.disabled = true; btn.textContent = 'Importando...'

    let gravadas = 0, falhas = []
    // em blocos, para uma linha ruim não derrubar a importação inteira
    for (let i = 0; i < prontas.length; i += 50) {
      const bloco = prontas.slice(i, i + 50)
      const { error } = await db.from('solicitacao_compra')
        .upsert(bloco, { onConflict: 'origem_id' })
      if (error) falhas.push(`bloco ${i / 50 + 1}: ${error.message}`)
      else gravadas += bloco.length
    }

    btn.disabled = false; btn.textContent = 'Importar'
    if (falhas.length) {
      dizer(`${gravadas} gravada(s), mas houve erro:<br>${falhas.map(esc).join('<br>')}`, true)
      return
    }
    dizer(`<b>${gravadas} solicitação(ões)</b> importada(s). Atualizando a tela...`)
    setTimeout(() => { fechar(); abrirCompras('solicitacoes', true) }, 1600)
  }
}

// ----- Ficha da solicitação: documento imprimível -----
async function abrirFicha (s, editavel) {
  if (!s) return

  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'

  const fechar = () => fundo.remove()

  const { data: orcs } = await db.from('orcamento')

    .eq('solicitacao_id', s.id).order('valor')

  const lista = orcs || []
  const escolhido = lista.find(o => o.escolhido)
  const menor = lista.length ? Math.min(...lista.map(o => Number(o.valor))) : null
  const nomeForn = o => o?.fornecedor?.nome || o?.fornecedor_avulso || null

  const corpo = `

        docLinha('Gestor', s.gestor?.nome) +
        docLinha('Local de entrega', s.local_entrega))}

      ${docBloco('Controle',
        docLinha('Nº', s.numero) +
        `<div style="margin:6px 0;"><span class="estado">${
          esc((STATUS_COMPRA[s.status] || {}).rotulo || s.status || '—')}</span></div>` +
        docLinha('Data', fmtQuando(s.data_solicitacao)) +
        docLinha('Analista', s.analista?.nome) +
        docLinha('Aprovador', s.aprovador?.nome))}

      ${docBloco('Urgência e tipo',
        docLinha('Tipo', s.tipo_solicitacao) +
        docLinha('Urgência', URGENCIA[s.urgencia] ?? s.urgencia) +
        docLinha('Recorrência', s.recorrencia) +
        (s.tem_risco
          ? `<div style="color:#a33;"><b>Risco:</b> ${esc(s.descricao_risco || 'apontado')}</div>`
          : '<div><span class="rot">Risco:</span> não</div>'))}
    </div>

    <div class="doc-linha" style="grid-template-columns:1fr 1fr;">
      ${docBloco('Detalhamento',
        docLinha('Produto ou serviço', s.produto_servico) +
        docLinha('Quantidade', s.quantidade ? `${s.quantidade} ${s.unidade ?? ''}` : null) +
        docLinha('Especificações', s.especificacoes) +
        docLinha('Finalidade', s.finalidade))}

      ${docBloco('Fornecedor e valores',
        docLinha('Fornecedor sugerido', s.fornecedor?.nome) +
        docLinha('Fornecedor escolhido', nomeForn(escolhido)) +
        docLinha('Pagamento', [s.forma_pagamento, s.condicao_pagamento].filter(Boolean).join(' · ') || null) +
        docLinha('Parcelas', s.parcelas ? s.parcelas + 'x' : null) +
        docLinha('Vencimento', s.vencimento ? fmtData(s.vencimento) : null) +
        docValor('Valor solicitado', 'estimativa do solicitante', s.valor_estimado) +
        docValor('Valor análise compras', 'cotação e negociação', escolhido?.valor) +
        docValor('Valor aprovado', 'valor final autorizado',
          s.valor_aprovado ?? (['APROVADA','PAGA','RECEBIDA'].includes(s.status) ? escolhido?.valor : null), true))}
    </div>

    ${docBloco('Análise do compras e coordenação',
      docLinha('Onde achou mais barato', s.onde_mais_barato) +
      docLinha('Fornecedor mais barato', nomeForn(lista.find(o => Number(o.valor) === menor))) +
      (lista.length ? `
        <table style="margin-top:8px;"><thead><tr>
          <th>Fornecedor</th><th class="num">Valor</th><th>Prazo</th><th>Pagamento</th><th></th>
        </tr></thead><tbody>
          ${lista.map(o => `<tr>
            <td>${esc(nomeForn(o) ?? '—')}</td>
            <td class="num">R$ ${fmtNum(o.valor)}</td>
            <td>${esc(o.prazo_entrega ?? '—')}</td>
            <td>${esc([o.forma_pagamento, o.condicao_pagamento].filter(Boolean).join(' · ') || '—')}</td>
            <td>${o.escolhido ? '<b>escolhido</b>' : (Number(o.valor) === menor ? 'menor preço' : '')}</td>
          </tr>`).join('')}
        </tbody></table>` : '') +
      docValor('Total', 'valor do orçamento escolhido', escolhido?.valor ?? s.valor_estimado, true))}

    ${docTexto('Justificativa do solicitante', s.justificativa)}
    ${docTexto('Orçamento e cotação', s.parecer_cotacao)}
    ${s.observacao_compras ? docTexto('Observação do compras', s.observacao_compras) : ''}
    ${docTexto('Justificativa da coordenação', s.parecer_coordenacao, 'coord')}
    ${s.parecer_aprovacao ? docTexto('Parecer da aprovação', s.parecer_aprovacao) : ''}

    ${docAssinaturas([['Solicitante', s.solicitante?.nome],
                      ['Coordenação', s.gestor?.nome],
                      ['Aprovação', s.aprovador?.nome]])}`

  fundo.innerHTML = documentoPDF({
    titulo: 'PEDIDO DE COMPRA',
    subtitulo: 'documento para aprovação e arquivo',
    corpo,
    acoes: `<button class="btn" id="f-imprimir">Gerar PDF do pedido</button>
      ${editavel ? '<button class="btn-secundario" id="f-editar">Editar</button>' : ''}
      <button class="btn-secundario" id="f-fechar">Fechar</button>`
  })

  fundo.querySelector('#f-fechar').onclick = fechar
  fundo.querySelector('#f-imprimir').onclick = () => window.print()
  const bEditar = fundo.querySelector('#f-editar')
  if (bEditar) bEditar.onclick = () => { fechar(); formSolicitacao(s) }
}

// ----- Formulário de solicitação -----
function formSolicitacao (s = null) {
  const opc = (lista, atual) => '<option value="">—</option>' +
    lista.map(i => `<option value="${i.id}" ${i.id === atual ? 'selected' : ''}>${esc(i.nome)}</option>`).join('')

  // listas fixas. Se o registro tiver um valor antigo fora da lista,
  // ele entra como opção para a edição não apagar o que já estava gravado.
  const opcTexto = (lista, atual, vazio = '—') => {
    const itens = atual && !lista.includes(atual) ? [...lista, atual] : lista
    return `<option value="">${esc(vazio)}</option>` +
      itens.map(v => `<option value="${esc(v)}" ${v === atual ? 'selected' : ''}>${esc(v)}</option>`).join('')
  }

  const UNIDADES = ['un', 'cx', 'pct', 'kg', 't', 'L', 'm', 'm²', 'm³',
                    'par', 'jogo', 'rolo', 'saco', 'balde', 'galão',
                    'peça', 'hora', 'mês', 'serviço']
  const TIPOS = ['Material', 'Peça de reposição', 'Equipamento', 'Ferramenta',
                 'EPI', 'Insumo', 'Serviço', 'Manutenção', 'Locação',
                 'Software ou licença', 'Frete', 'Obra', 'Outro']
  const RECORRENCIAS = ['Única', 'Sob demanda', 'Semanal', 'Quinzenal', 'Mensal',
                        'Bimestral', 'Trimestral', 'Semestral', 'Anual']

  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = `
    <div class="modal">
      <h3>${s ? 'Editar solicitação' : 'Nova solicitação de compra'}</h3>
      <div class="form-grade">
        <div class="campo"><label>Produto ou serviço *</label>
          <input id="s-produto" value="${esc(s?.produto_servico ?? '')}"></div>
        <div class="campo"><label>Quantidade</label>
          <input id="s-qtd" value="${esc(s?.quantidade ?? '')}"></div>
        <div class="campo"><label>Unidade</label>
          <select id="s-unid">${opcTexto(UNIDADES, s?.unidade)}</select></div>
        <div class="campo"><label>Urgência</label>
          <select id="s-urg">
            <option value="NAO_URGENTE_5D" ${s?.urgencia === 'NAO_URGENTE_5D' ? 'selected' : ''}>Normal — 5 dias</option>
            <option value="URGENTE_4H" ${s?.urgencia === 'URGENTE_4H' ? 'selected' : ''}>Urgente — 4 horas</option>
          </select></div>
        <div class="campo"><label>Tipo</label>
          <select id="s-tipo">${opcTexto(TIPOS, s?.tipo_solicitacao)}</select></div>
        <div class="campo"><label>Setor</label>
          <select id="s-setor">${opc(COMPRAS_CACHE.setores, s?.setor_id)}</select></div>
        <div class="campo"><label>Valor estimado (R$)</label>
          <input id="s-valor" inputmode="decimal" value="${s?.valor_estimado ?? ''}" placeholder="80,00"></div>
        <div class="campo"><label>Fornecedor sugerido</label>
          <select id="s-forn">${opc(COMPRAS_CACHE.fornecedores, s?.fornecedor_id)}</select></div>
        <div class="campo"><label>Local de entrega</label>
          <input id="s-local" value="${esc(s?.local_entrega ?? '')}"></div>
        <div class="campo"><label>Recorrência</label>
          <select id="s-recor">${opcTexto(RECORRENCIAS, s?.recorrencia)}</select></div>
      </div>

      <div class="campo" style="margin-top:12px;"><label>Finalidade</label>
        <textarea id="s-final" style="min-height:70px;">${esc(s?.finalidade ?? '')}</textarea></div>
      <div class="campo" style="margin-top:10px;"><label>Especificações</label>
        <textarea id="s-espec" style="min-height:70px;">${esc(s?.especificacoes ?? '')}</textarea></div>
      <div class="campo" style="margin-top:10px;"><label>Justificativa</label>
        <textarea id="s-just" style="min-height:70px;">${esc(s?.justificativa ?? '')}</textarea></div>

      <label class="linha-modulo" style="margin-top:12px;">
        <input type="checkbox" id="s-risco" ${s?.tem_risco ? 'checked' : ''}>
        <span class="nome">Existe risco se esta compra não acontecer</span></label>
      <div class="campo ${s?.tem_risco ? '' : 'oculto'}" id="s-linha-risco" style="margin-top:8px;">
        <label>Qual o risco</label>
        <textarea id="s-descrisco" style="min-height:60px;">${esc(s?.descricao_risco ?? '')}</textarea></div>

      <div class="acoes">
        <button class="btn" id="s-salvar">${s ? 'Salvar alterações' : 'Enviar solicitação'}</button>
        <button class="btn-secundario" id="s-cancelar">Cancelar</button>
      </div>
      <div class="recado oculto" id="s-recado"></div>
    </div>`

  document.body.appendChild(fundo)
  const fechar = () => fundo.remove()
  fundo.querySelector('#s-cancelar').onclick = fechar
  fundo.onclick = e => { if (e.target === fundo) fechar() }

  const q = id => fundo.querySelector(id)
  q('#s-risco').onchange = () => q('#s-linha-risco').classList.toggle('oculto', !q('#s-risco').checked)

  const aviso = (t, alerta = false) => {
    const el = q('#s-recado'); el.textContent = t; el.classList.remove('oculto')
    el.style.borderColor = alerta ? 'var(--warn-text)' : 'var(--line2)'
    el.style.color = alerta ? 'var(--warn-text)' : 'var(--dim)'
  }

  q('#s-salvar').onclick = async () => {
    const produto = q('#s-produto').value.trim()
    if (!produto) { aviso('Escreva o produto ou serviço.', true); return }

    const btn = q('#s-salvar'); btn.disabled = true; btn.textContent = 'Salvando...'
    const corpo = {
      produto_servico: produto,
      quantidade: q('#s-qtd').value.trim() || null,
      unidade: q('#s-unid').value || null,
      urgencia: q('#s-urg').value,
      tipo_solicitacao: q('#s-tipo').value || null,
      setor_id: q('#s-setor').value || null,
      valor_estimado: (() => {
        let b = q('#s-valor').value.trim()
        if (!b) return null
        if (b.includes(',')) {
          b = b.replace(/\./g, '').replace(',', '.')   // 1.250,50   -> 1250.50
        } else if (/^\d{1,3}(\.\d{3})+$/.test(b)) {
          b = b.replace(/\./g, '')                     // 1.234.567  -> 1234567
        }                                              // 80.5 fica como está
        const n = Number(b)
        return Number.isNaN(n) ? null : n
      })(),
      fornecedor_id: q('#s-forn').value || null,
      local_entrega: q('#s-local').value.trim() || null,
      recorrencia: q('#s-recor').value || null,
      finalidade: q('#s-final').value.trim() || null,
      especificacoes: q('#s-espec').value.trim() || null,
      justificativa: q('#s-just').value.trim() || null,
      tem_risco: q('#s-risco').checked,
      descricao_risco: q('#s-risco').checked ? (q('#s-descrisco').value.trim() || null) : null
    }
    if (!s) {
      corpo.solicitante_id = PERFIL.pessoaId
      corpo.data_solicitacao = new Date().toISOString()
      // Indústria passa pela coordenação; os demais vão direto para o analista
      const setorEscolhido = COMPRAS_CACHE.setores.find(x => x.id === corpo.setor_id)
      corpo.status = SETORES_COM_COORDENACAO.includes(setorEscolhido?.nome)
        ? 'AGUARDANDO_COORD'
        : 'AGUARDANDO_COTACAO'
    }

    const { error } = s
      ? await db.from('solicitacao_compra').update(corpo).eq('id', s.id)
      : await db.from('solicitacao_compra').insert(corpo)

    btn.disabled = false; btn.textContent = s ? 'Salvar alterações' : 'Enviar solicitação'
    if (error) { aviso(error.message, true); return }
    fechar()
    abrirCompras('solicitacoes', true)
  }
}

    recusar: { status: 'DEVOLVIDA', rotulo: 'Devolver ao solicitante' },
    campoParecer: 'parecer_coordenacao',

    explica: `Só solicitações de ${SETORES_COM_COORDENACAO.join(' e ')} passam por aqui. ` +

  aprovacao: {

}

async function comprasDecidir (alvo, nomeEtapa) {
  const etapa = ETAPAS[nomeEtapa]
  if (!etapa.permitido()) {
    alvo.innerHTML = `<div class="panel" style="padding:22px;"><p class="texto-dim">
      ${nomeEtapa === 'coordenacao'
        ? 'A coordenação é de quem gerencia um setor. Nenhum setor está sob sua gestão hoje.'
        : 'A aprovação final é do papel <b>Diretoria</b>.'}
      Você acompanha tudo na aba Solicitações.</p></div>`
    return
  }

  let consulta = db.from('solicitacao_compra')
    .select(selSolicitacao).eq('status', etapa.statusFila)

  // coordenação só enxerga o que é do setor que a pessoa gerencia
  if (nomeEtapa === 'coordenacao' && !ehAdminSistema()) {
    consulta = consulta.in('setor_id', COMPRAS_CACHE.meusSetores.map(s => s.id))
  }

  const { data, error } = await consulta.order('urgencia').order('data_solicitacao')
  if (error) { alvo.innerHTML = `<p class="vazio">${esc(error.message)}</p>`; return }

  const meus = nomeEtapa === 'coordenacao' && !ehAdminSistema()
    ? ` · ${COMPRAS_CACHE.meusSetores.map(s => s.nome).join(', ')}` : ''

  alvo.innerHTML = `
    <div class="cabeca-secao">
      <h3 style="font-family:var(--serif);font-size:17px;">${etapa.titulo}</h3>
      <span class="texto-dim2" style="font-size:12px;">${(data || []).length} pendente(s)${esc(meus)}</span>
    </div>
    <p class="aviso" style="margin-top:0;margin-bottom:14px;">${etapa.explica}</p>
    <div id="c-fila"></div>`

  $('#c-fila').innerHTML = (data || []).map(s => `
    <div class="cartao-sol">
      <div class="linha1">
        <span class="titulo">${esc(s.produto_servico)}</span>
        ${s.urgencia === 'URGENTE_4H' ? '<span class="urgente">● urgente</span>' : ''}
        <div class="botoes">
          <button class="btn-secundario mini" data-ficha="${s.id}">ficha</button>
          <button class="btn mini" data-decidir="${s.id}">decidir</button>
        </div>
      </div>
      <div class="meta">
        ${esc(s.solicitante?.nome ?? '—')} ${s.setor?.nome ? '· ' + esc(s.setor.nome) : ''}
        · ${fmtQuando(s.data_solicitacao) ?? '—'}
        ${s.valor_estimado ? `· estimado R$ ${fmtNum(s.valor_estimado)}` : ''}
        ${s.tem_risco ? '· <span class="urgente">risco apontado</span>' : ''}
      </div>
    </div>`).join('') || `<p class="vazio">Nada pendente nesta etapa.</p>`

  $('#c-fila').querySelectorAll('[data-ficha]').forEach(b => {
    b.onclick = () => { abrirFicha(data.find(x => x.id === b.dataset.ficha), false).catch(e => console.error(e)) }
  })
  $('#c-fila').querySelectorAll('[data-decidir]').forEach(b => {
    b.onclick = () => telaDecisao(data.find(x => x.id === b.dataset.decidir), nomeEtapa)
  })
}

// ----- Compras › Cotação (analista de compras) -----
async function comprasCotar (alvo) {
  if (!podeCotar()) {
    alvo.innerHTML = `<div class="panel" style="padding:22px;"><p class="texto-dim">
      A cotação é do analista de compras (papel <b>Compras</b>).</p></div>`
    return
  }

  const { data, error } = await db.from('solicitacao_compra')
    .select(selSolicitacao).eq('status', 'AGUARDANDO_COTACAO')
    .order('urgencia').order('data_solicitacao')

  if (error) { alvo.innerHTML = `<p class="vazio">${esc(error.message)}</p>`; return }

  // quantos orçamentos cada uma já tem
  const ids = (data || []).map(s => s.id)
  let porSol = {}
  if (ids.length) {
    const { data: orcs } = await db.from('orcamento')
      .select('solicitacao_id, valor, escolhido').in('solicitacao_id', ids)
    ;(orcs || []).forEach(o => {
      porSol[o.solicitacao_id] = porSol[o.solicitacao_id] || { n: 0, menor: null }
      porSol[o.solicitacao_id].n++
      const m = porSol[o.solicitacao_id].menor
      if (m === null || Number(o.valor) < m) porSol[o.solicitacao_id].menor = Number(o.valor)
    })
  }

  alvo.innerHTML = `
    <div class="cabeca-secao">
      <h3 style="font-family:var(--serif);font-size:17px;">Para cotar</h3>
      <span class="texto-dim2" style="font-size:12px;">${(data || []).length} pendente(s)</span>
    </div>
    <p class="aviso" style="margin-top:0;margin-bottom:14px;">
      Lance os orçamentos, escolha o melhor, preencha o pagamento e envie para a diretoria.</p>
    <div id="c-cotar"></div>`

  $('#c-cotar').innerHTML = (data || []).map(s => {
    const r = porSol[s.id]
    return `<div class="cartao-sol">
      <div class="linha1">
        <span class="titulo">${esc(s.produto_servico)}</span>
        ${s.urgencia === 'URGENTE_4H' ? '<span class="urgente">● urgente</span>' : ''}
        ${r ? `<span class="chip">${r.n} orçamento${r.n > 1 ? 's' : ''}</span>` : ''}
        <div class="botoes">
          <button class="btn-secundario mini" data-ficha="${s.id}">ficha</button>
          <button class="btn mini" data-cotar="${s.id}">cotar</button>
        </div>
      </div>
      <div class="meta">
        ${esc(s.solicitante?.nome ?? '—')} ${s.setor?.nome ? '· ' + esc(s.setor.nome) : ''}
        · ${fmtQuando(s.data_solicitacao) ?? '—'}
        ${s.valor_estimado ? `· estimado R$ ${fmtNum(s.valor_estimado)}` : ''}
        ${r?.menor != null ? `· menor cotação R$ ${fmtNum(r.menor)}` : ''}
      </div>
    </div>`
  }).join('') || `<p class="vazio">Nada aguardando cotação.</p>`

  $('#c-cotar').querySelectorAll('[data-ficha]').forEach(b => {
    b.onclick = () => { abrirFicha(data.find(x => x.id === b.dataset.ficha), false).catch(e => console.error(e)) }
  })
  $('#c-cotar').querySelectorAll('[data-cotar]').forEach(b => {
    b.onclick = () => telaCotacao(data.find(x => x.id === b.dataset.cotar))
  })
}

// ----- Tela de cotação de uma solicitação -----
async function telaCotacao (s) {
  if (!s) return

  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = `<div class="modal"><p class="texto-dim2">carregando orçamentos...</p></div>`
  document.body.appendChild(fundo)
  const fechar = () => fundo.remove()
  fundo.onclick = e => { if (e.target === fundo) fechar() }

  const recarregar = async () => {
    const { data: orcs } = await db.from('orcamento')
      .select('id,valor,prazo_entrega,forma_pagamento,condicao_pagamento,link_proposta,observacoes,escolhido,fornecedor_avulso,fornecedor:fornecedor_id(nome)')
      .eq('solicitacao_id', s.id).order('valor')
    desenhar(orcs || [])
  }

  const desenhar = orcs => {
    const menor = orcs.length ? Math.min(...orcs.map(o => Number(o.valor))) : null
    const escolhido = orcs.find(o => o.escolhido)

    fundo.innerHTML = `
      <div class="modal" style="max-width:860px;">
        <div class="cabeca-secao">
          <h3>Cotação — ${esc(s.produto_servico)}</h3>
          <span class="texto-dim2" style="font-size:12px;">
            ${s.quantidade ? esc(s.quantidade) + ' ' + esc(s.unidade ?? '') : ''}
            ${s.valor_estimado ? '· estimado R$ ' + fmtNum(s.valor_estimado) : ''}</span>
        </div>

        <div class="panel" style="padding:0;margin-bottom:16px;">
          <table><thead><tr>
            <th></th><th>Fornecedor</th><th class="num">Valor</th>
            <th>Prazo</th><th>Pagamento</th><th></th>
          </tr></thead><tbody>
            ${orcs.map(o => `<tr>
              <td><input type="radio" name="escolha" data-escolher="${o.id}" ${o.escolhido ? 'checked' : ''}></td>
              <td>${esc(o.fornecedor?.nome || o.fornecedor_avulso || '—')}
                ${o.link_proposta ? `<br><a class="anexo-link" href="${esc(o.link_proposta)}" target="_blank" rel="noopener">proposta</a>` : ''}</td>
              <td class="num ${Number(o.valor) === menor ? 'badge-bom' : ''}">R$ ${fmtNum(o.valor)}</td>
              <td>${esc(o.prazo_entrega ?? '—')}</td>
              <td>${esc([o.forma_pagamento, o.condicao_pagamento].filter(Boolean).join(' · ') || '—')}</td>
              <td style="text-align:right;">
                <button class="btn-secundario mini" data-apagar="${o.id}">remover</button></td>
            </tr>`).join('') || `<tr><td colspan="6" class="vazio">
              Nenhum orçamento lançado. Adicione ao menos um abaixo.</td></tr>`}
          </tbody></table>
        </div>

        <div class="secao">
          <h3 style="font-size:15px;">Novo orçamento</h3>
          <div class="form-grade">
            <div class="campo"><label>Fornecedor</label>
              <select id="o-forn"><option value="">— digitar abaixo —</option>
                ${COMPRAS_CACHE.fornecedores.map(f =>
                  `<option value="${f.id}">${esc(f.nome)}</option>`).join('')}</select></div>
            <div class="campo"><label>ou nome do fornecedor</label><input id="o-avulso"></div>
            <div class="campo"><label>Valor (R$) *</label><input id="o-valor" inputmode="decimal" placeholder="1.250,00"></div>
            <div class="campo"><label>Prazo de entrega</label><input id="o-prazo" placeholder="5 dias úteis"></div>
            <div class="campo"><label>Forma de pagamento</label><input id="o-forma" placeholder="boleto, PIX, cartão"></div>
            <div class="campo"><label>Condição</label><input id="o-cond" placeholder="à vista, 30/60"></div>
            <div class="campo"><label>Link da proposta</label><input id="o-link" placeholder="https://..."></div>
          </div>
          <div class="acoes"><button class="btn mini" id="o-add">Adicionar orçamento</button></div>
        </div>

        <div class="secao">
          <h3 style="font-size:15px;">Pagamento e envio</h3>
          <div class="form-grade">
            <div class="campo"><label>Parcelas</label>
              <input id="p-parcelas" type="number" min="1" value="${s.parcelas ?? 1}"></div>
            <div class="campo"><label>Vencimento</label>
              <input id="p-venc" type="date" value="${s.vencimento ?? ''}"></div>
          </div>
          <div class="campo" style="margin-top:10px;"><label>Dados de pagamento</label>
            <textarea id="p-dados" style="min-height:64px;"
              placeholder="PIX, dados bancários ou instruções">${esc(s.dados_pagamento ?? '')}</textarea></div>
          <div class="campo" style="margin-top:10px;"><label>Onde achou mais barato</label>
            <input id="p-onde" value="${esc(s.onde_mais_barato ?? '')}"
              placeholder="loja, site ou representante"></div>
          <div class="campo" style="margin-top:10px;"><label>Observação do compras</label>
            <textarea id="p-obs" style="min-height:56px;">${esc(s.observacao_compras ?? '')}</textarea></div>
          <div class="campo" style="margin-top:10px;"><label>Por que este orçamento *</label>
            <textarea id="p-parecer" style="min-height:64px;"
              placeholder="Menor preço, prazo melhor, único fornecedor homologado...">${esc(s.parecer_cotacao ?? '')}</textarea></div>
        </div>

        <div class="acoes">
          <button class="btn" id="c-enviar">Enviar para aprovação</button>
          <button class="btn-secundario" id="c-pdf">PDF dos orçamentos</button>
          <button class="btn-secundario" id="c-fechar">Fechar</button>
        </div>
        <div class="recado oculto" id="c-recado"></div>
      </div>`

    const q = id => fundo.querySelector(id)
    const aviso = (t, alerta = true) => {
      const el = q('#c-recado'); el.textContent = t; el.classList.remove('oculto')
      el.style.borderColor = alerta ? 'var(--warn-text)' : 'var(--line2)'
      el.style.color = alerta ? 'var(--warn-text)' : 'var(--dim)'
    }

    q('#c-fechar').onclick = fechar

    // marcar o escolhido
    fundo.querySelectorAll('[data-escolher]').forEach(r => {
      r.onchange = async () => {
        await db.from('orcamento').update({ escolhido: false }).eq('solicitacao_id', s.id)
        await db.from('orcamento').update({ escolhido: true }).eq('id', r.dataset.escolher)
        recarregar()
      }
    })

    fundo.querySelectorAll('[data-apagar]').forEach(b => {
      b.onclick = async () => {
        await db.from('orcamento').delete().eq('id', b.dataset.apagar)
        recarregar()
      }
    })

    q('#o-add').onclick = async () => {
      const valor = numeroBR(q('#o-valor').value)
      if (valor === null) { aviso('Informe o valor do orçamento.'); return }
      if (!q('#o-forn').value && !q('#o-avulso').value.trim()) {
        aviso('Escolha um fornecedor cadastrado ou digite o nome.'); return }

      const { error } = await db.from('orcamento').insert({
        solicitacao_id: s.id,
        fornecedor_id: q('#o-forn').value || null,
        fornecedor_avulso: q('#o-avulso').value.trim() || null,
        valor,
        prazo_entrega: q('#o-prazo').value.trim() || null,
        forma_pagamento: q('#o-forma').value.trim() || null,
        condicao_pagamento: q('#o-cond').value.trim() || null,
        link_proposta: q('#o-link').value.trim() || null,
        criado_por_id: PERFIL.pessoaId
      })
      if (error) { aviso(error.message); return }
      recarregar()
    }

    q('#c-pdf').onclick = () => pdfOrcamentos(s, orcs)

    q('#c-enviar').onclick = async () => {
      if (!orcs.length) { aviso('Lance ao menos um orçamento antes de enviar.'); return }
      if (!escolhido) { aviso('Marque qual orçamento foi escolhido.'); return }
      const parecer = q('#p-parecer').value.trim()
      if (!parecer) { aviso('Escreva por que escolheu este orçamento.'); return }

      const { error } = await db.from('solicitacao_compra').update({
        status: 'AGUARDANDO_APROVACAO',
        analista_id: PERFIL.pessoaId,
        cotado_em: new Date().toISOString(),
        parecer_cotacao: parecer,
        onde_mais_barato: q('#p-onde').value.trim() || null,
        observacao_compras: q('#p-obs').value.trim() || null,
        orcamento_escolhido_id: escolhido.id,
        forma_pagamento: escolhido.forma_pagamento ?? null,
        condicao_pagamento: escolhido.condicao_pagamento ?? null,
        parcelas: Number(q('#p-parcelas').value) || null,
        vencimento: q('#p-venc').value || null,
        dados_pagamento: q('#p-dados').value.trim() || null,
        fornecedor_id: escolhido.fornecedor?.nome
          ? COMPRAS_CACHE.fornecedores.find(f => f.nome === escolhido.fornecedor.nome)?.id ?? null
          : null
      }).eq('id', s.id)

      if (error) { aviso(error.message); return }
      fechar()
      abrirCompras('cotar', true)
    }
  }

  recarregar()
}

// converte "1.250,50" e "80.5" para número
function numeroBR (raw) {
  let b = String(raw ?? '').trim()
  if (!b) return null
  if (b.includes(',')) b = b.replace(/\./g, '').replace(',', '.')
  else if (/^\d{1,3}(\.\d{3})+$/.test(b)) b = b.replace(/\./g, '')
  const n = Number(b)
  return Number.isNaN(n) ? null : n
}

// ----- PDF: quadro comparativo dos orçamentos -----
function pdfOrcamentos (s, orcs) {
  const menor = orcs.length ? Math.min(...orcs.map(o => Number(o.valor))) : null
  const nomeForn = o => o?.fornecedor?.nome || o?.fornecedor_avulso || null
  const escolhido = orcs.find(o => o.escolhido)

  const corpo = `
    <div class="doc-linha">
      ${docBloco('Solicitação',
        docLinha('Nº', s.numero) +
        docLinha('Produto ou serviço', s.produto_servico) +
        docLinha('Quantidade', s.quantidade ? `${s.quantidade} ${s.unidade ?? ''}` : null))}
      ${docBloco('Origem',
        docLinha('Solicitante', s.solicitante?.nome) +
        docLinha('Setor', s.setor?.nome) +
        docLinha('Data', fmtQuando(s.data_solicitacao)))}
      ${docBloco('Cotação',
        docLinha('Levantado por', PERFIL.nome) +
        docLinha('Em', fmtQuando(new Date().toISOString())) +
        docLinha('Orçamentos', String(orcs.length)))}
    </div>

    ${docBloco('Orçamentos levantados', `
      <table><thead><tr>
        <th>Fornecedor</th><th class="num">Valor</th><th>Prazo</th><th>Pagamento</th><th></th>
      </tr></thead><tbody>
        ${orcs.map(o => `<tr>
          <td>${esc(nomeForn(o) ?? '—')}</td>
          <td class="num">R$ ${fmtNum(o.valor)}</td>
          <td>${esc(o.prazo_entrega ?? '—')}</td>
          <td>${esc([o.forma_pagamento, o.condicao_pagamento].filter(Boolean).join(' · ') || '—')}</td>
          <td>${o.escolhido ? '<b>escolhido</b>' : (Number(o.valor) === menor ? 'menor preço' : '')}</td>
        </tr>`).join('') || '<tr><td colspan="5">Nenhum orçamento lançado.</td></tr>'}
      </tbody></table>
      ${docValor('Menor preço', 'melhor condição encontrada', menor)}
      ${docValor('Escolhido', nomeForn(escolhido) ?? 'ainda não definido', escolhido?.valor, true)}`)}

    ${s.parecer_cotacao ? docTexto('Por que este orçamento', s.parecer_cotacao) : ''}
    ${s.onde_mais_barato ? docTexto('Onde achou mais barato', s.onde_mais_barato) : ''}

    ${docAssinaturas([['Levantado por', PERFIL.nome],
                      ['Conferido por', ''],
                      ['Aprovação', s.aprovador?.nome]])}`

  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = documentoPDF({
    titulo: 'QUADRO COMPARATIVO DE ORÇAMENTOS',
    subtitulo: 'cotação de compras',
    corpo,
    acoes: `<button class="btn" id="pq-imprimir">Gerar PDF</button>
      <button class="btn-secundario" id="pq-fechar">Fechar</button>`
  })
  document.body.appendChild(fundo)
  fundo.querySelector('#pq-fechar').onclick = () => fundo.remove()
  fundo.querySelector('#pq-imprimir').onclick = () => window.print()
  fundo.onclick = e => { if (e.target === fundo) fundo.remove() }
}

// ----- Decisão, sempre com parecer escrito -----
function telaDecisao (s, nomeEtapa) {
  if (!s) return
  const etapa = ETAPAS[nomeEtapa]

  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = `
    <div class="modal">
      <h3>${nomeEtapa === 'coordenacao' ? 'Coordenação' : 'Aprovação'} da solicitação</h3>
      <div class="ficha" style="margin-bottom:16px;">
        <div class="item"><div class="rot">Produto ou serviço</div>
          <div class="val">${esc(s.produto_servico)}</div></div>
        <div class="item"><div class="rot">Solicitante</div>
          <div class="val">${esc(s.solicitante?.nome ?? '—')}</div></div>
        <div class="item"><div class="rot">Valor estimado</div>
          <div class="val">${s.valor_estimado ? 'R$ ' + fmtNum(s.valor_estimado) : '—'}</div></div>
        <div class="item"><div class="rot">Urgência</div>
          <div class="val">${esc(URGENCIA[s.urgencia] ?? '—')}</div></div>
      </div>

      ${s.justificativa ? `<div class="secao">
        <div class="rot texto-dim2" style="font-size:10.5px;text-transform:uppercase;">Justificativa do solicitante</div>
        <p style="margin:4px 0 0;font-size:13.5px;">${esc(s.justificativa)}</p></div>` : ''}

      ${s.parecer_coordenacao ? `<div class="secao">
        <div class="rot texto-dim2" style="font-size:10.5px;text-transform:uppercase;">Justificativa da coordenação</div>
        <p style="margin:4px 0 0;font-size:13.5px;">${esc(s.parecer_coordenacao)}</p></div>` : ''}

      ${s.parecer_cotacao ? `<div class="secao">
        <div class="rot texto-dim2" style="font-size:10.5px;text-transform:uppercase;">Cotação — ${esc(s.analista?.nome ?? '')}</div>
        <p style="margin:4px 0 0;font-size:13.5px;">${esc(s.parecer_cotacao)}</p></div>` : ''}

      <div id="d-orcamentos"></div>

      ${nomeEtapa === 'aprovacao' ? `<div class="campo" style="margin-bottom:10px;">
        <label>Valor aprovado (R$)</label>
        <input id="d-valor" inputmode="decimal" value="${s.valor_aprovado ?? ''}"
          placeholder="deixe vazio para usar o valor cotado"></div>` : ''}
      <div class="campo"><label>${etapa.rotuloParecer} *</label>
        <textarea id="d-parecer" placeholder="Por que está ${nomeEtapa === 'coordenacao' ? 'encaminhando ou devolvendo' : 'aprovando ou reprovando'}"></textarea></div>

      <div class="acoes">
        <button class="btn" id="d-avancar">${etapa.avancar.rotulo}</button>
        <button class="btn-secundario" id="d-recusar">${etapa.recusar.rotulo}</button>
        <button class="btn-secundario" id="d-cancelar">Cancelar</button>
      </div>
      <div class="recado oculto" id="d-recado"></div>
      <p class="aviso">${etapa.explica}</p>
    </div>`

  document.body.appendChild(fundo)
  const q = id => fundo.querySelector(id)
  const fechar = () => fundo.remove()
  q('#d-cancelar').onclick = fechar
  fundo.onclick = e => { if (e.target === fundo) fechar() }

  const aviso = t => {
    const el = q('#d-recado'); el.textContent = t; el.classList.remove('oculto')
    el.style.borderColor = 'var(--warn-text)'; el.style.color = 'var(--warn-text)'
  }

  const decidir = async novoStatus => {
    const parecer = q('#d-parecer').value.trim()
    if (!parecer) { aviso('Escreva o parecer antes de decidir.'); return }

    const corpo = { status: novoStatus }
    corpo[etapa.campoParecer] = parecer
    if (nomeEtapa === 'aprovacao' && novoStatus === 'APROVADA') {
      const va = numeroBR(q('#d-valor')?.value)
      if (va !== null) corpo.valor_aprovado = va
    }
    corpo[etapa.campoData] = new Date().toISOString()
    corpo[etapa.campoPessoa] = PERFIL.pessoaId

    const { error } = await db.from('solicitacao_compra').update(corpo).eq('id', s.id)
    if (error) { aviso(error.message); return }
    fechar()
    abrirCompras(nomeEtapa === 'coordenacao' ? 'coordenar' : 'aprovar', true)
  }

  q('#d-avancar').onclick = () => decidir(etapa.avancar.status)
  q('#d-recusar').onclick = () => decidir(etapa.recusar.status)

  // na aprovação, mostra o quadro de orçamentos abaixo do parecer da cotação
  if (nomeEtapa === 'aprovacao') {
    db.from('orcamento')
      .select('valor,prazo_entrega,forma_pagamento,condicao_pagamento,escolhido,fornecedor_avulso,fornecedor:fornecedor_id(nome)')

        const menor = Math.min(...orcs.map(o => Number(o.valor)))
        q('#d-orcamentos').innerHTML = `
          <div class="secao">
            <div class="rot texto-dim2" style="font-size:10.5px;text-transform:uppercase;">Orçamentos levantados</div>
            <table style="margin-top:6px;"><thead><tr>
              <th>Fornecedor</th><th class="num">Valor</th><th>Prazo</th><th>Pagamento</th><th></th>
            </tr></thead><tbody>
              ${orcs.map(o => `<tr>
                <td>${esc(o.fornecedor?.nome || o.fornecedor_avulso || '—')}</td>
                <td class="num ${Number(o.valor) === menor ? 'badge-bom' : ''}">R$ ${fmtNum(o.valor)}</td>
                <td>${esc(o.prazo_entrega ?? '—')}</td>
                <td>${esc([o.forma_pagamento, o.condicao_pagamento].filter(Boolean).join(' · ') || '—')}</td>
                <td>${o.escolhido ? '<span class="status aprovada">escolhido</span>' : ''}</td>
              </tr>`).join('')}
            </tbody></table>
            ${s.dados_pagamento || s.vencimento || s.parcelas ? `
              <p class="aviso" style="margin-top:8px;">
                ${s.parcelas ? s.parcelas + 'x · ' : ''}
                ${s.vencimento ? 'vence ' + fmtData(s.vencimento) + ' · ' : ''}
                ${esc(s.dados_pagamento ?? '')}</p>` : ''}
          </div>`
      })
  }
}

async function comprasFornecedores (alvo, editavel) {
  const { data, error } = await db.from('fornecedor')
    .select('id,nome,cnpj_cpf,contato,status,criado_em,criado:criado_por(nome)').order('nome')
  if (error) { alvo.innerHTML = `<p class="vazio">${esc(error.message)}</p>`; return }

  alvo.innerHTML = `
    ${editavel ? `<div class="secao panel" style="padding:20px;">
      <h3>Novo fornecedor</h3>
      <div class="form-grade">
        <div class="campo"><label>Nome *</label><input id="fo-nome"></div>
        <div class="campo"><label>CNPJ ou CPF</label><input id="fo-doc"></div>
        <div class="campo"><label>Contato</label><input id="fo-contato" placeholder="telefone ou e-mail"></div>
      </div>
      <div class="acoes"><button class="btn" id="fo-salvar">Adicionar</button></div>
      <div class="recado oculto" id="fo-recado"></div>
    </div>` : ''}

    <div class="panel" style="padding:0;"><div class="tabela-scroll">
      <table><thead><tr><th>Nome</th><th>CNPJ / CPF</th><th>Contato</th>
        <th>Cadastrado por</th><th>Situação</th></tr></thead>
      <tbody>${(data || []).map(f => `<tr>
        <td>${esc(f.nome)}</td>
        <td class="texto-dim">${esc(f.cnpj_cpf ?? '—')}</td>
        <td>${esc(f.contato ?? '—')}</td>
        <td class="texto-dim2">${esc(f.criado?.nome ?? '—')}
          ${f.criado_em ? '<br>' + fmtQuando(f.criado_em) : ''}</td>
        <td><span class="chip">${esc(f.status)}</span></td>
      </tr>`).join('') || `<tr><td colspan="5" class="vazio">Nenhum fornecedor cadastrado.</td></tr>`}
      </tbody></table>
    </div></div>`

  if (!editavel) return

  $('#fo-salvar').onclick = async () => {
    const nome = $('#fo-nome').value.trim()
    const el = $('#fo-recado')
    if (!nome) {
      el.textContent = 'Escreva o nome do fornecedor.'; el.classList.remove('oculto')
      el.style.borderColor = 'var(--warn-text)'; el.style.color = 'var(--warn-text)'
      return
    }
    const { error } = await db.from('fornecedor').insert({
      nome,
      cnpj_cpf: $('#fo-doc').value.trim() || null,
      contato: $('#fo-contato').value.trim() || null,
      criado_por: PERFIL.pessoaId
    })
    if (error) {
      el.textContent = error.message; el.classList.remove('oculto')
      el.style.borderColor = 'var(--warn-text)'; el.style.color = 'var(--warn-text)'
      return
    }
    abrirCompras('fornecedores', true)
  }
}
