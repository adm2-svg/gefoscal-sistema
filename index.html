    </div>`

  document.body.appendChild(fundo)
  const q = id => fundo.querySelector(id)
  const fechar = () => fundo.remove()
  q('#dc-cancelar').onclick = fechar
  fundo.onclick = e => { if (e.target === fundo) fechar() }

  const aviso = t => {
    const el = q('#dc-recado'); el.textContent = t; el.classList.remove('oculto')
    el.style.borderColor = 'var(--warn-text)'; el.style.color = 'var(--warn-text)'
  }

  q('#dc-salvar').onclick = async () => {
    const desc = q('#dc-desc').value.trim()
    if (!desc) { aviso('Escreva a descrição.'); return }

    const btn = q('#dc-salvar'); btn.disabled = true; btn.textContent = 'Salvando...'
    try {
      const arq = await enviarArquivo(q('#dc-arquivo').files[0], mes)
      const { error } = await db.from('documento_pagamento').insert({
        tipo: q('#dc-tipo').value,
        descricao: desc,
        valor: numeroBR(q('#dc-valor').value),
        vencimento: q('#dc-venc').value || null,
        pago_em: q('#dc-pago').value || null,
        competencia: mes,
        arquivo_caminho: arq?.caminho ?? null,
        arquivo_nome: arq?.nome ?? null,
        criado_por: PERFIL.pessoaId,
        ...vinculo
      })
      if (error) throw new Error(error.message)
      fechar(); abrirFinanceiro('fechamento', true)
    } catch (e) {
      aviso(String(e.message ?? e))
      btn.disabled = false; btn.textContent = 'Salvar'
    }
  }
}

// ----- Capa imprimível do fechamento -----
function capaFechamento (mes, lista, completos, soBoleto, soComprovante) {
  const soma = t => lista.filter(d => d.tipo === t)
    .reduce((s, d) => s + Number(d.valor || 0), 0)

  const corpo = `
    <div class="doc-linha">
      ${docBloco('Competência',
        docLinha('Mês', mes) +
        docLinha('Gerado em', fmtQuando(new Date().toISOString())) +
        docLinha('Responsável', PERFIL.nome))}
      ${docBloco('Documentos',
        docLinha('Boletos', String(lista.filter(d => d.tipo === 'BOLETO').length)) +
        docLinha('Comprovantes', String(lista.filter(d => d.tipo === 'COMPROVANTE').length)) +
        docLinha('Notas fiscais', String(lista.filter(d => d.tipo === 'NOTA').length)))}
      ${docBloco('Conferência',
        docLinha('Pares completos', String(completos.length)) +
        docLinha('Sem comprovante', String(soBoleto.length)) +
        docLinha('Sem boleto', String(soComprovante.length)))}
    </div>

    ${docBloco('Relação de documentos', `
      <table><thead><tr>
        <th>Tipo</th><th>Referente a</th><th>Vencimento</th><th>Pago em</th><th class="num">Valor</th>
      </tr></thead><tbody>
        ${lista.map(d => `<tr>
          <td>${esc(d.tipo.toLowerCase())}</td>
          <td>${esc(d.descricao || d.lancamento?.descricao || '—')}</td>
          <td>${d.vencimento ? fmtData(d.vencimento) : '—'}</td>
          <td>${d.pago_em ? fmtData(d.pago_em) : '—'}</td>
          <td class="num">${d.valor ? 'R$ ' + fmtNum(d.valor) : '—'}</td>
        </tr>`).join('')}
      </tbody></table>
      ${docValor('Total comprovado', 'soma dos comprovantes do mês', soma('COMPROVANTE'), true)}`)}

    ${(soBoleto.length || soComprovante.length)
      ? docTexto('Pendências',
          [...soBoleto.map(([k, v]) => 'sem comprovante: ' + (v.boleto.descricao || k)),
           ...soComprovante.map(([k, v]) => 'sem boleto: ' + (v.comprovante.descricao || k))].join('\n'))
      : ''}

    ${docAssinaturas([['Conferido por', PERFIL.nome], ['Financeiro', ''], ['Contabilidade', '']])}`

  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = documentoPDF({
    titulo: 'FECHAMENTO MENSAL',
    subtitulo: 'documentos para a contabilidade · ' + mes,
    corpo,
    acoes: `<button class="btn" id="cf-imprimir">Gerar PDF</button>
      <button class="btn-secundario" id="cf-fechar">Fechar</button>`
  })
  document.body.appendChild(fundo)
  fundo.querySelector('#cf-fechar').onclick = () => fundo.remove()
  fundo.querySelector('#cf-imprimir').onclick = () => window.print()
  fundo.onclick = e => { if (e.target === fundo) fundo.remove() }
}

// ----- Financeiro › Categorias, centros e preços -----
async function finCadastros (alvo, editavel) {
  const { data: precos } = await db.from('preco_venda')
    .select('id,preco,vigente_de,produto:produto_id(nome),cliente:cliente_id(razao_social)')
    .order('vigente_de', { ascending: false })
  const { data: produtos } = await db.from('produto').select('id,nome').order('nome')
  const { data: titulos } = await db.from('titulo_externo')
    .select('id,tipo,situacao,vencimento,valor').order('vencimento', { ascending: false }).limit(500)

  const abertos = (titulos || []).filter(t => t.situacao === 'ABERTO')
  const ultimo = (titulos || [])[0]

  const bloco = (titulo, itens, extra = i => '') => `
    <div class="panel" style="padding:18px;">
      <h3>${titulo}</h3>
      <table><tbody>${itens.map(i => `<tr>
        <td>${esc(i.nome)}</td><td style="text-align:right;">${extra(i)}</td>
      </tr>`).join('') || `<tr><td class="vazio">Nada cadastrado.</td></tr>`}</tbody></table>
    </div>`

  alvo.innerHTML = `
    ${editavel ? `<div class="panel" style="padding:20px;margin-bottom:18px;">
      <div class="cabeca-secao">
        <h3>Importar contas a pagar e receber</h3>
        <span class="texto-dim2" style="font-size:12px;">
          ${abertos.length} título(s) em aberto${ultimo ? ' · último até ' + fmtData(ultimo.vencimento) : ''}</span>
      </div>
      <p class="aviso" style="margin-top:0;">
        Cole o relatório do sistema contábil, uma linha por título, separado por ponto e vírgula
        ou por tabulação (copiar do Excel já funciona). Ordem das colunas:
        <b>tipo; documento; parceiro; vencimento; valor</b> — tipo é P para pagar ou R para receber,
        vencimento em dd/mm/aaaa. Linhas repetidas são ignoradas.</p>
      <textarea id="ti-dados" style="min-height:150px;"
        placeholder="P;NF 1234;Fornecedor X;15/08/2026;1.250,00&#10;R;NF 5678;Cliente Y;20/08/2026;8.400,00"></textarea>
      <div class="acoes">
        <button class="btn" id="ti-importar">Importar</button>
        <button class="btn-secundario" id="ti-conferir">Só conferir</button>
      </div>
      <div class="recado oculto" id="ti-recado"></div>
    </div>` : ''}

    <div class="duas-colunas" style="margin-bottom:18px;">
      ${bloco('Categorias', FIN_CACHE.categorias,
        c => `<span class="chip">${esc(c.tipo)}</span>`)}
      ${bloco('Centros de custo', FIN_CACHE.centros)}
    </div>

    <div class="panel" style="padding:20px;">
      <div class="cabeca-secao">
        <h3>Preços de venda</h3>
        <span class="texto-dim2" style="font-size:12px;">usados para sugerir o valor da NF</span>
      </div>
      ${editavel ? `<div class="form-grade" style="margin-bottom:12px;">
        <div class="campo"><label>Produto</label>
          <select id="preco-produto">${(produtos || []).map(p =>
            `<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select></div>
        <div class="campo"><label>Preço por tonelada (R$)</label>
          <input id="preco-valor" inputmode="decimal" placeholder="1.250,00"></div>
        <div class="campo"><label>Vigente a partir de</label>
          <input type="date" id="preco-data" value="${new Date().toISOString().slice(0, 10)}"></div>
      </div>
      <div class="acoes" style="margin-top:0;">
        <button class="btn" id="preco-salvar">Adicionar preço</button></div>
      <div class="recado oculto" id="preco-recado"></div>` : ''}

      <table style="margin-top:14px;"><thead><tr>
        <th>Produto</th><th>Cliente</th><th class="num">Preço/t</th><th>Vigente de</th>
      </tr></thead><tbody>
        ${(precos || []).map(p => `<tr>
          <td>${esc(p.produto?.nome ?? '—')}</td>
          <td class="texto-dim">${esc(p.cliente?.razao_social ?? 'todos')}</td>
          <td class="num">R$ ${fmtNum(p.preco)}</td>
          <td>${fmtData(p.vigente_de)}</td>
        </tr>`).join('') || `<tr><td colspan="4" class="vazio">
          Nenhum preço cadastrado — por isso o faturamento pede o valor a cada NF.</td></tr>`}
      </tbody></table>
    </div>`

  if (!editavel) return

  // ---- importação do relatório contábil ----
  const lerLinhas = texto => {
    const erros = []
    const linhas = texto.split('\n').map(l => l.trim()).filter(Boolean)
    const titulos = []
    linhas.forEach((l, i) => {
      const c = l.split(/;|\t/).map(x => x.trim())
      if (c.length < 5) { erros.push(`linha ${i + 1}: só ${c.length} coluna(s)`); return }
      const [tipoBruto, documento, parceiro, vencBruto, valorBruto] = c
      const tipo = /^p/i.test(tipoBruto) ? 'PAGAR' : /^r/i.test(tipoBruto) ? 'RECEBER' : null
      if (!tipo) { erros.push(`linha ${i + 1}: tipo "${tipoBruto}" não é P nem R`); return }

      const d = vencBruto.match(/^(\d{2})\/(\d{2})\/(\d{4})$/)
      let venc = d ? `${d[3]}-${d[2]}-${d[1]}`
                   : (/^\d{4}-\d{2}-\d{2}$/.test(vencBruto) ? vencBruto : null)
      // o formato bater não garante que a data existe: 31/13 e 31/02 passariam
      if (venc) {
        const [a, m, dia] = venc.split('-').map(Number)
        const t = new Date(Date.UTC(a, m - 1, dia))
        if (t.getUTCFullYear() !== a || t.getUTCMonth() !== m - 1 || t.getUTCDate() !== dia) venc = null
      }
      if (!venc) { erros.push(`linha ${i + 1}: data "${vencBruto}" inválida`); return }

      const valor = numeroBR(valorBruto)
      if (valor === null || valor <= 0) { erros.push(`linha ${i + 1}: valor "${valorBruto}" inválido`); return }

      titulos.push({
        tipo, documento: documento || null, parceiro: parceiro || null,
        vencimento: venc, valor, competencia: venc.slice(0, 7),
        origem: 'importação manual', importado_por: PERFIL.pessoaId
      })
    })
    return { titulos, erros }
  }

  const dizer = (t, alerta = false) => {
    const el = $('#ti-recado'); el.innerHTML = t; el.classList.remove('oculto')
    el.style.borderColor = alerta ? 'var(--warn-text)' : 'var(--line2)'
    el.style.color = alerta ? 'var(--warn-text)' : 'var(--dim)'
  }

  const resumir = ({ titulos, erros }) => {
    const pagar = titulos.filter(t => t.tipo === 'PAGAR')
    const receber = titulos.filter(t => t.tipo === 'RECEBER')
    const soma = l => l.reduce((s, t) => s + t.valor, 0)
    return `<b>${titulos.length}</b> título(s) lido(s): `
      + `${pagar.length} a pagar (R$ ${fmtNum(soma(pagar))}), `
      + `${receber.length} a receber (R$ ${fmtNum(soma(receber))}).`
      + (erros.length ? `<br><b>${erros.length} linha(s) ignorada(s):</b><br>`
          + erros.slice(0, 6).map(esc).join('<br>')
          + (erros.length > 6 ? `<br>e mais ${erros.length - 6}...` : '') : '')
  }

  $('#ti-conferir').onclick = () => {
    const r = lerLinhas($('#ti-dados').value)
    if (!r.titulos.length && !r.erros.length) { dizer('Cole o relatório antes.', true); return }
    dizer(resumir(r) + '<br>Nada foi gravado ainda.', r.erros.length > 0)
  }

  $('#ti-importar').onclick = async () => {
    const r = lerLinhas($('#ti-dados').value)
    if (!r.titulos.length) { dizer('Nenhuma linha válida para importar.<br>' + resumir(r), true); return }

    const btn = $('#ti-importar'); btn.disabled = true; btn.textContent = 'Importando...'
    // ignora o que já existe, em vez de duplicar ou falhar tudo
    const { error, count } = await db.from('titulo_externo')
      .upsert(r.titulos, { onConflict: 'tipo,documento,parceiro,vencimento,valor',
                           ignoreDuplicates: true, count: 'exact' })
    btn.disabled = false; btn.textContent = 'Importar'

    if (error) { dizer('Não deu para importar: ' + esc(error.message), true); return }
    dizer(resumir(r) + `<br><b>${count ?? r.titulos.length} novo(s)</b> gravado(s); repetidos foram ignorados.`)
    $('#ti-dados').value = ''
    setTimeout(() => abrirFinanceiro('cadastros', true), 1800)
  }

  $('#preco-salvar').onclick = async () => {
    const el = $('#preco-recado')
    const falhar = t => { el.textContent = t; el.classList.remove('oculto')
      el.style.borderColor = 'var(--warn-text)'; el.style.color = 'var(--warn-text)' }
    const preco = numeroBR($('#preco-valor').value)
    if (preco === null || preco <= 0) { falhar('Informe o preço por tonelada.'); return }

    const { error } = await db.from('preco_venda').insert({
      produto_id: $('#preco-produto').value,
      preco,
      vigente_de: $('#preco-data').value
    })
    if (error) { falhar(error.message); return }
    abrirFinanceiro('cadastros', true)
  }
}

// ===============================================================
// Calculadora 1 — Simulador de barter
// Regra idêntica à do simulador original: juros SIMPLES sobre
// insumo+valorização; três relações de troca sucessivas (bruto,
// líquido de funrural+margem, líquido de taxa de sucesso); cessão
// da trading aplicada POR DENTRO (divide por 1−taxa).
// ===============================================================
const BARTER_PADRAO = { preco:720, ton:3000, valoriz:0, meses:8, dias:249, juros:2,
  grao:121, margem:0, tha:2, prod:65, funrural:1.5, sucesso:0.50, cessao:1 }
let BARTER = Object.assign({}, BARTER_PADRAO)
let BARTER_ON = { funrural:true, sucesso:true, cessao:true }
let BARTER_MODO = 'dia'
let BARTER_PIN = null

function calcularBarter (e) {
  const insumo = e.preco * e.ton
  const base = insumo + e.valoriz
  const jm = e.juros / 100
  const periodos = BARTER_MODO === 'mes' ? e.meses : e.dias / 30
  const jurosPct = jm * periodos                       // juros simples, não compostos
  const jurosRs = base * jurosPct
  const montante = base + jurosRs

  const rel1 = e.grao > 0 ? montante / e.grao : 0
  const impSaca = BARTER_ON.funrural ? e.grao * (e.funrural / 100) : 0
  const precoLiq = e.grao + e.margem - impSaca
  const rel2 = precoLiq > 0 ? montante / precoLiq : 0
  const suc = BARTER_ON.sucesso ? e.sucesso : 0
  const precoLiq2 = precoLiq - suc
  const rel3 = precoLiq2 > 0 ? montante / precoLiq2 : 0

  const valorOp = rel3 * e.grao
  const cess = BARTER_ON.cessao ? e.cessao / 100 : 0
  const valorFinal = cess < 1 ? valorOp / (1 - cess) : valorOp   // cessão "por dentro"
  const paridade = e.grao > 0 ? valorFinal / e.grao : 0
  const porTon = e.ton > 0 ? valorFinal / e.ton : 0
  const custoTotal = insumo > 0 ? valorFinal / insumo - 1 : 0
  const taxaReal = periodos > 0 ? Math.pow(valorFinal / insumo, 1 / periodos) - 1 : 0
  const ha = e.tha > 0 ? e.ton / e.tha : 0
  const scHa = ha > 0 ? paridade / ha : 0

  return { insumo, base, jm, periodos, jurosPct, jurosRs, montante, rel1, impSaca,
    precoLiq, rel2, suc, precoLiq2, rel3, valorOp, cess, valorFinal, paridade,
    porTon, custoTotal, taxaReal, ha, scHa }
}

const rs = v => 'R$ ' + fmtNum(v)
const pc = v => fmtNum(v * 100) + '%'

function calcBarter (alvo) {

        <input id="b-${id}" type="number" step="${passo || '0.01'}" value="${BARTER[id]}" style="flex:1;">
        ${suf ? `<span class="texto-dim2" style="font-size:11px;">${suf}</span>` : ''}
      </div></div>`

  alvo.innerHTML = voltarFerramentas('calculadoras') + `
    <div class="calc-grade">
      <div>
        <div class="secao">
          <div class="cabeca-secao"><h3 style="font-family:var(--serif);font-size:16px;">Insumo</h3>
            <span class="texto-dim2" style="font-size:12px;">o que você entrega</span></div>
          <div class="form-grade">
            ${campo('preco','Preço à vista','R$','/t')}

            ${campo('valoriz','Valorização','R$','')}
          </div>
          <p class="aviso" id="b-auto"></p>

        <div class="secao">
          <div class="cabeca-secao"><h3 style="font-family:var(--serif);font-size:16px;">Prazo e juros</h3>
            <div class="subabas" style="margin:0;border:none;">
              <button id="b-modo-dia" class="${BARTER_MODO === 'dia' ? 'ativo' : ''}">dias</button>
              <button id="b-modo-mes" class="${BARTER_MODO === 'mes' ? 'ativo' : ''}">meses</button>
            </div></div>
          <div class="form-grade">
            ${BARTER_MODO === 'mes' ? campo('meses','Meses de diferença','','meses','1') : campo('dias','Dias de diferença','','dias','1')}
            ${campo('juros','Juros ao mês','','% a.m.')}
          </div>
        </div>

        <div class="secao">
          <div class="cabeca-secao"><h3 style="font-family:var(--serif);font-size:16px;">Grão</h3>
            <span class="texto-dim2" style="font-size:12px;">o que o produtor paga</span></div>
          <div class="form-grade">
            ${campo('grao','Preço bruto do grão','R$','/sc')}
            ${campo('margem','Margem','R$','/sc')}
            ${campo('tha','Aplicação','','t/ha')}
            ${campo('prod','Produtividade','','sc/ha')}
          </div>
          <div class="chaves">
            <label><input type="checkbox" id="b-on-funrural" ${BARTER_ON.funrural ? 'checked' : ''}> Funrural</label>
            <label><input type="checkbox" id="b-on-sucesso" ${BARTER_ON.sucesso ? 'checked' : ''}> Taxa de sucesso</label>
            <label><input type="checkbox" id="b-on-cessao" ${BARTER_ON.cessao ? 'checked' : ''}> Cessão da trading</label>
          </div>
          <div class="form-grade" style="margin-top:10px;">
            ${campo('funrural','Funrural','','%')}
            ${campo('sucesso','Taxa de sucesso','R$','/sc')}
            ${campo('cessao','Cessão da trading','','%')}
          </div>
        </div>

        <div class="secao">
          <div class="cabeca-secao"><h3 style="font-family:var(--serif);font-size:16px;">Memória de cálculo</h3></div>
          <div class="memo" id="b-memo"></div>
        </div>

        <div class="secao">
          <div class="cabeca-secao"><h3 style="font-family:var(--serif);font-size:16px;">Se o grão mudar de preço</h3>
            <span class="texto-dim2" style="font-size:12px;">a paridade em sacas está travada</span></div>
          <div id="b-sens"></div>
          <div class="alerta-caixa" id="b-alerta"></div>
        </div>
      </div>

      <div>
        <div class="saida">
          <div class="rotulo texto-dim2" style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;">Custo por tonelada</div>
          <div class="destaque" id="b-o-ton">—</div>
          <div class="par"><span class="texto-dim">Paridade final</span><span id="b-o-sacas">—</span></div>
          <div class="par"><span class="texto-dim">Valor final da operação</span><span id="b-o-final">—</span></div>
          <div class="par"><span class="texto-dim">Custo total sobre o insumo</span><span id="b-o-custo">—</span></div>
          <div class="par"><span class="texto-dim">Taxa real equivalente</span><span id="b-o-taxa">—</span></div>
          <div class="par"><span class="texto-dim">Diferença por tonelada</span><span id="b-o-delta">—</span></div>
          <div class="par"><span class="texto-dim">Sacas por hectare</span><span id="b-o-scha">—</span></div>
          <div class="par"><span class="texto-dim">% da produtividade</span><span id="b-o-prod">—</span></div>
          <div class="acoes">
            <button class="btn-secundario mini" id="b-fixar">fixar cenário</button>
            <button class="btn-secundario mini" id="b-limpar">restaurar padrão</button>
          </div>
        </div>
        <div class="saida" id="b-fixado" style="margin-top:14px;display:none;"></div>
      </div>
    </div>`

  ligarVoltar('calculadoras')
  const ids = Object.keys(BARTER_PADRAO)
  ids.forEach(id => { const el = $('#b-' + id); if (el) el.oninput = () => { BARTER[id] = Number(el.value) || 0; pintarBarter() } })
  ;['funrural','sucesso','cessao'].forEach(k => {
    $('#b-on-' + k).onchange = e => { BARTER_ON[k] = e.target.checked; pintarBarter() }
  })
  $('#b-modo-dia').onclick = () => { BARTER_MODO = 'dia'; calcBarter(alvo) }
  $('#b-modo-mes').onclick = () => { BARTER_MODO = 'mes'; calcBarter(alvo) }
  $('#b-limpar').onclick = () => { BARTER = Object.assign({}, BARTER_PADRAO); calcBarter(alvo) }
  $('#b-fixar').onclick = () => {
    const r = calcularBarter(BARTER)
    BARTER_PIN = { rotulo: rs(BARTER.grao) + '/sc · ' + rs(BARTER.preco) + '/t', porTon: r.porTon, paridade: r.paridade, custoTotal: r.custoTotal }
    pintarBarter()
  }
  pintarBarter()
}

function pintarBarter () {
  const e = BARTER, r = calcularBarter(e)
  const linha = (n, d, sub, v, cls) => `<div class="memo-linha ${cls || ''}">
    <span class="memo-n">${n}</span><span class="memo-d">${d}${sub ? `<small>${sub}</small>` : ''}</span>
    <span class="memo-v">${v}</span></div>`

  $('#b-auto').textContent = 'preço × quantidade = ' + rs(e.preco * e.ton) +
    (e.valoriz ? ' · mais valorização de ' + rs(e.valoriz) : '')

  $('#b-memo').innerHTML =
    linha('01','Valor do insumo', rs(e.preco) + '/t × ' + fmtNum(e.ton) + ' t' + (e.valoriz ? ' + valorização' : ''), rs(r.base)) +
    linha('02','Juros totais', (BARTER_MODO === 'mes'
        ? fmtNum(r.periodos) + ' meses × ' + pc(r.jm)
        : fmtNum(r.periodos * 30) + ' dias pro rata × ' + pc(r.jm) + ' a.m.') + ' = ' + pc(r.jurosPct), rs(r.jurosRs)) +
    linha('03','Montante total','insumo mais juros', rs(r.montante), 'total') +
    linha('04','Relação de troca 1','montante ÷ preço bruto do grão', fmtNum(r.rel1) + ' sc') +
    linha('05','Funrural sobre a saca', BARTER_ON.funrural ? pc(e.funrural / 100) + ' de ' + rs(e.grao) : 'desligado',
      BARTER_ON.funrural ? '− ' + rs(r.impSaca) : '—', BARTER_ON.funrural ? '' : 'off') +
    linha('06','Preço do grão líquido', e.margem ? 'com margem de ' + rs(e.margem) : 'depois do imposto', rs(r.precoLiq) + '/sc') +
    linha('07','Relação de troca 2','montante ÷ preço líquido', fmtNum(r.rel2) + ' sc') +
    linha('08','Taxa de sucesso', BARTER_ON.sucesso ? 'valor fixo por saca' : 'desligada',
      BARTER_ON.sucesso ? '− ' + rs(r.suc) : '—', BARTER_ON.sucesso ? '' : 'off') +
    linha('09','Relação de troca 3','montante ÷ ' + rs(r.precoLiq2) + '/sc', fmtNum(r.rel3) + ' sc') +
    linha('10','Valor da operação','relação de troca 3 × preço bruto', rs(r.valorOp)) +
    linha('11','Cessão da trading', BARTER_ON.cessao ? pc(r.cess) + ' por dentro' : 'desligada',
      BARTER_ON.cessao ? '+ ' + rs(r.valorFinal - r.valorOp) : '—', BARTER_ON.cessao ? '' : 'off') +
    linha('12','Valor final da operação','o que o produtor paga em grão', rs(r.valorFinal), 'total') +
    linha('13','Paridade final','valor final ÷ preço bruto do grão', fmtNum(r.paridade) + ' sc')

  $('#b-o-ton').textContent = rs(r.porTon)
  $('#b-o-sacas').textContent = fmtNum(r.paridade) + ' sc'
  $('#b-o-final').textContent = rs(r.valorFinal)
  $('#b-o-custo').textContent = pc(r.custoTotal)
  $('#b-o-taxa').textContent = fmtNum(r.taxaReal * 100, 3) + '% a.m.'
  $('#b-o-delta').textContent = (r.porTon >= e.preco ? '+ ' : '− ') + rs(Math.abs(r.porTon - e.preco))
  $('#b-o-scha').textContent = fmtNum(r.scHa) + ' sc/ha'
  $('#b-o-prod').textContent = e.prod > 0 ? pc(r.scHa / e.prod) : '—'

  // sensibilidade: a paridade em sacas fica travada; se o grão sobe, o produtor paga mais
  const base = e.grao, faixas = []
  for (let k = -3; k <= 4; k++) faixas.push(Math.round(base * (1 + k * 0.05) * 100) / 100)
  const entregues = faixas.map(p => r.paridade * p)
  const max = Math.max.apply(null, entregues) || 1
  $('#b-sens').innerHTML = faixas.map((p, i) => `
    <div class="sens-linha ${Math.abs(p - base) < 0.005 ? 'agora' : ''}">
      <span class="p">${rs(p)}</span>
      <span class="barra"><span style="width:${(entregues[i] / max * 100).toFixed(1)}%"></span></span>
      <span class="v">${e.ton > 0 ? rs(entregues[i] / e.ton) : '—'}/t</span></div>`).join('')

  const alto = r.paridade * base * 1.05
  const custoAlto = r.insumo > 0 ? alto / r.insumo - 1 : 0
  $('#b-alerta').innerHTML = `<b>Atenção.</b> A conta do banco mostra ${pc(r.custoTotal)} de custo,
    mas isso só vale se o grão ficar em ${rs(base)}. Se subir 5%, para ${rs(base * 1.05)},
    o custo real do produtor vira ${pc(custoAlto)} e a tonelada equivale a
    ${rs(e.ton > 0 ? alto / e.ton : 0)}.`

  const cx = $('#b-fixado')
  if (!BARTER_PIN) { cx.style.display = 'none'; return }
  cx.style.display = 'block'
  const dif = (agora, antes, suf) => {
    const d = agora - antes
    if (Math.abs(d) < 0.005) return '<span class="texto-dim2">igual</span>'
    return `<span style="color:${d > 0 ? 'var(--warn-text)' : 'var(--good-text)'};">${d > 0 ? '+' : '−'}${fmtNum(Math.abs(d))}${suf || ''}</span>`
  }
  cx.innerHTML = `<div class="cabeca-secao"><h3 style="font-family:var(--serif);font-size:14px;margin:0;">Comparando com ${esc(BARTER_PIN.rotulo)}</h3>
      <button class="btn-secundario mini" id="b-soltar">soltar</button></div>
    <div class="par"><span class="texto-dim">R$/tonelada</span><span>${rs(BARTER_PIN.porTon)} &nbsp; ${dif(r.porTon, BARTER_PIN.porTon)}</span></div>
    <div class="par"><span class="texto-dim">Paridade</span><span>${fmtNum(BARTER_PIN.paridade)} sc &nbsp; ${dif(r.paridade, BARTER_PIN.paridade, ' sc')}</span></div>
    <div class="par"><span class="texto-dim">Custo total</span><span>${pc(BARTER_PIN.custoTotal)} &nbsp; ${dif(r.custoTotal * 100, BARTER_PIN.custoTotal * 100, '%')}</span></div>`
  $('#b-soltar').onclick = () => { BARTER_PIN = null; pintarBarter() }
}

// ===============================================================
// Calculadora 2 — Equiparação borra de enxofre × enxofre elementar
//
// Lógica conferida contra a aba "Resumo" da planilha original:
//   custo de S por t de produto = preço × %S desejado ÷ %S do material
//   preço equivalente 100% S    = preço ÷ %S
//   kg de material por t produto= %S desejado ÷ %S × 1000
//   produto possível por t mat. = %S ÷ %S desejado
//
// A aba "Compras" da planilha estava com as fórmulas deslocadas uma
// coluna à esquerda dos cabeçalhos (F e H ficaram circulares), então
// a avaliação por carga aqui foi reconstruída pelos cabeçalhos.
// ===============================================================
let ENX = { alvo:3, ref99:2700, borra:1800, teores:[99,90,80,70,60] }
let ENX_CARGA = { qtd:0, teor:0, preco:0 }

function calcEnxofre (alvo) {
  const a = ENX.alvo / 100
  const kgS = a * 1000
  const custoRef = ENX.ref99 * a / 0.99

  const linhas = ENX.teores.map(t => {
    const s = t / 100
    const preco = t >= 99 ? ENX.ref99 : ENX.borra
    const custoS = preco * a / s
    return { t, s, preco, pontos: s * 1000, kgPorT: a / s * 1000, custoS,
      equiv: preco / s, dif: custoS - custoRef, possivel: s / a }
  })

  const c = ENX_CARGA
  const cs = c.teor / 100
  const carga = c.qtd > 0 && c.teor > 0 ? {
    valorTotal: c.qtd * c.preco,
    sPuro: c.qtd * cs,
    precoKgS: cs > 0 ? c.preco / (cs * 1000) : 0,
    equiv100: cs > 0 ? c.preco / cs : 0,
    kgPorT: cs > 0 ? a / cs * 1000 : 0,
    custoSporT: cs > 0 ? c.preco * a / cs : 0,
    produtoPossivel: cs > 0 ? c.qtd * cs / a : 0
  } : null

  alvo.innerHTML = voltarFerramentas('calculadoras') + `
    <div class="secao panel" style="padding:18px;">
      <h3>Premissas</h3>
      <div class="form-grade">
        <div class="campo"><label>% de S puro desejado no produto</label>
          <input id="e-alvo" type="number" step="0.1" value="${ENX.alvo}"></div>
        <div class="campo"><label>Preço referência enxofre 99% (R$/t)</label>
          <input id="e-ref" type="number" step="1" value="${ENX.ref99}"></div>
        <div class="campo"><label>Preço da borra ofertada (R$/t)</label>
          <input id="e-borra" type="number" step="1" value="${ENX.borra}"></div>
      </div>
      <p class="aviso">Para formar produto com ${fmtNum(ENX.alvo, 1)}% de S puro, cada tonelada
        precisa de <b>${fmtNum(kgS, 0)} kg de S puro</b>. Quanto menor o teor da borra, mais
        material entra na fórmula para entregar os mesmos pontos de enxofre.</p>
    </div>

    <div class="cabeca-secao"><h3 style="font-family:var(--serif);font-size:16px;">Comparação por teor</h3>
      <span class="texto-dim2" style="font-size:12px;">a decisão é pelo custo de S por tonelada de produto, não pelo preço da tonelada comprada</span></div>
    <div class="panel" style="padding:0;margin-bottom:20px;"><div class="tabela-scroll">
      <table><thead><tr>
        <th>Material</th><th class="num">% S</th><th class="num">Pontos S/t</th>
        <th class="num">Kg por t produto</th><th class="num">Preço R$/t</th>
        <th class="num">Custo S/t produto</th><th class="num">Preço equiv. 100% S</th>
        <th class="num">Dif. vs 99%</th><th class="num">Produto por t material</th>
      </tr></thead><tbody>
      ${linhas.map(l => `<tr>
        <td>${l.t >= 99 ? 'Enxofre elementar 99%' : 'Borra ' + l.t + '%'}</td>
        <td class="num">${fmtNum(l.t, 0)}%</td>
        <td class="num">${fmtNum(l.pontos, 0)}</td>
        <td class="num">${fmtNum(l.kgPorT, 1)}</td>
        <td class="num">${rs(l.preco)}</td>
        <td class="num"><b>${rs(l.custoS)}</b></td>
        <td class="num">${rs(l.equiv)}</td>
        <td class="num ${l.dif > 0 ? 'badge-alerta' : l.dif < 0 ? 'badge-bom' : ''}">${l.dif === 0 ? '—' : (l.dif > 0 ? '+ ' : '− ') + rs(Math.abs(l.dif))}</td>
        <td class="num">${fmtNum(l.possivel, 1)} t</td>
      </tr>`).join('')}
      </tbody></table>
    </div></div>

    <div class="cabeca-secao"><h3 style="font-family:var(--serif);font-size:16px;">Avaliar uma carga ofertada</h3>
      <span class="texto-dim2" style="font-size:12px;">preencha os três campos</span></div>
    <div class="panel" style="padding:18px;">
      <div class="form-grade">
        <div class="campo"><label>Quantidade ofertada (t)</label>
          <input id="e-qtd" type="number" step="0.1" value="${c.qtd || ''}" placeholder="0"></div>
        <div class="campo"><label>% de enxofre da carga</label>
          <input id="e-teor" type="number" step="0.1" value="${c.teor || ''}" placeholder="0"></div>
        <div class="campo"><label>Preço pedido (R$/t)</label>
          <input id="e-preco" type="number" step="1" value="${c.preco || ''}" placeholder="0"></div>
      </div>
      ${carga ? `
      <div class="kpis" style="margin:16px 0 0;">
        ${kpi('Custo S por t de produto', rs(carga.custoSporT),
          carga.custoSporT <= custoRef ? 'melhor que o enxofre 99%' : 'pior que o enxofre 99%')}
        ${kpi('Preço equivalente 100% S', rs(carga.equiv100), 'referência: ' + rs(ENX.ref99 / 0.99))}
        ${kpi('Valor total da carga', rs(carga.valorTotal), fmtNum(carga.sPuro, 2) + ' t de S puro')}
        ${kpi('Produto possível', fmtNum(carga.produtoPossivel, 1) + ' t', 'com esta carga')}
      </div>
      <div class="${carga.custoSporT <= custoRef ? 'recado' : 'alerta-caixa'}" style="margin-top:14px;">
        ${carga.custoSporT <= custoRef
          ? `<b>Vale a pena.</b> O custo de enxofre por tonelada de produto fica em ${rs(carga.custoSporT)},
             contra ${rs(custoRef)} usando enxofre elementar 99% a ${rs(ENX.ref99)}/t —
             economia de ${rs(custoRef - carga.custoSporT)} por tonelada de produto.`
          : `<b>Não compensa neste preço.</b> O custo de enxofre por tonelada de produto sai a
             ${rs(carga.custoSporT)}, contra ${rs(custoRef)} com enxofre elementar 99%.
             Para empatar, o preço desta carga precisaria cair para
             ${rs(ENX.ref99 * cs / 0.99)}/t.`}
      </div>
      <p class="aviso">Preço por kg de S puro: ${rs(carga.precoKgS)} ·
        ${fmtNum(carga.kgPorT, 1)} kg desta carga entram em cada tonelada de produto.</p>`
      : '<p class="aviso">Preencha quantidade, teor e preço para avaliar a carga.</p>'}
    </div>`

  ligarVoltar('calculadoras')
  // onchange (e não oninput): esta tela se redesenha inteira a cada cálculo,
  // então atualizar a cada tecla faria o cursor pular para fora do campo.
  $('#e-alvo').onchange = ev => { ENX.alvo = Number(ev.target.value) || 0; calcEnxofre(alvo) }
  $('#e-ref').onchange = ev => { ENX.ref99 = Number(ev.target.value) || 0; calcEnxofre(alvo) }
  $('#e-borra').onchange = ev => { ENX.borra = Number(ev.target.value) || 0; calcEnxofre(alvo) }
  ;['qtd','teor','preco'].forEach(k => {
    $('#e-' + k).onchange = ev => { ENX_CARGA[k] = Number(ev.target.value) || 0; calcEnxofre(alvo) }
  })
}

// Banco de informações — leads por região
// ===============================================================
let BANCO = { regiao:'todas', busca:'', categoria:'', leads:[] }
const ROTULO_CAT = { INSTITUCIONAL:'Institucional', MAIORES:'Maiores', BATER_PORTEIRA:'Bater porteira', SECUNDARIO:'Secundário' }

async function bancoInformacoes (alvo) {
  const regioes = meusRecursos('REGIAO')
  if (!regioes.length) {
    alvo.innerHTML = `<p class="vazio">Nenhuma região liberada para você.
      Peça ao administrador do sistema o acesso às regiões que você atende.</p>`
    return
  }
  alvo.innerHTML = `<p class="texto-dim2">carregando...</p>`

  let q = db.from('regiao_lead').select('*').order('agricultavel', { ascending: false, nullsFirst: false })
  if (BANCO.regiao !== 'todas') {
    const r = regioes.find(x => x.chave === BANCO.regiao)
    if (r) q = q.eq('recurso_id', r.id)
  }
  const { data, error } = await q
  if (error) { alvo.innerHTML = `<p class="vazio">${esc(error.message)}</p>`; return }
  BANCO.leads = data || []
  pintarBanco(alvo, regioes)
}

function pintarBanco (alvo, regioes) {
  const nomeRegiao = id => (regioes.find(r => r.id === id) || {}).nome || '—'
  const txt = BANCO.busca.trim().toLowerCase()
  const lista = BANCO.leads.filter(l =>
    (!BANCO.categoria || l.categoria === BANCO.categoria) &&
    (!txt || `${l.grupo} ${l.cotitulares ?? ''} ${l.foco ?? ''}`.toLowerCase().includes(txt)))

  const area = lista.reduce((s, l) => s + Number(l.area_total || 0), 0)
  const agric = lista.reduce((s, l) => s + Number(l.agricultavel || 0), 0)

  alvo.innerHTML = `
    <div class="kpis" style="margin-bottom:16px;">
      ${kpi('Leads na base', lista.length, lista.length === BANCO.leads.length ? 'no filtro atual' : `de ${BANCO.leads.length} carregados`)}
      ${kpi('Área total', fmtNum(area / 1000, 1) + ' mil ha', 'no filtro atual')}
      ${kpi('Agricultável', fmtNum(agric / 1000, 1) + ' mil ha', 'potencial de fertilizante')}
    </div>
    <div class="chaves">
      <label style="${BANCO.regiao === 'todas' ? 'border-color:var(--rust);color:var(--txt);' : ''}"
        data-reg="todas">todas</label>
      ${regioes.map(r => `<label style="${BANCO.regiao === r.chave ? 'border-color:var(--rust);color:var(--txt);' : ''}"
        data-reg="${r.chave}">${esc(r.nome)}</label>`).join('')}
    </div>
    <div class="filtros" style="margin:12px 0 14px;">
      <div class="campo" style="flex:1;min-width:240px;">
        <label>Buscar</label>
        <input id="bc-busca" value="${esc(BANCO.busca)}" placeholder="produtor, grupo, co-titular ou foco"></div>
      <div class="campo"><label>Categoria</label>
        <select id="bc-cat"><option value="">todas</option>
          ${Object.entries(ROTULO_CAT).map(([k, v]) =>
            `<option value="${k}" ${BANCO.categoria === k ? 'selected' : ''}>${v}</option>`).join('')}
        </select></div>
    </div>
    <div class="panel" style="padding:0;"><div class="tabela-scroll">
      <table><thead><tr>
        <th>Grupo / produtor</th><th>Região</th><th>Categoria</th><th>Tipo</th>
        <th class="num">Faz.</th><th class="num">Área (ha)</th><th class="num">Agric. (ha)</th>
        <th class="num">Soja</th><th class="num">Milho</th><th class="num">Algodão</th><th>Foco</th>
      </tr></thead><tbody>
      ${lista.map(l => `<tr class="lead-linha">
        <td><b>${esc(l.grupo)}</b>
          ${l.cotitulares ? `<div class="lead-obs">${esc(l.cotitulares)}</div>` : ''}
          ${l.observacoes ? `<div class="lead-obs">${esc(l.observacoes)}</div>` : ''}</td>
        <td class="texto-dim2">${esc(nomeRegiao(l.recurso_id))}</td>
        <td><span class="chip">${ROTULO_CAT[l.categoria] ?? l.categoria}</span></td>
        <td class="texto-dim">${esc(l.tipo ?? '—')}</td>
        <td class="num">${l.fazendas ?? '—'}</td>
        <td class="num">${l.area_total ? fmtNum(l.area_total, 0) : '—'}</td>
        <td class="num"><b>${l.agricultavel ? fmtNum(l.agricultavel, 0) : '—'}</b></td>
        <td class="num">${l.soja ? fmtNum(l.soja, 0) : '—'}</td>
        <td class="num">${l.milho ? fmtNum(l.milho, 0) : '—'}</td>
        <td class="num">${l.algodao ? fmtNum(l.algodao, 0) : '—'}</td>
        <td class="texto-dim">${esc(l.foco ?? '—')}</td>
      </tr>`).join('') || `<tr><td colspan="11" class="vazio">
        ${BANCO.leads.length ? 'Nenhum lead com esse filtro.' : 'Esta região ainda não tem dados carregados. O administrador importa a planilha em Administração › Ferramentas e regiões.'}</td></tr>`}
      </tbody></table>
    </div></div>`

  alvo.querySelectorAll('[data-reg]').forEach(l => {
    l.onclick = () => { BANCO.regiao = l.dataset.reg; bancoInformacoes(alvo, regioes) }
  })
  $('#bc-busca').oninput = e => { BANCO.busca = e.target.value; pintarBanco(alvo, regioes) }
  $('#bc-cat').onchange = e => { BANCO.categoria = e.target.value; pintarBanco(alvo, regioes) }
}

// Seis telas, no mesmo desenho do controle diário que a equipe já usa.

let EST_CACHE = { produtos: [], locais: [] }

async function paginaEstoque () {
  if (!podeVer('estoque')) { areaLivre().innerHTML =
    `<div class="panel" style="padding:22px;"><p class="texto-dim">
     Você não tem acesso ao Estoque.</p></div>`; return }

  const editavel = podeEditar('estoque')
  $('#subtitulo-pagina').textContent = 'Controle de estoque diário'
  const area = areaLivre()
  area.innerHTML = `<p class="texto-dim2">carregando...</p>`

  const [{ data: prods }, { data: locais }] = await Promise.all([
    db.from('produto').select('id,nome,codigo,unidade,chave,local_estoque,preco_ref,status').order('nome'),
    db.from('local_estoque').select('id,nome,tipo').eq('status','ATIVO').order('nome')
  ])
  EST_CACHE = { produtos: prods || [], locais: locais || [] }

  const abas = [['atual','Estoque atual'], ['lancar','Lançar'], ['lancamentos','Lançamentos'],
                ['mensal','Resumo mensal'], ['relatorio','Relatório'], ['produtos','Produtos']]

  area.innerHTML = `
    <div class="subabas">
      ${abas.map((a,i) => `<button data-sub="${a[0]}" class="${i===0?'ativo':''}">${a[1]}</button>`).join('')}
    </div>
    <div id="sub-estoque"></div>`

  area.querySelectorAll('.subabas button').forEach(b => {
    b.onclick = () => {
      area.querySelectorAll('.subabas button').forEach(x => x.classList.toggle('ativo', x===b))
      abrirEstoque(b.dataset.sub, editavel)
    }
  })
  abrirEstoque('atual', editavel)
}

function abrirEstoque (sub, editavel) {
  const alvo = $('#sub-estoque')
  alvo.innerHTML = `<p class="texto-dim2">carregando...</p>`
  $('#kpis').innerHTML = ''
  if (sub === 'atual') estAtual(alvo, editavel)
  if (sub === 'lancar') estLancar(alvo, editavel)
  if (sub === 'lancamentos') estLancamentos(alvo, editavel)
  if (sub === 'mensal') estMensal(alvo)
  if (sub === 'relatorio') estRelatorio(alvo)
  if (sub === 'produtos') estProdutos(alvo, editavel)
}

// ----- Estoque atual -----
async function estAtual (alvo, editavel) {
  const { data, error } = await db.from('saldo_estoque_por_local').select('*')
  if (error) { alvo.innerHTML = `<p class="vazio">${esc(error.message)}</p>`; return }

  const lista = (data || []).filter(x => Number(x.saldo) !== 0 || true)
  const bicas = lista.filter(x => /Bica 0/.test(x.produto))
  const totalBicas = bicas.reduce((s,x) => s + Number(x.saldo||0), 0)

  const card = (rot, val, un, nota, classe) => `
    <div class="bloco ${classe ?? ''}">
      <div class="rot">${esc(rot)}</div>
      <div class="val">${fmtNum(val, 3)} <span style="font-size:15px;color:var(--dim2);">${esc(un)}</span></div>
      ${nota ? `<div class="nota">${esc(nota)}</div>` : ''}
    </div>`

  alvo.innerHTML = `
    <div class="resumo-topo">
      ${bicas.length ? card('Gefoscal — total nas bicas', totalBicas, 't',
        bicas.map(b => `${b.local}: ${fmtNum(b.saldo,2)}`).join(' · '), 'destaque') : ''}
      ${lista.filter(x => !/Bica 0/.test(x.produto))
        .map(x => card(x.produto, x.saldo, x.unidade, x.local)).join('')}
    </div>

    <div class="cabeca-secao" style="margin-top:6px;">
      <h3 style="font-family:var(--serif);font-size:17px;">Por produto e local</h3>

// ----- Lançar -----
function estLancar (alvo, editavel) {
  if (!editavel) { alvo.innerHTML = `<div class="panel" style="padding:22px;">
    <p class="texto-dim">Você pode consultar, mas não lançar.</p></div>`; return }

  const hoje = new Date().toISOString().slice(0,10)
  alvo.innerHTML = `
    <div class="panel" style="padding:20px;max-width:760px;">
      <h3 style="font-family:var(--serif);font-size:18px;margin:0 0 14px;">Novo lançamento</h3>
      <div class="form-grade">
        <div class="campo" style="grid-column:1/-1;"><label>Produto *</label>
          <select id="el-produto">${EST_CACHE.produtos.filter(p => p.status === 'ATIVO').map(p =>
            `<option value="${p.id}" data-un="${p.unidade}">${esc(p.nome)} (${p.unidade})</option>`).join('')}</select></div>
        <div class="campo"><label>Local / setor</label>
          <select id="el-local"><option value="">—</option>
            ${EST_CACHE.locais.map(l => `<option value="${l.id}">${esc(l.nome)}</option>`).join('')}</select></div>
        <div class="campo"><label>Tipo *</label>
          <select id="el-tipo">
            <option value="ENTRADA">Entrada</option>
            <option value="SAIDA">Saída</option>
            <option value="AJUSTE">Ajuste</option>
          </select></div>
        <div class="campo"><label>Quantidade *</label>
          <input id="el-qtd" inputmode="decimal" placeholder="Ex: 1250,5"></div>
        <div class="campo"><label>Data *</label><input type="date" id="el-data" value="${hoje}"></div>
        <div class="campo"><label>Turno</label>
          <select id="el-turno">
            ${['Geral','1º turno','2º turno','3º turno'].map(t => `<option>${t}</option>`).join('')}
          </select></div>
        <div class="campo"><label>Horas trabalhadas</label>
          <input id="el-horas" inputmode="decimal" placeholder="Ex: 8"></div>
      </div>
      <div class="campo" style="margin-top:12px;"><label>Observação</label>
        <textarea id="el-obs" style="min-height:70px;"
          placeholder="Ex: saída referente ao dia 10/03"></textarea></div>
      <div class="acoes">
        <button class="btn" id="el-salvar">Salvar lançamento</button>
      </div>
      <div class="recado oculto" id="el-recado"></div>
      <p class="aviso">Ajuste com valor negativo diminui o saldo. Entrada soma, saída subtrai.</p>
    </div>`

  const aviso = (t, alerta = true) => {
    const el = $('#el-recado'); el.textContent = t; el.classList.remove('oculto')
    el.style.borderColor = alerta ? 'var(--warn-text)' : 'var(--line2)'
    el.style.color = alerta ? 'var(--warn-text)' : 'var(--dim)'
  }

  $('#el-salvar').onclick = async () => {
    const qtd = numeroBR($('#el-qtd').value)
    if (qtd === null || qtd === 0) { aviso('Informe a quantidade.'); return }
    const sel = $('#el-produto').selectedOptions[0]

    const btn = $('#el-salvar'); btn.disabled = true; btn.textContent = 'Salvando...'
    const { error } = await db.from('movimentacao_estoque').insert({
      produto_id: $('#el-produto').value,
      tipo: $('#el-tipo').value,
      quantidade: Math.abs(qtd) * ($('#el-tipo').value === 'AJUSTE' && qtd < 0 ? -1 : 1),
      unidade: sel.dataset.un,
      data_mov: $('#el-data').value,
      local_id: $('#el-local').value || null,
      local_estoque: $('#el-local').selectedOptions[0]?.textContent.trim() || null,
      turno: $('#el-turno').value,
      horas: numeroBR($('#el-horas').value),
      observacoes: $('#el-obs').value.trim() || null,
      registrado_por: PERFIL.pessoaId
    })
    btn.disabled = false; btn.textContent = 'Salvar lançamento'
    if (error) { aviso(error.message); return }
    aviso('Lançamento salvo.', false)
    $('#el-qtd').value = ''; $('#el-horas').value = ''; $('#el-obs').value = ''
  }
}

// ----- Lançamentos -----
async function estLancamentos (alvo, editavel) {
  const hoje = new Date().toISOString().slice(0,10)
  const de = new Date(Date.now() - 30*864e5).toISOString().slice(0,10)

  alvo.innerHTML = `
    <div class="filtros" style="margin-bottom:14px;">
      <div class="campo"><label>De</label><input type="date" id="ml-de" value="${de}"></div>
      <div class="campo"><label>Até</label><input type="date" id="ml-ate" value="${hoje}"></div>
      <div class="campo"><label>Produto</label>
        <select id="ml-prod"><option value="">todos</option>
          ${EST_CACHE.produtos.map(p => `<option value="${p.id}">${esc(p.nome)}</option>`).join('')}
        </select></div>
      <div class="campo" style="flex:1;min-width:200px;"><label>Buscar</label>
        <input id="ml-busca" placeholder="local, turno ou observação"></div>
      <button class="btn" id="ml-buscar">Buscar</button>
    </div>
    <div id="ml-lista"></div>`

  const buscar = async () => {
    let q = db.from('movimentacao_estoque').select(`
      id, tipo, quantidade, unidade, data_mov, local_estoque, turno, horas, observacoes, criado_em,
      produto:produto_id ( nome ), quem:registrado_por ( nome )
    `).gte('data_mov', $('#ml-de').value).lte('data_mov', $('#ml-ate').value)
      .order('data_mov', { ascending: false }).order('criado_em', { ascending: false }).limit(500)

    if ($('#ml-prod').value) q = q.eq('produto_id', $('#ml-prod').value)

    const { data, error } = await q
    if (error) { $('#ml-lista').innerHTML = `<p class="vazio">${esc(error.message)}</p>`; return }

    const termo = $('#ml-busca').value.trim().toLowerCase()
    const lista = (data || []).filter(m => !termo ||
      `${m.local_estoque ?? ''} ${m.turno ?? ''} ${m.observacoes ?? ''} ${m.quem?.nome ?? ''}`
        .toLowerCase().includes(termo))

    const cor = t => t === 'ENTRADA' ? 'badge-bom' : t === 'SAIDA' ? 'badge-alerta' : ''

    $('#ml-lista').innerHTML = `
      <div class="panel" style="padding:0;"><div class="tabela-scroll">
        <table><thead><tr>
          <th>Data</th><th>Produto</th><th>Local</th><th>Tipo</th>
          <th class="num">Qtd</th><th>Turno</th><th>Horas</th><th>Observação</th>
          ${editavel ? '<th></th>' : ''}
        </tr></thead><tbody>
          ${lista.map(m => `<tr>
            <td>${fmtData(m.data_mov)}</td>
            <td>${esc(m.produto?.nome ?? '—')}</td>
            <td class="texto-dim">${esc(m.local_estoque ?? '—')}</td>
            <td class="${cor(m.tipo)}">${esc(m.tipo.toLowerCase())}</td>
            <td class="num">${fmtNum(m.quantidade, 3)} ${esc(m.unidade)}</td>
            <td class="texto-dim">${esc(m.turno ?? '—')}</td>
            <td class="num texto-dim">${m.horas ? fmtNum(m.horas, 2) : '—'}</td>
            <td class="texto-dim2" style="font-size:12px;">${esc((m.observacoes ?? '').slice(0,60))}
              ${m.quem?.nome ? `<br>${esc(m.quem.nome)}` : ''}</td>
            ${editavel ? `<td><button class="btn-secundario mini" data-del-mov="${m.id}">×</button></td>` : ''}
          </tr>`).join('') || `<tr><td colspan="${editavel?9:8}" class="vazio">
            Nenhum lançamento no período.</td></tr>`}
        </tbody></table>
      </div></div>
      <p class="texto-dim2" style="font-size:12px;margin-top:8px;">${lista.length} lançamento(s)</p>`

    if (!editavel) return
    $('#ml-lista').querySelectorAll('[data-del-mov]').forEach(b => {
      b.onclick = async () => {
        if (!confirm('Excluir este lançamento? O saldo é recalculado na hora.')) return
        await db.from('movimentacao_estoque').delete().eq('id', b.dataset.delMov)
        buscar()
      }
    })
  }

  $('#ml-buscar').onclick = buscar
  $('#ml-busca').oninput = buscar
  buscar()
}

// ----- Resumo mensal -----
async function estMensal (alvo) {
  const base = new Date()
  const mes = `${base.getFullYear()}-${String(base.getMonth()+1).padStart(2,'0')}`

  alvo.innerHTML = `
    <div class="filtros" style="margin-bottom:14px;">
      <div class="campo"><label>Mês</label><input type="month" id="mm-mes" value="${mes}"></div>
    </div>
    <div id="mm-res"></div>`

  const carregar = async () => {
    const m = $('#mm-mes').value
    const [a, mm] = m.split('-').map(Number)
    const de = `${m}-01`
    const ate = new Date(Date.UTC(a, mm, 1)).toISOString().slice(0,10)

    const { data } = await db.from('movimentacao_estoque')
      .select('tipo,quantidade,unidade,horas,produto:produto_id(nome)')
      .gte('data_mov', de).lt('data_mov', ate)

    const porProduto = {}
    let horas = 0
    ;(data || []).forEach(x => {
      const k = x.produto?.nome ?? '—'
      porProduto[k] = porProduto[k] || { un: x.unidade, ENTRADA: 0, SAIDA: 0, AJUSTE: 0 }
      porProduto[k][x.tipo] += Number(x.quantidade || 0)
      horas += Number(x.horas || 0)
    })

    $('#mm-res').innerHTML = `
      <p class="texto-dim2" style="font-size:12.5px;margin:0 0 10px;">
        Total de horas lançadas no mês: ${fmtNum(horas, 2)}</p>
      <div class="panel" style="padding:0;"><div class="tabela-scroll">
        <table><thead><tr>
          <th>Produto</th><th>Unidade</th><th class="num">Entradas</th>
          <th class="num">Saídas</th><th class="num">Ajustes</th>
        </tr></thead><tbody>
          ${Object.entries(porProduto).sort().map(([nome,v]) => `<tr>
            <td>${esc(nome)}</td><td class="texto-dim">${esc(v.un)}</td>
            <td class="num">${fmtNum(v.ENTRADA, 3)}</td>
            <td class="num">${fmtNum(v.SAIDA, 3)}</td>
            <td class="num">${fmtNum(v.AJUSTE, 3)}</td>
          </tr>`).join('') || `<tr><td colspan="5" class="vazio">Nada lançado neste mês.</td></tr>`}
        </tbody></table>
      </div></div>`
  }
  $('#mm-mes').onchange = carregar
  carregar()
}

// ----- Relatório -----
async function estRelatorio (alvo) {
  const hoje = new Date().toISOString().slice(0,10)
  const inicio = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0,10)

  alvo.innerHTML = `
    <div class="panel" style="padding:20px;max-width:720px;">
      <h3 style="font-family:var(--serif);font-size:18px;margin:0 0 6px;">Gerar relatório</h3>
      <p class="texto-dim" style="font-size:13px;margin-top:0;">
        Escolha o período e gere um relatório pronto para imprimir ou salvar em PDF.</p>
      <div class="form-grade">
        <div class="campo"><label>De</label><input type="date" id="er-de" value="${inicio}"></div>
        <div class="campo"><label>Até</label><input type="date" id="er-ate" value="${hoje}"></div>
      </div>
      <div class="acoes"><button class="btn" id="er-gerar">Gerar relatório</button></div>
    </div>`

  $('#er-gerar').onclick = async () => {
    const de = $('#er-de').value, ate = $('#er-ate').value
    const [{ data: movs }, { data: saldos }] = await Promise.all([
      db.from('movimentacao_estoque').select('tipo,quantidade,unidade,horas,data_mov,local_estoque,produto:produto_id(nome)')
        .gte('data_mov', de).lte('data_mov', ate).order('data_mov'),
      db.from('saldo_estoque_por_local').select('*')
    ])

    const porProduto = {}
    let horas = 0
    ;(movs || []).forEach(x => {
      const k = x.produto?.nome ?? '—'
      porProduto[k] = porProduto[k] || { un: x.unidade, ENTRADA: 0, SAIDA: 0, AJUSTE: 0 }
      porProduto[k][x.tipo] += Number(x.quantidade || 0)
      horas += Number(x.horas || 0)
    })

    const corpo = `
      <div class="doc-linha">
        ${docBloco('Período', docLinha('De', fmtData(de)) + docLinha('Até', fmtData(ate)) +
          docLinha('Emitido por', PERFIL.nome))}
        ${docBloco('Movimento', docLinha('Lançamentos', String((movs||[]).length)) +
          docLinha('Horas trabalhadas', fmtNum(horas, 2)))}
      </div>

      ${docBloco('Movimentação no período', `
        <table><thead><tr><th>Produto</th><th>Un.</th><th class="num">Entradas</th>
          <th class="num">Saídas</th><th class="num">Ajustes</th></tr></thead><tbody>
          ${Object.entries(porProduto).sort().map(([n,v]) => `<tr>
            <td>${esc(n)}</td><td>${esc(v.un)}</td>
            <td class="num">${fmtNum(v.ENTRADA,3)}</td>
            <td class="num">${fmtNum(v.SAIDA,3)}</td>
            <td class="num">${fmtNum(v.AJUSTE,3)}</td>
          </tr>`).join('')}
        </tbody></table>`)}

      ${docBloco('Saldo atual por local', `
        <table><thead><tr><th>Produto</th><th>Local</th><th>Un.</th>
          <th class="num">Saldo</th></tr></thead><tbody>
          ${(saldos || []).map(s => `<tr>
            <td>${esc(s.produto)}</td><td>${esc(s.local ?? '—')}</td>
            <td>${esc(s.unidade)}</td><td class="num">${fmtNum(s.saldo,3)}</td>
          </tr>`).join('')}
        </tbody></table>`)}

      ${docAssinaturas([['Emitido por', PERFIL.nome], ['Produção', ''], ['Diretoria', '']])}`

    const fundo = document.createElement('div')
    fundo.className = 'modal-fundo'
    fundo.innerHTML = documentoPDF({
      titulo: 'RELATÓRIO DE ESTOQUE E PRODUÇÃO',
      subtitulo: `${fmtData(de)} a ${fmtData(ate)}`, corpo,
      acoes: `<button class="btn" id="erp-imprimir">Gerar PDF</button>
        <button class="btn-secundario" id="erp-fechar">Fechar</button>`
    })
    document.body.appendChild(fundo)
    fundo.querySelector('#erp-fechar').onclick = () => fundo.remove()
    fundo.querySelector('#erp-imprimir').onclick = () => window.print()
    fundo.onclick = e => { if (e.target === fundo) fundo.remove() }
  }
}

// ----- Produtos -----
async function estProdutos (alvo, editavel) {
  const { data: usados } = await db.from('movimentacao_estoque').select('produto_id')
  const comLancamento = new Set((usados || []).map(x => x.produto_id))

  alvo.innerHTML = `
    <div class="panel" style="padding:0;margin-bottom:16px;">
      <div style="padding:16px 18px;">
        <h3 style="font-family:var(--serif);font-size:17px;margin:0 0 4px;">Produtos cadastrados</h3>
        <p class="texto-dim" style="font-size:12.5px;margin:0;">
          A unidade só muda enquanto o produto não tem lançamento — depois disso,
          trocar bagunçaria o saldo somado. O resto (nome, código, local padrão,
          preço de referência, status) pode ser editado a qualquer momento.</p>
      </div>
      <table><thead><tr><th>Nome</th><th>Código</th><th>Unidade</th><th>Local padrão</th><th>Status</th>
        ${editavel ? '<th></th>' : ''}</tr></thead><tbody>
        ${EST_CACHE.produtos.map(p => `<tr style="${p.status !== 'ATIVO' ? 'opacity:.55;' : ''}">
          <td>${esc(p.nome)}</td>
          <td class="texto-dim2">${esc(p.codigo ?? '—')}</td>
          <td>${esc(p.unidade)} ${comLancamento.has(p.id)
            ? '<span class="texto-dim2">(fixa — já tem lançamentos)</span>' : ''}</td>
          <td class="texto-dim2">${esc(p.local_estoque ?? '—')}</td>
          <td>${p.status === 'ATIVO' ? '<span class="badge-bom">ativo</span>' : '<span class="badge-alerta">inativo</span>'}</td>
          ${editavel ? `<td style="text-align:right;white-space:nowrap;">
            <button class="btn-secundario mini" data-edit-prod="${p.id}">editar</button>
            ${comLancamento.has(p.id) ? ''
              : `<button class="btn-secundario mini" data-del-prod="${p.id}">remover</button>`}
          </td>` : ''}
        </tr>`).join('')}
      </tbody></table>
    </div>

    ${editavel ? `<div class="panel" style="padding:20px;max-width:640px;">
      <h3 style="font-family:var(--serif);font-size:17px;margin:0 0 12px;">Adicionar produto</h3>
      <div class="form-grade">
        <div class="campo" style="grid-column:1/-1;"><label>Nome *</label>
          <input id="ep-nome" placeholder="Ex: Fosfato Natural 12%"></div>
        <div class="campo"><label>Unidade *</label>
          <select id="ep-un">${['t','kg','L','un'].map(u => `<option>${u}</option>`).join('')}</select></div>
        <div class="campo"><label>Código</label><input id="ep-cod" placeholder="opcional"></div>
      </div>
      <div class="acoes"><button class="btn" id="ep-add">Adicionar produto</button></div>
      <div class="recado oculto" id="ep-recado"></div>
    </div>` : ''}`

  if (!editavel) return

  const dizer = t => {
    const el = $('#ep-recado'); el.textContent = t; el.classList.remove('oculto')
    el.style.borderColor = 'var(--warn-text)'; el.style.color = 'var(--warn-text)'
  }

  $('#ep-add').onclick = async () => {
    const nome = $('#ep-nome').value.trim()
    if (!nome) { dizer('Escreva o nome do produto.'); return }
    const chave = (($('#ep-cod').value.trim() || nome).toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_')).slice(0,40)
    const { error } = await db.from('produto').insert({
      nome, unidade: $('#ep-un').value, codigo: chave.toUpperCase().slice(0,10),
      chave, status: 'ATIVO'
    })
    if (error) { dizer(error.message); return }
    paginaEstoque()
  }

  alvo.querySelectorAll('[data-edit-prod]').forEach(b => {
    b.onclick = () => {
      const p = EST_CACHE.produtos.find(x => x.id === b.dataset.editProd)
      if (p) formProduto(p, comLancamento.has(p.id))
    }
  })

  alvo.querySelectorAll('[data-del-prod]').forEach(b => {
    b.onclick = async () => {
      if (!confirm('Remover este produto? Só é possível porque ele não tem lançamento.')) return
      const { error } = await db.from('produto').delete().eq('id', b.dataset.delProd)
      if (error) { alert(error.message); return }
      paginaEstoque()
    }
  })
}

function formProduto (p, unidadeFixa) {
  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = `<div class="modal">
    <h3>Editar produto</h3>
    <div class="form-grade">
      <div class="campo" style="grid-column:1/-1;"><label>Nome *</label>
        <input id="ed-nome" value="${esc(p.nome)}"></div>
      <div class="campo"><label>Código</label><input id="ed-cod" value="${esc(p.codigo ?? '')}"></div>
      <div class="campo"><label>Unidade${unidadeFixa ? ' (fixa)' : ' *'}</label>
        <select id="ed-un" ${unidadeFixa ? 'disabled' : ''}>
          ${['t','kg','L','un'].map(u => `<option ${p.unidade === u ? 'selected' : ''}>${u}</option>`).join('')}
        </select></div>
      <div class="campo"><label>Local de estoque padrão</label>
        <input id="ed-local" list="ed-locais-lista" value="${esc(p.local_estoque ?? '')}" placeholder="opcional">
        <datalist id="ed-locais-lista">${EST_CACHE.locais.map(l => `<option value="${esc(l.nome)}">`).join('')}</datalist></div>
      <div class="campo"><label>Preço de referência</label>
        <input id="ed-preco" type="number" step="0.01" value="${p.preco_ref ?? ''}"></div>
      <div class="campo"><label>Status</label><select id="ed-status">
        <option value="ATIVO" ${p.status === 'ATIVO' ? 'selected' : ''}>ativo</option>
        <option value="INATIVO" ${p.status === 'INATIVO' ? 'selected' : ''}>inativo</option>
      </select></div>
    </div>
    <div class="acoes"><button class="btn" id="ed-salvar">Salvar</button><button class="btn-secundario" id="ed-cancelar">Cancelar</button></div>
    <div class="recado oculto" id="ed-recado"></div>
  </div>`
  document.body.appendChild(fundo)
  const fechar = () => fundo.remove()
  fundo.querySelector('#ed-cancelar').onclick = fechar
  fundo.onclick = e => { if (e.target === fundo) fechar() }

  fundo.querySelector('#ed-salvar').onclick = async () => {
    const nome = fundo.querySelector('#ed-nome').value.trim()
    const el = fundo.querySelector('#ed-recado')
    const aviso = t => { el.textContent = t; el.classList.remove('oculto'); el.style.borderColor = 'var(--warn-text)'; el.style.color = 'var(--warn-text)' }
    if (!nome) { aviso('Escreva o nome do produto.'); return }

    const corpo = {
      nome,
      codigo: fundo.querySelector('#ed-cod').value.trim() || null,
      local_estoque: fundo.querySelector('#ed-local').value.trim() || null,
      preco_ref: fundo.querySelector('#ed-preco').value ? Number(fundo.querySelector('#ed-preco').value) : null,
      status: fundo.querySelector('#ed-status').value
    }
    if (!unidadeFixa) corpo.unidade = fundo.querySelector('#ed-un').value

    const { error } = await db.from('produto').update(corpo).eq('id', p.id)
    if (error) { aviso(error.message); return }
    fechar()
    paginaEstoque()
  }
}

const TIPOS_COMBUSTIVEL = ['S500', 'GASOLINA', 'ARLA', 'OUTRO']
const ROTULO_COMBUSTIVEL = { S500: 'Diesel S500', GASOLINA: 'Gasolina', ARLA: 'Arla 32', OUTRO: 'Outro' }

let COMB_CACHE = { veiculos: [], equipamentos: [], pessoas: [], fornecedores: [], setores: [],
  precos: { S500: 0, GASOLINA: 0, ARLA: 0, OUTRO: 0 } }

async function paginaCombustivel () {
  if (!podeVer('combustivel')) { areaLivre().innerHTML =
    `<div class="panel" style="padding:22px;"><p class="texto-dim">
     Você não tem acesso ao Combustível.</p></div>`; return }

  const editavel = podeEditar('combustivel')
  $('#subtitulo-pagina').textContent = 'Entradas, abastecimentos e frota'
  const area = areaLivre()
  area.innerHTML = `<p class="texto-dim2">carregando...</p>`

  const [{ data: veiculos }, { data: equipamentos }, { data: pessoas },
         { data: fornecedores }, { data: setores }, { data: precos }] = await Promise.all([
    db.from('veiculo').select('id,placa,descricao,eh_proprio').order('placa'),
    db.from('equipamento').select('id,tag,descricao').eq('status', 'ATIVO').order('tag'),
    db.from('pessoa').select('id,nome').eq('status', 'ATIVO').order('nome'),
    db.from('fornecedor').select('id,nome').eq('status', 'ATIVO').order('nome'),
    db.from('setor').select('id,nome').order('nome'),
    db.from('preco_combustivel').select('tipo,preco,atualizado_em')
  ])
  const mapaPrecos = {}
  TIPOS_COMBUSTIVEL.forEach(t => { mapaPrecos[t] = 0 })
  ;(precos || []).forEach(p => { mapaPrecos[p.tipo] = Number(p.preco || 0) })
  COMB_CACHE = { veiculos: veiculos || [], equipamentos: equipamentos || [],
                 pessoas: pessoas || [], fornecedores: fornecedores || [], setores: setores || [],
                 precos: mapaPrecos }

  const abas = [['painel', 'Painel'], ['abastecer', 'Abastecer'], ['abastecimentos', 'Abastecimentos'],
                ['entrada', 'Registrar entrada'], ['entradas', 'Entradas'],
                ['veiculos', 'Frota'], ['relatorio', 'Relatório']]

  area.innerHTML = `
    <div class="subabas">
      ${abas.map((a, i) => `<button data-sub="${a[0]}" class="${i === 0 ? 'ativo' : ''}">${a[1]}</button>`).join('')}
    </div>
    <div id="sub-combustivel"></div>`

  area.querySelectorAll('.subabas button').forEach(b => {
    b.onclick = () => {
      area.querySelectorAll('.subabas button').forEach(x => x.classList.toggle('ativo', x === b))
      abrirCombustivel(b.dataset.sub, editavel)
    }
  })
  abrirCombustivel('painel', editavel)
}

function abrirCombustivel (sub, editavel) {
  const alvo = $('#sub-combustivel')
  alvo.innerHTML = `<p class="texto-dim2">carregando...</p>`
  $('#kpis').innerHTML = ''
  if (sub === 'painel') combPainel(alvo, editavel)
  if (sub === 'abastecer') combAbastecer(alvo, editavel)
  if (sub === 'abastecimentos') combAbastecimentos(alvo, editavel)
  if (sub === 'entrada') combEntrada(alvo, editavel)
  if (sub === 'entradas') combEntradas(alvo, editavel)
  if (sub === 'veiculos') combVeiculos(alvo, editavel)
  if (sub === 'relatorio') combRelatorio(alvo)
}

// Comprovantes (foto do painel da bomba etc.) ficam num bucket privado —
// mesmo padrão já usado para comprovante de pagamento em Cobrança.
async function subirComprovante (arquivo, pasta) {
  if (!arquivo) return null
  const limpo = arquivo.name.replace(/[^\w.\-]/g, '_').slice(-80)
  const caminho = `${pasta}/${Date.now()}_${limpo}`
  const { error } = await db.storage.from('comprovantes').upload(caminho, arquivo, { upsert: false })
  if (error) throw new Error('Não deu para enviar o arquivo: ' + error.message)
  return { caminho, nome: arquivo.name }
}
async function abrirComprovante (caminho) {
  if (!caminho) return
  const { data, error } = await db.storage.from('comprovantes').createSignedUrl(caminho, 300)
  if (error) { alert('Não deu para abrir: ' + error.message); return }
  window.open(data.signedUrl, '_blank', 'noopener')
}

    .eq('entidade', 'ABASTECIMENTO').eq('registro_id', registroId).order('criado_em')

// ----- pequenos gráficos sem biblioteca externa -----
function svgLinha (pontos, { largura = 640, altura = 200, cor = 'var(--rust)' } = {}) {
  if (!pontos.length) return `<p class="vazio" style="padding:40px 0;">Sem dados no período.</p>`
  const max = Math.max(...pontos.map(p => p.valor), 1)
  const passoX = pontos.length > 1 ? largura / (pontos.length - 1) : 0
  const coordX = i => pontos.length > 1 ? i * passoX : largura / 2
  const coordY = v => altura - 24 - (v / max) * (altura - 40)
  const linha = pontos.map((p, i) => `${coordX(i)},${coordY(p.valor)}`).join(' ')
  const area = `0,${altura - 24} ${linha} ${largura},${altura - 24}`
  return `
    <svg viewBox="0 0 ${largura} ${altura}" style="width:100%;height:${altura}px;overflow:visible;">
      <polygon points="${area}" fill="${cor}" opacity="0.08"></polygon>
      <polyline points="${linha}" fill="none" stroke="${cor}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>
      ${pontos.map((p, i) => `<circle cx="${coordX(i)}" cy="${coordY(p.valor)}" r="3.5" fill="${cor}"></circle>`).join('')}
      ${pontos.map((p, i) => `<text x="${coordX(i)}" y="${altura - 4}" font-size="10" fill="var(--dim2)" text-anchor="middle">${esc(p.rotulo)}</text>`).join('')}
    </svg>`
}

const CORES_GRAFICO = ['var(--rust)', '#4b4fd0', '#c8a11a', '#5b8c5a', '#a15b8c']

function svgDonut (fatias, { tamanho = 180 } = {}) {
  const total = fatias.reduce((s, f) => s + f.valor, 0)
  if (!total) return `<p class="vazio" style="padding:20px 0;">Sem dados no período.</p>`
  const raio = tamanho / 2, centro = tamanho / 2, espessura = raio * 0.38
  let anguloAcum = -90
  const arcos = fatias.filter(f => f.valor > 0).map((f, i) => {
    const angulo = (f.valor / total) * 360
    const x1 = centro + (raio - espessura / 2) * Math.cos(anguloAcum * Math.PI / 180)
    const y1 = centro + (raio - espessura / 2) * Math.sin(anguloAcum * Math.PI / 180)
    anguloAcum += angulo
    const x2 = centro + (raio - espessura / 2) * Math.cos(anguloAcum * Math.PI / 180)
    const y2 = centro + (raio - espessura / 2) * Math.sin(anguloAcum * Math.PI / 180)
    const grandeArco = angulo > 180 ? 1 : 0
    return `<path d="M ${x1} ${y1} A ${raio - espessura / 2} ${raio - espessura / 2} 0 ${grandeArco} 1 ${x2} ${y2}"
      fill="none" stroke="${CORES_GRAFICO[i % CORES_GRAFICO.length]}" stroke-width="${espessura}"></path>`
  }).join('')
  const legenda = fatias.filter(f => f.valor > 0).map((f, i) => `
    <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);">
      <span style="width:9px;height:9px;border-radius:50%;background:${CORES_GRAFICO[i % CORES_GRAFICO.length]};display:inline-block;"></span>
      ${esc(f.rotulo)} — ${fmtNum(f.valor)} L (${(f.valor / total * 100).toFixed(0)}%)
    </div>`).join('')
  return `
    <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;">
      <svg viewBox="0 0 ${tamanho} ${tamanho}" style="width:${tamanho}px;height:${tamanho}px;flex:none;">${arcos}</svg>
      <div style="display:flex;flex-direction:column;gap:6px;">${legenda}</div>
    </div>`
}

function barrasHorizontais (itens, { unidade = 'L', casas = 0 } = {}) {
  if (!itens.length) return `<p class="vazio" style="padding:20px 0;">Sem dados no período.</p>`
  const max = Math.max(...itens.map(i => i.valor), 1)
  return `<div style="display:flex;flex-direction:column;gap:10px;">
    ${itens.map(i => `
      <div>
        <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px;">
          <span>${esc(i.rotulo)}</span><span class="texto-dim">${fmtNum(i.valor, casas)} ${unidade}</span>
        </div>
        <div style="background:var(--surface2);border-radius:5px;height:9px;overflow:hidden;">
          <div style="width:${Math.max((i.valor / max) * 100, 2)}%;height:100%;background:var(--rust);border-radius:5px;"></div>
        </div>
      </div>`).join('')}
  </div>`
}

function barrasVerticais (itens, { altura = 190 } = {}) {
  if (!itens.length) return `<p class="vazio" style="padding:20px 0;">Sem dados no período.</p>`
  const max = Math.max(...itens.map(i => i.valor), 1)
  return `<div style="display:flex;gap:14px;align-items:flex-end;height:${altura}px;padding-top:10px;">
    ${itens.map(i => `
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;">
        <span class="texto-dim2" style="font-size:11px;">${i.valor ? 'R$ ' + fmtNum(i.valor) : ''}</span>
        <div style="width:100%;max-width:52px;background:var(--gold, #c8a11a);border-radius:5px 5px 0 0;
          height:${Math.max((i.valor / max) * (altura - 40), 2)}px;"></div>
        <span class="texto-dim" style="font-size:11.5px;">${esc(i.rotulo)}</span>
      </div>`).join('')}
  </div>`
}

    </div>
    <div class="acoes"><button class="btn" id="pc-salvar">Salvar preços</button>
      <button class="btn-secundario" id="pc-cancelar">Cancelar</button></div>
    <div class="recado oculto" id="pc-recado"></div>
  </div>`
  document.body.appendChild(fundo)
  const fechar = () => fundo.remove()
  fundo.querySelector('#pc-cancelar').onclick = fechar
  fundo.onclick = e => { if (e.target === fundo) fechar() }

  fundo.querySelector('#pc-salvar').onclick = async () => {
    const linhas = TIPOS_COMBUSTIVEL.map(t => ({
      tipo: t,
      preco: numeroBR(fundo.querySelector(`#pc-${t}`).value) ?? 0,
      atualizado_em: new Date().toISOString(),
      atualizado_por: PERFIL.pessoaId
    }))
    const { error } = await db.from('preco_combustivel').upsert(linhas)

      el.textContent = error.message; el.classList.remove('oculto')

      return
    }
    linhas.forEach(l => { COMB_CACHE.precos[l.tipo] = l.preco })
    fechar(); aoSalvar()
  }
}

function abrirLancamentoRapido (aoSalvar) {
  const alvos = [
    ...COMB_CACHE.veiculos.map(v => ({ valor: 'v:' + v.id, rotulo: `${v.placa}${v.descricao ? ' — ' + v.descricao : ''}` })),
    ...COMB_CACHE.equipamentos.map(e => ({ valor: 'e:' + e.id, rotulo: `${e.tag}${e.descricao ? ' — ' + e.descricao : ''}` }))
  ]
  const hoje = new Date().toISOString().slice(0, 10)

  const fundo = document.createElement('div')
  fundo.className = 'modal-fundo'
  fundo.innerHTML = `<div class="modal">
    <h3>Lançar saída de combustível</h3>
    <p class="texto-dim" style="font-size:12.5px;margin-top:-8px;">
      Registro rápido — para leitura de bomba, horímetro e comprovante, use a aba Abastecer.</p>
    <div class="form-grade">
      <div class="campo" style="grid-column:1/-1;"><label>Placa / equipamento *</label>
        <select id="lr-alvo">${alvos.map(a => `<option value="${a.valor}">${esc(a.rotulo)}</option>`).join('') ||
          '<option value="">nenhum veículo ou equipamento cadastrado</option>'}</select></div>
      <div class="campo"><label>Combustível *</label>
        <select id="lr-tipo">${TIPOS_COMBUSTIVEL.map(t => `<option value="${t}">${ROTULO_COMBUSTIVEL[t]}</option>`).join('')}</select></div>
      <div class="campo"><label>Data *</label><input type="date" id="lr-data" value="${hoje}"></div>
      <div class="campo"><label>Quantidade (litros) *</label><input id="lr-litros" inputmode="decimal" placeholder="Ex: 80"></div>
      <div class="campo"><label>Responsável *</label>
        <select id="lr-responsavel"><option value="">—</option>${COMB_CACHE.pessoas.map(p => `<option value="${p.id}" ${p.id === PERFIL.pessoaId ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}</select></div>
    </div>
    <div class="acoes"><button class="btn" id="lr-salvar">Lançar saída</button>
      <button class="btn-secundario" id="lr-cancelar">Cancelar</button></div>
    <div class="recado oculto" id="lr-recado"></div>
  </div>`
  document.body.appendChild(fundo)
  const fechar = () => fundo.remove()
  fundo.querySelector('#lr-cancelar').onclick = fechar
  fundo.onclick = e => { if (e.target === fundo) fechar() }

  const aviso = t => {
    const el = fundo.querySelector('#lr-recado'); el.textContent = t; el.classList.remove('oculto')
    el.style.borderColor = 'var(--warn-text)'; el.style.color = 'var(--warn-text)'
  }

  fundo.querySelector('#lr-salvar').onclick = async () => {
    const alvoVal = fundo.querySelector('#lr-alvo').value
    const litros = numeroBR(fundo.querySelector('#lr-litros').value)
    const responsavel = fundo.querySelector('#lr-responsavel').value
    if (!alvoVal) { aviso('Cadastre um veículo (aba Frota) ou equipamento (Manutenção) antes de lançar.'); return }
    if (!litros || litros <= 0) { aviso('Informe a quantidade.'); return }
    if (!responsavel) { aviso('Escolha o responsável.'); return }

    const [tipo, id] = alvoVal.split(':')
    const btn = fundo.querySelector('#lr-salvar'); btn.disabled = true; btn.textContent = 'Salvando...'
    const { error } = await db.from('abastecimento').insert({
      tipo: fundo.querySelector('#lr-tipo').value,
      veiculo_id: tipo === 'v' ? id : null,
      equipamento_id: tipo === 'e' ? id : null,
      data_abastecimento: new Date(fundo.querySelector('#lr-data').value + 'T12:00:00').toISOString(),
      litros,
      bombista_id: responsavel,
      destino: 'OUTROS'
    })
    btn.disabled = false; btn.textContent = 'Lançar saída'
    if (error) { aviso(error.message); return }
    fechar(); aoSalvar()
  }
}

// ----- exportar CSV -----
function exportarCsv (nomeArquivo, colunas, linhas) {
  const linha = vals => vals.map(v => {
    const s = String(v ?? '')
    return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s
  }).join(';')
  const csv = '\uFEFF' + [linha(colunas), ...linhas.map(linha)].join('\r\n')
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' })
  const url = URL.createObjectURL(blob)
  const a = document.createElement('a')
  a.href = url; a.download = nomeArquivo
  document.body.appendChild(a); a.click(); a.remove()
  URL.revokeObjectURL(url)
}

async function combPainel (alvo, editavel) {

  const alvosFiltro = [
    ...COMB_CACHE.veiculos.map(v => ({ valor: 'v:' + v.id, rotulo: `${v.placa}${v.descricao ? ' — ' + v.descricao : ''}` })),
    ...COMB_CACHE.equipamentos.map(e => ({ valor: 'e:' + e.id, rotulo: `${e.tag}${e.descricao ? ' — ' + e.descricao : ''}` }))
  ]

  alvo.innerHTML = `
    <div class="panel" style="padding:18px;margin-bottom:16px;">
      <div class="cabeca-secao" style="margin-bottom:12px;">
        <h3 style="font-family:var(--serif);font-size:17px;">Filtros</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          ${editavel ? `<button class="btn-secundario mini" id="pn-lancar">+ Lançar saída</button>
          <button class="btn-secundario mini" id="pn-precos">Configurar preços</button>` : ''}
        </div>
      </div>
      <div class="form-grade">
        <div class="campo"><label>Data inicial</label><input type="date" id="pn-de" value="${inicioMes}"></div>
        <div class="campo"><label>Data final</label><input type="date" id="pn-ate" value="${hoje}"></div>
        <div class="campo"><label>Veículo / equipamento</label>
          <select id="pn-alvo"><option value="">Todos</option>${alvosFiltro.map(a => `<option value="${a.valor}">${esc(a.rotulo)}</option>`).join('')}</select></div>
        <div class="campo"><label>Combustível</label>
          <select id="pn-tipo"><option value="">Todos</option>${TIPOS_COMBUSTIVEL.map(t => `<option value="${t}">${ROTULO_COMBUSTIVEL[t]}</option>`).join('')}</select></div>
      </div>
      <div class="acoes" style="margin-top:12px;">
        <button class="btn-secundario" id="pn-limpar">Limpar</button>
        <button class="btn" id="pn-aplicar">Aplicar filtros</button>
      </div>
    </div>
    <div id="pn-conteudo"><p class="texto-dim2">carregando...</p></div>`

  if (editavel) {
    $('#pn-lancar').onclick = () => abrirLancamentoRapido(carregar)
    $('#pn-precos').onclick = () => abrirConfigurarPrecos(carregar)
  }

    $('#pn-alvo').value = ''; $('#pn-tipo').value = ''

    let q = db.from('abastecimento').select(`
